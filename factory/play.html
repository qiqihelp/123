<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10120c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>星核工厂</title>
  <!-- single-file build for HTML preview hosts -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%2310120c' width='16' height='16'/%3E%3Crect fill='%23e3a045' x='3' y='3' width='10' height='10'/%3E%3Crect fill='%23ffc857' x='6' y='6' width='4' height='4'/%3E%3C/svg%3E">
  <style>
:root {
  --bg: #10120c;
  --bg-2: #171b12;
  --panel: #1c2118;
  --line: #3c4430;
  --text: #efe7d6;
  --muted: #a39b88;
  --copper: #e3a045;
  --copper-2: #ffd48a;
  --ink: #1a1208;
  --danger: #d84b3a;
  --ok: #8fce6a;
  --lead: #8eacbe;
  --ti: #7ee0dc;
  --graphite: #c2b8a4;
  --coal: #8a93a3;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Source Han Sans SC", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
body { overscroll-behavior: none; user-select: none; }
button, input { font-family: inherit; touch-action: manipulation; }
#view, #stage { touch-action: none; }
#tools, .res-scroll { touch-action: pan-x; }
#dock, #title-screen, .modal-card { touch-action: pan-y; }
button { cursor: pointer; }
[hidden] { display: none !important; }
#app { height: 100%; }

.btn, .dock-btn, .icon-btn, .tool, .cat {
  appearance: none;
  border: 2px solid #6a542c;
  background: #2a2418;
  color: var(--text);
  font-weight: 800;
  letter-spacing: 0.02em;
}
.btn { min-height: 48px; padding: 0 16px; font-size: 16px; }
.btn.primary, .btn.go {
  background: var(--copper);
  color: var(--ink);
  border-color: var(--copper-2);
}
.btn.ghost, .dock-btn, .icon-btn {
  background: #221e16;
  border-color: var(--line);
  color: var(--text);
}
.btn:active, .dock-btn:active, .icon-btn:active, .tool:active, .cat:active { transform: translateY(1px); }
.btn:disabled, .dock-btn:disabled { opacity: 0.55; }

#title-screen {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: calc(18px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  background:
    radial-gradient(ellipse at 50% 18%, #3a3018 0%, rgba(16, 18, 12, 0) 46%),
    var(--bg);
  overflow: auto;
}
#title-canvas {
  width: min(100%, 420px);
  height: auto;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #14180f;
  border: 2px solid var(--line);
  box-shadow: var(--shadow);
}
.eyebrow {
  margin: 10px 0 0;
  color: var(--copper);
  letter-spacing: 0.18em;
  font-size: 12px;
  font-weight: 800;
}
h1 {
  margin: 0;
  font-size: clamp(40px, 12vw, 68px);
  line-height: 1;
  letter-spacing: 0.08em;
  color: var(--copper-2);
  text-shadow: 0 3px 0 #6a4418;
}
.tagline { margin: 0; font-size: 16px; }
.note { margin: 0; color: var(--muted); font-size: 12px; }
.title-actions { width: min(100%, 320px); display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.title-actions .btn { width: 100%; }

#game { height: 100%; display: flex; flex-direction: column; }
#play-col { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#stage { flex: 1; min-height: 0; position: relative; background: #0c0e0a; }
#view { display: block; width: 100%; height: 100%; touch-action: none; }

#topbar {
  background: #161a12;
  padding: calc(4px + env(safe-area-inset-top)) 8px 0;
  border-bottom: 2px solid #2a2618;
}
#topbar::after {
  content: "";
  display: block;
  height: 4px;
  margin-top: 4px;
  background: repeating-linear-gradient(90deg, #e3a045 0 8px, #1a140c 8px 16px);
}
.top-row, .status-row { display: flex; align-items: center; gap: 6px; }
.status-row { padding: 4px 0 2px; }
.res-scroll {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  flex: 1;
  min-width: 0;
  scrollbar-width: none;
}
.res-scroll::-webkit-scrollbar { display: none; }
.res {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #10140c;
  border: 1px solid var(--line);
  padding: 2px 6px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.res b { font-weight: 800; }
.res.low b { color: var(--danger); }
.swatch { width: 8px; height: 8px; display: inline-block; flex: none; }
.swatch.copper { background: #e39a3c; }
.swatch.lead { background: #8eacbe; }
.swatch.coal { background: #5c6574; box-shadow: inset 0 0 0 1px #9aa3b2; }
.swatch.titanium { background: #7ee0dc; }
.swatch.graphite { background: #c2b8a4; }
.swatch.power { background: #ffc857; clip-path: polygon(55% 0, 20% 55%, 48% 55%, 35% 100%, 80% 40%, 50% 40%); width: 10px; }

.top-actions { display: flex; gap: 4px; }
.icon-btn { min-width: 40px; height: 36px; padding: 0 8px; font-size: 13px; }
.icon-btn.on { border-color: var(--copper); color: var(--copper-2); }
.core-wrap { display: flex; align-items: center; gap: 6px; min-width: 118px; }
.core-label { font-size: 12px; font-weight: 800; color: var(--copper-2); }
.hp { flex: 1; height: 10px; background: #2a2018; border: 1px solid #6a542c; min-width: 64px; }
.hp > div { height: 100%; width: 100%; background: var(--copper); }
.hp.low > div, #core-hp.low { background: var(--danger); }
.wave-wrap { flex: 1; min-width: 0; }
#wave-label { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#wave-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#zoom-pad {
  position: absolute;
  right: 8px;
  top: 100px;
  z-index: 4;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#zoom-pad button {
  width: 44px;
  height: 44px;
  font-size: 24px;
  line-height: 1;
  background: rgba(22, 18, 12, 0.9);
  color: var(--text);
  border: 2px solid var(--line);
}

#inspect {
  position: absolute;
  left: 8px;
  top: 8px;
  z-index: 5;
  width: min(250px, calc(100% - 16px));
  background: rgba(16, 18, 12, 0.94);
  border: 2px solid #6a542c;
  padding: 8px;
}
.inspect-top { display: flex; align-items: center; gap: 6px; }
.inspect-top strong { flex: 1; font-size: 14px; }
.inspect-top span, .inspect-note { color: var(--muted); font-size: 12px; }
#inspect-x {
  width: 32px; height: 32px; border: 0; background: transparent; color: var(--text); font-size: 20px;
}
.inspect-actions { display: flex; gap: 6px; margin-top: 8px; }
.inspect-actions button { flex: 1; min-height: 40px; font-size: 13px; }

#coach {
  display: flex;
  gap: 8px;
  align-items: center;
  background: #2a2214;
  border: 2px solid var(--copper);
  padding: 8px;
  margin: 6px 0 4px;
}
#coach p { margin: 0; flex: 1; font-size: 14px; line-height: 1.35; font-weight: 700; }
#coach button { min-height: 40px; padding: 0 10px; background: var(--copper); color: var(--ink); border: 2px solid var(--copper-2); font-weight: 800; }

#toast, #banner {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  pointer-events: none;
  background: rgba(16, 18, 12, 0.92);
  border: 2px solid var(--copper);
  color: var(--text);
  text-align: center;
  max-width: calc(100% - 24px);
}
#toast { top: 8px; padding: 8px 12px; font-size: 14px; font-weight: 700; }
#banner {
  top: 22%;
  padding: 12px 16px;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.06em;
  color: var(--copper-2);
}

#stage.danger::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 48px rgba(216, 75, 58, 0.55);
}

#dock {
  background: #14180f;
  border-top: 2px solid #2a2618;
  padding: 0 8px calc(8px + env(safe-area-inset-bottom));
}
#dock::before {
  content: "";
  display: block;
  height: 4px;
  margin: 0 -8px 6px;
  background: repeating-linear-gradient(90deg, #e3a045 0 8px, #1a140c 8px 16px);
}
#sel-info {
  display: flex;
  gap: 8px;
  align-items: baseline;
  min-height: 28px;
  padding: 2px 2px 4px;
}
#sel-name { font-size: 13px; color: var(--copper-2); white-space: nowrap; }
#sel-desc { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cats { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
.cat {
  flex: 1;
  min-height: 34px;
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font-size: 13px;
}
.cat.on { color: var(--copper-2); border-bottom-color: var(--copper); }
#tools {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 0;
  scrollbar-width: none;
}
#tools::-webkit-scrollbar { display: none; }
.tool {
  flex: 0 0 72px;
  height: 74px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 4px;
  scroll-snap-align: start;
  background: #1c2118;
  border-color: var(--line);
}
.tool canvas { width: 28px; height: 28px; image-rendering: pixelated; }
.tool .tname { font-size: 11px; font-weight: 800; }
.tool .cost { font-size: 10px; color: var(--muted); font-weight: 700; }
.tool.on { border-color: var(--copper); background: #3a2c16; color: var(--copper-2); }
.tool.cant .cost { color: var(--danger); }
.tool.lock { opacity: 0.5; }
.tool.pulse, #btn-wave.pulse, .dock-btn.pulse {
  animation: pulse 1.1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(227, 160, 69, 0.7); }
  50% { box-shadow: 0 0 0 5px rgba(227, 160, 69, 0); }
}
#dock-actions { display: flex; gap: 4px; padding-bottom: 2px; }
.dock-btn { flex: 1; min-width: 0; min-height: 44px; padding: 0 2px; font-size: 13px; white-space: nowrap; }
.dock-btn.on { border-color: var(--copper); color: var(--copper-2); }
#btn-wave { flex: 1.35; min-height: 44px; font-size: 15px; }
#btn-launch { flex: 1.05; min-height: 44px; font-size: 14px; background: #221e16; }
#btn-launch.ready { background: var(--ok); color: #14210c; border-color: #d7f5c4; }

#modal {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(8, 10, 6, 0.76);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
}
.modal-card {
  width: min(460px, 100%);
  max-height: min(86vh, 680px);
  overflow: auto;
  background: #1a1e14;
  border: 2px solid var(--copper);
  padding: 16px;
  box-shadow: var(--shadow);
}
.modal-card h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0.06em; }
.modal-card p, .modal-card li { font-size: 14px; line-height: 1.45; }
.modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.modal-actions .btn { width: 100%; }
.help h3 { margin: 14px 0 4px; color: var(--copper); font-size: 15px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 6px 0; }
.legend span { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.check { list-style: none; padding: 0; margin: 8px 0; }
.check li { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
.check li.ok { color: var(--ok); }
.check li.no { color: var(--danger); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.stat { background: #12160e; border: 1px solid var(--line); padding: 8px; }
.stat b { display: block; font-size: 18px; color: var(--copper-2); }
.stat span { color: var(--muted); font-size: 12px; }

@media (min-width: 720px) {
  #modal { align-items: center; }
}
@media (orientation: landscape) and (max-height: 520px) {
  #game { flex-direction: row; }
  #dock {
    width: 176px;
    overflow: auto;
    border-top: 0;
    border-left: 2px solid #2a2618;
  }
  #tools { display: grid; grid-template-columns: 1fr 1fr; overflow: visible; }
  .tool { width: auto; flex: none; height: 68px; }
  #dock-actions { flex-wrap: wrap; }
  #btn-wave, #btn-launch { flex: 1 1 46%; }
  #sel-desc { display: none; }
  h1 { font-size: 36px; }
  #title-screen { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  #title-canvas { width: min(46vh, 280px); }
}
@media (min-width: 960px) {
  #game { flex-direction: row; }
  #dock { width: 300px; overflow: auto; border-top: 0; border-left: 2px solid #2a2618; }
  #tools { display: grid; grid-template-columns: repeat(3, 1fr); overflow: visible; }
  .tool { width: auto; flex: none; }
  #sel-desc { display: inline; }
}
@media (prefers-reduced-motion: reduce) {
  .tool.pulse, #btn-wave.pulse, .dock-btn.pulse { animation: none; outline: 2px solid var(--copper); }
}

</style>
</head>
<body>
  <div id="app">
    <section id="title-screen">
      <canvas id="title-canvas" width="208" height="128" aria-hidden="true"></canvas>
      <p class="eyebrow">扇区 · 锈河 7-C</p>
      <h1>星核工厂</h1>
      <p class="tagline">开采，传送，守住坠落的星核。</p>
      <p class="note">原创小品，玩法致敬《像素工厂》</p>
      <div class="title-actions">
        <button id="btn-start" class="btn primary" type="button">开始建造</button>
        <button id="btn-continue" class="btn" type="button" hidden>继续驻守</button>
        <button id="btn-help" class="btn ghost" type="button">怎么玩</button>
      </div>
    </section>

    <section id="game" hidden>
      <div id="play-col">
        <header id="topbar">
          <div class="top-row">
            <div class="res-scroll" id="resources"></div>
            <div class="top-actions">
              <button id="btn-speed" class="icon-btn" type="button" aria-label="速度">1×</button>
              <button id="btn-sound" class="icon-btn" type="button" aria-label="声音">声</button>
              <button id="btn-pause" class="icon-btn" type="button" aria-label="暂停">暂停</button>
            </div>
          </div>
          <div class="status-row">
            <div class="core-wrap">
              <span class="core-label">星核</span>
              <div class="hp" id="core-hp-track"><div id="core-hp"></div></div>
            </div>
            <div class="wave-wrap">
              <div id="wave-label">准备</div>
              <div id="wave-sub">侦察爬虫</div>
            </div>
            <button id="btn-focus" class="icon-btn" type="button">定位</button>
          </div>
        </header>
        <div id="stage">
          <canvas id="view"></canvas>
          <div id="zoom-pad">
            <button id="zoom-in" type="button" aria-label="放大">+</button>
            <button id="zoom-out" type="button" aria-label="缩小">−</button>
          </div>
          <div id="inspect" hidden></div>
          <div id="banner" hidden></div>
          <div id="toast" hidden></div>
        </div>
      </div>
      <footer id="dock">
        <div id="coach" hidden>
          <p id="coach-text"></p>
          <button id="coach-btn" type="button">知道了</button>
        </div>
        <div id="sel-info">
          <strong id="sel-name">拖动地图</strong>
          <span id="sel-desc">单指拖动，双指缩放。点下面的设备开始建造。</span>
        </div>
        <div id="cats"></div>
        <div id="tools"></div>
        <div id="dock-actions">
          <button id="tool-hand" class="dock-btn on" type="button">拖动</button>
          <button id="tool-demo" class="dock-btn" type="button">拆除</button>
          <button id="tool-rot" class="dock-btn" type="button">旋转</button>
          <button id="btn-path" class="dock-btn on" type="button">路径</button>
          <button id="btn-wave" class="btn go" type="button">出击</button>
          <button id="btn-launch" class="btn launch" type="button">撤离</button>
        </div>
      </footer>
    </section>

    <div id="modal" hidden>
      <div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div>
    </div>
  </div>
  <noscript>需要开启 JavaScript 才能玩星核工厂。</noscript>

      solid: true, hp: 180, power: 16, unlockWave: 5,
      desc: '修复附近建筑和星核，需要电力',
    },
    generator: {
      name: '燃煤机', cat: 'power', cost: { copper: 24, lead: 10 },
      solid: true, hp: 200, power: 0, unlockWave: 3, supply: 100,
      desc: '烧煤，给全图供电',
    },
  };

  const ENEMIES = {
    crawler: { name: '爬虫', hp: 36, speed: 1.0, dmg: 8, cd: 0.55, flying: false, radius: 0.28 },
    rusher: { name: '疾行', hp: 22, speed: 1.78, dmg: 6, cd: 0.4, flying: false, radius: 0.22 },
    armored: { name: '甲壳', hp: 128, speed: 0.56, dmg: 16, cd: 0.7, flying: false, radius: 0.36 },
    wasp: { name: '飞螳', hp: 30, speed: 1.25, dmg: 9, cd: 0.48, flying: true, radius: 0.24 },
    boss: { name: '巨螯', hp: 680, speed: 0.38, dmg: 24, cd: 0.52, flying: false, radius: 0.55, boss: true },
  };

  const WAVE_DEFS = [
    { name: '侦察爬虫', hint: '只走中间', groups: [{ type: 'crawler', n: 5, lane: 1, every: 1.2 }] },
    {
      name: '三路试探', hint: '左右也会来', groups: [
        { type: 'crawler', n: 4, lane: 1, every: 1.0 },
        { type: 'crawler', n: 3, lane: 0, every: 1.3 },
        { type: 'crawler', n: 3, lane: 2, every: 1.3 },
      ],
    },
    {
      name: '空中单位', hint: '散射炮克制飞螳', groups: [
        { type: 'crawler', n: 4, lane: 1, every: 0.95 },
        { type: 'wasp', n: 4, lane: 1, every: 1.35 },
        { type: 'wasp', n: 2, lane: 2, every: 1.6 },
      ],
    },
    {
      name: '甲壳推进', hint: '厚血，用墙拖时间', groups: [
        { type: 'armored', n: 3, lane: 1, every: 1.65 },
        { type: 'rusher', n: 5, lane: 0, every: 0.72 },
        { type: 'crawler', n: 4, lane: 2, every: 0.9 },
      ],
    },
    {
      name: '混合风暴', hint: '三路一起压', groups: [
        { type: 'wasp', n: 5, lane: 0, every: 0.8 },
        { type: 'armored', n: 3, lane: 1, every: 1.45 },
        { type: 'rusher', n: 6, lane: 2, every: 0.62 },
        { type: 'crawler', n: 4, lane: 1, every: 0.75 },
      ],
    },
    {
      name: '巨螯来袭', hint: '首领', boss: true, groups: [
        { type: 'boss', n: 1, lane: 1, every: 1 },
        { type: 'crawler', n: 6, lane: 0, every: 0.65 },
        { type: 'wasp', n: 4, lane: 2, every: 0.95 },
        { type: 'rusher', n: 4, lane: 1, every: 0.85 },
      ],
    },
  ];

  const ROTATABLE = { drill: 1, tidrill: 1, belt: 1, press: 1 };
  const ORE_OK = { belt: 1, router: 1, junction: 1, drill: 1, tidrill: 1 };
  const ORE_AMOUNT = { copper: 520, lead: 420, coal: 380, titanium: 300 };

  function opposite(d) { return (d + 2) & 3; }

  function hash(x, y) {
    let n = (x * 374761393 + y * 668265263) | 0;
    n = (n ^ (n >>> 13)) | 0;
    n = Math.imul(n, 1274126177);
    return (n ^ (n >>> 16)) >>> 0;
  }

  function rng(state) {
    state.seed = (Math.imul(state.seed, 1664525) + 1013904223) >>> 0;
    return state.seed / 4294967296;
  }

  function emit(state, e) {
    state.events.push(e);
    if (state.events.length > 500) state.events.splice(0, state.events.length - 300);
  }

  function blankGrid(w, h) {
    const g = new Array(h);
    for (let y = 0; y < h; y++) g[y] = new Array(w).fill(null);
    return g;
  }

  function inBounds(state, x, y) {
    return x >= 0 && y >= 0 && x < state.w && y < state.h;
  }

  function isCoreTile(state, x, y) {
    const c = state.core;
    return x >= c.x && x < c.x + 2 && y >= c.y && y < c.y + 2;
  }

  function buildingAt(state, x, y) {
    if (!inBounds(state, x, y)) return null;
    return state.grid[y][x];
  }

  function blockedTile(state, x, y) {
    if (!inBounds(state, x, y)) return true;
    const tile = state.tiles[y][x];
    if (tile.kind === 'rock') return true;
    if (isCoreTile(state, x, y)) return true;
    const b = state.grid[y][x];
    if (b && BUILDINGS[b.type].solid) return true;
    return false;
  }

  function walkable(state, x, y) {
    return inBounds(state, x, y) && !blockedTile(state, x, y);
  }

  function canAfford(state, cost) {
    for (const k in cost) if ((state.inv[k] || 0) < cost[k]) return false;
    return true;
  }

  function pay(state, cost) {
    for (const k in cost) state.inv[k] -= cost[k];
  }

  function refund(state, cost) {
    for (const k in cost) state.inv[k] = (state.inv[k] || 0) + cost[k];
  }

  function makeBuilding(state, type, x, y, dir) {
    const def = BUILDINGS[type];
    return {
      id: state.nextId++,
      type, x, y,
      dir: (dir == null ? 1 : dir) & 3,
      hp: def.hp,
      maxHp: def.hp,
      items: [],
      buffer: [],
      ammo: 0,
      progress: 0,
      burn: 0,
      fuel: 0,
      input: 0,
      outBuf: [],
      craft: 0,
      rr: 0,
      cd: 0,
      reload: 0.2,
      angle: ((dir == null ? 1 : dir) & 3) * Math.PI / 2,
      targetId: 0,
      stalled: false,
      empty: false,
      unpowered: false,
    };
  }

  function defaultDir(state, x, y) {
    const cx = state.core.x + 1;
    const cy = state.core.y + 1;
    const dx = cx - (x + 0.5);
    const dy = cy - (y + 0.5);
    if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 0 : 2;
    return dy > 0 ? 1 : 3;
  }

  function paintOre(tiles, x, y, ore) {
    const t = tiles[y] && tiles[y][x];
    if (!t || t.kind !== 'ground') return;
    t.ore = ore;
    t.oreLeft = ORE_AMOUNT[ore];
  }

  function generateTiles() {
    const tiles = [];
    const spawns = { 3: 1, 7: 1, 12: 1 };
    for (let y = 0; y < MAP_H; y++) {
      const row = [];
      for (let x = 0; x < MAP_W; x++) {
        let kind = 'ground';
        if (y <= 1) kind = (y === 0 && spawns[x]) ? 'spawn' : 'hazard';
        else if (x === 0 || x === MAP_W - 1) kind = 'rock';
        row.push({
          kind,
          ore: null,
          oreLeft: 0,
          variant: hash(x, y) & 3,
          deco: (y === 11 && kind === 'ground') ? 'river' : null,
        });
      }
      tiles.push(row);
    }
    const rocks = [];
    for (let y = 2; y <= 5; y++) rocks.push([5, y], [10, y]);
    rocks.push([5, 8], [10, 8], [3, 17], [4, 18]);
    for (const [x, y] of rocks) {
      if (tiles[y][x].kind === 'ground') tiles[y][x].kind = 'rock';
    }
    const veins = [
      ['copper', [[1, 12], [2, 12], [1, 13], [2, 13], [1, 14], [2, 14]]],
      ['copper', [[12, 12], [13, 12], [14, 12], [12, 13], [13, 13], [14, 13]]],
      ['lead', [[1, 9], [2, 9], [1, 10], [2, 10], [13, 9], [14, 9], [13, 10], [14, 10]]],
      ['coal', [[1, 6], [2, 6], [1, 7], [2, 7], [13, 6], [14, 6], [13, 7], [14, 7]]],
      ['titanium', [[12, 17], [13, 17], [14, 17], [13, 18], [14, 18]]],
    ];
    for (const [ore, cells] of veins) {
      for (const [x, y] of cells) paintOre(tiles, x, y, ore);
    }
    return tiles;
  }

  function emptyInv() {
    return { copper: 0, lead: 0, coal: 0, titanium: 0, graphite: 0 };
  }

  function createState(opts) {
    opts = opts || {};
    const state = {
      v: 1,
      w: MAP_W,
      h: MAP_H,
      tiles: generateTiles(),
      buildings: [],
      grid: blankGrid(MAP_W, MAP_H),
      core: { x: 7, y: 16, hp: CORE_HP, maxHp: CORE_HP },
      inv: emptyInv(),
      produced: emptyInv(),
      waveIndex: 0,
      waveActive: false,
      waveName: '',
      waveHint: '',
      waveScale: 1,
      prepTime: opts.bare ? 8 : 40,
      spawnTimer: 0,
      spawnQueue: [],
      enemies: [],
      projectiles: [],
      flow: null,
      flowDist: null,
      flowDirty: true,
      unlocked: {},
      launchUnlocked: false,
      speed: 1,
      paused: false,
      over: false,
      time: 0,
      seed: opts.seed || 0x51a7c0de,
      nextId: 1,
      events: [],
      power: { supply: 0, demand: 0, ratio: 1 },
      stats: {
        kills: 0,
        placed: 0,
        delivered: 0,
        crafted: 0,
        mined: emptyInv(),
      },
      tutorialStep: 0,
      sector: '锈河 7-C',
    };
    state.inv.copper = opts.bare ? 0 : 110;
    for (const id of Object.keys(BUILDINGS)) {
      state.unlocked[id] = BUILDINGS[id].unlockWave <= 0;
    }
    if (!opts.bare) addStarter(state);
    rebuildGrid(state);
    recomputeFlow(state);
    return state;
  }

  function addStarter(state) {
    const drill = makeBuilding(state, 'drill', 2, 13, 0);
    state.buildings.push(drill);
    const belts = [
      [3, 13, 0], [4, 13, 0], [5, 13, 0], [6, 13, 0],
      [7, 13, 1], [7, 14, 1], [7, 15, 1],
    ];
    belts.forEach(([x, y, dir], i) => {
      const b = makeBuilding(state, 'belt', x, y, dir);
      if (i === 1) b.items.push({ type: 'copper', t: 0.25, fresh: false });
      if (i === 4) b.items.push({ type: 'copper', t: 0.62, fresh: false });
      state.buildings.push(b);
    });
  }

  function rebuildGrid(state) {
    for (let y = 0; y < state.h; y++) {
      for (let x = 0; x < state.w; x++) state.grid[y][x] = null;
    }
    for (const b of state.buildings) {
      if (inBounds(state, b.x, b.y)) state.grid[b.y][b.x] = b;
    }
  }

  function recomputeFlow(state) {
    const w = state.w;
    const h = state.h;
    const dist = new Int16Array(w * h);
    dist.fill(-1);
    const flow = new Int8Array(w * h);
    flow.fill(-1);
    const q = [];
    const core = state.core;
    for (let y = core.y - 1; y <= core.y + 2; y++) {
      for (let x = core.x - 1; x <= core.x + 2; x++) {
        if (!walkable(state, x, y)) continue;
        const sharesEdge =
          (x >= core.x && x < core.x + 2 && (y === core.y - 1 || y === core.y + 2)) ||
          (y >= core.y && y < core.y + 2 && (x === core.x - 1 || x === core.x + 2));
        if (!sharesEdge) continue;
        const i = y * w + x;
        dist[i] = 0;
        flow[i] = -2;
        q.push(x, y);
      }
    }
    for (let qi = 0; qi < q.length; qi += 2) {
      const x = q[qi];
      const y = q[qi + 1];
      const cd = dist[y * w + x];
      for (let d = 0; d < 4; d++) {
        const nx = x + DX[d];
        const ny = y + DY[d];
        if (!walkable(state, nx, ny)) continue;
        const ni = ny * w + nx;
        if (dist[ni] !== -1) continue;
        dist[ni] = cd + 1;
        flow[ni] = opposite(d);
        q.push(nx, ny);
      }
    }
    state.flow = flow;
    state.flowDist = dist;
    state.flowDirty = false;
  }

  function place(state, type, x, y, dir) {
    if (state.over) return { ok: false, reason: 'over' };
    const def = BUILDINGS[type];
    if (!def) return { ok: false, reason: 'type' };
    if (!state.unlocked[type]) return { ok: false, reason: 'locked', wave: def.unlockWave };
    if (!inBounds(state, x, y)) return { ok: false, reason: 'bounds' };
    const tile = state.tiles[y][x];
    if (tile.kind === 'rock' || tile.kind === 'hazard' || tile.kind === 'spawn') {
      return { ok: false, reason: 'blocked' };
    }
    if (isCoreTile(state, x, y)) return { ok: false, reason: 'blocked' };
    if (state.grid[y][x]) return { ok: false, reason: 'occupied' };
    if (tile.ore && !ORE_OK[type]) return { ok: false, reason: 'ore' };
    if ((type === 'drill' || type === 'tidrill') && !tile.ore) return { ok: false, reason: 'need-ore' };
    if (!canAfford(state, def.cost)) return { ok: false, reason: 'cost' };
    pay(state, def.cost);
    const useDir = dir == null ? defaultDir(state, x, y) : (dir & 3);
    const b = makeBuilding(state, type, x, y, useDir);
    state.buildings.push(b);
    state.grid[y][x] = b;
    if (def.solid) state.flowDirty = true;
    state.stats.placed++;
    emit(state, { type: 'place', x, y, building: type });
    return { ok: true, building: b };
  }

  function demolish(state, x, y) {
    if (!inBounds(state, x, y)) return { ok: false, reason: 'bounds' };
    if (isCoreTile(state, x, y)) return { ok: false, reason: 'core' };
    const b = state.grid[y][x];
    if (!b) return { ok: false, reason: 'empty' };
    const def = BUILDINGS[b.type];
    refund(state, def.cost);
    state.buildings = state.buildings.filter((o) => o !== b);
    state.grid[y][x] = null;
    if (def.solid) state.flowDirty = true;
    emit(state, { type: 'demolish', x, y, building: b.type, refund: def.cost });
    return { ok: true, refund: def.cost };
  }

  function rotateBuilding(state, x, y) {
    if (!inBounds(state, x, y)) return { ok: false, reason: 'bounds' };
    const b = state.grid[y][x];
    if (!b) return { ok: false, reason: 'empty' };
    if (!ROTATABLE[b.type]) return { ok: false, reason: 'fixed' };
    b.dir = (b.dir + 1) & 3;
    b.angle = b.dir * Math.PI / 2;
    emit(state, { type: 'rotate', x, y, dir: b.dir });
    return { ok: true, dir: b.dir };
  }

  function loadTurret(state, x, y, n) {
    if (!inBounds(state, x, y)) return { ok: false, reason: 'bounds' };
    const b = state.grid[y][x];
    const tdef = b && BUILDINGS[b.type].turret;
    if (!tdef) return { ok: false, reason: 'empty' };
    const space = tdef.ammoMax - b.ammo;
    const have = state.inv[tdef.ammo] || 0;
    const move = Math.min(n || 10, space, have);
    if (move <= 0) return { ok: false, reason: have <= 0 ? 'cost' : 'full', ammo: tdef.ammo };
    state.inv[tdef.ammo] -= move;
    b.ammo += move;
    emit(state, { type: 'load', x, y, n: move, ammo: tdef.ammo });
    return { ok: true, moved: move, ammo: tdef.ammo };
  }

  function acceptItem(state, x, y, itemType, fromDir) {
    if (!inBounds(state, x, y)) return false;
    if (isCoreTile(state, x, y)) {
      if (state.inv[itemType] == null) return false;
      state.inv[itemType]++;
      state.produced[itemType]++;
      state.stats.delivered++;
      emit(state, { type: 'deliver', item: itemType, x, y });
      return true;
    }
    const b = state.grid[y][x];
    if (!b) return false;
    if (b.type === 'belt') {
      if (fromDir === opposite(b.dir)) return false;
      if (b.items.length >= 4) return false;
      if (b.items.some((it) => !it.dead && it.t < MIN_GAP)) return false;
      b.items.push({ type: itemType, t: 0, fresh: true });
      return true;
    }
    if (b.type === 'router') {
      if (b.buffer.length >= 6) return false;
      b.buffer.push(itemType);
      return true;
    }
    if (b.type === 'junction') {
      if (b.items.some((it) => !it.dead && it.dir === fromDir && it.t < MIN_GAP)) return false;
      if (b.items.length >= 8) return false;
      b.items.push({ type: itemType, t: 0, dir: fromDir, fresh: true });
      return true;
    }
    const tdef = BUILDINGS[b.type].turret;
    if (tdef) {
      if (itemType !== tdef.ammo) return false;
      if (b.ammo >= tdef.ammoMax) return false;
      b.ammo++;
      return true;
    }
    if (b.type === 'press' && itemType === 'coal') {
      if (b.input >= 8) return false;
      b.input++;
      return true;
    }
    if (b.type === 'generator' && itemType === 'coal') {
      if (b.fuel >= 12) return false;
      b.fuel++;
      return true;
    }
    return false;
  }

  function tryOutput(state, b, itemType) {
    return acceptItem(state, b.x + DX[b.dir], b.y + DY[b.dir], itemType, b.dir);
  }

  function spaceItems(items) {
    const live = items.filter((it) => !it.dead);
    live.sort((a, b) => b.t - a.t);
    let limit = 99;
    for (const it of live) {
      if (it.t > limit) it.t = limit;
      limit = it.t - MIN_GAP;
    }
  }

  function updateLogistics(state, dt) {
    const movers = [];
    for (const b of state.buildings) {
      if (b.type === 'belt' || b.type === 'junction') movers.push(b);
    }
    for (const b of movers) {
      for (const it of b.items) {
        if (it.fresh || it.dead) continue;
        it.t += BELT_SPEED * dt;
      }
      if (b.type === 'belt') spaceItems(b.items);
      else {
        for (let d = 0; d < 4; d++) spaceItems(b.items.filter((it) => it.dir === d));
      }
    }
    for (const b of movers) {
      if (b.type === 'belt') exitBelt(state, b);
      else {
        for (let d = 0; d < 4; d++) exitJunction(state, b, d);
      }
    }
    for (const b of state.buildings) {
      if (b.type !== 'router') continue;
      b.cd = (b.cd || 0) - dt;
      if (b.cd > 0 || !b.buffer.length) continue;
      const itemType = b.buffer[0];
      for (let i = 0; i < 4; i++) {
        const d = (b.rr + i) & 3;
        if (acceptItem(state, b.x + DX[d], b.y + DY[d], itemType, d)) {
          b.buffer.shift();
          b.rr = (d + 1) & 3;
          b.cd = 0.06;
          break;
        }
      }
    }
    for (const b of movers) {
      for (const it of b.items) it.fresh = false;
      if (b.items.some((it) => it.dead)) b.items = b.items.filter((it) => !it.dead);
    }
  }

  function exitBelt(state, b) {
    if (!b.items.length) return;
    let front = null;
    for (const it of b.items) {
      if (it.dead) continue;
      if (!front || it.t > front.t) front = it;
    }
    if (!front || front.fresh || front.t < 1) return;
    if (acceptItem(state, b.x + DX[b.dir], b.y + DY[b.dir], front.type, b.dir)) {
      front.dead = true;
    } else {
      front.t = 1;
      spaceItems(b.items);
    }
  }

  function exitJunction(state, b, dir) {
    let front = null;
    for (const it of b.items) {
      if (it.dead || it.dir !== dir) continue;
      if (!front || it.t > front.t) front = it;
    }
    if (!front || front.fresh || front.t < 1) return;
    if (acceptItem(state, b.x + DX[dir], b.y + DY[dir], front.type, dir)) front.dead = true;
    else front.t = 1;
  }

  function updateProduction(state, dt) {
    const ratio = state.power.ratio;
    for (const b of state.buildings) {
      b.stalled = false;
      b.empty = false;
      b.unpowered = false;
      if (b.type === 'drill' || b.type === 'tidrill') updateDrill(state, b, dt, ratio);
      else if (b.type === 'press') updatePress(state, b, dt, ratio);
      else if (b.type === 'generator') updateGenerator(state, b, dt);
    }
  }

  function updateDrill(state, b, dt, ratio) {
    const tile = state.tiles[b.y][b.x];
    if (!tile.ore || tile.oreLeft <= 0) {
      b.empty = true;
      b.stalled = true;
      return;
    }
    let rate = b.type === 'tidrill' ? 2.15 : 0.92;
    if (b.type === 'tidrill') {
      if (ratio <= 0) {
        b.unpowered = true;
        b.stalled = true;
        return;
      }
      rate *= ratio;
    }
    b.progress += rate * dt;
    if (b.progress < 1) return;
    const ore = tile.ore;
    if (!tryOutput(state, b, ore)) {
      b.progress = 1;
      b.stalled = true;
      return;
    }
    b.progress -= 1;
    tile.oreLeft--;
    state.stats.mined[ore]++;
    if (tile.oreLeft <= 0) {
      tile.ore = null;
      tile.oreLeft = 0;
      tile.deco = 'pit';
      emit(state, { type: 'depleted', x: b.x, y: b.y });
    }
  }

  function updatePress(state, b, dt, ratio) {
    if (b.outBuf.length && tryOutput(state, b, b.outBuf[0])) b.outBuf.shift();
    if (BUILDINGS.press.power && ratio <= 0) {
      b.unpowered = true;
      if (b.input > 0 || b.craft > 0) b.stalled = true;
      return;
    }
    const mul = BUILDINGS.press.power ? ratio : 1;
    if (b.craft > 0) {
      b.craft -= dt * mul;
      if (b.craft <= 0) {
        b.craft = 0;
        if (b.outBuf.length < 4) {
          b.outBuf.push('graphite');
          state.stats.crafted++;
        }
      }
    } else if (b.input >= 2 && b.outBuf.length < 4) {
      b.input -= 2;
      b.craft = 1.45;
    }
    if (b.outBuf.length >= 4) b.stalled = true;
  }

  function updateGenerator(state, b, dt) {
    const need = state.power.demand > 0;
    if (b.burn <= 0 && b.fuel > 0 && need) {
      b.fuel--;
      b.burn = 3.4;
    }
    if (need && b.burn > 0) b.burn -= dt;
    if (b.burn < 0) b.burn = 0;
    b.stalled = need && b.burn <= 0 && b.fuel <= 0;
  }

  function computePower(state) {
    let supply = 0;
    let demand = 0;
    for (const b of state.buildings) {
      const def = BUILDINGS[b.type];
      if (def.power) demand += def.power;
      if (b.type === 'generator' && b.burn > 0) supply += def.supply;
    }
    state.power = {
      supply,
      demand,
      ratio: demand <= 0 ? 1 : Math.min(1, supply / demand),
    };
  }

  function updateTurrets(state, dt) {
    const ratio = state.power.ratio;
    for (const b of state.buildings) {
      const tdef = BUILDINGS[b.type].turret;
      if (!tdef) continue;
      if (BUILDINGS[b.type].power) {
        if (ratio <= 0) {
          b.unpowered = true;
          b.stalled = true;
          continue;
        }
        b.reload -= dt * ratio;
      } else {
        b.reload -= dt;
      }
      if (b.reload < 0) b.reload = 0;
      const target = acquireTarget(state, b, tdef);
      if (!target) continue;
      const ang = Math.atan2(target.y - (b.y + 0.5), target.x - (b.x + 0.5));
      b.angle = ang;
      if (b.reload <= 0 && b.ammo > 0) {
        fire(state, b, tdef, target);
        b.ammo--;
        b.reload = tdef.reload;
      } else if (b.ammo <= 0) {
        b.stalled = true;
      }
    }
  }

  function acquireTarget(state, b, tdef) {
    const cx = b.x + 0.5;
    const cy = b.y + 0.5;
    if (b.targetId) {
      const stuck = state.enemies.find((e) => e.id === b.targetId && e.hp > 0);
      if (stuck && canShoot(tdef, stuck)) {
        const d = Math.hypot(stuck.x - cx, stuck.y - cy);
        if (d <= tdef.range + 0.25) return stuck;
      }
    }
    let best = null;
    let bestD = tdef.range;
    for (const e of state.enemies) {
      if (e.hp <= 0 || !canShoot(tdef, e)) continue;
      const d = Math.hypot(e.x - cx, e.y - cy);
      if (d <= bestD) {
        bestD = d;
        best = e;
      }
    }
    b.targetId = best ? best.id : 0;
    return best;
  }

  function canShoot(tdef, e) {
    if (e.flying) return tdef.air > 0;
    return tdef.ground > 0;
  }

  function fire(state, b, tdef, target) {
    const pellets = tdef.pellets || 1;
    const spread = tdef.spread || 0;
    const cx = b.x + 0.5;
    const cy = b.y + 0.5;
    const lead = 0.28;
    const tx = target.x + (target.vx || 0) * lead;
    const ty = target.y + (target.vy || 0) * lead;
    const base = Math.atan2(ty - cy, tx - cx);
    const speed = 10;
    for (let i = 0; i < pellets; i++) {
      const ang = base + (i - (pellets - 1) / 2) * spread;
      state.projectiles.push({
        x: cx + Math.cos(ang) * 0.35,
        y: cy + Math.sin(ang) * 0.35,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        dmg: tdef.dmg,
        splash: tdef.splash || 0,
        air: tdef.air,
        ground: tdef.ground,
        life: 1.05,
      });
    }
    if (state.projectiles.length > 90) state.projectiles.splice(0, state.projectiles.length - 90);
    emit(state, { type: 'shoot', x: cx, y: cy, building: b.type });
  }

  function hitEnemy(state, e, dmg) {
    if (e.hp <= 0 || dmg <= 0) return;
    e.hp -= dmg;
    e.flash = 0.08;
    if (e.hp <= 0) {
      e.hp = 0;
      e.dead = true;
      state.stats.kills++;
      emit(state, { type: 'kill', x: e.x, y: e.y, enemy: e.type, boss: !!ENEMIES[e.type].boss });
    }
  }

  function updateProjectiles(state, dt) {
    for (const p of state.projectiles) {
      p.life -= dt;
      if (p.life <= 0) {
        p.dead = true;
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      for (const e of state.enemies) {
        if (e.hp <= 0) continue;
        if (e.flying && p.air <= 0) continue;
        if (!e.flying && p.ground <= 0) continue;
        const d = Math.hypot(e.x - p.x, e.y - p.y);
        if (d > (e.radius || 0.28) + 0.12) continue;
        const mul = e.flying ? p.air : p.ground;
        hitEnemy(state, e, p.dmg * mul);
        if (p.splash) {
          for (const o of state.enemies) {
            if (o === e || o.hp <= 0) continue;
            const dd = Math.hypot(o.x - p.x, o.y - p.y);
            if (dd <= p.splash) hitEnemy(state, o, p.dmg * 0.5 * (o.flying ? p.air : p.ground));
          }
        }
        emit(state, { type: 'hit', x: p.x, y: p.y });
        p.dead = true;
        break;
      }
    }
    if (state.projectiles.some((p) => p.dead)) {
      state.projectiles = state.projectiles.filter((p) => !p.dead);
    }
  }

  function distToCore(state, e) {
    const x0 = state.core.x;
    const y0 = state.core.y;
    const x1 = x0 + 2;
    const y1 = y0 + 2;
    const cx = Math.max(x0, Math.min(e.x, x1));
    const cy = Math.max(y0, Math.min(e.y, y1));
    return Math.hypot(e.x - cx, e.y - cy);
  }

  function damageCore(state, dmg) {
    if (state.over) return;
    state.core.hp = Math.max(0, state.core.hp - dmg);
    emit(state, { type: 'coreHit', dmg, hp: state.core.hp });
    if (state.core.hp <= 0) {
      state.over = 'dead';
      emit(state, { type: 'gameover' });
    }
  }

  function damageBuilding(state, b, dmg) {
    b.hp -= dmg;
    emit(state, { type: 'hurt', x: b.x, y: b.y, building: b.type });
    if (b.hp <= 0) {
      state.buildings = state.buildings.filter((o) => o !== b);
      if (state.grid[b.y] && state.grid[b.y][b.x] === b) state.grid[b.y][b.x] = null;
      state.flowDirty = true;
      emit(state, { type: 'destroyed', x: b.x, y: b.y, building: b.type });
    }
  }

  function attackBuilding(state, e, b) {
    damageBuilding(state, b, e.dmg);
    e.cd = e.atkCd;
  }

  function moveEnemy(state, e, vx, vy, dt) {
    e.vx = vx;
    e.vy = vy;
    let moved = false;
    const nx = e.x + vx * dt;
    if (!blockedTile(state, Math.floor(nx), Math.floor(e.y))) {
      e.x = nx;
      moved = true;
    }
    const ny = e.y + vy * dt;
    if (!blockedTile(state, Math.floor(e.x), Math.floor(ny))) {
      e.y = ny;
      moved = true;
    }
    return moved;
  }

  function updateEnemies(state, dt) {
    const ccx = state.core.x + 1;
    const ccy = state.core.y + 1;
    for (const e of state.enemies) {
      if (e.hp <= 0) continue;
      e.flash = Math.max(0, (e.flash || 0) - dt);
      e.cd -= dt;
      if (e.flying) {
        const dx = ccx - e.x;
        const dy = ccy - e.y;
        const dist = Math.hypot(dx, dy) || 1;
        const moved = moveEnemy(state, e, (dx / dist) * e.speed, (dy / dist) * e.speed, dt);
        if (distToCore(state, e) < 0.55 && e.cd <= 0) {
          damageCore(state, e.dmg);
          e.cd = e.atkCd;
        }
        if (!moved && distToCore(state, e) < 1.2 && e.cd <= 0) {
          damageCore(state, e.dmg);
          e.cd = e.atkCd;
        }
        continue;
      }
      if (distToCore(state, e) < 0.62) {
        e.vx = 0;
        e.vy = 0;
        if (e.cd <= 0) {
          damageCore(state, e.dmg);
          e.cd = e.atkCd;
        }
        continue;
      }
      const tx = Math.floor(e.x);
      const ty = Math.floor(e.y);
      let dir = -1;
      if (inBounds(state, tx, ty)) dir = state.flow[ty * state.w + tx];
      let vx = 0;
      let vy = 0;
      if (dir === -2 || dir < 0) {
        const dx = ccx - e.x;
        const dy = ccy - e.y;
        const dist = Math.hypot(dx, dy) || 1;
        vx = (dx / dist) * e.speed;
        vy = (dy / dist) * e.speed;
      } else {
        const nx = tx + DX[dir] + 0.5;
        const ny = ty + DY[dir] + 0.5;
        const dx = nx - e.x;
        const dy = ny - e.y;
        const dist = Math.hypot(dx, dy) || 1;
        vx = (dx / dist) * e.speed;
        vy = (dy / dist) * e.speed;
      }
      moveEnemy(state, e, vx, vy, dt);
      if (e.cd <= 0) {
        const ahead = blockedAhead(state, e, vx, vy);
        if (ahead) {
          if (isCoreTile(state, ahead[0], ahead[1])) {
            damageCore(state, e.dmg);
            e.cd = e.atkCd;
          } else {
            const blocker = buildingAt(state, ahead[0], ahead[1]);
            if (blocker && BUILDINGS[blocker.type].solid) attackBuilding(state, e, blocker);
          }
        }
      }
    }
    separate(state);
    if (state.enemies.some((e) => e.hp <= 0 || e.dead)) {
      state.enemies = state.enemies.filter((e) => e.hp > 0 && !e.dead);
    }
  }

  function blockedAhead(state, e, vx, vy) {
  const tx = Math.floor(e.x);
  const ty = Math.floor(e.y);
  let nx = tx;
  let ny = ty;
  if (Math.abs(vy) >= Math.abs(vx)) ny = ty + (vy >= 0 ? 1 : -1);
  else nx = tx + (vx >= 0 ? 1 : -1);
  if (!inBounds(state, nx, ny) || !blockedTile(state, nx, ny)) return null;
  const dist = Math.hypot((nx + 0.5) - e.x, (ny + 0.5) - e.y);
  if (dist > 1.15) return null;
  return [nx, ny];
}

function nearestSolid(state, e) {
    let best = null;
    let bestD = 1.15;
    for (const b of state.buildings) {
      if (!BUILDINGS[b.type].solid) continue;
      const d = Math.hypot(b.x + 0.5 - e.x, b.y + 0.5 - e.y);
      if (d < bestD) {
        bestD = d;
        best = b;
      }
    }
    return best;
  }

  function separate(state) {
    const list = state.enemies.filter((e) => !e.flying && e.hp > 0);
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i];
        const b = list[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        const min = (a.radius + b.radius) * 0.8;
        if (d >= min) continue;
        if (d < 0.0001) {
          dx = 0.02;
          dy = 0;
          d = 0.02;
        }
        const push = (min - d) * 0.45;
        const ux = dx / d;
        const uy = dy / d;
        nudge(state, a, -ux * push, -uy * push);
        nudge(state, b, ux * push, uy * push);
      }
    }
  }

  function nudge(state, e, dx, dy) {
    const nx = e.x + dx;
    const ny = e.y + dy;
    if (!blockedTile(state, Math.floor(nx), Math.floor(e.y))) e.x = nx;
    if (!blockedTile(state, Math.floor(e.x), Math.floor(ny))) e.y = ny;
  }

  function updateRepair(state, dt) {
    if (state.power.ratio <= 0) return;
    for (const b of state.buildings) {
      if (b.type !== 'repair') continue;
      const amount = 16 * state.power.ratio * dt;
      const cx = b.x + 0.5;
      const cy = b.y + 0.5;
      for (const o of state.buildings) {
        if (o === b || o.hp >= o.maxHp) continue;
        if (Math.hypot(o.x + 0.5 - cx, o.y + 0.5 - cy) <= 3.15) {
          o.hp = Math.min(o.maxHp, o.hp + amount);
        }
      }
      if (Math.hypot(state.core.x + 1 - cx, state.core.y + 1 - cy) <= 3.8) {
        state.core.hp = Math.min(state.core.maxHp, state.core.hp + amount * 0.4);
      }
    }
  }

  function waveDef(index) {
    if (index < WAVE_DEFS.length) return WAVE_DEFS[index];
    const extra = index - (WAVE_DEFS.length - 1);
    return {
      name: '增援 ' + (index + 1),
      hint: '一波比一波厚',
      scale: 1 + (extra - 1) * 0.16,
      groups: [
        { type: 'crawler', n: 6 + extra, lane: 0, every: 0.58 },
        { type: 'armored', n: 2 + Math.floor(extra / 2), lane: 1, every: 1.25 },
        { type: 'wasp', n: 3 + Math.floor(extra / 2), lane: 2, every: 0.8 },
        { type: 'rusher', n: 4 + extra, lane: extra % 2, every: 0.66 },
        extra % 3 === 0 ? { type: 'boss', n: 1, lane: 1, every: 1 } : null,
      ].filter(Boolean),
    };
  }

  function startWave(state) {
    const def = waveDef(state.waveIndex);
    state.waveActive = true;
    state.waveName = def.name;
    state.waveHint = def.hint || '';
    state.waveScale = def.scale || 1;
    state.spawnTimer = 0;
    state.spawnQueue = [];
    for (const g of def.groups) {
      let t = 0.3 + g.lane * 0.22;
      for (let i = 0; i < g.n; i++) {
        state.spawnQueue.push({ type: g.type, lane: g.lane, delay: t, scale: state.waveScale });
        t += g.every;
      }
    }
    state.spawnQueue.sort((a, b) => a.delay - b.delay);
    emit(state, { type: 'waveStart', name: def.name, index: state.waveIndex, hint: def.hint || '' });
  }

  function spawnEnemy(state, spec) {
    const def = ENEMIES[spec.type];
    if (!def) return;
    const lane = LANES[spec.lane] != null ? LANES[spec.lane] : 7;
    const scale = spec.scale || 1;
    const hp = Math.max(1, Math.round(def.hp * (spec.type === 'boss' ? scale : scale) * (0.94 + rng(state) * 0.12)));
    state.enemies.push({
      id: state.nextId++,
      type: spec.type,
      x: lane + 0.5 + (rng(state) - 0.5) * 0.3,
      y: 0.42,
      hp,
      maxHp: hp,
      speed: def.speed,
      dmg: def.dmg,
      atkCd: def.cd,
      cd: 0.25,
      flying: !!def.flying,
      radius: def.radius,
      vx: 0,
      vy: 0,
      flash: 0,
    });
    if (state.enemies.length > 80) state.enemies.splice(0, state.enemies.length - 80);
  }

  function unlockFor(state) {
    const newly = [];
    for (const id of Object.keys(BUILDINGS)) {
      if (!state.unlocked[id] && state.waveIndex >= BUILDINGS[id].unlockWave) {
        state.unlocked[id] = true;
        newly.push(id);
      }
    }
    if (state.waveIndex >= LAUNCH_WAVE) state.launchUnlocked = true;
    if (newly.length) emit(state, { type: 'unlock', ids: newly });
  }

  function updateWave(state, dt) {
    if (state.over) return;
    if (!state.waveActive) {
      state.prepTime -= dt;
      if (state.prepTime <= 0) {
        state.prepTime = 0;
        startWave(state);
      }
      return;
    }
    state.spawnTimer += dt;
    let guard = 0;
    while (state.spawnQueue.length && state.spawnQueue[0].delay <= state.spawnTimer && guard++ < 8) {
      spawnEnemy(state, state.spawnQueue.shift());
    }
    if (!state.spawnQueue.length && state.enemies.length === 0 && state.spawnTimer > 0.4) {
      state.waveIndex++;
      state.waveActive = false;
      state.prepTime = state.waveIndex === 1 ? 26 : 20;
      const bonusCu = 10 + state.waveIndex * 4;
      const bonusPb = state.waveIndex >= 2 ? 6 : 0;
      state.inv.copper += bonusCu;
      state.inv.lead += bonusPb;
      unlockFor(state);
      emit(state, { type: 'waveClear', wave: state.waveIndex, copper: bonusCu, lead: bonusPb });
    }
  }

  function update(state, dt) {
    if (!state || state.paused || state.over) return;
    const scaled = Math.max(0, Math.min(0.05, dt)) * (state.speed || 1);
    if (scaled <= 0) return;
    state.time += scaled;
    if (state.flowDirty || !state.flow) recomputeFlow(state);
    rebuildGrid(state);
    computePower(state);
    updateProduction(state, scaled);
    updateLogistics(state, scaled);
    updateTurrets(state, scaled);
    updateProjectiles(state, scaled);
    updateEnemies(state, scaled);
    updateRepair(state, scaled);
    updateWave(state, scaled);
  }

  function callWave(state) {
    if (state.over) return { ok: false, reason: 'over' };
    if (state.waveActive) return { ok: false, reason: 'active' };
    const early = state.prepTime > 3;
    if (early) {
      state.inv.copper += 20;
      emit(state, { type: 'bonus', copper: 20 });
    }
    startWave(state);
    state.prepTime = 0;
    return { ok: true, early };
  }

  function launchStatus(state) {
    const missing = {};
    let ready = !state.over && state.waveIndex >= LAUNCH_WAVE;
    if (state.waveIndex < LAUNCH_WAVE) ready = false;
    for (const k of Object.keys(LAUNCH_COST)) {
      const have = state.inv[k] || 0;
      if (have < LAUNCH_COST[k]) {
        missing[k] = LAUNCH_COST[k] - have;
        ready = false;
      }
    }
    return { ready, missing, cost: LAUNCH_COST, needWave: LAUNCH_WAVE, wave: state.waveIndex };
  }

  function launch(state) {
    if (state.over) return { ok: false, reason: 'over' };
    const status = launchStatus(state);
    if (state.waveIndex < LAUNCH_WAVE) return { ok: false, reason: 'early', status };
    if (!status.ready) return { ok: false, reason: 'cost', status };
    pay(state, LAUNCH_COST);
    state.over = 'launch';
    emit(state, { type: 'launch' });
    return { ok: true };
  }

  function setSpeed(state, mult) {
    state.speed = mult >= 2 ? 2 : 1;
  }

  function nextWaveInfo(state) {
    const def = waveDef(state.waveIndex);
    const groups = {};
    for (const g of def.groups) groups[g.type] = (groups[g.type] || 0) + g.n;
    return {
      index: state.waveIndex,
      active: !!state.waveActive,
      name: state.waveActive ? state.waveName : def.name,
      hint: state.waveActive ? state.waveHint : (def.hint || ''),
      prep: state.prepTime,
      groups,
      remaining: state.waveActive ? state.enemies.length + state.spawnQueue.length : 0,
    };
  }

  function serialize(state) {
    return JSON.stringify({
      v: 1,
      time: state.time,
      tiles: state.tiles,
      buildings: state.buildings,
      core: state.core,
      inv: state.inv,
      produced: state.produced,
      waveIndex: state.waveIndex,
      waveActive: state.waveActive,
      waveName: state.waveName,
      waveHint: state.waveHint,
      waveScale: state.waveScale,
      prepTime: state.prepTime,
      spawnTimer: state.spawnTimer,
      spawnQueue: state.spawnQueue,
      enemies: state.enemies,
      projectiles: state.projectiles,
      unlocked: state.unlocked,
      launchUnlocked: state.launchUnlocked,
      speed: state.speed,
      stats: state.stats,
      tutorialStep: state.tutorialStep,
      nextId: state.nextId,
      seed: state.seed,
      over: state.over,
    });
  }

  function hydrate(raw) {
    const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!data || data.v !== 1 || !data.tiles || !data.core) throw new Error('bad save');
    const state = createState({ bare: true });
    const keep = ['w', 'h', 'grid', 'events', 'flow', 'flowDist', 'flowDirty', 'paused', 'power', 'sector'];
    for (const k of Object.keys(data)) {
      if (keep.indexOf(k) === -1) state[k] = data[k];
    }
    state.paused = false;
    state.events = [];
    state.power = state.power || { supply: 0, demand: 0, ratio: 1 };
    state.grid = blankGrid(state.w, state.h);
    for (const b of state.buildings) {
      b.items = b.items || [];
      b.buffer = b.buffer || [];
      b.outBuf = b.outBuf || [];
      for (const it of b.items) it.fresh = false;
    }
    state.enemies = state.enemies || [];
    state.projectiles = state.projectiles || [];
    state.spawnQueue = state.spawnQueue || [];
    rebuildGrid(state);
    recomputeFlow(state);
    return state;
  }

  function debugMap(state) {
    const rows = [];
    for (let y = 0; y < state.h; y++) {
      let row = '';
      for (let x = 0; x < state.w; x++) {
        if (isCoreTile(state, x, y)) {
          row += 'C';
          continue;
        }
        const b = state.grid[y][x];
        if (b) {
          if (b.type === 'belt') row += '>v<^'[b.dir];
          else if (b.type === 'drill') row += 'D';
          else if (b.type === 'router') row += 'R';
          else if (b.type === 'duo') row += 'T';
          else if (b.type === 'cwall') row += '#';
          else row += 'B';
          continue;
        }
        const t = state.tiles[y][x];
        if (t.kind === 'rock') row += '#';
        else if (t.kind === 'hazard' || t.kind === 'spawn') row += t.kind === 'spawn' ? 'S' : 'x';
        else if (t.ore === 'copper') row += 'c';
        else if (t.ore === 'lead') row += 'l';
        else if (t.ore === 'coal') row += 'k';
        else if (t.ore === 'titanium') row += 't';
        else if (t.deco === 'river') row += '~';
        else row += '.';
      }
      rows.push(row);
    }
    return rows.join('\n');
  }

  return {
    createState,
    update,
    place,
    demolish,
    rotateBuilding,
    loadTurret,
    callWave,
    launch,
    launchStatus,
    setSpeed,
    nextWaveInfo,
    serialize,
    hydrate,
    debugMap,
    BUILDINGS,
    ENEMIES,
    LAUNCH_COST,
    LAUNCH_WAVE,
    ITEM_KEYS,
    DX,
    DY,
    DIR_NAME,
    MAP_W,
    MAP_H,
    CORE_HP,
  };
});

</script>

  const ITEM_NAME = { copper: '铜', lead: '铅', coal: '煤', titanium: '钛', graphite: '石墨' };

  };

  function loadSettings() {

      const s = JSON.parse(localStorage.getItem(SET_KEY) || '{}');

    } catch (err) { /* ignore */ }
  }

  function audio() {
    if (!soundOn) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  let lastSfx = 0;
  function tone(freq, dur, type, gain) {
    const ctx = audio();
    if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.6), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  function sfx(kind) {
    const now = performance.now();
    if ((kind === 'place' || kind === 'demo') && now - lastSfx < 70) return;
    lastSfx = now;
    if (kind === 'place') tone(540, 0.05, 'square', 0.03);
    else if (kind === 'demo') tone(180, 0.07, 'sawtooth', 0.03);
    else if (kind === 'deny') tone(120, 0.08, 'square', 0.04);
    else if (kind === 'shoot') tone(880, 0.03, 'square', 0.015);
    else if (kind === 'wave') { tone(440, 0.12, 'square', 0.04); setTimeout(() => tone(660, 0.14, 'square', 0.04), 90); }
    else if (kind === 'clear') tone(520, 0.1, 'triangle', 0.04);
    else if (kind === 'hurt') tone(90, 0.16, 'sawtooth', 0.05);
    else if (kind === 'unlock') tone(700, 0.12, 'triangle', 0.04);
    else if (kind === 'launch') { tone(330, 0.2, 'triangle', 0.05); setTimeout(() => tone(520, 0.24, 'triangle', 0.05), 140); }
    else if (kind === 'lose') tone(80, 0.35, 'sawtooth', 0.05);
  }
  function buzz(ms) {

  function toast(msg) {
    const now = performance.now();
    if (msg === lastToast && now - lastToastAt < 900) return;
    lastToast = msg;
    lastToastAt = now;
    toastText = msg;
    toastUntil = now + 1600;
    const el = $('toast');

  function initSprites() {
    sprites.ground = [0, 1, 2, 3].map((v) => paint(16, 16, (g) => drawGround(g, v, null)));

    sprites.pit = paint(16, 16, (g) => drawPit(g));
    sprites.ore = {};

  function drawGround(g, variant, deco) {
    const bases = ['#3c4632', '#445038', '#36422e', '#323a2c'];
    g.fillStyle = deco === 'river' ? '#2a332c' : bases[variant % 4];
    g.fillRect(0, 0, 16, 16);
    g.fillStyle = deco === 'river' ? '#3e4c46' : '#516048';
    const spots = [[[2, 3], [8, 11], [13, 5]], [[4, 8], [11, 2], [7, 14]], [[1, 12], [9, 6], [14, 10]], [[6, 2], [12, 12], [3, 7]]];
    spots[variant % 4].forEach(([x, y]) => g.fillRect(x, y, 1, 1));
    g.fillStyle = 'rgba(0,0,0,0.18)';
    g.fillRect(0, 15, 16, 1);
    g.fillRect(15, 0, 1, 16);
    if (deco === 'river') {
      g.fillStyle = '#6a5434';
      g.fillRect(0, 7, 16, 1);
      g.fillStyle = '#c4a06a';
      g.fillRect(0, 8, 16, 1);
      g.fillStyle = '#2a2418';
      g.fillRect(0, 9, 16, 1);
    }
  }
  function drawPit(g) {
    drawGround(g, 0, null);

  function drawOre(g, kind) {
    drawGround(g, kind === 'copper' ? 0 : 2, null);
    const pal = {
      copper: ['#7a4a1c', '#e39a3c', '#ffc857'],

    g.fillRect(3, 4, 10, 9);

    g.fillRect(4, 5, 8, 7);

    g.fillRect(5, 6, 6, 5);

  function drawRock(g) {

  function drawHazard(g, frame) {
    g.fillStyle = '#2a1614';
    g.fillRect(0, 0, 16, 16);
    for (let i = -16; i < 32; i += 8) {
      g.fillStyle = (Math.floor(i / 8) + frame) % 2 === 0 ? '#6a3030' : '#3a2020';
      g.beginPath();
      g.moveTo(i, 16);
      g.lineTo(i + 8, 0);
      g.lineTo(i + 12, 0);
      g.lineTo(i + 4, 16);
      g.fill();
    }

  function drawSpawn(g) {

  function drawBelt(g, dir, frame) {
    const horizontal = dir % 2 === 0;
    g.fillStyle = '#6e675c';
    if (horizontal) g.fillRect(0, 3, 16, 10);
    else g.fillRect(3, 0, 10, 16);
    g.fillStyle = '#cbbba4';
    if (horizontal) g.fillRect(0, 3, 16, 2);
    else g.fillRect(3, 0, 2, 16);
    g.fillStyle = '#241f1a';
    if (horizontal) g.fillRect(0, 6, 16, 5);
    else g.fillRect(6, 0, 5, 16);
    g.fillStyle = '#ffe08a';
    const p = 1 + frame * 4;
    if (dir === 0) {
      g.fillRect(p, 7, 4, 2);
      g.fillRect(p + 3, 6, 2, 1);
      g.fillRect(p + 3, 9, 2, 1);
    } else if (dir === 2) {
      g.fillRect(11 - p, 7, 4, 2);
      g.fillRect(10 - p, 6, 2, 1);
      g.fillRect(10 - p, 9, 2, 1);
    } else if (dir === 1) {
      g.fillRect(7, p, 2, 4);
      g.fillRect(6, p + 3, 1, 2);
      g.fillRect(9, p + 3, 1, 2);
    } else {
      g.fillRect(7, 11 - p, 2, 4);
      g.fillRect(6, 10 - p, 1, 2);
      g.fillRect(9, 10 - p, 1, 2);
    }

  function drawDrill(g, frame, titanium) {
    g.fillStyle = '#1c1814';

    g.fillStyle = '#1c1814';
    g.fillRect(5, 6, 6, 6);
    g.fillStyle = titanium ? '#d8fffd' : '#e39a3c';

      g.fillRect(7, 6, 2, 6);
      g.fillRect(5, 8, 6, 2);

  function drawArrow(g, dir) {

  function drawTurretBase(g, accent, heavy) {

  function paintCore(g, frame) {

    g.fillStyle = '#8a8174';
    g.fillRect(5, 5, 22, 6);

    g.fillRect(14, 14, 4, 4);

    g.fillStyle = '#e3a045';
    g.fillRect(1, 1, 6, 2);
    g.fillRect(1, 1, 2, 6);
