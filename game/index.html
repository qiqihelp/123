<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>深空当铺：可能是偷的 2.0 | Deepspace Pawnshop: Probably Stolen</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- 强制横屏 + 全屏自适应主容器 -->
  <div id="app-shell">

    <!-- 顶部全屏状态栏 -->
    <header class="topbar">
      <div class="brand-box">
        <span style="font-size:20px;">🛸</span>
        <div>
          <div class="brand-title">深空当铺：可能是偷的</div>
          <div class="brand-sub" id="hud-day">第 1 天 · 准备营业</div>
        </div>
      </div>

      <div class="hud-stats">
        <div class="stat-pill credits" id="hud-credits" title="当前流动信用点">💰 0 CR</div>
        <div class="stat-pill rent" id="hud-rent" title="每4天收一次递增房租">🏠 房租 350 CR</div>
        <div class="stat-pill energy" id="hud-energy" title="驱动机器合成、光谱仪与AI扫描仪">⚡ 110/160</div>
        <div class="stat-pill luck" id="hud-luck" title="幸运值影响物资箱稀有掉落、刮刮乐大奖与治安官漏检概率">🍀 幸运 10</div>
        <div class="stat-pill heat" id="hud-heat" title="治安局关注度">🚨 嫌疑 0%</div>
        <div class="stat-pill aug" id="hud-aug" title="失控AI改造体渗透度">🤖 AI 10%</div>
      </div>

      <div style="display:flex;gap:5px;align-items:center;">
        <div id="difficulty-badge" style="font-size:11px;padding:2px 5px;border-radius:4px;background:#1e3a5f;color:#3b82f6;">⚖️ 标准模式</div>
        <div id="perks-badge" style="font-size:11px;padding:2px 5px;border-radius:4px;background:#1e3a5f;color:#94a3b8;">无特性</div>
        <div id="modules-badge" style="font-size:11px;padding:2px 5px;border-radius:4px;background:#1e3a5f;color:#a855f7;">⚙️ 0/4</div>
        <div id="newspaper-badge" style="font-size:11px;padding:2px 5px;border-radius:4px;background:#1e3a5f;color:#f59e0b;font-weight:bold;">📰 报纸头条</div>
        <button class="btn-amber" id="btn-buyout" title="攒够 6,000 CR 买断永久地契解锁多结局！">🔑 买断地契(6000)</button>
        <button class="btn-primary" id="btn-fullscreen" title="进入沉浸全屏并锁定横屏">⛶ 全屏横屏</button>
        <button id="btn-mute" title="开关合成音效">🔊</button>
        <button id="btn-newgame-top" title="切换职业或重开">🔄 职业</button>
      </div>
    </header>

    <!-- 横屏三栏一屏核心工作台（每栏内部独立丝滑滚动） -->
    <main class="main-grid">

      <!-- 左栏：派系声望、通缉悬赏、紧俏行情与暗巷日志 -->
      <section class="panel">
        <div class="panel-header">
          <span class="panel-title">🌐 空间站势力 & 悬赏</span>
        </div>
        <div class="panel-scroll">
          <div id="market-hot" style="background:#0a1324;border:1px solid #1e3a5f;border-radius:5px;padding:5px 8px;font-size:11.5px;margin-bottom:7px;"></div>
          <div id="wanted-box" class="wanted-card"></div>
          <div id="faction-list"></div>

          <div class="panel-header" style="margin-top:6px;">
            <span class="panel-title">📓 掌柜交易日志</span>
          </div>
          <div id="log-box" class="log-box"></div>
        </div>
      </section>

      <!-- 中栏：主交易柜台（支持单名顾客多物品整批/勾选买卖、鉴伪质询、开箱与霰弹枪防卫） -->
      <section class="panel">
        <div class="panel-header">
          <span class="panel-title">🏮 第13底层街区 · 当铺交易柜台</span>
          <span id="queue-counter" style="font-size:11.5px;color:#94a3b8;font-family:var(--font-mono);"></span>
        </div>

        <div class="panel-scroll" id="center-scroll">
          <div class="counter-stage">
            <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
              <canvas id="customer-canvas" width="144" height="144"></canvas>
              <div id="customer-badges" style="display:flex;flex-wrap:wrap;gap:3px;justify-content:center;"></div>
            </div>
            <div id="customer-meta"></div>
            <div id="newspaper-badge" style="font-size:11px;padding:2px 5px;border-radius:4px;background:#1e3a5f;color:#f59e0b;font-weight:bold;margin-top:4px;text-align:center;">📰 报纸头条</div>
          </div>

          <div id="center-content"></div>
        </div>

        <div id="under-counter-mount"></div>
      </section>

      <!-- 右栏：5 合 1 终端（库存&套包扩容箱 / 电话大宗批发商 / 后室机器 / 证照设备 / 掌柜手册） -->
      <section class="panel">
        <div class="tabs-nav">
          <button class="tab-btn active" data-tab="inventory">🎒 库存套包</button>
          <button class="tab-btn" data-tab="merchants">☎️ 电话批发</button>
          <button class="tab-btn" data-tab="workshop">⚙️ 后室产线</button>
          <button class="tab-btn" data-tab="upgrades">📜 证照设备</button>
          <button class="tab-btn" data-tab="guide">📖 手册</button>
        </div>

        <div class="panel-scroll" id="right-tab-body"></div>
      </section>

    </main>

    <!-- 开局 6 大职业选择全屏弹窗 -->
    <div id="start-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>🛸 深空当铺：可能是偷的 v3.0</h2>
          <button id="btn-close-start" class="btn-close hidden">✕</button>
        </div>

        <!-- v3.0 难度与特性选择 -->
        <div class="select-group">
          <label>难度：</label>
          <select id="diff-select">
            <option value="gouge">💰 宰客模式 (预算+15%)</option>
            <option value="markup" selected>⚖️ 标准模式</option>
            <option value="thin_margins">📉 薄利模式 (房租+20%)</option>
            <option value="red_ink">🔴 赤字模式 (地狱难度)</option>
          </select>
        </div>
        <div class="select-group">
          <label>正面特性：</label>
          <select id="perk-pos-select">
            <option value="">无</option>
            <option value="short_sleeper">😴 短睡者 (夜间回电+20)</option>
            <option value="model_citizen">⭐ 模范公民 (治安+15)</option>
            <option value="lucky">🍀 幸运儿 (幸运+25)</option>
            <option value="intimidating">😠 气势逼人 (议价+15%)</option>
            <option value="vending_machine">🏪 自动售货机 (自带机器)</option>
            <option value="sawyers_crew">🕵️ 索耶手下 (解锁黑市)</option>
            <option value="diplomatic">🤝 外交家 (全派系+10)</option>
            <option value="proficient_scavenger">🗑️ 熟练拾荒者 (垃圾场+2)</option>
            <option value="vigilant">👁️ 警觉 (AI扫描减半)</option>
            <option value="experienced_chemist">🧪 资深化学家 (机器耗电-15%)</option>
          </select>
        </div>
        <div class="select-group">
          <label>负面特性：</label>
          <select id="perk-neg-select">
            <option value="">无</option>
            <option value="ascetic">🧘 苦行者 (声望-30%)</option>
            <option value="minimalist">📦 极简主义者 (货架-4)</option>
            <option value="sentinel_disorder">🤖 哨兵紊乱症 (AI+20)</option>
            <option value="bad_lease">📜 烂租约 (房租+30%)</option>
            <option value="convict">⛓️ 前科犯 (嫌疑+25)</option>
            <option value="addictions">💊 成瘾者 (能量-30)</option>
            <option value="unlucky">☠️ 倒霉蛋 (幸运-20)</option>
            <option value="blackmail">💸 被勒索 (开局-200CR)</option>
          </select>
        </div>
        <div class="select-group">
          <label>中性特性：</label>
          <select id="perk-neu-select">
            <option value="">无</option>
            <option value="aug_menace">🤖 AI威胁 (赏金+50%)</option>
            <option value="makeshift_reactor">☢️ 简易反应堆 (能量+40)</option>
            <option value="prime_real_estate">🏙️ 黄金地段 (买断-20%)</option>
          </select>
        </div>

        <div id="prof-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:15px;"></div>

        <div style="margin-top:15px;text-align:center;">
          <button id="btn-resume-save" class="btn-primary hidden" style="width:100%;margin-bottom:8px;">📂 继续存档</button>
        </div>
      </div>
    </div>
    <div id="start-modal" class="modal-overlay">
      <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
          <div>
            <h1 style="font-size:21px;background:linear-gradient(90deg,#22d3ee,#c084fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
              🛸 深空当铺：可能是偷的 2.0 完全版
            </h1>
            <p style="color:#94a3b8;font-size:12px;margin-top:2px;">
              五类密封物资箱+钥匙卡 · 暗区式套包扩容箱/免检伪装箱 · 电话大宗批发商 · 多物品批量交易 · 刮刮乐与养鼠流
            </p>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn-primary" id="btn-start-fullscreen">⛶ 开启全屏横屏游玩</button>
            <button class="btn-success hidden" id="btn-resume-save">📂 继续存档</button>
            <button class="hidden" id="btn-close-start">✕ 返回对局</button>
          </div>
        </div>

        <div id="prof-grid" class="prof-grid"></div>
      </div>
    </div>

    <!-- 结局结算弹窗 -->
    <div id="ending-modal" class="modal-overlay hidden">
      <div class="modal-box" style="max-width:700px;">
        <div id="ending-content"></div>
      </div>
    </div>

    <!-- 浮动消息提示 -->
    <div id="toast-container"></div>

  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
