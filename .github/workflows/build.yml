name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: "4.0.23"

jobs:
  native:
    name: Native build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  web:
    name: WebAssembly build
    runs-on: ubuntu-latest
    needs: native
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten
        run: |
          if [ ! -x emsdk/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          fi
          ./emsdk/emsdk install "$EMSDK_VERSION"
          ./emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Configure
        run: |
          source emsdk/emsdk_env.sh > /dev/null 2>&1
          emcmake cmake -S . -B build-web \
            -DCMAKE_BUILD_TYPE=Release \
            -DECHOFALL_BUILD_WEB=ON \
            -DECHOFALL_BUILD_TESTS=OFF

      - name: Build
        run: |
          source emsdk/emsdk_env.sh > /dev/null 2>&1
          cmake --build build-web -j2 --target echofall_web
          ls -la build-web

      - name: Build single file bundle
        continue-on-error: true
        run: |
          source emsdk/emsdk_env.sh > /dev/null 2>&1
          emcmake cmake -S . -B build-web-single \
            -DCMAKE_BUILD_TYPE=Release \
            -DECHOFALL_BUILD_WEB=OFF \
            -DECHOFALL_BUILD_WEB_SINGLE=ON \
            -DECHOFALL_BUILD_TESTS=OFF
          cmake --build build-web-single -j2 --target echofall_web_single
          ls -la build-web-single

      - name: Package for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: build-web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: echofall-web
          path: build-web
          if-no-files-found: error

      - name: Upload single file artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: echofall-single-file
          path: build-web-single
          if-no-files-found: warn
