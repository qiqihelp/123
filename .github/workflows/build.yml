name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pages 只有 main 分支能发布，避免多个 Arena 分支互相覆盖站点内容
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: "4.0.23"

jobs:
  native:
    name: Native build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  web:
    name: WebAssembly build
    runs-on: ubuntu-latest
    needs: native
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten
        run: |
          if [ ! -x emsdk/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          fi
          ./emsdk/emsdk install "$EMSDK_VERSION"
          ./emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Configure
        run: |
          source emsdk/emsdk_env.sh > /dev/null 2>&1
          emcmake cmake -S . -B build-web \
            -DCMAKE_BUILD_TYPE=Release \
            -DECHOFALL_BUILD_WEB=ON \
            -DECHOFALL_BUILD_TESTS=OFF

      - name: Build
        run: |
          source emsdk/emsdk_env.sh > /dev/null 2>&1
          cmake --build build-web -j2 --target echofall_web
          ls -la build-web

      - name: Build single file bundle
        continue-on-error: true
        run: |
          source emsdk/emsdk_env.sh > /dev/null 2>&1
          emcmake cmake -S . -B build-web-single \
            -DCMAKE_BUILD_TYPE=Release \
            -DECHOFALL_BUILD_WEB=OFF \
            -DECHOFALL_BUILD_WEB_SINGLE=ON \
            -DECHOFALL_BUILD_TESTS=OFF
          cmake --build build-web-single -j2 --target echofall_web_single
          ls -la build-web-single

      - name: Add 数学之战 mini game
        run: |
          mkdir -p build-web/mathwar
          cp -r mathwar/. build-web/mathwar/

      # 两个 Pages action 都升到 node24 版本：旧版本（v3 / v4）声明的是 node20，
      # 在 runner 上被强制用 Node 24 运行，deploy-pages 因此读不到 artifact，
      # 报 "No artifacts named github-pages were found"（artifact 其实已经上传成功）。
      - name: Package for GitHub Pages
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build-web

      # 诊断：让 runner 自己报告它看到的 artifact 列表（失败时用于定位）
      - name: Show artifacts seen by runner
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          echo "run id: $GITHUB_RUN_ID / attempt: $GITHUB_RUN_ATTEMPT"
          curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID/artifacts" \
            | head -c 800

      # 不加 continue-on-error：部署失败必须让工作流变红，不能再出现"假绿"
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: echofall-web
          path: build-web
          if-no-files-found: error

      - name: Upload single file artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: echofall-single-file
          path: build-web-single
          if-no-files-found: warn
