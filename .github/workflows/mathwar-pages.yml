name: Math War → GitHub Pages

# 《数学之战》是纯静态网页游戏（mathwar/），不依赖 Emscripten 构建。
# 这个工作流会把它单独发布到 GitHub Pages。
# 等主站（回声之谷）也启用 Pages 后，可以删掉本文件，改用 build.yml 里的打包步骤。

on:
  push:
    paths:
      - 'mathwar/**'
      - '.github/workflows/mathwar-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mathwar-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight (debug)
        run: |
          echo "repo=${{ github.repository }} branch=${{ github.ref }}"
          echo "pages via api:"
          curl -s -o /dev/null -w "GET /pages => %{http_code}\n" -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages
          echo "token scopes:"
          curl -s -I -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/user | grep -i "x-oauth-scopes" || echo "(no scopes header)"
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mathwar

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
