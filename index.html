<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影子格斗家 - Shadow Fighter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SimSun', 'STSong', serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            border: 4px solid #4a4a6a;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(100, 100, 150, 0.5);
        }
        canvas {
            display: block;
            background: #0d0d1a;
        }
        #instructions {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            color: #8a8aa0;
            font-size: 14px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="instructions">WASD移动 | 1/2/3切换光源 | 空格攻击 | R重置关卡</div>
    </div>

    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GAME_WIDTH = 900;
const GAME_HEIGHT = 600;
canvas.width = GAME_WIDTH;
canvas.height = GAME_HEIGHT;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    
    switch(type) {
        case 'attack':
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
            osc.type = 'sawtooth';
            osc.start(now);
            osc.stop(now + 0.2);
            break;
        case 'hit':
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
            osc.type = 'square';
            osc.start(now);
            osc.stop(now + 0.15);
            break;
        case 'switch':
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            osc.type = 'sine';
            osc.start(now);
            osc.stop(now + 0.1);
            break;
        case 'death':
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
            osc.type = 'sawtooth';
            osc.start(now);
            osc.stop(now + 0.5);
            break;
        case 'levelup':
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.4);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
            break;
    }
}

const GameState = { MENU: 0, PLAYING: 1, GAMEOVER: 2, LEVELCOMPLETE: 3 };
let gameState = GameState.MENU;

let player, enemies, particles, obstacles;
let lightSources;
let currentLightIndex = 0;
let score = 0;
let level = 1;
let keys = {};
let lastTime = 0;
let menuSelection = 0;

const SHADOW_FORMS = {
    STANDING: 'standing',
    SWORD: 'sword',
    GIANT_HAND: 'giantHand'
};

class Vector2 {
    constructor(x = 0, y = 0) {
        this.x = x;
        this.y = y;
    }
    
    add(v) { return new Vector2(this.x + v.x, this.y + v.y); }
    sub(v) { return new Vector2(this.x - v.x, this.y - v.y); }
    mul(s) { return new Vector2(this.x * s, this.y * s); }
    length() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    normalize() {
        const len = this.length();
        return len > 0 ? new Vector2(this.x / len, this.y / len) : new Vector2();
    }
    distance(v) { return this.sub(v).length(); }
}

class Player {
    constructor(x, y) {
        this.pos = new Vector2(x, y);
        this.vel = new Vector2();
        this.width = 40;
        this.height = 60;
        this.speed = 200;
        this.shadowForm = SHADOW_FORMS.STANDING;
        this.health = 100;
        this.maxHealth = 100;
        this.isAttacking = false;
        this.attackTimer = 0;
        this.attackCooldown = 0;
        this.invincible = false;
        this.invincibleTimer = 0;
        this.shadowLength = 80;
        this.animFrame = 0;
        this.facingRight = true;
    }
    
    update(dt) {
        this.vel = new Vector2();
        if (keys['KeyW'] || keys['ArrowUp']) this.vel.y = -1;
        if (keys['KeyS'] || keys['ArrowDown']) this.vel.y = 1;
        if (keys['KeyA'] || keys['ArrowLeft']) { this.vel.x = -1; this.facingRight = false; }
        if (keys['KeyD'] || keys['ArrowRight']) { this.vel.x = 1; this.facingRight = true; }
        
        this.vel = this.vel.normalize().mul(this.speed);
        this.pos = this.pos.add(this.vel.mul(dt));
        
        this.pos.x = Math.max(this.width/2, Math.min(GAME_WIDTH - this.width/2, this.pos.x));
        this.pos.y = Math.max(this.height/2, Math.min(GAME_HEIGHT - this.height/2, this.pos.y));
        
        if (this.attackCooldown > 0) this.attackCooldown -= dt;
        if (this.isAttacking) {
            this.attackTimer -= dt;
            if (this.attackTimer <= 0) this.isAttacking = false;
        }
        if (this.invincible) {
            this.invincibleTimer -= dt;
            if (this.invincibleTimer <= 0) this.invincible = false;
        }
        
        this.animFrame += dt * 10;
    }
    
    attack() {
        if (this.attackCooldown <= 0 && !this.isAttacking) {
            this.isAttacking = true;
            this.attackTimer = 0.3;
            this.attackCooldown = 0.5;
            playSound('attack');
            return true;
        }
        return false;
    }
    
    getShadowPolygon(lightPos) {
        const polygons = [];
        const centerX = this.pos.x;
        const centerY = this.pos.y;
        
        switch(this.shadowForm) {
            case SHADOW_FORMS.STANDING:
                polygons.push({
                    points: this.getStandingShadow(centerX, centerY, lightPos),
                    type: 'jump',
                    damage: 25,
                    range: 70
                });
                break;
            case SHADOW_FORMS.SWORD:
                polygons.push({
                    points: this.getSwordShadow(centerX, centerY, lightPos),
                    type: 'slash',
                    damage: 35,
                    range: 90
                });
                break;
            case SHADOW_FORMS.GIANT_HAND:
                polygons.push({
                    points: this.getGiantHandShadow(centerX, centerY, lightPos),
                    type: 'grab',
                    damage: 45,
                    range: 120
                });
                break;
        }
        return polygons;
    }
    
    getStandingShadow(cx, cy, lightPos) {
        const dir = new Vector2(cx - lightPos.x, cy - lightPos.y).normalize();
        const points = [];
        points.push(new Vector2(cx - 15, cy + 30));
        points.push(new Vector2(cx + 15, cy + 30));
        points.push(points[1].add(dir.mul(80)));
        points.push(points[0].add(dir.mul(80)));
        return points;
    }
    
    getSwordShadow(cx, cy, lightPos) {
        const dir = new Vector2(cx - lightPos.x, cy - lightPos.y).normalize();
        const perpDir = new Vector2(-dir.y, dir.x);
        const points = [];
        const startX = cx + (this.facingRight ? 20 : -20);
        const endX = startX + (this.facingRight ? 90 : -90);
        points.push(new Vector2(startX - perpDir.x * 10, cy));
        points.push(new Vector2(startX + perpDir.x * 10, cy));
        points.push(new Vector2(endX + perpDir.x * 25, cy));
        points.push(new Vector2(endX - perpDir.x * 25, cy));
        return points;
    }
    
    getGiantHandShadow(cx, cy, lightPos) {
        const dir = new Vector2(cx - lightPos.x, cy - lightPos.y).normalize();
        const perpDir = new Vector2(-dir.y, dir.x);
        const points = [];
        const handX = cx + dir.x * 60;
        const handY = cy + dir.y * 60;
        points.push(new Vector2(cx, cy));
        points.push(new Vector2(cx - perpDir.x * 15, cy - perpDir.y * 15));
        points.push(new Vector2(handX - perpDir.x * 50, handY - perpDir.y * 50));
        points.push(new Vector2(handX - perpDir.x * 20, handY - perpDir.y * 20));
        points.push(new Vector2(handX + 20, handY));
        points.push(new Vector2(handX + perpDir.x * 20, handY + perpDir.y * 20));
        points.push(new Vector2(handX + perpDir.x * 50, handY + perpDir.y * 50));
        points.push(new Vector2(cx + perpDir.x * 15, cy + perpDir.y * 15));
        return points;
    }
    
    draw() {
        ctx.save();
        
        if (this.invincible && Math.floor(this.invincibleTimer * 20) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }
        
        const gradient = ctx.createRadialGradient(this.pos.x, this.pos.y, 0, this.pos.x, this.pos.y, 30);
        gradient.addColorStop(0, '#3a3a5a');
        gradient.addColorStop(1, '#1a1a2e');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.ellipse(this.pos.x, this.pos.y + 25, 20, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#2a2a4a';
        ctx.beginPath();
        ctx.ellipse(this.pos.x, this.pos.y - 10, 12, 15, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillRect(this.pos.x - 8, this.pos.y - 5, 16, 25);
        
        ctx.fillStyle = '#4a4a6a';
        const legOffset = Math.sin(this.animFrame) * 5;
        ctx.fillRect(this.pos.x - 10, this.pos.y + 20, 8, 15 + legOffset);
        ctx.fillRect(this.pos.x + 2, this.pos.y + 20, 8, 15 - legOffset);
        
        ctx.fillStyle = '#3a3a5a';
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y - 18, 8, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
    }
}

class Enemy {
    constructor(x, y, type = 'normal') {
        this.pos = new Vector2(x, y);
        this.vel = new Vector2();
        this.width = 35;
        this.height = 50;
        this.speed = type === 'fast' ? 120 : (type === 'tank' ? 50 : 80);
        this.health = type === 'tank' ? 80 : (type === 'fast' ? 30 : 50);
        this.maxHealth = this.health;
        this.type = type;
        this.isAttacking = false;
        this.attackTimer = 0;
        this.attackCooldown = 2;
        this.isChasing = false;
        this.shadowForm = [SHADOW_FORMS.STANDING, SHADOW_FORMS.SWORD, SHADOW_FORMS.GIANT_HAND][Math.floor(Math.random() * 3)];
        this.animFrame = Math.random() * 10;
        this.facingRight = true;
        this.flashTimer = 0;
    }
    
    update(dt, playerPos) {
        const toPlayer = playerPos.sub(this.pos);
        const dist = toPlayer.length();
        
        this.animFrame += dt * 8;
        
        if (dist < 200) {
            this.isChasing = true;
            const dir = toPlayer.normalize();
            this.vel = dir.mul(this.speed);
            this.facingRight = dir.x > 0;
        } else {
            this.isChasing = false;
            this.vel = this.vel.mul(0.95);
        }
        
        this.pos = this.pos.add(this.vel.mul(dt));
        this.pos.x = Math.max(this.width/2, Math.min(GAME_WIDTH - this.width/2, this.pos.x));
        this.pos.y = Math.max(this.height/2, Math.min(GAME_HEIGHT - this.height/2, this.pos.y));
        
        if (this.attackCooldown > 0) this.attackCooldown -= dt;
        if (this.isAttacking) {
            this.attackTimer -= dt;
            if (this.attackTimer <= 0) this.isAttacking = false;
        }
        
        if (this.flashTimer > 0) this.flashTimer -= dt;
    }
    
    tryAttack(playerPos) {
        const dist = this.pos.distance(playerPos);
        if (dist < 80 && this.attackCooldown <= 0 && !this.isAttacking) {
            this.isAttacking = true;
            this.attackTimer = 0.4;
            this.attackCooldown = 2;
            return true;
        }
        return false;
    }
    
    getShadowPolygon(lightPos) {
        const polygons = [];
        const centerX = this.pos.x;
        const centerY = this.pos.y;
        
        switch(this.shadowForm) {
            case SHADOW_FORMS.STANDING:
                polygons.push({
                    points: this.getStandingShadow(centerX, centerY, lightPos),
                    type: 'jump',
                    damage: 15,
                    range: 60
                });
                break;
            case SHADOW_FORMS.SWORD:
                polygons.push({
                    points: this.getSwordShadow(centerX, centerY, lightPos),
                    type: 'slash',
                    damage: 20,
                    range: 75
                });
                break;
            case SHADOW_FORMS.GIANT_HAND:
                polygons.push({
                    points: this.getGiantHandShadow(centerX, centerY, lightPos),
                    type: 'grab',
                    damage: 25,
                    range: 100
                });
                break;
        }
        return polygons;
    }
    
    getStandingShadow(cx, cy, lightPos) {
        const dir = new Vector2(cx - lightPos.x, cy - lightPos.y).normalize();
        return [
            new Vector2(cx - 12, cy + 25),
            new Vector2(cx + 12, cy + 25),
            new Vector2(cx + 12 + dir.x * 60, cy + 25 + dir.y * 60),
            new Vector2(cx - 12 + dir.x * 60, cy + 25 + dir.y * 60)
        ];
    }
    
    getSwordShadow(cx, cy, lightPos) {
        const dir = new Vector2(cx - lightPos.x, cy - lightPos.y).normalize();
        const perpDir = new Vector2(-dir.y, dir.x);
        const startX = cx + (this.facingRight ? 15 : -15);
        const endX = startX + (this.facingRight ? 75 : -75);
        return [
            new Vector2(startX - perpDir.x * 8, cy),
            new Vector2(startX + perpDir.x * 8, cy),
            new Vector2(endX + perpDir.x * 20, cy),
            new Vector2(endX - perpDir.x * 20, cy)
        ];
    }
    
    getGiantHandShadow(cx, cy, lightPos) {
        const dir = new Vector2(cx - lightPos.x, cy - lightPos.y).normalize();
        const perpDir = new Vector2(-dir.y, dir.x);
        const handX = cx + dir.x * 50;
        const handY = cy + dir.y * 50;
        return [
            new Vector2(cx, cy),
            new Vector2(cx - perpDir.x * 12, cy - perpDir.y * 12),
            new Vector2(handX - perpDir.x * 40, handY - perpDir.y * 40),
            new Vector2(handX - perpDir.x * 15, handY - perpDir.y * 15),
            new Vector2(handX + 15, handY),
            new Vector2(handX + perpDir.x * 15, handY + perpDir.y * 15),
            new Vector2(handX + perpDir.x * 40, handY + perpDir.y * 40),
            new Vector2(cx + perpDir.x * 12, cy + perpDir.y * 12)
        ];
    }
    
    draw() {
        ctx.save();
        
        if (this.flashTimer > 0) {
            ctx.fillStyle = '#ff4444';
        } else {
            const color = this.type === 'fast' ? '#4a3a5a' : (this.type === 'tank' ? '#3a3a4a' : '#3a4a5a');
            ctx.fillStyle = color;
        }
        
        const gradient = ctx.createRadialGradient(this.pos.x, this.pos.y, 0, this.pos.x, this.pos.y, 25);
        gradient.addColorStop(0, this.flashTimer > 0 ? '#ff6666' : '#4a4a6a');
        gradient.addColorStop(1, this.flashTimer > 0 ? '#cc3333' : '#2a2a4a');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.ellipse(this.pos.x, this.pos.y + 20, 18, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = this.flashTimer > 0 ? '#ff6666' : '#3a3a5a';
        ctx.beginPath();
        ctx.ellipse(this.pos.x, this.pos.y - 8, 10, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillRect(this.pos.x - 6, this.pos.y - 3, 12, 20);
        
        const legOffset = Math.sin(this.animFrame) * 4;
        ctx.fillRect(this.pos.x - 8, this.pos.y + 17, 6, 12 + legOffset);
        ctx.fillRect(this.pos.x + 2, this.pos.y + 17, 6, 12 - legOffset);
        
        ctx.fillStyle = '#5a2a2a';
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y - 14, 6, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = this.isChasing ? '#ff4444' : '#3a3a3a';
        ctx.beginPath();
        ctx.arc(this.pos.x - 3, this.pos.y - 15, 2, 0, Math.PI * 2);
        ctx.arc(this.pos.x + 3, this.pos.y - 15, 2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
    }
    
    takeDamage(amount) {
        this.health -= amount;
        this.flashTimer = 0.15;
        playSound('hit');
        return this.health <= 0;
    }
}

class Particle {
    constructor(x, y, vx, vy, color, life, size) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.size = size;
    }
    
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
        this.vy += 200 * dt;
    }
    
    draw() {
        const alpha = this.life / this.maxLife;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class LightSource {
    constructor(x, y, color = '#ffffaa') {
        this.pos = new Vector2(x, y);
        this.color = color;
        this.radius = 150;
        this.intensity = 1;
        this.pulseTimer = Math.random() * Math.PI * 2;
    }
    
    update(dt) {
        this.pulseTimer += dt * 2;
        this.intensity = 0.8 + Math.sin(this.pulseTimer) * 0.2;
    }
    
    draw() {
        const gradient = ctx.createRadialGradient(this.pos.x, this.pos.y, 0, this.pos.x, this.pos.y, this.radius);
        gradient.addColorStop(0, this.color);
        gradient.addColorStop(0.3, 'rgba(255, 255, 200, 0.3)');
        gradient.addColorStop(1, 'rgba(255, 255, 200, 0)');
        
        ctx.save();
        ctx.globalAlpha = this.intensity * 0.5;
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        
        ctx.save();
        ctx.fillStyle = '#ffffcc';
        ctx.shadowColor = '#ffffaa';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class Obstacle {
    constructor(x, y, width, height) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
    }
    
    draw() {
        ctx.save();
        
        const gradient = ctx.createLinearGradient(this.x, this.y, this.x + this.width, this.y + this.height);
        gradient.addColorStop(0, '#2a2a3a');
        gradient.addColorStop(0.5, '#3a3a4a');
        gradient.addColorStop(1, '#2a2a3a');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        
        ctx.strokeStyle = '#4a4a5a';
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x, this.y, this.width, this.height);
        
        ctx.strokeStyle = 'rgba(100, 100, 120, 0.3)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(this.x + 5 + i * 8, this.y + 5);
            ctx.lineTo(this.x + 5 + i * 8, this.y + this.height - 5);
            ctx.stroke();
        }
        
        ctx.restore();
    }
    
    contains(point) {
        return point.x >= this.x && point.x <= this.x + this.width &&
               point.y >= this.y && point.y <= this.y + this.height;
    }
}

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 150;
        particles.push(new Particle(
            x, y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed - 50,
            color,
            0.5 + Math.random() * 0.5,
            3 + Math.random() * 5
        ));
    }
}

function pointInPolygon(point, polygon) {
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i].x, yi = polygon[i].y;
        const xj = polygon[j].x, yj = polygon[j].y;
        
        if (((yi > point.y) !== (yj > point.y)) &&
            (point.x < (xj - xi) * (point.y - yi) / (yj - yi) + xi)) {
            inside = !inside;
        }
    }
    return inside;
}

function polygonIntersectsRect(polygon, rect) {
    const center = new Vector2(rect.x, rect.y);
    const halfW = rect.width / 2;
    const halfH = rect.height / 2;
    
    const corners = [
        new Vector2(rect.x - halfW, rect.y - halfH),
        new Vector2(rect.x + halfW, rect.y - halfH),
        new Vector2(rect.x + halfW, rect.y + halfH),
        new Vector2(rect.x - halfW, rect.y + halfH)
    ];
    
    for (const corner of corners) {
        if (pointInPolygon(corner, polygon)) return true;
    }
    
    return false;
}

function getCurrentLight() {
    return lightSources[currentLightIndex];
}

function initLevel(levelNum) {
    player = new Player(GAME_WIDTH / 2, GAME_HEIGHT - 100);
    
    lightSources = [
        new LightSource(150, 100, '#ffaaaa'),
        new LightSource(GAME_WIDTH / 2, 80, '#aaffaa'),
        new LightSource(GAME_WIDTH - 150, 100, '#aaaaff')
    ];
    
    particles = [];
    obstacles = [];
    
    if (levelNum === 1) {
        enemies = [
            new Enemy(200, 150, 'normal'),
            new Enemy(700, 150, 'normal'),
            new Enemy(450, 100, 'fast')
        ];
        obstacles.push(new Obstacle(100, 300, 80, 120));
        obstacles.push(new Obstacle(400, 250, 100, 80));
        obstacles.push(new Obstacle(720, 300, 80, 120));
    } else if (levelNum === 2) {
        enemies = [
            new Enemy(150, 100, 'normal'),
            new Enemy(750, 100, 'normal'),
            new Enemy(300, 200, 'fast'),
            new Enemy(600, 200, 'fast'),
            new Enemy(450, 80, 'tank')
        ];
        obstacles.push(new Obstacle(50, 280, 100, 100));
        obstacles.push(new Obstacle(250, 350, 80, 80));
        obstacles.push(new Obstacle(570, 350, 80, 80));
        obstacles.push(new Obstacle(750, 280, 100, 100));
        obstacles.push(new Obstacle(400, 180, 100, 60));
    } else if (levelNum === 3) {
        enemies = [
            new Enemy(100, 80, 'fast'),
            new Enemy(800, 80, 'fast'),
            new Enemy(200, 200, 'normal'),
            new Enemy(700, 200, 'normal'),
            new Enemy(400, 100, 'tank'),
            new Enemy(500, 100, 'tank'),
            new Enemy(300, 300, 'normal'),
            new Enemy(600, 300, 'normal')
        ];
        obstacles.push(new Obstacle(50, 380, 120, 100));
        obstacles.push(new Obstacle(730, 380, 120, 100));
        obstacles.push(new Obstacle(200, 150, 60, 100));
        obstacles.push(new Obstacle(640, 150, 60, 100));
        obstacles.push(new Obstacle(400, 280, 100, 100));
        obstacles.push(new Obstacle(300, 450, 80, 60));
        obstacles.push(new Obstacle(520, 450, 80, 60));
    }
    
    currentLightIndex = 0;
}

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
    gradient.addColorStop(0, '#0a0a15');
    gradient.addColorStop(0.5, '#0d0d1a');
    gradient.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    ctx.strokeStyle = 'rgba(60, 60, 80, 0.3)';
    ctx.lineWidth = 1;
    for (let i = 0; i < GAME_WIDTH; i += 50) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, GAME_HEIGHT);
        ctx.stroke();
    }
    for (let i = 0; i < GAME_HEIGHT; i += 50) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(GAME_WIDTH, i);
        ctx.stroke();
    }
    
    ctx.save();
    ctx.strokeStyle = 'rgba(80, 80, 100, 0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GAME_HEIGHT - 20);
    ctx.quadraticCurveTo(GAME_WIDTH / 4, GAME_HEIGHT - 40, GAME_WIDTH / 2, GAME_HEIGHT - 25);
    ctx.quadraticCurveTo(GAME_WIDTH * 3 / 4, GAME_HEIGHT - 10, GAME_WIDTH, GAME_HEIGHT - 30);
    ctx.stroke();
    ctx.restore();
}

function drawShadows() {
    const light = getCurrentLight();
    
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
    ctx.shadowBlur = 15;
    ctx.shadowOffsetX = 5;
    ctx.shadowOffsetY = 5;
    
    const playerShadows = player.getShadowPolygon(light.pos);
    for (const shadow of playerShadows) {
        ctx.beginPath();
        ctx.moveTo(shadow.points[0].x, shadow.points[0].y);
        for (let i = 1; i < shadow.points.length; i++) {
            ctx.lineTo(shadow.points[i].x, shadow.points[i].y);
        }
        ctx.closePath();
        ctx.fill();
    }
    
    for (const enemy of enemies) {
        const enemyShadows = enemy.getShadowPolygon(light.pos);
        for (const shadow of enemyShadows) {
            ctx.beginPath();
            ctx.moveTo(shadow.points[0].x, shadow.points[0].y);
            for (let i = 1; i < shadow.points.length; i++) {
                ctx.lineTo(shadow.points[i].x, shadow.points[i].y);
            }
            ctx.closePath();
            ctx.fill();
        }
    }
    
    ctx.restore();
}

function drawInkStyle() {
    ctx.save();
    
    for (let i = 0; i < 20; i++) {
        const x = Math.random() * GAME_WIDTH;
        const y = Math.random() * GAME_HEIGHT;
        const size = Math.random() * 3;
        ctx.fillStyle = `rgba(30, 30, 40, ${Math.random() * 0.3})`;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.restore();
}

function drawUI() {
    ctx.save();
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(10, 10, 200, 80);
    ctx.strokeStyle = '#4a4a6a';
    ctx.lineWidth = 2;
    ctx.strokeRect(10, 10, 200, 80);
    
    ctx.fillStyle = '#8a8aa0';
    ctx.font = '16px SimSun, serif';
    ctx.fillText('生命值', 20, 35);
    
    const healthWidth = 150;
    const healthHeight = 15;
    ctx.fillStyle = '#2a2a3a';
    ctx.fillRect(40, 40, healthWidth, healthHeight);
    
    const healthGradient = ctx.createLinearGradient(40, 0, 40 + healthWidth, 0);
    healthGradient.addColorStop(0, '#ff4444');
    healthGradient.addColorStop(1, '#ff6666');
    ctx.fillStyle = healthGradient;
    ctx.fillRect(40, 40, healthWidth * (player.health / player.maxHealth), healthHeight);
    
    ctx.strokeStyle = '#4a4a6a';
    ctx.strokeRect(40, 40, healthWidth, healthHeight);
    
    ctx.fillStyle = '#8a8aa0';
    ctx.font = '14px SimSun, serif';
    ctx.fillText(`分数: ${score}`, 20, 75);
    ctx.fillText(`关卡: ${level}`, 100, 75);
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(GAME_WIDTH - 180, 10, 170, 100);
    ctx.strokeStyle = '#4a4a6a';
    ctx.strokeRect(GAME_WIDTH - 180, 10, 170, 100);
    
    ctx.fillStyle = '#8a8aa0';
    ctx.font = '14px SimSun, serif';
    ctx.fillText('影子形态:', GAME_WIDTH - 170, 35);
    
    const forms = ['站立人形', '横剑形态', '巨手形态'];
    const colors = ['#5a5a7a', '#7a5a5a', '#5a7a7a'];
    
    for (let i = 0; i < 3; i++) {
        const x = GAME_WIDTH - 170 + i * 55;
        const y = 45;
        const isActive = player.shadowForm === [SHADOW_FORMS.STANDING, SHADOW_FORMS.SWORD, SHADOW_FORMS.GIANT_HAND][i];
        
        ctx.fillStyle = isActive ? colors[i] : '#2a2a3a';
        ctx.fillRect(x, y, 50, 30);
        ctx.strokeStyle = isActive ? colors[i] : '#4a4a6a';
        ctx.lineWidth = isActive ? 2 : 1;
        ctx.strokeRect(x, y, 50, 30);
        
        ctx.fillStyle = isActive ? '#ffffff' : '#6a6a8a';
        ctx.font = '10px SimSun, serif';
        ctx.fillText(`${i + 1}`, x + 22, y + 12);
        ctx.fillText(forms[i].substring(0, 2), x + 15, y + 25);
    }
    
    ctx.fillStyle = '#6a6a8a';
    ctx.font = '12px SimSun, serif';
    ctx.fillText(`光源 ${currentLightIndex + 1}`, GAME_WIDTH - 170, 95);
    
    ctx.restore();
}

function drawMenu() {
    ctx.save();
    
    const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
    gradient.addColorStop(0, '#0a0a15');
    gradient.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    for (let i = 0; i < 50; i++) {
        const x = Math.random() * GAME_WIDTH;
        const y = Math.random() * GAME_HEIGHT;
        ctx.fillStyle = `rgba(100, 100, 150, ${Math.random() * 0.5})`;
        ctx.beginPath();
        ctx.arc(x, y, Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.fillStyle = '#ff6644';
    ctx.shadowColor = '#ff4422';
    ctx.shadowBlur = 30;
    ctx.font = 'bold 56px SimSun, STSong, serif';
    ctx.textAlign = 'center';
    ctx.fillText('影子格斗家', GAME_WIDTH / 2, 180);
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#6a6a8a';
    ctx.font = '18px SimSun, serif';
    ctx.fillText('SHADOW FIGHTER', GAME_WIDTH / 2, 220);
    
    ctx.fillStyle = '#4a4a5a';
    ctx.font = '24px SimSun, serif';
    ctx.fillText('— 东方水墨风格解谜动作游戏 —', GAME_WIDTH / 2, 280);
    
    const menuItems = ['开始游戏', '操作说明'];
    for (let i = 0; i < menuItems.length; i++) {
        const y = 380 + i * 50;
        const isSelected = menuSelection === i;
        
        ctx.fillStyle = isSelected ? 'rgba(255, 100, 68, 0.2)' : 'rgba(50, 50, 70, 0.5)';
        ctx.fillRect(GAME_WIDTH / 2 - 120, y - 20, 240, 40);
        
        ctx.strokeStyle = isSelected ? '#ff6644' : '#4a4a6a';
        ctx.lineWidth = isSelected ? 2 : 1;
        ctx.strokeRect(GAME_WIDTH / 2 - 120, y - 20, 240, 40);
        
        ctx.fillStyle = isSelected ? '#ff6644' : '#8a8aa0';
        ctx.font = isSelected ? 'bold 20px SimSun, serif' : '18px SimSun, serif';
        ctx.fillText(menuItems[i], GAME_WIDTH / 2, y + 5);
    }
    
    if (menuSelection === 1) {
        ctx.fillStyle = 'rgba(20, 20, 30, 0.95)';
        ctx.fillRect(GAME_WIDTH / 2 - 250, 300, 500, 250);
        ctx.strokeStyle = '#4a4a6a';
        ctx.lineWidth = 2;
        ctx.strokeRect(GAME_WIDTH / 2 - 250, 300, 500, 250);
        
        ctx.fillStyle = '#ff6644';
        ctx.font = 'bold 20px SimSun, serif';
        ctx.fillText('操作说明', GAME_WIDTH / 2, 335);
        
        ctx.fillStyle = '#8a8aa0';
        ctx.font = '16px SimSun, serif';
        const instructions = [
            'WASD - 移动角色',
            '1 / 2 / 3 - 切换光源位置（影响影子方向）',
            '空格键 - 攻击',
            'R - 重置当前关卡',
            '',
            '三种影子形态：',
            '1. 站立人形 - 跳跃攻击',
            '2. 横剑形态 - 横扫切割',
            '3. 巨手形态 - 远程抓取'
        ];
        
        for (let i = 0; i < instructions.length; i++) {
            ctx.fillText(instructions[i], GAME_WIDTH / 2, 370 + i * 22);
        }
    }
    
    ctx.fillStyle = '#4a4a5a';
    ctx.font = '14px SimSun, serif';
    ctx.fillText('使用 ↑↓ 选择，按 Enter 确认', GAME_WIDTH / 2, 550);
    
    ctx.restore();
}

function drawGameOver() {
    ctx.save();
    
    ctx.fillStyle = 'rgba(10, 10, 20, 0.9)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    ctx.fillStyle = '#aa3333';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 30;
    ctx.font = 'bold 48px SimSun, serif';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 60);
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#8a8aa0';
    ctx.font = '24px SimSun, serif';
    ctx.fillText(`最终得分: ${score}`, GAME_WIDTH / 2, GAME_HEIGHT / 2);
    ctx.fillText(`到达关卡: ${level}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 40);
    
    const isSelected = menuSelection === 0;
    ctx.fillStyle = isSelected ? 'rgba(255, 100, 68, 0.2)' : 'rgba(50, 50, 70, 0.5)';
    ctx.fillRect(GAME_WIDTH / 2 - 80, GAME_HEIGHT / 2 + 80, 160, 40);
    ctx.strokeStyle = isSelected ? '#ff6644' : '#4a4a6a';
    ctx.lineWidth = isSelected ? 2 : 1;
    ctx.strokeRect(GAME_WIDTH / 2 - 80, GAME_HEIGHT / 2 + 80, 160, 40);
    ctx.fillStyle = isSelected ? '#ff6644' : '#8a8aa0';
    ctx.font = '18px SimSun, serif';
    ctx.fillText('重新开始', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 108);
    
    ctx.restore();
}

function drawLevelComplete() {
    ctx.save();
    
    ctx.fillStyle = 'rgba(10, 10, 20, 0.9)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    ctx.fillStyle = '#44aa66';
    ctx.shadowColor = '#66ff88';
    ctx.shadowBlur = 30;
    ctx.font = 'bold 48px SimSun, serif';
    ctx.textAlign = 'center';
    ctx.fillText(`第 ${level} 关完成!`, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 60);
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#8a8aa0';
    ctx.font = '24px SimSun, serif';
    ctx.fillText(`当前得分: ${score}`, GAME_WIDTH / 2, GAME_HEIGHT / 2);
    
    const isSelected = menuSelection === 0;
    ctx.fillStyle = isSelected ? 'rgba(68, 170, 102, 0.3)' : 'rgba(50, 50, 70, 0.5)';
    ctx.fillRect(GAME_WIDTH / 2 - 80, GAME_HEIGHT / 2 + 50, 160, 40);
    ctx.strokeStyle = isSelected ? '#44aa66' : '#4a4a6a';
    ctx.lineWidth = isSelected ? 2 : 1;
    ctx.strokeRect(GAME_WIDTH / 2 - 80, GAME_HEIGHT / 2 + 50, 160, 40);
    ctx.fillStyle = isSelected ? '#66ff88' : '#8a8aa0';
    ctx.font = '18px SimSun, serif';
    ctx.fillText('下一关', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 78);
    
    ctx.restore();
}

function handleInput(dt) {
    if (keys['Digit1']) {
        if (currentLightIndex !== 0) {
            currentLightIndex = 0;
            playSound('switch');
            keys['Digit1'] = false;
        }
    }
    if (keys['Digit2']) {
        if (currentLightIndex !== 1) {
            currentLightIndex = 1;
            playSound('switch');
            keys['Digit2'] = false;
        }
    }
    if (keys['Digit3']) {
        if (currentLightIndex !== 2) {
            currentLightIndex = 2;
            playSound('switch');
            keys['Digit3'] = false;
        }
    }
    
    if (keys['Space']) {
        if (player.attack()) {
            keys['Space'] = false;
        }
    }
    
    if (keys['KeyR']) {
        initLevel(level);
        keys['KeyR'] = false;
    }
}

function checkCollisions() {
    const light = getCurrentLight();
    
    if (player.isAttacking) {
        const playerAttacks = player.getShadowPolygon(light.pos);
        for (const attack of playerAttacks) {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                if (polygonIntersectsRect(attack.points, {
                    x: enemy.pos.x,
                    y: enemy.pos.y,
                    width: enemy.width,
                    height: enemy.height
                })) {
                    if (enemy.takeDamage(attack.damage)) {
                        createParticles(enemy.pos.x, enemy.pos.y, '#ff6644', 20);
                        score += enemy.type === 'tank' ? 300 : (enemy.type === 'fast' ? 200 : 100);
                        enemies.splice(i, 1);
                        playSound('death');
                    }
                }
            }
        }
    }
    
    for (const enemy of enemies) {
        if (enemy.tryAttack(player.pos) && !player.invincible) {
            player.health -= 15;
            player.invincible = true;
            player.invincibleTimer = 1;
            createParticles(player.pos.x, player.pos.y, '#ff4444', 15);
            
            if (player.health <= 0) {
                gameState = GameState.GAMEOVER;
                menuSelection = 0;
            }
        }
        
        if (enemy.isAttacking && !player.invincible) {
            const enemyAttacks = enemy.getShadowPolygon(light.pos);
            for (const attack of enemyAttacks) {
                if (polygonIntersectsRect(attack.points, {
                    x: player.pos.x,
                    y: player.pos.y,
                    width: player.width,
                    height: player.height
                })) {
                    player.health -= attack.damage;
                    player.invincible = true;
                    player.invincibleTimer = 0.5;
                    createParticles(player.pos.x, player.pos.y, '#ff4444', 10);
                    
                    if (player.health <= 0) {
                        gameState = GameState.GAMEOVER;
                        menuSelection = 0;
                    }
                    break;
                }
            }
        }
    }
    
    for (const obstacle of obstacles) {
        if (player.pos.x - player.width/2 < obstacle.x + obstacle.width &&
            player.pos.x + player.width/2 > obstacle.x &&
            player.pos.y - player.height/2 < obstacle.y + obstacle.height &&
            player.pos.y + player.height/2 > obstacle.y) {
            
            const overlapX1 = (player.pos.x + player.width/2) - obstacle.x;
            const overlapX2 = (obstacle.x + obstacle.width) - (player.pos.x - player.width/2);
            const overlapY1 = (player.pos.y + player.height/2) - obstacle.y;
            const overlapY2 = (obstacle.y + obstacle.height) - (player.pos.y - player.height/2);
            
            const minOverlap = Math.min(overlapX1, overlapX2, overlapY1, overlapY2);
            
            if (minOverlap === overlapX1) player.pos.x = obstacle.x - player.width/2;
            else if (minOverlap === overlapX2) player.pos.x = obstacle.x + obstacle.width + player.width/2;
            else if (minOverlap === overlapY1) player.pos.y = obstacle.y - player.height/2;
            else player.pos.y = obstacle.y + obstacle.height + player.height/2;
        }
    }
}

function update(dt) {
    if (gameState !== GameState.PLAYING) return;
    
    handleInput(dt);
    
    player.update(dt);
    
    for (const enemy of enemies) {
        enemy.update(dt, player.pos);
    }
    
    for (const light of lightSources) {
        light.update(dt);
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) {
            particles.splice(i, 1);
        }
    }
    
    checkCollisions();
    
    if (enemies.length === 0) {
        if (level < 3) {
            gameState = GameState.LEVELCOMPLETE;
            menuSelection = 0;
            playSound('levelup');
        } else {
            score += 1000;
            gameState = GameState.GAMEOVER;
            menuSelection = 0;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    if (gameState === GameState.MENU) {
        drawMenu();
        return;
    }
    
    if (gameState === GameState.GAMEOVER) {
        drawGameOver();
        return;
    }
    
    if (gameState === GameState.LEVELCOMPLETE) {
        drawLevelComplete();
        return;
    }
    
    drawBackground();
    
    for (const obstacle of obstacles) {
        obstacle.draw();
    }
    
    for (const light of lightSources) {
        light.draw();
    }
    
    drawShadows();
    
    for (const enemy of enemies) {
        enemy.draw();
    }
    
    player.draw();
    
    for (const particle of particles) {
        particle.draw();
    }
    
    drawInkStyle();
    drawUI();
}

function gameLoop(currentTime) {
    const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
    lastTime = currentTime;
    
    update(dt);
    draw();
    
    requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', (e) => {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    
    keys[e.code] = true;
    
    if (gameState === GameState.MENU) {
        if (e.code === 'ArrowUp') {
            menuSelection = (menuSelection - 1 + 2) % 2;
        } else if (e.code === 'ArrowDown') {
            menuSelection = (menuSelection + 1) % 2;
        } else if (e.code === 'Enter') {
            if (menuSelection === 0) {
                gameState = GameState.PLAYING;
                level = 1;
                score = 0;
                initLevel(level);
            }
        }
    } else if (gameState === GameState.GAMEOVER || gameState === GameState.LEVELCOMPLETE) {
        if (e.code === 'Enter' || e.code === 'Space') {
            if (gameState === GameState.GAMEOVER) {
                gameState = GameState.MENU;
            } else {
                level++;
                initLevel(level);
                gameState = GameState.PLAYING;
            }
        }
    }
});

document.addEventListener('keyup', (e) => {
    keys[e.code] = false;
});

window.addEventListener('load', () => {
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
});
    </script>
