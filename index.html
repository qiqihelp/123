<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际猎手 - Space Hunter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}
canvas { display: block; }
#ui-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: none;
  z-index: 10;
}
#ui-overlay.active { pointer-events: auto; }
.screen {
  display: none;
  flex-direction: column;
  align-items: center;
  text-align: center;
  color: #fff;
}
.screen.visible { display: flex; }
#start-screen h1 {
  font-size: 64px;
  background: linear-gradient(135deg, #00f0ff, #7b2ff7, #ff2d95);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px;
  letter-spacing: 4px;
  text-shadow: 0 0 40px rgba(0,240,255,0.3);
}
#start-screen .subtitle {
  font-size: 18px;
  color: #8899aa;
  margin-bottom: 40px;
}
.btn {
  padding: 14px 48px;
  font-size: 20px;
  border: 2px solid #00f0ff;
  background: rgba(0,240,255,0.1);
  color: #00f0ff;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s;
  margin: 8px;
  pointer-events: auto;
  letter-spacing: 2px;
}
.btn:hover {
  background: rgba(0,240,255,0.3);
  box-shadow: 0 0 20px rgba(0,240,255,0.4);
  transform: scale(1.05);
}
.controls-hint {
  margin-top: 30px;
  font-size: 14px;
  color: #556677;
  line-height: 1.8;
}
#gameover-screen h2 {
  font-size: 48px;
  color: #ff2d95;
  margin-bottom: 20px;
}
#gameover-screen .final-score {
  font-size: 28px;
  color: #00f0ff;
  margin-bottom: 10px;
}
#gameover-screen .high-score {
  font-size: 18px;
  color: #7b2ff7;
  margin-bottom: 30px;
}
#pause-screen h2 {
  font-size: 42px;
  color: #ffcc00;
  margin-bottom: 20px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui-overlay" class="active">
  <div id="start-screen" class="screen visible">
    <h1>星际猎手</h1>
    <p class="subtitle">SPACE HUNTER</p>
    <button class="btn" id="btn-start">开始游戏</button>
    <div class="controls-hint">
      方向键 / WASD 移动 &nbsp;|&nbsp; 空格键 射击<br>
      P 暂停 &nbsp;|&nbsp; 支持触屏操作
    </div>
  </div>
  <div id="gameover-screen" class="screen">
    <h2>任务失败</h2>
    <p class="final-score">得分: <span id="final-score">0</span></p>
    <p class="high-score">最高分: <span id="high-score">0</span></p>
    <button class="btn" id="btn-restart">再来一次</button>
  </div>
  <div id="pause-screen" class="screen">
    <h2>已暂停</h2>
    <button class="btn" id="btn-resume">继续游戏</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('ui-overlay');
const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const pauseScreen = document.getElementById('pause-screen');
const finalScoreEl = document.getElementById('final-score');
const highScoreEl = document.getElementById('high-score');

const W = 480, H = 720;
canvas.width = W;
canvas.height = H;

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3 };
let gameState = STATE.MENU;
let score = 0;
let highScore = parseInt(localStorage.getItem('spaceHunterHigh') || '0');
let lives = 3;
let level = 1;
let spawnTimer = 0;
let spawnInterval = 90;
let difficultyTimer = 0;
let shakeTimer = 0;
let shakeIntensity = 0;

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'p' || e.key === 'P') togglePause();
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

let touchX = null;
let touchShooting = false;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  touchX = (e.touches[0].clientX - rect.left) * scaleX;
  touchShooting = true;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  touchX = (e.touches[0].clientX - rect.left) * scaleX;
});
canvas.addEventListener('touchend', e => {
  touchX = null;
  touchShooting = false;
});

class Player {
  constructor() { this.reset(); }
  reset() {
    this.x = W / 2;
    this.y = H - 80;
    this.w = 36;
    this.h = 40;
    this.speed = 5;
    this.shootCooldown = 0;
    this.shootRate = 10;
    this.invincible = 0;
    this.powerLevel = 0;
    this.powerTimer = 0;
  }
  update() {
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx = -1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) dx = 1;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) dy = -1;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) dy = 1;

    if (touchX !== null) {
      const diff = touchX - this.x;
      dx = Math.abs(diff) < 3 ? 0 : (diff > 0 ? 1 : -1);
      dy = 0;
    }

    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    this.x += dx * this.speed;
    this.y += dy * this.speed;
    this.x = Math.max(this.w / 2, Math.min(W - this.w / 2, this.x));
    this.y = Math.max(this.h / 2, Math.min(H - this.h / 2, this.y));

    if (this.shootCooldown > 0) this.shootCooldown--;
    if ((keys[' '] || touchShooting) && this.shootCooldown <= 0) {
      this.shoot();
      this.shootCooldown = this.shootRate;
    }
    if (this.invincible > 0) this.invincible--;
    if (this.powerTimer > 0) {
      this.powerTimer--;
      if (this.powerTimer <= 0) this.powerLevel = 0;
    }
  }
  shoot() {
    const bSpeed = -9;
    bullets.push(new Bullet(this.x, this.y - this.h / 2, 0, bSpeed, '#00f0ff'));
    if (this.powerLevel >= 1) {
      bullets.push(new Bullet(this.x - 14, this.y - this.h / 2 + 5, 0, bSpeed, '#00f0ff'));
      bullets.push(new Bullet(this.x + 14, this.y - this.h / 2 + 5, 0, bSpeed, '#00f0ff'));
    }
    if (this.powerLevel >= 2) {
      bullets.push(new Bullet(this.x - 8, this.y - this.h / 2, -1.5, bSpeed, '#7b2ff7'));
      bullets.push(new Bullet(this.x + 8, this.y - this.h / 2, 1.5, bSpeed, '#7b2ff7'));
    }
  }
  draw() {
    if (this.invincible > 0 && Math.floor(this.invincible / 3) % 2) return;
    ctx.save();
    ctx.translate(this.x, this.y);

    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 15;

    ctx.fillStyle = '#0a1628';
    ctx.beginPath();
    ctx.moveTo(0, -this.h / 2);
    ctx.lineTo(-this.w / 2, this.h / 2);
    ctx.lineTo(-this.w / 4, this.h / 3);
    ctx.lineTo(this.w / 4, this.h / 3);
    ctx.lineTo(this.w / 2, this.h / 2);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.moveTo(0, -this.h / 2 + 8);
    ctx.lineTo(-6, 4);
    ctx.lineTo(6, 4);
    ctx.closePath();
    ctx.fill();

    const flicker = 0.7 + Math.random() * 0.3;
    ctx.fillStyle = `rgba(0,180,255,${flicker})`;
    ctx.beginPath();
    ctx.moveTo(-8, this.h / 3);
    ctx.lineTo(0, this.h / 3 + 12 + Math.random() * 8);
    ctx.lineTo(8, this.h / 3);
    ctx.closePath();
    ctx.fill();

    if (this.powerLevel > 0) {
      ctx.strokeStyle = '#7b2ff7';
      ctx.lineWidth = 1;
      ctx.shadowColor = '#7b2ff7';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(0, 0, this.w / 2 + 8, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }
  hit() {
    if (this.invincible > 0) return false;
    lives--;
    this.invincible = 90;
    shakeTimer = 15;
    shakeIntensity = 8;
    for (let i = 0; i < 20; i++) {
      particles.push(new Particle(this.x, this.y, '#ff2d95', 3));
    }
    return lives <= 0;
  }
}

class Bullet {
  constructor(x, y, vx, vy, color) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.color = color;
    this.alive = true;
    this.r = 3;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.y < -10 || this.y > H + 10 || this.x < -10 || this.x > W + 10) this.alive = false;
  }
  draw() {
    ctx.save();
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Enemy {
  constructor(type) {
    this.type = type || 0;
    this.alive = true;
    this.flash = 0;
    if (this.type === 0) {
      this.x = 30 + Math.random() * (W - 60);
      this.y = -30;
      this.w = 28; this.h = 28;
      this.hp = 1; this.maxHp = 1;
      this.speed = 1.5 + Math.random() * 1 + level * 0.15;
      this.vx = (Math.random() - 0.5) * 2;
      this.score = 100;
      this.color = '#ff4444';
      this.shootRate = 0;
    } else if (this.type === 1) {
      this.x = 30 + Math.random() * (W - 60);
      this.y = -30;
      this.w = 34; this.h = 34;
      this.hp = 3; this.maxHp = 3;
      this.speed = 1 + Math.random() * 0.5 + level * 0.1;
      this.vx = Math.sin(Math.random() * Math.PI * 2) * 1.5;
      this.score = 250;
      this.color = '#ff8800';
      this.shootRate = 120;
      this.shootTimer = 30 + Math.random() * 60;
      this.phase = Math.random() * Math.PI * 2;
    } else {
      this.x = W / 2;
      this.y = -50;
      this.w = 50; this.h = 50;
      this.hp = 10 + level * 2; this.maxHp = this.hp;
      this.speed = 0.5;
      this.vx = 1;
      this.score = 1000;
      this.color = '#ff2d95';
      this.shootRate = 60;
      this.shootTimer = 30;
      this.phase = 0;
    }
  }
  update() {
    if (this.type === 0) {
      this.y += this.speed;
      this.x += this.vx;
      if (this.x < this.w / 2 || this.x > W - this.w / 2) this.vx *= -1;
    } else if (this.type === 1) {
      this.y += this.speed;
      this.phase += 0.03;
      this.x += Math.sin(this.phase) * 2;
      if (this.shootTimer > 0) this.shootTimer--;
      if (this.shootTimer <= 0 && this.y > 0 && this.y < H * 0.6) {
        this.shootTimer = this.shootRate;
        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        enemyBullets.push(new Bullet(this.x, this.y, Math.cos(angle) * 3, Math.sin(angle) * 3, '#ff8800'));
      }
    } else {
      if (this.y < 80) this.y += this.speed;
      else {
        this.phase += 0.02;
        this.x = W / 2 + Math.sin(this.phase) * 150;
      }
      if (this.shootTimer > 0) this.shootTimer--;
      if (this.shootTimer <= 0 && this.y > 0) {
        this.shootTimer = this.shootRate;
        for (let i = 0; i < 5; i++) {
          const angle = (Math.PI * 2 / 5) * i + this.phase;
          enemyBullets.push(new Bullet(this.x, this.y, Math.cos(angle) * 2.5, Math.sin(angle) * 2.5, '#ff2d95'));
        }
      }
    }
    if (this.y > H + 40) this.alive = false;
    if (this.flash > 0) this.flash--;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 10;

    const c = this.flash > 0 ? '#fff' : this.color;

    if (this.type === 0) {
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(0, -this.h / 2);
      ctx.lineTo(this.w / 2, this.h / 2);
      ctx.lineTo(-this.w / 2, this.h / 2);
      ctx.closePath();
      ctx.fill();
    } else if (this.type === 1) {
      ctx.fillStyle = c;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 / 6) * i - Math.PI / 2;
        const px = Math.cos(a) * this.w / 2;
        const py = Math.sin(a) * this.h / 2;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      if (this.maxHp > 1) this.drawHpBar();
    } else {
      ctx.fillStyle = c;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (Math.PI * 2 / 8) * i - Math.PI / 2;
        const r = i % 2 === 0 ? this.w / 2 : this.w / 3.5;
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fill();
      this.drawHpBar();
    }
    ctx.restore();
  }
  drawHpBar() {
    const bw = this.w + 10;
    const bh = 4;
    const by = -this.h / 2 - 10;
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(-bw / 2, by, bw, bh);
    ctx.fillStyle = this.color;
    ctx.fillRect(-bw / 2, by, bw * (this.hp / this.maxHp), bh);
  }
  hit() {
    this.hp--;
    this.flash = 4;
    if (this.hp <= 0) {
      this.alive = false;
      score += this.score;
      const count = this.type === 2 ? 40 : (this.type === 1 ? 20 : 10);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(this.x, this.y, this.color, this.type === 2 ? 4 : 2.5));
      }
      if (Math.random() < 0.12) {
        powerups.push(new Powerup(this.x, this.y));
      }
    }
  }
}

class Particle {
  constructor(x, y, color, size) {
    this.x = x; this.y = y;
    this.color = color;
    this.size = size || 2;
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 30 + Math.random() * 20;
    this.maxLife = this.life;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.97;
    this.vy *= 0.97;
    this.life--;
  }
  draw() {
    const alpha = this.life / this.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 6;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Powerup {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.type = Math.random() < 0.4 ? 1 : 0;
    this.alive = true;
    this.vy = 1.5;
    this.r = 12;
    this.phase = 0;
  }
  update() {
    this.y += this.vy;
    this.phase += 0.08;
    if (this.y > H + 20) this.alive = false;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    const glow = 0.5 + Math.sin(this.phase) * 0.3;
    const color = this.type === 0 ? '#00ff88' : '#ffcc00';
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6 + glow;
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.3;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = color;
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.type === 0 ? 'P' : '♥', 0, 1);
    ctx.restore();
  }
}

class Star {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = 0.5 + Math.random() * 1.5;
    this.speed = 0.3 + this.size * 0.5;
    this.brightness = 0.3 + Math.random() * 0.7;
  }
  update() {
    this.y += this.speed;
    if (this.y > H) {
      this.y = 0;
      this.x = Math.random() * W;
    }
  }
  draw() {
    ctx.fillStyle = `rgba(200,220,255,${this.brightness})`;
    ctx.fillRect(this.x, this.y, this.size, this.size);
  }
}

let player, bullets, enemyBullets, enemies, particles, powerups, stars;

function init() {
  player = new Player();
  bullets = [];
  enemyBullets = [];
  enemies = [];
  particles = [];
  powerups = [];
  stars = [];
  for (let i = 0; i < 80; i++) stars.push(new Star());
  score = 0;
  lives = 3;
  level = 1;
  spawnTimer = 0;
  spawnInterval = 90;
  difficultyTimer = 0;
}

function spawnEnemy() {
  const r = Math.random();
  let type = 0;
  if (level >= 3 && r < 0.05) type = 2;
  else if (level >= 2 && r < 0.25) type = 1;
  enemies.push(new Enemy(type));
}

function rectCollide(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax - aw / 2 < bx + bw / 2 && ax + aw / 2 > bx - bw / 2 &&
         ay - ah / 2 < by + bh / 2 && ay + ah / 2 > by - bh / 2;
}

function circleRectCollide(cx, cy, cr, rx, ry, rw, rh) {
  const dx = Math.abs(cx - rx);
  const dy = Math.abs(cy - ry);
  if (dx > rw / 2 + cr || dy > rh / 2 + cr) return false;
  if (dx <= rw / 2 || dy <= rh / 2) return true;
  return (dx - rw / 2) ** 2 + (dy - rh / 2) ** 2 <= cr ** 2;
}

function update() {
  if (gameState !== STATE.PLAYING) return;

  player.update();

  for (const b of bullets) b.update();
  bullets = bullets.filter(b => b.alive);

  for (const b of enemyBullets) b.update();
  enemyBullets = enemyBullets.filter(b => b.alive);

  for (const e of enemies) e.update();
  enemies = enemies.filter(e => e.alive);

  for (const p of particles) p.update();
  particles = particles.filter(p => p.life > 0);

  for (const p of powerups) p.update();
  powerups = powerups.filter(p => p.alive);

  for (const s of stars) s.update();

  for (const b of bullets) {
    for (const e of enemies) {
      if (b.alive && e.alive && circleRectCollide(b.x, b.y, b.r, e.x, e.y, e.w, e.h)) {
        b.alive = false;
        e.hit();
      }
    }
  }

  for (const b of enemyBullets) {
    if (b.alive && circleRectCollide(b.x, b.y, b.r, player.x, player.y, player.w, player.h)) {
      b.alive = false;
      if (player.hit()) {
        gameOver();
        return;
      }
    }
  }

  for (const e of enemies) {
    if (e.alive && rectCollide(player.x, player.y, player.w, player.h, e.x, e.y, e.w, e.h)) {
      e.alive = false;
      for (let i = 0; i < 15; i++) particles.push(new Particle(e.x, e.y, e.color, 2));
      if (player.hit()) {
        gameOver();
        return;
      }
    }
  }

  for (const p of powerups) {
    if (p.alive && circleRectCollide(p.x, p.y, p.r, player.x, player.y, player.w, player.h)) {
      p.alive = false;
      if (p.type === 0) {
        player.powerLevel = Math.min(2, player.powerLevel + 1);
        player.powerTimer = 600;
      } else {
        lives = Math.min(5, lives + 1);
      }
      for (let i = 0; i < 12; i++) {
        particles.push(new Particle(p.x, p.y, p.type === 0 ? '#00ff88' : '#ffcc00', 2));
      }
    }
  }

  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnEnemy();
  }

  difficultyTimer++;
  if (difficultyTimer >= 600) {
    difficultyTimer = 0;
    level++;
    spawnInterval = Math.max(25, spawnInterval - 8);
  }

  if (shakeTimer > 0) shakeTimer--;
}

function drawHUD() {
  ctx.save();
  ctx.fillStyle = '#00f0ff';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`分数 ${score}`, 15, 30);

  ctx.fillStyle = '#7b2ff7';
  ctx.font = '14px sans-serif';
  ctx.fillText(`关卡 ${level}`, 15, 52);

  ctx.textAlign = 'right';
  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = '#ff2d95';
    ctx.shadowColor = '#ff2d95';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    const hx = W - 20 - i * 28;
    const hy = 25;
    ctx.moveTo(hx, hy + 4);
    ctx.bezierCurveTo(hx, hy, hx - 8, hy - 4, hx - 8, hy + 2);
    ctx.bezierCurveTo(hx - 8, hy + 8, hx, hy + 14, hx, hy + 16);
    ctx.bezierCurveTo(hx, hy + 14, hx + 8, hy + 8, hx + 8, hy + 2);
    ctx.bezierCurveTo(hx + 8, hy - 4, hx, hy, hx, hy + 4);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (player.powerLevel > 0) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7b2ff7';
    ctx.font = '12px sans-serif';
    const pwTime = Math.ceil(player.powerTimer / 60);
    ctx.fillText(`火力强化 ${pwTime}s`, W / 2, 25);
  }
  ctx.restore();
}

function draw() {
  ctx.save();

  if (shakeTimer > 0) {
    const sx = (Math.random() - 0.5) * shakeIntensity;
    const sy = (Math.random() - 0.5) * shakeIntensity;
    ctx.translate(sx, sy);
  }

  ctx.fillStyle = '#060a14';
  ctx.fillRect(-10, -10, W + 20, H + 20);

  for (const s of stars) s.draw();

  if (gameState === STATE.PLAYING || gameState === STATE.PAUSED) {
    for (const p of powerups) p.draw();
    for (const b of bullets) b.draw();
    for (const b of enemyBullets) b.draw();
    for (const e of enemies) e.draw();
    for (const p of particles) p.draw();
    player.draw();
    drawHUD();
  }

  ctx.restore();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function showScreen(screen) {
  startScreen.classList.remove('visible');
  gameoverScreen.classList.remove('visible');
  pauseScreen.classList.remove('visible');
  if (screen) screen.classList.add('visible');
  overlay.classList.toggle('active', !!screen);
}

function startGame() {
  init();
  gameState = STATE.PLAYING;
  showScreen(null);
}

function gameOver() {
  gameState = STATE.GAMEOVER;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('spaceHunterHigh', highScore);
  }
  finalScoreEl.textContent = score;
  highScoreEl.textContent = highScore;
  showScreen(gameoverScreen);
}

function togglePause() {
  if (gameState === STATE.PLAYING) {
    gameState = STATE.PAUSED;
    showScreen(pauseScreen);
  } else if (gameState === STATE.PAUSED) {
    gameState = STATE.PLAYING;
    showScreen(null);
  }
}

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);
document.getElementById('btn-resume').addEventListener('click', () => {
  gameState = STATE.PLAYING;
  showScreen(null);
});

init();
gameLoop();
</script>
</body>
