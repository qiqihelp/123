<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1030">
<title>像素边境 · Demo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;touch-action:none;overscroll-behavior:none;
  font-family:"Courier New",ui-monospace,Menlo,monospace;font-weight:700;color:#fff}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.px{border:3px solid #1a1208;background:#3b2a1a;box-shadow:inset 0 0 0 2px #6b4c2a,0 3px 0 rgba(0,0,0,.45)}

#top{position:fixed;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:6px;pointer-events:none}
#status{display:flex;align-items:center;gap:8px;font-size:13px;text-shadow:2px 2px 0 #000}
#hpbar{width:120px;height:16px;border:3px solid #1a1208;background:#401018;position:relative}
#hpfill{height:100%;width:100%;background:linear-gradient(#ff6a6a 0 40%,#d42a3a 40%)}
#hptext{position:absolute;inset:0;text-align:center;font-size:10px;line-height:10px}
#bagBtn{margin-left:auto;pointer-events:auto;padding:6px 10px;font:inherit;color:#ffe9a8;font-size:13px}
#hotbar{display:flex;gap:4px;pointer-events:auto;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
#hotbar::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto;width:44px;height:44px;position:relative;display:flex;align-items:center;justify-content:center;opacity:.92}
.slot canvas{width:32px;height:32px}
.slot.sel{background:#7a5a2a;box-shadow:inset 0 0 0 2px #ffd84a,0 3px 0 rgba(0,0,0,.45);opacity:1}
.slot.empty canvas{opacity:.3}
.slot span{position:absolute;right:2px;bottom:0;font-size:11px;text-shadow:1px 1px 0 #000,-1px 1px 0 #000}

.pad{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:12px}
#padL{left:calc(14px + env(safe-area-inset-left))}
#padR{right:calc(14px + env(safe-area-inset-right))}
.btn{width:68px;height:68px;font-size:28px;color:#ffe9a8;display:flex;align-items:center;justify-content:center;opacity:.72;font-family:inherit}
.btn.on{opacity:1;transform:translateY(3px);background:#7a5a2a}
#jump{width:80px;height:80px}

#toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);padding:8px 14px;font-size:14px;text-align:center;
  max-width:86vw;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:2px 2px 0 #000}
#toast.show{opacity:1}

#craft{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5}
#craft.show{display:flex}
#craftBox{width:min(92vw,380px);max-height:86vh;overflow:auto;padding:12px;touch-action:pan-y}
#craftBox h2{margin:0 0 8px;font-size:16px;color:#ffd84a;display:flex;justify-content:space-between;align-items:center}
#craftBox h3{margin:10px 0 6px;font-size:13px;color:#cfa}
#res{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
#res div{display:flex;align-items:center;gap:4px}
#res canvas{width:20px;height:20px}
.rec{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:2px dashed #6b4c2a;font-size:12px}
.rec canvas{width:32px;height:32px;flex:0 0 auto}
.rec .d{flex:1;line-height:1.4}
.rec .d small{color:#d8c7a0;font-weight:400}
.rec button,#closeCraft{font:inherit;font-size:12px;color:#fff;padding:8px 10px;background:#2f8f2f;border:3px solid #1a1208;box-shadow:inset 0 0 0 2px #5fd65f}
.rec button:disabled{background:#555;box-shadow:inset 0 0 0 2px #777;color:#aaa}
#closeCraft{background:#a33;box-shadow:inset 0 0 0 2px #e66}

#title{position:fixed;inset:0;z-index:10;background:#0b1030 url(title.jpg) center/cover no-repeat;image-rendering:pixelated;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12vh 16px 10vh;text-align:center}
#title h1{margin:0;font-size:clamp(40px,13vw,84px);letter-spacing:4px;color:#ffe14a;
  text-shadow:4px 0 0 #3a1c00,-4px 0 0 #3a1c00,0 4px 0 #3a1c00,0 -4px 0 #3a1c00,4px 4px 0 #3a1c00,-4px 4px 0 #3a1c00,0 10px 0 rgba(0,0,0,.5)}
#title p{margin:10px 0 0;font-size:14px;letter-spacing:3px;text-shadow:2px 2px 0 #000}
#startBtn{font:inherit;font-size:20px;color:#fff;padding:14px 30px;background:#2f8f2f;border:4px solid #0d2a0d;
  box-shadow:inset 0 0 0 3px #5fd65f,0 6px 0 rgba(0,0,0,.5);animation:bob 1s steps(2) infinite}
#title small{display:block;margin-top:14px;font-size:11px;line-height:1.7;text-shadow:1px 1px 0 #000;background:rgba(0,0,0,.45);padding:6px 10px}
@keyframes bob{50%{transform:translateY(4px)}}
@media (max-height:420px){.btn{width:56px;height:56px}#jump{width:64px;height:64px}.slot{width:38px;height:38px}.slot canvas{width:26px;height:26px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top">
  <div id="status">
    <div id="hpbar"><div id="hpfill"></div><div id="hptext">100</div></div>
    <span id="clock">☀</span><span id="coins">◎0</span>
    <button id="bagBtn" class="px">⚒ 合成</button>
  </div>
  <div id="hotbar"></div>
</div>

<div id="padL" class="pad">
  <div id="left" class="btn px">◀</div>
  <div id="right" class="btn px">▶</div>
</div>
<div id="padR" class="pad">
  <div id="jump" class="btn px">▲</div>
</div>

<div id="toast" class="px"></div>

<div id="craft">
  <div id="craftBox" class="px">
    <h2><span>背包 &amp; 合成</span><button id="closeCraft">关闭</button></h2>
    <h3>材料</h3><div id="res"></div>
    <h3>配方</h3><div id="recipes"></div>
  </div>
</div>

<div id="title">
  <div><h1>像素边境</h1><p>PIXEL FRONTIER · DEMO</p></div>
  <div>
    <button id="startBtn">▶ 开始冒险</button>
    <small>◀ ▶ 移动 · ▲ 跳跃 · 点住方块挖掘 / 放置 / 攻击<br>电脑: A D 移动 · 空格跳 · 鼠标操作 · 数字键切换 · E 合成</small>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
