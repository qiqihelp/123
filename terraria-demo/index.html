<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="landscape">
<meta name="theme-color" content="#0b1030">
<title>像素边境 · Demo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;touch-action:none;overscroll-behavior:none;
  font-family:"Courier New",ui-monospace,Menlo,monospace;font-weight:700;color:#fff}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:#fff;touch-action:none}
/* 整个游戏放在 #stage 里；竖屏手机上把它旋转 90° 强制横屏 */
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;transform-origin:0 0;
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
#stage.rot{transform:rotate(90deg) translateY(-100%);
  --sl:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-bottom,0px);--sb:0px;--st:0px}
#game{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.px{border:3px solid #1a1208;background:#3b2a1a;box-shadow:inset 0 0 0 2px #6b4c2a,0 3px 0 rgba(0,0,0,.45)}

#top{position:absolute;left:0;right:0;top:0;padding:calc(6px + var(--st)) calc(10px + var(--sr)) 0 calc(10px + var(--sl));
  display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#status{display:flex;flex-direction:column;gap:3px;font-size:12px;text-shadow:2px 2px 0 #000;min-width:112px}
#hpbar{width:112px;height:16px;border:3px solid #1a1208;background:#401018;position:relative}
#hpfill{height:100%;width:100%;background:linear-gradient(#ff6a6a 0 40%,#d42a3a 40%)}
#hptext{position:absolute;inset:0;text-align:center;font-size:10px;line-height:10px}
#hotbar{flex:1;display:flex;justify-content:center;gap:3px;pointer-events:none;flex-wrap:wrap}
.slot{flex:0 0 auto;width:40px;height:40px;position:relative;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.slot canvas{width:32px;height:32px;pointer-events:none}
.slot.sel{background:#7a5a2a;box-shadow:inset 0 0 0 2px #ffd84a,0 3px 0 rgba(0,0,0,.45)}
.slot.empty canvas{opacity:.3}
.slot span{position:absolute;right:2px;bottom:0;font-size:10px;text-shadow:1px 1px 0 #000,-1px 1px 0 #000;pointer-events:none}
#bagBtn{pointer-events:auto;padding:0 10px;height:40px;color:#ffe9a8;font-size:13px;white-space:nowrap}

.pad{position:absolute;bottom:calc(16px + var(--sb));display:flex;gap:12px}
#padL{left:calc(22px + var(--sl))}
#padR{right:calc(18px + var(--sr))}
.btn{width:64px;height:64px;font-size:26px;color:#ffe9a8;display:flex;align-items:center;justify-content:center;opacity:.7}
.btn.on{opacity:1;transform:translateY(3px);background:#7a5a2a}
#jump{width:76px;height:76px}
#padR{align-items:flex-end}
#act{margin-bottom:54px}
#joy{width:132px;height:132px;border-radius:50%;background:rgba(40,28,16,.4);border:3px solid rgba(26,18,8,.8);
  box-shadow:inset 0 0 0 2px rgba(255,233,168,.3);position:relative;opacity:.8}
#joy.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#7a5a2a;
  border:3px solid #1a1208;box-shadow:inset 0 0 0 2px #ffd84a;pointer-events:none}
#buffs{font-size:10px;color:#9f9;max-width:150px;font-weight:400}
#pager{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;margin-top:6px;color:#d8c7a0}
#pager button{padding:4px 14px;background:#34508c;border:3px solid #1a1208;font-size:12px}
#pager button:disabled{background:#444;color:#888}

#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);padding:8px 14px;font-size:13px;text-align:center;
  max-width:86%;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:2px 2px 0 #000;z-index:4}
#toast.show{opacity:1}

#bag{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5}
#bag.show{display:flex}
#bagBox{display:flex;gap:10px;padding:10px;max-width:96%;max-height:96%;overflow:auto;touch-action:pan-y}
#bagL{width:336px;flex:0 0 auto}
#tabs{display:flex;gap:6px;margin-bottom:8px;align-items:center}
#tabs button{padding:6px 12px;font-size:13px;background:#2a1d10;border:3px solid #1a1208;color:#d8c7a0}
#tabs button.on{background:#7a5a2a;color:#ffd84a;box-shadow:inset 0 0 0 2px #ffd84a}
#stations{font-size:10px;color:#9f9;margin-left:auto;font-weight:400}
#grid{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;min-height:166px;max-width:336px}
#grid .slot.dim canvas{opacity:.35}
#bagR{width:190px;flex:0 0 auto;display:flex;flex-direction:column;gap:6px;font-size:12px;line-height:1.5}
#closeBag{align-self:flex-end;padding:4px 10px;background:#a33;border:3px solid #1a1208;box-shadow:inset 0 0 0 2px #e66;font-size:12px}
#detail{flex:1;display:flex;flex-direction:column;gap:6px}
#detail .hd{display:flex;gap:8px;align-items:center;color:#ffd84a;font-size:14px}
#detail .hd canvas{width:40px;height:40px;flex:0 0 auto}
#detail small{font-weight:400;color:#d8c7a0;display:block}
#detail .ok{color:#9f9}#detail .no{color:#f88}
#detail button{padding:8px;background:#2f8f2f;border:3px solid #1a1208;box-shadow:inset 0 0 0 2px #5fd65f;font-size:12px}
#detail button:disabled{background:#555;box-shadow:inset 0 0 0 2px #777;color:#aaa}
#detail button.alt{background:#34508c;box-shadow:inset 0 0 0 2px #6a8ad0}

#mach{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:6}
#mach.show{display:flex}
#machBox{width:310px;max-width:94%;max-height:96%;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:5px;font-size:12px;line-height:1.45}
#machBox h3{margin:0;font-size:15px;color:#ffd84a}
#machBox small{font-weight:400;color:#d8c7a0}
#machBox .ok{color:#9f9}#machBox .no{color:#f88}
#machBox button{padding:7px;background:#2f8f2f;border:3px solid #1a1208;box-shadow:inset 0 0 0 2px #5fd65f;font-size:12px}
#machBox button.alt{background:#34508c;box-shadow:inset 0 0 0 2px #6a8ad0}
#machBox button.red{background:#a33;box-shadow:inset 0 0 0 2px #e66}
#machBox button:disabled{background:#555;box-shadow:inset 0 0 0 2px #777;color:#aaa}
#tabs button{padding:6px 9px}
#title{position:absolute;inset:0;z-index:10;background:#0b1030 url(title.jpg) center 38%/cover no-repeat;image-rendering:pixelated;
  display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:12px;text-align:center}
#title h1{margin:0;font-size:clamp(36px,9vmax,76px);letter-spacing:4px;color:#ffe14a;
  text-shadow:4px 0 0 #3a1c00,-4px 0 0 #3a1c00,0 4px 0 #3a1c00,0 -4px 0 #3a1c00,4px 4px 0 #3a1c00,-4px 4px 0 #3a1c00,0 10px 0 rgba(0,0,0,.5)}
#title p{margin:6px 0 0;font-size:13px;letter-spacing:3px;text-shadow:2px 2px 0 #000}
#title .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#title button{font-size:18px;padding:12px 24px;background:#2f8f2f;border:4px solid #0d2a0d;box-shadow:inset 0 0 0 3px #5fd65f,0 6px 0 rgba(0,0,0,.5)}
#newBtn.alt{background:#34508c;border-color:#101c3a;box-shadow:inset 0 0 0 3px #6a8ad0,0 6px 0 rgba(0,0,0,.5)}
#title small{display:inline-block;margin-top:10px;font-size:11px;line-height:1.7;text-shadow:1px 1px 0 #000;background:rgba(0,0,0,.5);padding:6px 10px}
@media (max-width:600px){#bagBox{flex-direction:column}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="top">
    <div id="status">
      <div id="hpbar"><div id="hpfill"></div><div id="hptext">100</div></div>
      <div><span id="clock">☀</span> <span id="coins">◎0</span></div>
      <div id="buffs"></div>
    </div>
    <div id="hotbar"></div>
    <button id="bagBtn" class="px">🎒 背包</button>
  </div>

  <div id="padL" class="pad">
    <div id="joy"><div id="knob"></div></div>
  </div>
  <div id="padR" class="pad">
    <div id="act" class="btn px">⚒</div>
    <div id="jump" class="btn px">▲</div>
  </div>

  <div id="toast" class="px"></div>

  <div id="bag">
    <div id="bagBox" class="px">
      <div id="bagL">
        <div id="tabs"><button id="tabInv">背包</button><button id="tabCraft">合成</button><button id="tabShop">商店</button><span id="stations"></span></div>
        <div id="grid"></div>
        <div id="pager"></div>
      </div>
      <div id="bagR">
        <button id="closeBag">✕ 关闭</button>
        <div id="detail"></div>
      </div>
    </div>
  </div>

  <div id="mach"><div id="machBox" class="px"></div></div>

  <div id="title">
    <div><h1>像素边境</h1><p>PIXEL FRONTIER · DEMO</p></div>
    <div>
      <div class="row">
        <button id="contBtn" style="display:none">▶ 继续游戏</button>
        <button id="newBtn">▶ 新的世界</button>
      </div>
      <small>摇杆移动（上推跳 / 爬绳）· ▲ 跳跃 · ⚒ 自动使用手中物品 · 也可直接点画面<br>电脑: A D 移动 · 空格跳 · F 动作 · 鼠标操作 · 数字键切换 · E 背包</small>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
