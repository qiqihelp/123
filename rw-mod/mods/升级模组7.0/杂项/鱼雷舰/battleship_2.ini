[core]
name: 鱼雷舰
displayDescription:没啥用单位
class: CustomUnitMetadata
price: 1200
maxHp: 800
mass: 6000
techLevel: 1
buildSpeed: 0.001
availableInDemo: true
radius: 20
transportSlotsNeeded: 3
builtFrom_1_name: seaFacTory
builtFrom_1_pos:  5
numBitsOnDeath:0
[graphics]
image:        battle_ship2.png
image_wreak:  NONE
image_turret: battle_ship2_turret.png
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
splastEffect: true
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
turretSize: 17
turretTurnSpeed: 1.8
maxAttackRange: 210
shootDelay: 120
turretMultiTargeting: true
[turret_1]
x: 0
y: 0
shoot_sound:cannon_firing
shoot_sound_vol:0.3
shoot_flame:small
shoot_light:#FFEECCCC
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
projectile: 1
recoilOffset: -3
idleDir:0
idleDirReversing: -145
[turret_2]
invisible: true
x: 0
y: 0
idleDir:0
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: true
projectile: 2
size: 1
turnSpeed: 15
delay: 180
[projectile_1]
life: 150
speed: 4
drawType:0
drawSize:1
directDamage: 60
color: #ffe92b
lightColor: #ffe92b
lightSize: 0.6
[projectile_2]
directDamage: 33
life: 250
speed: 0.15
targetSpeed: 1.2
drawSize: 1
color: #1E1E96
trailEffect: true
largeHitEffect: true
deflectionPower: -1
[movement]
movementType: WATER
moveSpeed: 0.8
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.05
reverseSpeedPercentage:1
maxTurnSpeed: 1.5
turnAcceleration: 0.3
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90