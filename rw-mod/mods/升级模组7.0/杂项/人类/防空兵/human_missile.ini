[core]
name: 防空兵
class: CustomUnitMetadata
price: 700
maxHp: 100
mass: 1000
techLevel: 1
buildSpeed: 0.0018
radius: 5
displayRadius: 6
isBio: false
softCollisionOnAll: 0
builtFrom_1_name: 人类营地
builtFrom_1_pos: 1.5
builtFrom_2_name: 人类营地T2
builtFrom_2_pos: 1.5
[graphics]
total_frames: 4
image:        human_missile.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 0
animation_moving_end: 3
animation_moving_speed: 8
lock_body_rotation_with_main_turret: true
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turretSize: 8
turretTurnSpeed: 4
maxAttackRange: 200
shootDelay: 120
[turret_1]
x: 0
y: 0
projectile: 1
turnSpeedAcceleration: 1.0
shoot_sound:missile_fire
shoot_sound_vol:0.1
shoot_flame:CUSTOM:verySmallFlame
shoot_light:#FFEECCCC
canShoot: true
recoilOffset: -1
recoilOutTime: 10
recoilReturnTime: 14
barrelX:3
[projectile_1]
directDamage: 70
areaDamage: 50
areaRadius: 35
life: 240
speed: 0.3
targetSpeed: 3
trailEffect: true
largeHitEffect: true
frame: 4
autoTargetingOnDeadTarget: true
drawSize:0.6
wobbleAmplitude: 0.4
wobbleFrequency: 0.8s
[effect_verySmallFlame]
life: 20
attachedToUnit: true
atmospheric: true
stripIndex: 3
animateFrameStart: 0
animateFrameEnd: 3
animateFrameSpeed: 0.5
alpha:1
scaleFrom: 0.5
scaleTo: 0.5
[movement]
movementType: LAND
moveSpeed: 0.6
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.17
maxTurnSpeed: 4.1
turnAcceleration: 0.25
moveSlidingMode :false
moveIgnoringBody:false
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90