[core]
name: 机枪兵-外骨骼
class: CustomUnitMetadata
price: 3000
maxHp: 600
mass: 3000
techLevel: 2
buildSpeed: 0.0009
radius: 11
displayRadius: 12
isBio: false
softCollisionOnAll: 0
builtFrom_1_name: 人类营地T2
builtFrom_1_pos: 2
[graphics]
total_frames: 4
image:        human_Exoskeleton_minigun.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 0
animation_moving_end: 3
animation_moving_speed: 8
lock_body_rotation_with_main_turret: true
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 11
turretTurnSpeed: 4
maxAttackRange: 182
shootDelay: 7.5
[turret_1]
x: 0
y: 0
projectile: 1
turnSpeedAcceleration: 1.0
shoot_sound:firing3
shoot_sound_vol:0.08
shoot_flame:CUSTOM:verySmallFlame
shoot_light:#FFEECCCC
canShoot: true
recoilOffset: -2
recoilOutTime: 10
recoilReturnTime: 14
[projectile_1]
directDamage: 40
life: 60
speed: 4
frame: 5
drawSize: 0.7
trailEffect: custom:1
[effect_verySmallFlame]
life: 20
attachedToUnit: true
atmospheric: true
stripIndex: 3
animateFrameStart: 0
animateFrameEnd: 3
animateFrameSpeed: 0.5
alpha:1
scaleFrom: 0.5
scaleTo: 0.5
[effect_1]
image:榴弹1.png
life:20
yOffsetRelative:-10
total_frames:1
animateFrameStart:0
animateFrameEnd:0
animateFrameSpeed:1
attachedToUnit:true
scaleFrom: 0.7
scaleTo: 0.7
alpha: 0.5
[movement]
movementType: LAND
moveSpeed: 0.8
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.17
maxTurnSpeed: 4.1
turnAcceleration: 0.25
moveSlidingMode :false
moveIgnoringBody:false
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90