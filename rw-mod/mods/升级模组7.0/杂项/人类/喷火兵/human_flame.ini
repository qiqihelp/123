[core]
name: 喷火兵
class: CustomUnitMetadata
price: 1200
maxHp: 240
mass: 1000
selfRegenRate:0.005
techLevel: 1
buildSpeed: 0.0014
radius: 5
displayRadius: 6
isBio: false
softCollisionOnAll: 0
builtFrom_1_name: 人类营地
builtFrom_1_pos: 1.5
builtFrom_2_name: 人类营地T2
builtFrom_2_pos: 1.5
[graphics]
total_frames: 4
image:        human_flame.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 0
animation_moving_end: 3
animation_moving_speed: 8
lock_body_rotation_with_main_turret: true
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 8
turretTurnSpeed: 4
aimOffsetSpread:0
maxAttackRange: 145
shootDelay: 5
[turret_1]
x: 0
y: 0
shoot_sound:NONE
warmup:10
warmupNoReset: true
warmupCallDownRate:0.05
chargeEffectImage:SHARED:light_25.png
[projectile_1]
life: 70
speed: 7
targetSpeed: 2.5
targetSpeedAcceleration: 0.3
speedSpread: 1
frame: 3
drawSize: 0.5
flameWeapon: true
hitSound: false
targetGround:true
targetGroundSpread: 25
deflectionPower: -1
areaDamage: 20
areaRadius: 45
[effect_attachedFlame]
priority:high
frameIndex: 3
stripIndex: projectiles
life: 120
fadeOut: true
attachedToUnit: true
color: #FFFFFF
fadeInTime:9
scaleFrom: 0.45
scaleTo: 0.65
alpha: 1.5
drawUnderUnits:false
liveAfterAttachedDies: false
[effect_attachedLight]
priority:high
image: SHARED:light_25.png
life: 80
fadeOut: true
attachedToUnit: true
color: #fdc14d
fadeInTime:4
scaleFrom: 0.2
scaleTo: 0.2
alpha: 0.5
drawUnderUnits:false
liveAfterAttachedDies: false
[effect_hitFlame]
frameIndex: 3
stripIndex: projectiles
life: 40
fadeOut: true
attachedToUnit: false
color: #FFFFFF
scaleFrom: 0.5
scaleTo: 0.6
alpha: 0.5
drawUnderUnits:false
liveAfterAttachedDies: false
physics: true
ySpeedRelative:0.4
hSpeed: 0.3
[movement]
movementType: LAND
moveSpeed: 0.6
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.17
maxTurnSpeed: 4.1
turnAcceleration: 0.25
moveSlidingMode :false
moveIgnoringBody:false
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90