[core]
name: 建造车
class: CustomUnitMetadata
price: 500
maxHp: 70
mass: 4000
maxShield: 100
shieldRegen: 0.014
displayText: 建造车
displayDescription:人类营地的建造车\n处处比不上原版的建造者\n唯一的用处可能就是:\n什么，我的虫子呢？\n
techLevel: 1
buildSpeed: 0.002
availableInDemo: false
isBuilder:true
canReclaimResources:true
radius:10
displayRadius: 11
isBio: false
canRepairBuildings: true
canRepairUnits : false
nanoRange: 95
nanoBuildSpeed: 1
nanoRepairSpeed: 0.3
canBuild_1_name: reclaim
canBuild_1_pos:  -1
canBuild_3_name: exTracTor
canBuild_3_pos:  3
canBuild_4_name: landFactory
canBuild_4_pos:  4
canBuild_5_name: airFactory
canBuild_5_pos:  5
canBuild_17_name: 人类营地
canBuild_17_pos:  5.1
canBuild_6_name: seaFactory
canBuild_6_pos:  6
canBuild_7_name: fabricaTor
canBuild_7_pos:  7
canBuild_8_name: repairBay
canBuild_8_pos:  8
canBuild_10_name: 阵地
canBuild_10_pos:  3.1
canBuild_11_name: 防空阵地T0
canBuild_11_pos:  3.2
canBuild_12_name: laserDefence
canBuild_12_pos:  12
canBuild_15_name: mechFactory
canBuild_15_pos:  4.1
[graphics]
total_frames: 2
image:        builder_car.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 6
[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize:5
[movement]
movementType: land
moveSpeed: 0.8
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.08
maxTurnSpeed: 3.5
turnAcceleration: 0.25
moveSlidingMode :true
moveIgnoringBody:false
moveSlidingDir:  181
[ai]
useAsBuilder: true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_护盾升级]
@copyFromSection:action_效率升级
id:${core.price}+4
iconExtraImage:ROOT:素材/护盾K.png
isVisible:if self.globalTeamTags(includes="EW") and self.maxShield()>0
text:升级护盾[%{self.resource.HDDS}]
description:增加基础的2倍
setUnitStats:maxShield=self.maxShield()*(1+2/(2*self.resource.HDDS-1)),shield=self.shield()*(1+2/(2*self.resource.HDDS-1)),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS)
addResourcesWithLogic:HDDS=1
[decal_护盾升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.HDDS>0,1,-1)
isVisible:if self.resource.HDDS!=0
frame:min(select(self.resource.HDDS>0,self.resource.HDDS,int(-self.resource.HDDS/0.08))-1,4)
image:ROOT:素材/护盾升级.png
xOffsetAbsolute:0.1*${core.radius}
imageScale:${core.radius}/110