displayDescription:泰坦型坦克。\n对地四个轨道炮火力攻击，\n同时还有一架双连装主炮对敌人发射核高爆炮弹\n还装有一个防空导弹发射器来用于防空\n因火力分配不对等，导致对地火力十分强大，\n但是对空中单位则没有足够的火力攻击。\n很害怕蚊群(笑\n因体积过大，所以也可在海上移动\n但会有很强的阻力。\n原稿by巨屑合金\n完善by威严な大小姐\n🍉瓜呱王八出击😡👊🏻
