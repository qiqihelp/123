[core]
name: 泰坦型坦克(水面)
displayText: 泰坦型坦克
displayDescription:泰坦型坦克。\n对地四个轨道炮火力攻击，\n同时还有一架双连装主炮对敌人发射核高爆炮弹\n还装有一个防空导弹发射器来用于防空\n因火力分配不对等，导致对地火力十分强大，\n但是对空中单位则没有足够的火力攻击。\n很害怕蚊群(笑\n因体积过大，所以也可在海上移动\n但会有很强的阻力。\n原稿by巨屑合金\n完善by威严な大小姐
copyFrom:experimental_tank5.ini
showInEditor:false
[action_trigger_onWater]
autoTrigger:false
[hiddenAction_trigger_onLand]
autoTrigger: if not self.overWater()
convertTo: 泰坦型坦克
[graphics]
image:        experimental_tank5k.png
shadowOffsetX:3
shadowOffsetY:3
splastEffect: true
animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 7
teamColorsOnTurret: true
movementEffect:        CUSTOM:dustL, CUSTOM:dustR
movementEffectReverse: CUSTOM:dustL, CUSTOM:dustR
movementEffectReverseFlipEffects: true
[movement]
movementType: OVER_CLIFF_WATER
moveSpeed:0.375
moveAccelerationSpeed: 0.015
moveDecelerationSpeed: 0.015
reverseSpeedPercentage:1
maxTurnSpeed: 0.35
turnAcceleration: 0.02
moveSlidingMode :false
moveIgnoringBody:false
[effect_dustL]
life: 30
stripIndex: dust
frameIndex: 0
frameIndexRandom: 2
scaleFrom: 6
scaleTo: 7.6
color: #5C331711
alpha: 1
atmospheric:true
xSpeedAbsoluteRandom: 0.4
ySpeedAbsoluteRandom: 0.4
ySpeedRelative:-3.2
hSpeed:0.1
xOffsetRelative:80
yOffsetRelative:-136
drawUnderUnits:true
attachedToUnit: false
[effect_dustR]
life: 30
stripIndex: dust
frameIndex: 0
frameIndexRandom: 2
scaleFrom: 6
scaleTo: 7.6
alpha: 1
atmospheric:true
color:#5C331711
xSpeedAbsoluteRandom: 0.4
ySpeedAbsoluteRandom: 0.4
ySpeedRelative:-3.2
hSpeed:0.1
xOffsetRelative:-80
yOffsetRelative:-136
drawUnderUnits:true
attachedToUnit: false