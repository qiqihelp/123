[core]
name: 高级侦察者T2
displayDescription:更强的侦察能力，战斗力较弱，也就欺负一些低级单位了\npvp不建议造，pve里要小心它扎堆来进攻你。\nby小空
class: CustomUnitMetadata
price: 58100
maxHp:6300
mass: 1000
techLevel: 1
buildSpeed:0.000083333
availableInDemo: true
radius: 22
softCollisionOnAll: 11
displayRadius: 26
fogOfWarSightRange: 50
fogOfWarSightRangeWhileNotBuilt: 35
transportSlotsNeeded: 5
tags:侦察者T1,ys
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T6") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 概念型侦察者
price:  280000
text: 升级T6
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.00025
pos: 0.05
[graphics]
image:        base4.png
image_wreak:  base_dead1.png
image_turret: NONE
lock_body_rotation_with_main_turret: true
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
splastEffect: true
movementEffect: CUSTOM:scoutTrail
movementEffectRate: 14
[attack]
turretRotateWithBody: false
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 7
turretTurnSpeed: 4
turretMultiTargeting:true
maxAttackRange: 253
shootDelay: 18
isFixedFiring: false
[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
projectile: 1
size: 22
turnSpeed: 2.4
shoot_sound:plasma_fire
shoot_sound_vol:0.05
shoot_flame:small
shoot_light:#FFccCCEE
recoilOffset: -1
recoilOutTime: 5
recoilReturnTime: 15
canAttackFlyingUnits: false
canAttackLandUnits:   true
[turret_2]
invisible: true
x: 0
y: 0
idleDir:0
projectile: 2
size: 0
turnSpeed: 2.4
shoot_sound:plasma_fire
shoot_sound_vol:0.05
shoot_flame:small
shoot_light:#FFccCCEE
recoilOffset: -1
recoilOutTime: 5
recoilReturnTime: 15
canAttackFlyingUnits: true
canAttackLandUnits:   false
[projectile_1]
directDamage: 110
life: 70
speed: 13.82
frame: 5
drawSize: 1.15
deflectionPower:6.4799999999999995
[projectile_2]
flameWeapon: true
directDamage: 110
drawSize: 0.8
life: 240
speed: 3.12
trailEffect: true
largeHitEffect: true
lightColor: #FFccCCEE
lightSize: 0.4
deflectionPower:6.4799999999999995
frame: 7
wobbleAmplitude: 0.9
wobbleFrequency: 0.4s
[effect_scoutTrail]
createWhenOverLiquid: false
createWhenZoomedOut: false
priority:low
life: 50
fadeOut: true
attachedToUnit: false
color: #FFFFFF
fadeInTime:5
scaleFrom: 0.7
scaleTo: 3.2
alpha: 0.9
drawUnderUnits:true
ySpeedRelative:-0.1
xSpeedRelativeRandom:0.2
atmospheric: true
stripIndex:dust
[movement]
movementType: HOVER
moveSpeed:2.1
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.06
targetHeight: 3
targetHeightDrift: 1
maxTurnSpeed: 2.4
turnAcceleration: 0.2
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.侦察者T1>4) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T6") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
useAsAttacker:true
buildPriority:-1
maxEachBase:2
[ai]
upgradedFrom:侦察者T1
[hiddenAction_无尽]
buildSpeed:1
requireConditional:if self.resource.credits>=${action_upgradeT2.price}
alsoQueueAction:无尽
autoTrigger:if self.isControlledByAI() and self.resource.credits>${action_upgradeT2.price}-1 and self.globalTeamTags(includes="WJ")
addResources:credits=-${action_upgradeT2.price}
alsoTriggerAction:upgradeT2
[global_resource_侦察者T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90