[core]
name: 自行火炮T3
displayLocaleKey: 自行火炮T3
displayDescription:大幅强化的自行火炮\npvp里查无此物，但pve里被这个骚扰还是很难受的。\n依旧不能同时移动和开火。\nby小空
overrideAndReplace: 自行火炮T3
transportSlotsNeeded: 3
class: CustomUnitMetadata
price: 20700
maxHp:1260
mass: 14000
techLevel: 1
buildSpeed:0.000155556
fogOfWarSightRange:24
radius: 18
displayRadius: 18
isBio: false
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T4") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 自行巨炮T1
price:  18000
text: 升级T4
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.001
pos: 0.05
ai_isHighPriority:true
[graphics]
total_frames: 3
image:        artillery2.png
image_wreak:  artillery_dead.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:3
shadowOffsetY:3
animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 1
dustEffect: true
lock_body_rotation_with_main_turret: true
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 20
turretTurnSpeed: 4
isFixedFiring: true
maxAttackRange: 464
shootDelay: 240
[turret_1]
x: 0
y: 0
projectile: 1
turnSpeedAcceleration: 1.0
shoot_sound:cannon_firing
shoot_sound_vol:0.3
shoot_flame:small
shoot_light:#FFEEEEEE
canShoot: true
recoilOffset: -2
recoilOutTime: 9
recoilReturnTime: 18
[projectile_1]
directDamage: 9
life: 150
speed: 5.6
frame: 2
color: #bebe50
drawSize: 0.9
areaDamage: 720
areaRadius: 63
largeHitEffect: true
targetGround: true
lightColor: #ffe92b
lightSize: 0.4
targetGroundSpread: 30
initialUnguidedSpeedHeight: 1.2
gravity:0.18
lightCastOnGround: true
deflectionPower:8.9964
[movement]
movementType: LAND
moveSpeed:1.35
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.12
maxTurnSpeed: 1.7
turnAcceleration: 0.13
moveSlidingMode :false
moveIgnoringBody:false
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.自行火炮T1>2) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T4") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:自行火炮T1
[global_resource_自行火炮T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90