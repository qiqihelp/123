[core]
name: 飞行坦克(空中)
displayDescription:飞行坦克。\n一辆看似普通的坦克\n却可以飞行\n但因某原因，使得它即使可以飞行，\n也不能攻击同在空中的单位(悲\n现在仍未实装，所以这段也只于沙盒模式中可见\n不过咱写的这些，真的会有人看吗？\n假若真的看了，那不妨告诉咱一声罢(笑\n嘛，其实看不看都无所谓了啦～\nby威严な大小姐
class: CustomUnitMetadata
price: 4500
maxHp: 1200
mass: 21000
techLevel: 2
buildSpeed: 0.0005
showInEditor: false
radius: 19
displayRadius: 19
isBio: false
softCollisionOnAll: 0
action_1_convertTo: 飞行坦克
action_1_displayType: action
action_1_price:  0
action_1_text: drop
action_1_buildSpeed: 0.009
action_1_whenBuilding_cannotMove: true
action_1_isActive: if self.isOverOpenLand()
[graphics]
total_frames: 2
image:        flying_tank_fly.png
image_wreak:  flying_tank_dead.png
image_turret: flying_tank_turret.png
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 10
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 1
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 32
turretTurnSpeed: 2
maxAttackRange: 210
shootDelay: 60
[turret_1]
x: 0
y: 0
projectile: main
turnSpeedAcceleration: 0.9
shoot_sound:cannon_firing
shoot_sound_vol:0.3
shoot_flame:small
shoot_light:#FFEEEEEE
canShoot: true
recoilOffset: -4
recoilOutTime: 9
recoilReturnTime: 18
barrelX: -5
barrelOffsetX_onOddShots: 10
[projectile_main]
directDamage: 1
life: 360
speed: 4
frame: 2
color: #bebe50
drawSize: 0.9
areaDamage: 120
areaRadius: 30
largeHitEffect: true
lightColor: #ffe92b
lightSize: 0.4
[movement]
movementType: AIR
moveSpeed: 0.8
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.03
maxTurnSpeed: 1.5
turnAcceleration: 0.03
moveSlidingMode :false
moveIgnoringBody:false
reverseSpeedPercentage:1
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90