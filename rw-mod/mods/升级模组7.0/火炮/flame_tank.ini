[core]
name: 喷火坦克
displayDescription:我们一直都很苦恼 为什么坦克没有aoe伤害呢\n所以我们给坦克加装了两个喷火器\n这样就可以更方便的在战场上吃烧烤了
class: CustomUnitMetadata
price: 4000
maxHp: 3200
mass: 21000
selfRegenRate:0.05
techLevel: 2
buildSpeed: 0.0005
radius: 19
displayRadius: 19
isBio: false
softCollisionOnAll: 0
builtFrom_1_name: landFacTory
builtFrom_1_pos:  8
[graphics]
total_frames: 2
image:        flame_tank.png
image_wreak:  flame_tank_dead.png
image_turret: flame_tank_turret.png
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 1
dustEffect: true
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 32
turretTurnSpeed: 2
maxAttackRange: 165
aimOffsetSpread:0
shootDelay: 5
[turret_1]
x: 0
y: 0
shoot_sound:NONE
warmup:10
warmupNoReset: true
warmupCallDownRate:0.05
chargeEffectImage: SHARED:light_25.png
barrelX:5
[turret_2]
x: 0
y: 0
copyFrom:1
invisible: true
barrelX:-5
[projectile_1]
life: 70
speed: 7
targetSpeed: 2.5
targetSpeedAcceleration: 0.3
speedSpread: 1
frame: 3
drawSize: 1
flameWeapon: true
hitSound: false
targetGround:true
targetGroundSpread: 25
deflectionPower: -1
areaDamage: 6
areaRadius: 65
[effect_attachedFlame]
priority:high
frameIndex: 3
stripIndex: projectiles
life: 120
fadeOut: true
attachedToUnit: true
color: #FFFFFF
fadeInTime:9
scaleFrom: 0.9
scaleTo: 1.3
alpha: 1.5
drawUnderUnits:false
liveAfterAttachedDies: false
[effect_attachedLight]
priority:high
image: SHARED:light_50.png
life: 80
fadeOut: true
attachedToUnit: true
color: #fdc14d
fadeInTime:4
scaleFrom: 0.4
scaleTo: 0.4
alpha: 0.5
drawUnderUnits:false
liveAfterAttachedDies: false
[effect_hitFlame]
frameIndex: 3
stripIndex: projectiles
life: 40
fadeOut: true
attachedToUnit: false
color: #FFFFFF
scaleFrom: 1.0
scaleTo: 1.2
alpha: 0.5
drawUnderUnits:false
liveAfterAttachedDies: false
physics: true
ySpeedRelative:0.4
hSpeed: 0.3
[movement]
movementType: LAND
moveSpeed: 0.6
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.03
maxTurnSpeed: 1.5
turnAcceleration: 0.03
moveSlidingMode :false
moveIgnoringBody:false
reverseSpeedPercentage:1
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90