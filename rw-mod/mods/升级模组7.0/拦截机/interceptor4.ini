[core]
name: 拦截战机T2
class: CustomUnitMetadata
price: 49800
maxHp:4500
mass: 6000
techLevel: 1
buildSpeed:0.000111111
fogOfWarSightRange:35
radius: 22
isBio: false
softCollisionOnAll: 6
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T6") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 拦截战斗机
price:  240000
text: 升级最高T6
description: 超大幅度增强
displayType: Upgrade
buildSpeed: 0.00025
pos: 0.05
ai_isHighPriority:true
[graphics]
total_frames: 1
image:        interceptor4.png
image_wreak:  interceptor_dead.png
image_turret: NONE
lock_body_rotation_with_main_turret: true
teamColorsOnTurret: true
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:false
canAttackUnderwaterUnits: false
maxAttackRange: 391
shootDelay: 40
turretRotateWithBody: true
[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
projectile: 1
size: 10
turnSpeed: 5.7
turnSpeedAcceleration: 0.5
canShoot: false
recoilOffset: -4
recoilOutTime: 3
recoilReturnTime: 10
[turret_2]
x: 0
y: 0
projectile: 1
size: 5
attachedTo: 1
slave: true
turnSpeed: 0
turnSpeedAcceleration: 1
shoot_sound:plasma_fire
shoot_sound_vol:0.2
shoot_flame: NONE
shoot_light: #f046ebff
recoilOffset: -2
recoilOutTime: 3
recoilReturnTime: 10
canAttackFlyingUnits: true
canAttackLandUnits:   false
[turret_3]
x: 0
y: 0
copyFrom:2
linkDelayWithTurret:2
[turret_4]
x: 0
y: 0
copyFrom:2
linkDelayWithTurret:2
[projectile_1]
areaDamage: 150
areaRadius: 25
areaRadiusFromEdge:true
life: 100
speed: 16.13
drawSize: 2.1
color: #46ebff
lightColor: #46ebff
lightSize: 0.5
deflectionPower:6
autoTargetingOnDeadTargetRange:60
autoTargetingOnDeadTarget:true
[movement]
movementType: AIR
moveSpeed:5.04
moveAccelerationSpeed: 0.18
moveDecelerationSpeed: 0.18
maxTurnSpeed: 5.7
turnAcceleration: 0.5
reverseSpeedPercentage: 0.85
targetHeight: 20
targetHeightDrift: 1
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
slowDeathFall: true
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.拦截机T1>4) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T6") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:拦截机T1
[global_resource_拦截机T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90