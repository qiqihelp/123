[ai]
upgradedFrom:拦截机T1
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_lj]
autoTrigger:false
[hiddenAction_splj]
autoTrigger:false
alsoTriggerAction:lj1k,lj2k,lj3
requireConditional:if self.globalTeamTags(includes="yd") and numberOfUnitsInEnemyTeam(withTag="ct",greaterThan=0)
[hiddenAction_lj1k]
addWaypoint_prepend:true
autoTrigger:if (self.x>3600 and numberOfUnitsInTeam(withTag='标记K',lessThan=1) or (self.x>2100 and self.teamId%2==0 and not self.hasActiveWaypoint(type='attackmove'))) and self.globalTeamTags(includes="yd")
addWaypoint_position_offsetFromSelf:-4000,0
addWaypoint_type:attackmove
autoTriggerOnEvent:newWaypointGivenByPlayer,created
requireConditional:if self.globalTeamTags(includes="yd") and (self.teamId%2==0 or self.x>3600) and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
[hiddenAction_lj2k]
@copyFromSection:hiddenAction_lj1k
autoTrigger:if (self.x<=600 and numberOfUnitsInTeam(withTag='标记K',lessThan=1) or (self.x<=2100 and self.teamId%2!=0 and not self.hasActiveWaypoint(type='attackmove'))) and self.globalTeamTags(includes="yd")
addWaypoint_position_offsetFromSelf:4000,0
requireConditional:if self.globalTeamTags(includes="yd") and (self.teamId%2!=0 or self.x<=600) and numberOfUnitsInTeam(withTag='标记K',lessThan=1)