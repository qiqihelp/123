[core]
name: 武装直升机T3
displayDescription:虽然相比于T2并没有什么改动 \n但是我还是要把他说的高大上一些T﹏T
class: CustomUnitMetadata
price: 18400
maxHp:2340
mass: 3000
fogOfWarSightRange: 24
techLevel: 1
buildSpeed:0.000133333
availableInDemo: true
radius: 15
softCollisionOnAll: 24
isBio: false
builtFrom_1_name: airFacTory
builtFrom_1_pos:  3
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T4") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 武装喷气机T1
price:  16000
text: 升级T4
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.001
pos: 0.2
ai_isHighPriority:true
addResources:ammo=-1
[action_add1]
autoTriggerOnEvent:created
addResources:auto=1
isVisible:false
[resource_auto]
displayName:auto
hidden:true
[action_1]
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_3]
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_2]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.武装直升机>2) and self.ammo(lessThan=1) and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T4") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},ammo=1
alsoQueueAction:upgradeT2
[graphics]
total_frames: 1
image:        gunship2.png
image_wreak:  gunship_dead.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:0
shadowOffsetY:0
[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 0
aimOffsetSpread:0.4
maxAttackRange: 224
shootDelay: 40
isFixedFiring: false
[turret_1]
invisible: true
x: 0
y: 13
idleDir:0
projectile: 1
turnSpeed: 15
turnSpeedAcceleration: 15
shoot_sound:firing4
shoot_sound_vol:0.2
shoot_flame:small
shoot_light:#FFFFFF
[turret_2]
x: 5
y: 8
shoot_flame:NONE
shoot_light:#FFFFFF
copyFrom:1
linkDelayWithTurret:1
[turret_3]
x: -5
y: 8
shoot_flame:NONE
shoot_light:#FFFFFF
copyFrom:1
linkDelayWithTurret:1
[projectile_1]
directDamage: 105
life: 70
speed: 6.4
drawSize: 2
color: #00FF00
deflectionPower:3
[movement]
movementType: AIR
targetHeight: 20
targetHeightDrift: 2
moveSpeed:2.0999999999999996
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.06
maxTurnSpeed: 6
turnAcceleration: 0.4
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
reverseSpeedPercentage:0.6
[ai]
upgradedFrom:武装直升机T1
[hiddenAction_无尽]
buildSpeed:1
requireConditional:if self.resource.credits>=${action_upgradeT2.price}
alsoQueueAction:无尽
autoTrigger:if self.isControlledByAI() and self.resource.credits>${action_upgradeT2.price}-1 and self.globalTeamTags(includes="WJ")
addResources:credits=-${action_upgradeT2.price}
alsoTriggerAction:upgradeT2
[global_resource_武装直升机]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90