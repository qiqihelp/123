[core]
name: 武装喷气机T2
displayDescription:专业空对地单位\n虽然我至今都不知道他的炮管在哪 \n但是 牛逼就完了
class: CustomUnitMetadata
price: 66400
maxHp:4680
mass: 6000
fogOfWarSightRange: 35
techLevel: 1
buildSpeed:0.000066667
availableInDemo: true
radius: 30
softCollisionOnAll: 24
isBio: false
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T6") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 武装战斗机
price:  320000
text: 升级T6
description: 超大幅度增强
displayType: Upgrade
buildSpeed: 0.00025
pos: 0.2
ai_isHighPriority:true
addResources:ammo=-1
[action_add1]
autoTriggerOnEvent:created
addResources:auto=1
isVisible:false
[resource_auto]
displayName:auto
hidden:true
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_2]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.武装直升机>4) and self.ammo(lessThan=1) and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T6") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},ammo=1
alsoQueueAction:upgradeT2
[graphics]
imageScale:0.9
total_frames: 1
image:        gunship4.png
image_wreak:  gunship_dead3.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:0
shadowOffsetY:0
[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits:false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 0
aimOffsetSpread:0.4
maxAttackRange: 320
shootDelay: 40
isFixedFiring: false
[turret_1]
invisible: true
x: 0
y: 30
idleDir:0
projectile: 1
turnSpeed: 15
turnSpeedAcceleration: 15
canAttackFlyingUnits: false
canAttackLandUnits:   true
shoot_sound:firing4
shoot_sound_vol:0.2
shoot_flame:small
shoot_light:#FFFFFF
[turret_2]
x: 10
y: 20
shoot_light:#FFFFFF
copyFrom:1
linkDelayWithTurret:1
[turret_3]
x: -10
y: 20
shoot_light:#FFFFFF
copyFrom:1
linkDelayWithTurret:1
[projectile_1]
image:heavy_tank_ammo.png
directDamage: 210
life: 70
speed: 9.22
drawSize: 1
color: #00FF00
deflectionPower:6
[movement]
movementType: AIR
targetHeight: 20
targetHeightDrift: 2
moveSpeed:2.94
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.06
maxTurnSpeed: 6
turnAcceleration: 0.4
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
reverseSpeedPercentage:0.6
[ai]
upgradedFrom:武装直升机T1
[hiddenAction_无尽]
buildSpeed:1
requireConditional:if self.resource.credits>=${action_upgradeT2.price}
alsoQueueAction:无尽
autoTrigger:if self.isControlledByAI() and self.resource.credits>${action_upgradeT2.price}-1 and self.globalTeamTags(includes="WJ")
addResources:credits=-${action_upgradeT2.price}
alsoTriggerAction:upgradeT2
[global_resource_武装直升机]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_lj]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="ydk") and numberOfUnitsInEnemyTeam(withTag="ct",greaterThan=0)
[hiddenAction_splj]
autoTrigger:if self.hasActiveWaypoint(type='attackmove') and activeWaypointTarget.numberOfUnitsInAllTeams(withinRange=30,withTag='ct')<1 and activeWaypointTarget.isInMap and self.globalTeamTags(includes='yd')
alsoTriggerAction:lj1k,lj2k,lj3
[hiddenAction_lj1]
clearAllWaypoints:true
autoTrigger:if self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1) and activeWaypointTarget.numberOfUnitsInAllTeams(withinRange=30,withTag='ct')<1 and ((self.x>4100-${attack.maxAttackRange} and self.teamId%2!=0) or (self.x<=100+${attack.maxAttackRange} and self.teamId%2==0))
alsoTriggerAction:lj
[hiddenAction_lj1k]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:-4000,0
addWaypoint_type:attackmove
requireConditional:if self.globalTeamTags(includes="yd") and self.teamId%2==0 and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
[hiddenAction_lj2k]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:4000,0
addWaypoint_type:attackmove
requireConditional:if self.globalTeamTags(includes="yd") and self.teamId%2!=0 and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
