[core]
name: 虫_0
displayDescription:。
class: CustomUnitMetadata
price: 13000
maxHp:3150
mass: 20000
showInEditor:false
techLevel: 3
buildSpeed: 83.3s
availableInDemo: true
ignoreInUnitCapCalculation:true
radius: 45
displayRadius: 27
softCollisionOnAll: 24
tags:W
isBio: false
canNotBeDamaged:true
canOnlyBeAttackedByUnitsWithTags:W
autoTriggerCooldownTime:6
[hiddenAction_1]
autoTriggerOnEvent:created
addWaypoint_type:attack
addWaypoint_target_fromReference:self.parent
clearActiveWaypoint:true
[graphics]
drawLayer:experimentals
icon_zoomed_out_neverShow:true
imageScale:1.2
total_frames: 1
image:        ROOT:素材/NONE.png
image_wreak:  NONE
image_turret: NONE
image_shadow: NONE
shadowOffsetX:30
shadowOffsetY:30
[attack]
canOnlyAttackUnitsWithTags:WZ
turretRotateWithBody: false
aimOffsetSpread:0
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
isFixedFiring:true
turretSize: 4
maxAttackRange: 320
shootDelay: 60
turretMultiTargeting:true
[turret_1]
canAttackCondition:if self.parent.isMoving() or (self.parent.hasActiveWaypoint and not self.parent.hasActiveWaypoint(type='attack'))
invisible: true
x: 0
y: 0
idleDir:0
shoot_light:#FF0000
projectile: 1
size: 30
turnSpeed: 4
turnSpeedAcceleration: 0.5
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
canAttackMaxAngle:90
[turret_2]
canAttackCondition:if not self.parent.isMoving() or self.parent.hasActiveWaypoint(type='attack') or self.parent.height()>3
invisible: true
x: 0
y: 0
idleDir:0
shoot_light:#FF0000
projectile: 1
size: 30
turnSpeed: 4
turnSpeedAcceleration: 0.5
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
canAttackMaxAngle:90
[turret_3]
canAttackCondition:if not self.parent.isMoving() or self.parent.hasActiveWaypoint(type='attack') or self.parent.height()>3
invisible: true
x: 0
y: 0
idleDir:0
shoot_light:#FF0000
projectile: 1
size: 30
turnSpeed: 4
turnSpeedAcceleration: 0.5
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: true
canAttackMaxAngle:90
[projectile_1]
delayedStartTimer:10
areaDamage: 0
areaRadius: 60
areaRadiusFromEdge:true
life: 0
speed: 0.6
targetSpeed: 6
largeHitEffect: false
explodeOnEndOfLife:true
areaHitAirAndLandAtSameTime:true
autoTargetingOnDeadTarget: true
explodeEffect:NONE
deflectionPower:-1
spawnProjectilesOnCreate:2(offsetRandomXY=190,offsetHeight=4)
[projectile_2]
image:light.png
drawSize:1
areaDamage: 0
areaRadius: 50
areaRadiusFromEdge:true
life: 120
speed: 0
speedSpread:2
explodeOnEndOfLife:false
areaHitAirAndLandAtSameTime:true
trailEffect: true
trailEffectRate:10
largeHitEffect: false
deflectionPower:-1
initialUnguidedSpeedY:-2
wobbleAmplitude: 2
wobbleFrequency: 2s
lightColor:#FFA500
lightSize:2
[movement]
movementType: NONE
targetHeight: 4
reverseSpeedPercentage: 0.1
moveSpeed:4
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.03
maxTurnSpeed: 4
turnAcceleration: 0.04
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  -1
[attachment_1]
x:0
y:-100
onCreateSpawnUnitOf:虫_1
addTransportedUnits: false
setDrawLayerOnTop:true
lockLegMovement:true
canBeAttackedAndDamaged: false
isUnselectable: true
lockRotation: false
rotateWithParent:false
createIncompleteIfParentIs: false
redirectDamageToParent: false
redirectDamageToParent_shieldOnly: false
canAttack:true
deattachIfWantingToMove:false
keepAliveWhenParentDies:false
[action_伤害升级]
autoTrigger:if self.resource.SHDS<self.parent.resource.SHDS and self.globalTeamTags(includes="EW")
id:${core.price}+12
[action_射程升级]
autoTrigger:if self.resource.SCDS<self.parent.resource.SCDS and self.globalTeamTags(includes="EW")
id:${core.price}+15
[action_射速升级]
autoTrigger:if self.resource.SSDS<self.parent.resource.SSDS and self.globalTeamTags(includes="EW")
id:${core.price}+16
[action_能量升级]
autoTrigger:if self.resource.NNDS<self.parent.resource.NNDS and self.globalTeamTags(includes="EW")
id:${core.price}+17
[hiddenAction_洗点数K]
autoTrigger:if self.globalTeamTags(includes="EW") and (self.resource.DSK==2 or (self.resource.SDDS+self.resource.XLDS+self.resource.SHDS+self.resource.HDDS+self.resource.SCDS+self.resource.SSDS+self.resource.NNDS+self.resource.GCDS>self.parent.resource.SDDS+self.parent.resource.XLDS+self.parent.resource.SHDS+self.parent.resource.HDDS+self.parent.resource.SCDS+self.parent.resource.SSDS+self.parent.resource.NNDS+self.parent.resource.GCDS))
setResourcesWithLogic:SDDS=0,XLDS=0,SHDS=0,HDDS=0,SCDS=0,SSDS=0,NNDS=0,GCDS=0,DS=5,DSK=0
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90