[core]
name: 虫_a2
class: CustomUnitMetadata
price: 300
maxHp: 170
mass: 3000
showOnMinimap:false
techLevel: 1
buildSpeed: 0.005
availableInDemo: true
ignoreInUnitCapCalculation:true
showInEditor:false
radius: 1
tags:a2
[decal_1]
isVisible:true
layer:afterBody
teamColors:true
onlyWithZoomLevelOrMore:0.00000001
imageScale:1.2
image:base.png
basePosition:self.parent
[graphics]
drawLayer:experimentals
imageScale:1.2
image:        ROOT:素材/NONE.png
image_wreak:  NONE
image_turret: NONE
icon_zoomed_out_neverShow:true
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
turretSize: 0
turretTurnSpeed: 1.8
maxAttackRange: 0
turretMultiTargeting: true
[movement]
movementType: NONE
moveSpeed: 1.5
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.05
reverseSpeedPercentage:0
targetHeight:4
maxTurnSpeed: 4.1
turnAcceleration: 0.25
[attachment_T]
x:0
y:-20
idleDir:0
idleDirReversing:0
height:4
onCreateSpawnUnitOf:虫_T
addTransportedUnits: false
setDrawLayerOnTop: true
lockLegMovement:true
canBeAttackedAndDamaged: false
isUnselectable: true
lockRotation: true
createIncompleteIfParentIs: false
redirectDamageToParent: false
redirectDamageToParent_shieldOnly: false
canAttack:true
deattachIfWantingToMove:false
keepAliveWhenParentDies:false
alwaysAllowedToAttackParentsMainTarget:false
[action_伤害升级]
autoTrigger:if self.resource.SHDS<self.parent.resource.SHDS and self.globalTeamTags(includes="EW")
id:${core.price}+12
[action_射程升级]
autoTrigger:if self.resource.SCDS<self.parent.resource.SCDS and self.globalTeamTags(includes="EW")
id:${core.price}+15
[action_射速升级]
autoTrigger:if self.resource.SSDS<self.parent.resource.SSDS and self.globalTeamTags(includes="EW")
id:${core.price}+16
[action_能量升级]
autoTrigger:if self.resource.NNDS<self.parent.resource.NNDS and self.globalTeamTags(includes="EW")
id:${core.price}+17
[hiddenAction_洗点数K]
autoTrigger:if self.globalTeamTags(includes="EW") and (self.resource.DSK==2 or (self.resource.SDDS+self.resource.XLDS+self.resource.SHDS+self.resource.HDDS+self.resource.SCDS+self.resource.SSDS+self.resource.NNDS+self.resource.GCDS>self.parent.resource.SDDS+self.parent.resource.XLDS+self.parent.resource.SHDS+self.parent.resource.HDDS+self.parent.resource.SCDS+self.parent.resource.SSDS+self.parent.resource.NNDS+self.parent.resource.GCDS))
setResourcesWithLogic:SDDS=0,XLDS=0,SHDS=0,HDDS=0,SCDS=0,SSDS=0,NNDS=0,GCDS=0,DS=5,DSK=0
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90