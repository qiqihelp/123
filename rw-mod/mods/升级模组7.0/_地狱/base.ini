[core]
name: 地狱
displayDescription:地狱。\n-巨大的陆行火龙，虫族的最终单位\n-价格十分甚至有九分滴昂贵（这还用说嘛\n-全身由黑曜石铸炼而成，并且被岩浆环绕着\n-任何试图靠近的单位都会被灼烧\n-可切换攻击模式：远程与近战\n-远程攻击时龙头发射3000摄氏度的激光融化一切单位\n-近战攻击时龙头发射高强度的范围火龙卷覆盖龙的躯体\n-从背部释放对空AOE火球与高额单体火龙卷\n-近战攻击手脚并用，可谓是不浪费每个身体部位（\n-践踏可以快速跳跃到一处地点并且造成高额伤害，但是跳跃时处于腾空状态可以被防空单位攻击\n-可能是是本模组唯一能与帝空打的有来有回的单位了吧\n-虽说是龙，但其实更像个巨蜥\n（by_UZQueen~)
