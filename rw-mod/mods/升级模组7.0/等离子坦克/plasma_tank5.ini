[core]
name: 聚能离子坦克
displayText: 聚能离子坦克
displayDescription:聚能离子坦克。\n一辆向敌人发射聚能离子的坦克，射程中等\n能力较为综合，面对单体单位时较为强力\n拥有护盾，但是惧怕电击，\n但即便这样，多个袭来时依旧十分难缠\n原稿by巨屑合金\n完善by威严な大小姐
class: CustomUnitMetadata
price: 483000
maxHp:14300
mass: 40000
maxShield:27950
shieldRegen:3.9
techLevel: 2
buildSpeed:0.000013846
radius: 60
displayRadius: 60
shieldRenderRadius:60
fogOfWarSightRange:46
isBio: false
softCollisionOnAll: 30
transportSlotsNeeded:16
[global_resource_pfcd]
hidden:true
[global_resource_pf2]
hidden:true
[hiddenAction_毒圈]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield>=self.maxShield()/100
addResourcesWithLogic:shield=-0.083333*self.maxShield()
[hiddenAction_毒圈1]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield<self.maxShield()/100
addResourcesWithLogic:hp=-0.083333*self.maxShield()
[decal_1]
layer:afterBody
teamColors:true
onlyWhileAlive:true
isVisible:if self.resource.pf2==1
image:1.png
[decal_2k]
layer:afterBody
teamColors:true
onlyWhileAlive:true
isVisible:if self.resource.pf2==0
image:turret5.png
basePositionFromTurret:1
[decal_2]
layer:afterBody
teamColors:true
onlyWhileAlive:true
isVisible:if self.resource.pf2==1
image:2.png
basePositionFromTurret:1
[decal_护盾]
layer:afterBody
teamColors:true
onlyWhileAlive:true
isVisible:if self.resource.pf2==0
image:ROOT:/素材/护盾.png
alpha:self.shield*0.6/self.maxShield+0.4*self.ammo
imageScale:0.8
imageScaleY:1.2
[decal_护盾1]
layer:afterBody
teamColors:true
onlyWhileAlive:true
isVisible:if self.resource.pf2==1
image:红护盾.png
alpha:self.shield*0.5/self.maxShield+0.4*self.ammo+0.1
imageScale:0.8
imageScaleY:1.2
[hiddenAction_护盾]
autoTriggerOnEvent:tookDamage
setResourcesWithLogic:ammo=1
requireConditional:if self.resource.pf2==1
[hiddenAction_护盾1]
autoTrigger:if self.ammo==1 and self.hasTakenDamage(laterThanSeconds=0.1) and self.resource.pf2==1
setResourcesWithLogic:ammo=0
[action_pf_on]
isActive:if self.resource.pfcd==0
text:毁灭者坦克皮
description:为m3制作
isVisible:if self.resource.pf2==0
buildSpeed:0
alwaysSinglePress:true
highPriorityQueue:true
setResourcesWithLogic:pf2=1,pfcd=6
[action_pf_off]
isActive:if self.resource.pfcd==0
text:原皮
isVisible:if self.resource.pf2==1
buildSpeed:0
alwaysSinglePress:true
highPriorityQueue:true
setResourcesWithLogic:pf2=0,pfcd=6
[graphics]
image_shield:ROOT:/素材/NONE.png
total_frames: 2
teamColorsOnTurret: true
image:        plasma_tank2.png
image_wreak:  plasma_tank_dead1.png
image_turret: ROOT:/素材/NONE.png
image_shadow: AUTO
shadowOffsetX:4
shadowOffsetY:4
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2.0
dustEffect: true
lock_body_rotation_with_main_turret: false
