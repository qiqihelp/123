[core]
name: 等离子坦克T1
displayText: 等离子坦克T1
displayDescription:所以 我们至今都不知道等离子到底是什么东西\n不是吗
class: CustomUnitMetadata
price: 1000
maxHp: 220
mass: 10000
maxShield: 430
shieldRegen: 0.06
techLevel: 2
buildSpeed: 0.0009
radius: 15
displayRadius: 15
shieldRenderRadius:15
softCollisionOnAll: 0
builtFrom_1_name: landFacTory
builtFrom_1_pos:  5
overrideAndReplace:plasmaTank
[hiddenAction_毒圈]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield>=self.maxShield()/100
addResourcesWithLogic:shield=-0.083333*self.maxShield()
[hiddenAction_毒圈1]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield<self.maxShield()/100
addResourcesWithLogic:hp=-0.083333*self.maxShield()
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 等离子坦克T2
price:  2000
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.05
ai_isHighPriority:true
[graphics]
total_frames: 2
teamColorsOnTurret: true
image:        plasma_tank.png
image_wreak:  plasma_tank_dead.png
image_turret: turret.png
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2.0
dustEffect: true
lock_body_rotation_with_main_turret: false
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 18
turretTurnSpeed: 2.5
maxAttackRange: 165
shootDelay: 90
isFixedFiring: false
[turret_1]
x: 0
y: 3
projectile: 1
turnSpeed: 4
turnSpeedAcceleration: 0.3
shoot_sound_vol:0.8
shoot_flame:CUSTOM:lightSlowFade
shoot_light:#ffffff
canShoot: true
recoilOffset: -2
recoilOutTime: 4
recoilReturnTime: 20
warmup:10
chargeEffectImage: SHARED:lighting_charge.png
[projectile_1]
directDamage: 100
life: 80
speed: 0
targetSpeed: 16
targetSpeedAcceleration: 0.7
drawType:2
frame:4
drawSize: 1
trailEffect: CUSTOM:projectileTrail
trailEffectRate:2
explodeEffect: CUSTOM:projectilePassThough, smallExplosion, CUSTOM:hitLightFlash
effectOnCreate: CUSTOM:projectileLight
[effect_warmup]
priority:high
image: SHARED:light_50.png
life: 25
fadeOut: true
attachedToUnit: true
color: #63e6e8
scaleFrom: 0.1
scaleTo: 0.1
alpha: 0.8
drawUnderUnits:false
ySpeedRelative:3.9
[effect_lightSlowFade]
image: SHARED:light_50.png
life: 40
fadeOut: true
attachedToUnit: true
color: #63e6e8
scaleFrom: 0.7
scaleTo: 0.7
alpha: 0.5
drawUnderUnits:true
[effect_projectileTrail]
image: SHARED:light_50.png
life: 20
fadeOut: true
attachedToUnit: false
color: #63e6e8
fadeInTime:2
scaleFrom: 0.4
scaleTo: 0.4
alpha: 0.6
drawUnderUnits:true
[effect_projectileLight]
priority:veryhigh
image: SHARED:light_50.png
life: 100
fadeOut: true
attachedToUnit: true
color: #63e6e8
fadeInTime:2
scaleFrom: 0.8
scaleTo: 0.8
alpha: 0.6
drawUnderUnits:false
liveAfterAttachedDies: false
[effect_hitLightFlash]
priority:high
image: SHARED:light_50.png
life: 14
fadeOut: true
attachedToUnit: false
color: #63e6e8
scaleFrom: 1.8
scaleTo: 1.8
alpha: 0.6
drawUnderUnits:false
[effect_projectilePassThough]
priority:high
frameIndex: 4
stripIndex: projectiles2
life: 20
fadeOut: true
attachedToUnit: false
color: #FFFFFF
scaleFrom: 1
scaleTo: 0.5
alpha: 1
drawUnderUnits:false
ySpeedRelative:2
atmospheric: true
[movement]
movementType: LAND
moveSpeed: 0.8
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.1
reverseSpeedPercentage:0.75
maxTurnSpeed: 3.4
turnAcceleration: 0.1
moveSlidingMode :false
moveIgnoringBody:false
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.等离子坦克T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:等离子坦克T1
[hiddenAction_无尽]
buildSpeed:1
requireConditional:if self.resource.credits>=${action_upgradeT2.price}
alsoQueueAction:无尽
autoTrigger:if self.isControlledByAI() and self.resource.credits>${action_upgradeT2.price}-1 and self.globalTeamTags(includes="WJ")
addResources:credits=-${action_upgradeT2.price}
alsoTriggerAction:upgradeT2
[global_resource_等离子坦克T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_护盾升级]
@copyFromSection:action_效率升级
id:${core.price}+4
iconExtraImage:ROOT:素材/护盾K.png
isVisible:if self.globalTeamTags(includes="EW") and self.maxShield()>0
text:升级护盾[%{self.resource.HDDS}]
description:增加基础的2倍
setUnitStats:maxShield=self.maxShield()*(1+2/(2*self.resource.HDDS-1)),shield=self.shield()*(1+2/(2*self.resource.HDDS-1)),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS)
addResourcesWithLogic:HDDS=1
[decal_护盾升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.HDDS>0,1,-1)
isVisible:if self.resource.HDDS!=0
frame:min(select(self.resource.HDDS>0,self.resource.HDDS,int(-self.resource.HDDS/0.08))-1,4)
image:ROOT:素材/护盾升级.png
xOffsetAbsolute:0.1*${core.radius}
imageScale:${core.radius}/110