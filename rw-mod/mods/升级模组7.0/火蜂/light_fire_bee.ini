[core]
name: 工蜂
displayDescription:工蜂。\n杀人蜂的辅助作战单位\n射程较远，通常两只同时出现于杀人蜂前方两侧\n这条估计只有沙盒才看得到吧（笑\nby威严な大小姐
class: CustomUnitMetadata
price: 4000
maxHp:700
mass: 10000
techLevel: 1
buildSpeed:0.00001111111
experimental: true
availableInDemo: false
radius: 15
ignoreInUnitCapCalculation:true
softCollisionOnAll: 24
[graphics]
drawLayer: experimentals
total_frames: 2
image:        light_body.png
image_wreak:  NONE
image_turret: smallbee_turret.png
teamColorsOnTurret:true
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 2
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2
lock_body_rotation_with_main_turret: true
[attack]
turretRotateWithBody: false
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 10
turretTurnSpeed: 2
maxAttackRange: 500
shootDelay: 25
[turret_1]
invisible: true
canShoot: false
x: 0
y: 0
idleDir:0
[turret_2]
invisible: false
attachedTo: 1
x: -6
y: 13
idleDir:-20
shoot_sound:plasma_fire
shoot_sound_vol:0.03
shoot_light: #FFEECCCC
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
projectile: 2
size: 8
delay: 25
recoilOffset: -2
turnSpeed: 0.8
turnSpeedAcceleration: 1
[turret_3]
copyFrom: 2
idleDir:20
warmup:10
invisible: false
x: 6
y: 13
[projectile_2]
areaDamage: 358
areaRadius: 65
areaRadiusFromEdge:true
life: 140
color:#ff0000
frame: 11
drawSize: 0.7
flameWeapon: true
deflectionPower:-1
speed: 0
targetSpeed: 8
targetSpeedAcceleration: 1.5
effectOnCreate: CUSTOM:projectileLight
[effect_projectileLight]
priority:high
image: SHARED:light_50.png
life: 100
fadeOut: true
attachedToUnit: true
color: #ff0000
fadeInTime:2
scaleFrom: 0.3
scaleTo: 0.3
alpha: 0.6
drawUnderUnits:false
liveAfterAttachedDies: false
[movement]
movementType: AIR
moveSpeed: 1.4
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
targetHeightDrift: 2
landOnGround: false
reverseSpeedPercentage:0.8
maxTurnSpeed: 4
turnAcceleration: 0.1
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
slowDeathFall: true
[ai]
upgradedFrom:火蜂战机T1
[action_射速升级]
autoTrigger:if self.resource.SSDS<self.customTarget1.resource.SSDS and self.globalTeamTags(includes="EW")
[action_射程升级]
autoTrigger:if self.resource.SCDS<self.customTarget1.resource.SCDS and self.globalTeamTags(includes="EW")
[action_伤害升级]
autoTrigger:if self.resource.SHDS<self.customTarget1.resource.SHDS and self.globalTeamTags(includes="EW")
[hiddenAction_洗点数K]
autoTrigger:if self.globalTeamTags(includes="EW") and (self.resource.DSK==2 or (self.resource.SDDS+self.resource.XLDS+self.resource.SHDS+self.resource.HDDS+self.resource.SCDS+self.resource.SSDS+self.resource.NNDS+self.resource.GCDS>self.customTarget1.resource.SDDS+self.customTarget1.resource.XLDS+self.customTarget1.resource.SHDS+self.customTarget1.resource.HDDS+self.customTarget1.resource.SCDS+self.customTarget1.resource.SSDS+self.customTarget1.resource.NNDS+self.customTarget1.resource.GCDS))
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_SJEW]
autoTrigger:false
autoTriggerOnEvent:NONE
[hiddenAction_JY]
autoTriggerOnEvent:killedAnyUnit
autoTrigger:if self.resource.CHZ>0
takeResources_includeReference:self.customTarget1
takeResources_directTransferStoppingAtZero:true
takeResources:CHZ=-999999999
[hiddenAction_dj3]
autoTriggerOnEvent:NONE