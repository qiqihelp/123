[core]
name: 巨型剑盾机甲
displayDescription:巨型剑盾机甲。\n一台使用剑盾的机甲，近战攻击\n这台机甲会如同一名骑士一般，杀死一切靠近的敌人\n同时，它的护盾可以为其提供一定的防护，但是会被电击直接伤害\n不过移动速度过慢，会成为风筝(悲\n原稿by巨屑合金\n完善by威严の大小姐
copyFrom: mech_large_common1.ini
price: 30000
maxHp: 5000
mass: 12000
maxShield: 5000
shieldRegen: 0.7
techLevel: 3
buildSpeed: 83.3s
radius: 45
[graphics]
drawLayer: experimentals
image: NONE.png
image_wreak:  NONE.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
teamColorsOnTurret:true
[attack]
isMelee: true
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretMultiTargeting:true
turretSize: 20
turretTurnSpeed: 3
maxAttackRange: 60
shootDelay: 60
turretRotateWithBody: false
[turret_4]
x: 0
y: 0
idleDir:0
invisible: true
projectile:3
canAttackFlyingUnits: true
[turret_0]
attachedTo:3
x: 28
y: -7
idleDir:0
turnSpeed: 2.9
turnSpeedAcceleration: 0.3
shoot_sound:bug_attack
shoot_sound_vol:0.3
recoilOffset: 16
recoilOutTime: 4
recoilReturnTime: 24
projectile: 1
image:cut1.png
canAttackFlyingUnits: false
canAttackLandUnits:   true
[turret_2]
attachedTo:3
x: -28
y: -11
idleDir:0
turnSpeed: 2.9
turnSpeedAcceleration: 0.3
shoot_sound:bug_die
shoot_sound_vol:0.3
recoilOffset: 16
recoilOutTime: 4
recoilReturnTime: 24
projectile: 2
image:shield1.png
linkDelayWithTurret: 0
warmup:30
canAttackFlyingUnits: false
canAttackLandUnits:   true
[turret_3]
x: 0
y: 0
canShoot:false
image:topCS1.png
recoilOffset: 8
recoilOutTime: 4
recoilReturnTime: 24
idleSweepAngle:20
idleSweepSpeed:0.30
idleSweepDelay:100
idleSweepAddRandomDelay:50
idleSweepCondition: if not self.isMoving()
canAttackFlyingUnits: false
canAttackLandUnits:   true
[effect_lightSlowFade]
image: SHARED:light_50.png
life: 20
fadeOut: true
attachedToUnit: true
color: #FFEECCCC
scaleFrom: 0.2
scaleTo: 0.5
alpha: 0.5
drawUnderUnits:true
[projectile_1]
directDamage: 270
life: 70
deflectionPower:-1
speed: 999
[projectile_2]
areaDamage: 150
areaRadius:65
life: 70
deflectionPower:-1
speed: 999
[projectile_3]
invisible: true
directDamage: 0
life: 0
speed: 0
deflectionPower:-1
[attachment_unitSlot1]
x:0
y:0
idleDir:0
idleDirReversing:0
onCreateSpawnUnitOf:missile
addTransportedUnits: true
setDrawLayerOnTop: true
lockLegMovement:false
canBeAttackedAndDamaged: false
isUnselectable: true
isVisible:false
showAllActionsFrom:if self.hasFlag(id=1)
lockRotation: true
createIncompleteIfParentIs: false
redirectDamageToParent: true
redirectDamageToParent_shieldOnly: true
canAttack:true
deattachIfWantingToMove:false
keepAliveWhenParentDies:false
prioritizeParentsMainTarget:true
alwaysAllowedToAttackParentsMainTarget:false
[movement]
moveSpeed: 0.6
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.07
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_护盾升级]
@copyFromSection:action_效率升级
id:${core.price}+4
iconExtraImage:ROOT:素材/护盾K.png
isVisible:if self.globalTeamTags(includes="EW") and self.maxShield()>0
text:升级护盾[%{self.resource.HDDS}]
description:增加基础的2倍
setUnitStats:maxShield=self.maxShield()*(1+2/(2*self.resource.HDDS-1)),shield=self.shield()*(1+2/(2*self.resource.HDDS-1)),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS)
addResourcesWithLogic:HDDS=1
[decal_护盾升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.HDDS>0,1,-1)
isVisible:if self.resource.HDDS!=0
frame:min(select(self.resource.HDDS>0,self.resource.HDDS,int(-self.resource.HDDS/0.08))-1,4)
image:ROOT:素材/护盾升级.png
xOffsetAbsolute:0.1*${core.radius}
imageScale:${core.radius}/110