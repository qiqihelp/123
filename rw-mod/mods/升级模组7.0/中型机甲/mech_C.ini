[core]
name: 重型近战机甲
copyFrom: mech_large_common.ini
price: 5000
maxHp: 1800
mass: 6000
techLevel: 2
buildSpeed: 0.0006
radius: 25
[graphics]
image: NONE.png
image_wreak:  NONE.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
teamColorsOnTurret:true
[attack]
isMelee: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 20
turretTurnSpeed: 3
maxAttackRange: 30
shootDelay: 60
turretRotateWithBody: false
[turret_0]
attachedTo:3
x: 13
y: -6
idleDir:0
turnSpeed: 2.9
turnSpeedAcceleration: 0.3
shoot_sound:bug_attack
shoot_sound_vol:0.3
recoilOffset: 8
recoilOutTime: 4
recoilReturnTime: 24
projectile: 1
image:cut.png
[turret_2]
attachedTo:3
x: -13
y: -6
idleDir:0
turnSpeed: 2.9
turnSpeedAcceleration: 0.3
shoot_sound:bug_attack
shoot_sound_vol:0.3
recoilOffset: 8
recoilOutTime: 4
recoilReturnTime: 24
warmup:30
linkDelayWithTurret: 0
projectile: 1
image:cut.png
[turret_3]
x: 0
y: 0
canShoot:false
image:topC.png
recoilOffset: 4
recoilOutTime: 4
recoilReturnTime: 24
idleSweepAngle:20
idleSweepSpeed:0.30
idleSweepDelay:100
idleSweepAddRandomDelay:50
idleSweepCondition: if not self.isMoving()
[effect_lightSlowFade]
image: SHARED:light_50.png
life: 20
fadeOut: true
attachedToUnit: true
color: #FFEECCCC
scaleFrom: 0.2
scaleTo: 0.5
alpha: 0.5
drawUnderUnits:true
[projectile_1]
directDamage: 130
life: 70
deflectionPower:-1
speed: 999
[movement]
moveSpeed: 0.75
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.07
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90