[core]
name: 轻型喷火机甲
copyFrom: mechs_small_common.ini
price: 1200
maxHp: 900
mass: 3000
techLevel: 1
buildSpeed: 0.0008
radius: 13
displayRadius: 11
selfRegenRate:0.01
[action_upgradeT2]
convertTo: 喷火机甲T1
price:  14000
text: 升级T1
description: 大幅度增强\n但比正常建造成本更高
displayType: Upgrade
buildSpeed: 0.001
pos: 0.05
[graphics]
image: topflame.png
image_wreak:  NONE
image_shadow: AUTO
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 20
turretTurnSpeed: 3
maxAttackRange: 120
shootDelay: 5
turretRotateWithBody: false
[turret_1]
x: 0
y: 0
idleDir:0
turnSpeed: 2.9
turnSpeedAcceleration: 0.17
turnSpeedDeceleration: 0.35
canShoot: false
idleSweepAngle:20
idleSweepSpeed:0.30
idleSweepDelay:100
idleSweepAddRandomDelay:50
idleSweepCondition: if not self.isMoving()
[turret_2]
x: 5
y: 10
attachedTo: 1
slave: true
invisible: true
projectile: 1
turnSpeed: 8.0
turnSpeedAcceleration: 1.0
shoot_flame:CUSTOM:smoke
canShoot: true
size: 0
limitingAngle: 45
[turret_3]
copyFrom: 2
x: -5
y: 10
warmup:1
[projectile_1]
life: 70
speed: 7
targetSpeed: 2.5
targetSpeedAcceleration: 0.3
speedSpread: 1
frame: 3
drawSize: 0.15
flameWeapon: true
hitSound: false
targetGround:true
targetGroundSpread: 25
deflectionPower: -1
areaDamage: 4
areaRadius: 45
explodeEffect: CUSTOM:hitFlame
effectOnCreate: CUSTOM:attachedFlame, CUSTOM:attachedLight
[effect_attachedFlame]
priority:veryhigh
frameIndex: 3
stripIndex: projectiles
life: 120
fadeOut: true
attachedToUnit: true
color: #FFFFFF
fadeInTime:9
scaleFrom: 0.45
scaleTo: 0.65
alpha: 1.5
drawUnderUnits:false
liveAfterAttachedDies: false
[effect_attachedLight]
priority:veryhigh
image: SHARED:light_50.png
life: 80
fadeOut: true
attachedToUnit: true
color: #fdc14d
fadeInTime:4
scaleFrom: 0.2
scaleTo: 0.2
alpha: 0.5
drawUnderUnits:false
liveAfterAttachedDies: false
[effect_hitFlame]
frameIndex: 3
stripIndex: projectiles
life: 40
fadeOut: true
attachedToUnit: false
color: #FFFFFF
scaleFrom: 0.5
scaleTo: 0.6
alpha: 0.5
drawUnderUnits:false
liveAfterAttachedDies: false
physics: true
ySpeedRelative:0.4
hSpeed: 0.3
[effect_flameExit]
frameIndex: 3
stripIndex: projectiles
alwayStartDirAtZero:true
life: 15
fadeOut: true
attachedToUnit: false
color: #FFFFFF
scaleFrom: 0.0
scaleTo: 0.65
alpha: 0.4
drawUnderUnits:false
liveAfterAttachedDies: false
hSpeed:0.2
atmospheric: true
[effect_smoke]
frameIndex: 0
stripIndex: smoke_black
spawnChance: 0.3
life: 90
fadeOut: true
attachedToUnit: false
color: #FFFFFF
fadeInTime:15
scaleFrom: 0.15
scaleTo: 0.3
alpha: 0.8
drawUnderUnits:false
liveAfterAttachedDies: false
hSpeed:0.2
dirOffsetRandom:180
atmospheric: true
[movement]
moveSpeed: 0.8
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.07
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90