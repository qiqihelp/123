[core]
name: 模块护盾恢复T1
copyFrom: ROOT:/炮塔/基础炮塔/common_slot.ini
price: 6000
[hiddenAction_regen]
autoTrigger:if numberOfUnitsInAllTeams(withTag="ST")<1 and self.resource.stk==0
takeResources: shield=-30
takeResources_includeParent: true
takeResources_discardCollected: true
[action_upgradeT2]
description:需要模块化蜘蛛T2
textAddUnitName: ${section.convertTo}
isActive: if self.queueSize(empty=true) and self.hasParent(withTag="模块化蜘蛛T2") or self.hasParent(withTag="模块化蜘蛛T3") or self.hasParent(withTag="模块化战斗蜘蛛T1") or self.hasParent(withTag="模块化战斗蜘蛛T2") or self.hasParent(withTag="模块化泰坦蜘蛛")
buildSpeed: 1
convertTo: 模块护盾恢复T2
price: 12000
ai_isHighPriority:true
takeResources: HDZ=-30
takeResources_includeParent: true
takeResources_discardCollected: true
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
shootDelay: 85
[graphics]
image:        shieldGen.png
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
drawLayer: bottom
[hiddenAction_HDZ]
autoTrigger:if self.resource.HD==0 and self.completed
takeResources: HDZ=-30
takeResources_includeParent: true
takeResources_discardCollected: true
setResourcesWithLogic:HD=1
[action_reclaim]
takeResources: HDZ=30
takeResources_includeParent: true
takeResources_discardCollected: true
setResourcesWithLogic:HD=0
[resource_HDZ]
hidden:true
[resource_HD]
hidden:true