[core]
name: 模块反核装置T3
copyFrom: ROOT:/炮塔/基础炮塔/common_slot2.ini
price: 161000
isLockedIfGameModeNoNuke:true
[action_upgradeT2]
description:需要模块化战斗蜘蛛T1
textAddUnitName: ${section.convertTo}
isActive: if self.queueSize(empty=true) and self.hasParent(withTag="模块化战斗蜘蛛T1") or self.hasParent(withTag="模块化战斗蜘蛛T2") or self.hasParent(withTag="模块化泰坦蜘蛛")
buildSpeed: 1
convertTo:模块反核装置T4
price: 140000
iconExtraImage: SHARED:icon_upgrade.png
iconExtraColor: #FFFFFFFF
ai_isHighPriority:true
[action_buildAntiNuke]
price:  3000
text: i:gui.actions.buildAntiNuke
description:i:gui.actions.buildAntiNuke.description
displayType: NONE
buildSpeed: 0.0161
pos: 0.2
isActive:if self.ammoIncludingQueued(lessThan=276)
addResources: ammo=1
ai_isDisabled: if self.ammo(greaterThan=91)
iconImage: SHARED:icon_build.png
[action_buildAntiNukeT2]
price:  69000
text: 建立反核装置*23
description:i:gui.actions.buildAntiNuke.description
displayType: NONE
buildSpeed: 0.0007
pos: 0.2
isActive:if self.ammoIncludingQueued(lessThan=254)
addResources: ammo=23
ai_isDisabled: if self.ammo(greaterThan=69)
iconImage: SHARED:icon_build.png
[action_showAntiNukeCount]
addResources: ammo=1
price:  ammo=1
text: i:gui.actions.antiNukeCount
description:i:gui.actions.antiNukeCount.description
buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile
isActive:false
isVisible: if self.ammo(greaterThan=0) and not self.hasFlag(id=1)
iconImage: SHARED:icon_nuke_stockpile.png
[action_showAntiNukeCountEmpty]
text: i:gui.actions.antiNukeCountEmpty
description:i:gui.actions.antiNukeCount.descriptionEmpty
buildSpeed: 0s
pos: 0.1
displayType: infoOnlyStockpile
isActive:false
isVisible: if self.ammo(lessThan=1) and not self.hasFlag(id=1)
iconImage: SHARED:icon_nuke_stockpile.png
isGuiBlinking: true
[action_showAntiNukeCountOffline]
addResources: ammo=1
price:  ammo=1
text: i:gui.actions.antiNukeCountOffline
description:i:gui.actions.antiNukeCount.descriptionOffline
buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile
isActive:false
isVisible: if self.hasFlag(id=1)
iconImage: SHARED:icon_nuke_stockpile.png
isGuiBlinking: true
[action_isEnabled]
text: i:gui.actions.enabled
description:i:gui.actions.enabled.description
buildSpeed: 0s
addResources: setFlag=1
isVisible: if not self.hasFlag(id=1)
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
highPriorityQueue: true
ai_isDisabled: true
canPlayerCancel: false
allowMultipleInQueue: false
alwaysSinglePress: true
[action_isDisabled]
text: i:gui.actions.disabled
description:i:gui.actions.disabled.description
buildSpeed: 0s
addResources: unsetFlag=1
isVisible: if self.hasFlag(id=1)
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
isGuiBlinking: true
highPriorityQueue: true
ai_isDisabled: true
canPlayerCancel: false
allowMultipleInQueue: false
alwaysSinglePress: true
