text: i:gui.actions.buildAntiNuke
description:i:gui.actions.buildAntiNuke.description
displayType: NONE
buildSpeed: 0.0301
pos: 0.2
isActive:if self.ammoIncludingQueued(lessThan=516)
addResources: ammo=1
ai_isDisabled: if self.ammo(greaterThan=171)
iconImage: SHARED:icon_build.png
