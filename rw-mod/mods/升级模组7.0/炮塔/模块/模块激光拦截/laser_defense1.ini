[core]
name: 模块激光拦截T2
copyFrom: ROOT:/炮塔/基础炮塔/common_slot1.ini
price: 9000
energyMax: 2
energyRegen: 0.0006
[hiddenAction_NNHF]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull
addResourcesWithLogic:energy=${core.energyRegen}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[action_upgradeT2]
description:需要模块化蜘蛛T3
textAddUnitName: ${section.convertTo}
isActive: if self.queueSize(empty=true) and self.hasParent(withTag="模块化蜘蛛T3") or self.hasParent(withTag="模块化战斗蜘蛛T1") or self.hasParent(withTag="模块化战斗蜘蛛T2") or self.hasParent(withTag="模块化泰坦蜘蛛")
buildSpeed: 1
convertTo: 模块激光拦截T3
price: 60000
ai_isHighPriority:true
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
shootDelay: 85
maxAttackRange:192
[turret_laserDefence]
x: 0
y: 0
canShoot: false
invisible: true
laserDefenceEnergyUse: 0.05
size:1
[turret_laserDefence1]
x: 0
y: 0
canShoot: false
invisible: true
laserDefenceEnergyUse: 0.05
size:1
[graphics]
image:        laser_defense1.png
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
drawLayer: bottom
[action_能量升级]
@copyFromSection:action_效率升级K
id:${core.price}+7
iconExtraImage:ROOT:素材/能量K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级能量[%{self.resource.NNDS}]
description:增加基础的1倍
setUnitStats:maxEnergy=self.maxEnergy*(1+1/self.resource.NNDS),energy=self.energy()*(1+1/self.resource.NNDS)
addResourcesWithLogic:NNDS=1
[decal_能量升级]
alwaysStartDirAtZero:true
imageScaleY:select(self.resource.NNDS>0,1,-1)
total_frames:5
layer:beforeUI
onlyWhileAlive:true
isVisible:if self.resource.NNDS!=0
frame:min(select(self.resource.NNDS>0,self.resource.NNDS,int(-self.resource.NNDS/0.16))-1,4)
image:ROOT:素材/能量.png
xOffsetAbsolute:-0.1*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_射程升级]
isVisible:if self.globalTeamTags(includes="EW")