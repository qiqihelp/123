[core]
name: 模块火炮T1
copyFrom: ROOT:/炮塔/基础炮塔/common_weapon_slot.ini
price: 5000
[action_upgradeT2]
description:需要模块化蜘蛛T2
textAddUnitName: ${section.convertTo}
