[action_reclaim]
alwaysSinglePress:true
buildSpeed:1
text:换卡
description:
convertTo:闲置中
iconExtraImage:SHARED:icon_sell_top.png
iconExtraColor:#AAFFFFFF
isVisible: if (self.parent.ammo==0 or self.ammo==3) and self.hasParent
