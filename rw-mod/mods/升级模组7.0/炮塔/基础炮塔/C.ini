canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
maxAttackRange: 290
shootDelay: 85
[movement]
movementType: OVER_CLIFF_WATER
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0
targetHeight: 0
targetHeightDrift: 0
reverseSpeedPercentage:1
maxTurnSpeed: 0.6
turnAcceleration: 0.2
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  45
slowDeathFall: true
[ai]
ai_upgradePriority: 0.2
[attachment_unitSlot1]
@define slotId: 1
x:0
y:60
idleDir:0
idleDirReversing:0
onCreateSpawnUnitOf:NONE
addTransportedUnits: true
setDrawLayerOnTop: true
lockLegMovement:false
canBeAttackedAndDamaged: true
isUnselectable: false
showAllActionsFrom:if self.hasFlag(id=${slotId})
lockRotation: true
createIncompleteIfParentIs: false
[attachment_unitSlot2]
@define slotId: 2
@copyFromSection: attachment_unitSlot1
x:0
y:-60
idleDir:0
idleDirReversing:0
showAllActionsFrom:if self.hasFlag(id=2)
[attachment_unitSlot3]
@define slotId: 3
@copyFromSection: attachment_unitSlot1
x:60
y:0
idleDir:0
idleDirReversing:0
showAllActionsFrom:if self.hasFlag(id=3)
[attachment_unitSlot4]
@define slotId: 4
@copyFromSection: attachment_unitSlot1
x:-60
y:-0
idleDir:0
idleDirReversing:0
showAllActionsFrom:if self.hasFlag(id=4)