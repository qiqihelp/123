[core]
name: 闲置中T5
class: CustomUnitMetadata
price: 1000
tags: modularSpider_emptySlot,ys
copyFrom: baseSlot.ini
showInEditor: false
maxHp: 3000
selfRegenRate:3000
mass: 90000
techLevel: 1
buildSpeed:0.000011111
radius: 20
fogOfWarSightRange:5
transportSlotsNeeded: 1
softCollisionOnAll: 3
