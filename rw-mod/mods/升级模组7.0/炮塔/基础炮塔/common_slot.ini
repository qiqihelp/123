[core]
dont_load:true
class:CustomUnitMetadata
price:1000
disableAllUnitCollisions:true
tags:modularSpider_nonEmptySlot
showInEditor:false
copyFrom:baseSlot.ini
@define baseTags:modularSpider_nonEmptySlot
tags:${baseTags}
maxHp:3000
mass:10000
techLevel:1
buildSpeed:0.0002
radius:15
displayRadius:12
fogOfWarSightRange:5
transportSlotsNeeded:1
isBio:false
softCollisionOnAll:3
showOnMinimap:false
isUnrepairableUnit:true
ignoreInUnitCapCalculation:true
disableDeathOnZeroHp:true
isUnselectable:true
isUnselectableAsTarget:false
selfRegenRate:0.2
selfBuildRate:0.001
[hiddenAction_convertOnDeath]
autoTriggerOnEvent:tookDamage
requireConditional:if self.hp(lessThan=1)
convertTo:闲置中T1
setBuilt:1
alsoTriggerAction: tellChangeToParent
[action_reclaim]
buildSpeed:3s
text:Reclaim Slot
description:-Free up slot for another turret type.\n-Returns ${core.price * 0.5} credits
convertTo:闲置中T1
addResources:${core.price * 0.5}
iconExtraImage:SHARED:icon_sell_top.png
iconExtraColor:#AAFFFFFF
isVisible: if self.completed
alsoTriggerAction: tellChangeToParent
[graphics]
total_frames:1
image:SHARED:blank.png
image_wreak:NONE
image_turret:NONE
image_shadow:AUTO
shadowOffsetX:3
shadowOffsetY:3
teamColorsOnTurret:false
teamColoringMode:disabled
icon_zoomed_out_neverShow:true
[attack]
canAttack:true
canAttackFlyingUnits:false
canAttackLandUnits:true
canAttackUnderwaterUnits:false
turretSize:30
turretTurnSpeed:2
maxAttackRange:290
shootDelay:85
[movement]
movementType:OVER_CLIFF_WATER
moveSpeed:0
moveAccelerationSpeed:0
moveDecelerationSpeed:0
targetHeight:0
targetHeightDrift:0
reverseSpeedPercentage:1
maxTurnSpeed:0
turnAcceleration:0
[hiddenAction_lj]
autoTriggerOnEvent:NONE
autoTrigger:false
[hiddenAction_lj2]
autoTriggerOnEvent:NONE
autoTrigger:false
[hiddenAction_lj3]
autoTriggerOnEvent:NONE
autoTrigger:false
[hiddenAction_运输]
autoTrigger:false
[hiddenAction_空军yd]
autoTrigger:false
[hiddenAction_陆军yd]
autoTrigger:false