[core]
name: 终极闲置中
class: CustomUnitMetadata
price: 1000
tags: modularSpider_emptySlot,ys
copyFrom: baseSlot.ini
showInEditor: false
energyMax:2000
energyRegen:0
energyRegenWhenRecharging:5.1
energyStartingPercentage:0.0005
energyNeedsToRechargeToFull:true
maxHp: 3000
selfRegenRate:3000
mass: 90000
techLevel: 1
buildSpeed: 0.0002
radius: 50
fogOfWarSightRange:5
transportSlotsNeeded: 1
softCollisionOnAll: 3
canNotBeDirectlyAttacked: true
isUnrepairableUnit: true
showOnMinimap: false
ignoreInUnitCapCalculation: true
isUnselectable: false
disableDeathOnZeroHp: true
[template_buildTurret]
text: Add
textAddUnitName: ${section.convertTo}
descriptionAddFromUnit: ${section.convertTo}
descriptionAddUnitStats: ${section.convertTo}
isActive: if self.queueSize(empty=true)
setBuilt:0
buildSpeed: 0s
alsoTriggerAction: tellChangeToParent
[action_ys]
@copyFromSection: template_buildTurret
convertTo: 帝空_G
price: 15000000
[action_buildSmallLaser]
@copyFromSection: template_buildTurret
convertTo: 帝空_F
price: 15000000
[action_cj2]
@copyFromSection: template_buildTurret
convertTo: 帝空_M1
price: 15000000
[action_cj3]
@copyFromSection: template_buildTurret
convertTo: 帝空_M2
price: 15000000
[action_buildGun]
@copyFromSection: template_buildTurret
convertTo: 帝空_LD
price: 15000000
[action_buildLightning]
@copyFromSection: template_buildTurret
convertTo: 帝空_A
price: 15000000
[action_buildArtillery]
@copyFromSection: template_buildTurret
convertTo: 帝空_T
price: 15000000
[action_cj]
@copyFromSection: template_buildTurret
convertTo: 立场
price: 15000000
[action_cj1]
@copyFromSection: template_buildTurret
convertTo: 机库
price: 30000000
[comment_action_buildNano]
@copyFromSection: template_buildTurret
convertTo: modularSpider_nano
price: 501000
[action_buildAntiair]
@copyFromSection:template_buildTurret
iconImage:ROOT:_帝空/_帝空_炮塔/_帝空_主炮/主炮.png
convertTo:帝空_K
price: 300000000
[graphics]
showEnergyBar:false
drawLayer: experimentals
total_frames: 1
image:        SHARED:blank.png
image_wreak:  NONE
image_turret: NONE
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
icon_zoomed_out_neverShow: true
[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
maxAttackRange: 290
shootDelay: 85
[movement]
movementType: OVER_CLIFF_WATER
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0
targetHeight: 0
targetHeightDrift: 0
reverseSpeedPercentage:1
maxTurnSpeed: 0.6
turnAcceleration: 0.2
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  45
slowDeathFall: true
[ai]
ai_upgradePriority: 0.2
[attachment_unitSlot1]
@define slotId: 1
x:0
y:60
idleDir:0
idleDirReversing:0
onCreateSpawnUnitOf:NONE
addTransportedUnits: true
setDrawLayerOnTop: true
lockLegMovement:false
canBeAttackedAndDamaged: true
isUnselectable: false
showAllActionsFrom:if self.hasFlag(id=${slotId})
lockRotation: true
createIncompleteIfParentIs: false
[attachment_unitSlot2]
@define slotId: 2
@copyFromSection: attachment_unitSlot1
x:0
y:-60
idleDir:0
idleDirReversing:0
showAllActionsFrom:if self.hasFlag(id=2)
[attachment_unitSlot3]
@define slotId: 3
@copyFromSection: attachment_unitSlot1
x:60
y:0
idleDir:0
idleDirReversing:0
showAllActionsFrom:if self.hasFlag(id=3)
[attachment_unitSlot4]
@define slotId: 4
@copyFromSection: attachment_unitSlot1
x:-60
y:-0
idleDir:0
idleDirReversing:0
showAllActionsFrom:if self.hasFlag(id=4)