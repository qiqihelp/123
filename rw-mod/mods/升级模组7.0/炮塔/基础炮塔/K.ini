[core]
name: 延伸模块
class: CustomUnitMetadata
isBuilder:true
price: 1000000
tags: modularSpider_emptySlot,modularSpider_nonEmptySlot,ys,ysmk,zysmk
copyFrom: baseSlot.ini
showInEditor: false
selfRegenRate:13
selfBuildRate:0.001
maxHp: 100000
mass: 90000
techLevel: 1
buildSpeed: 0.0002
radius: 20
fogOfWarSightRange:15
transportSlotsNeeded: 1
softCollisionOnAll: 3
canNotBeDirectlyAttacked: false
isUnrepairableUnit: true
showOnMinimap: false
ignoreInUnitCapCalculation: true
isUnselectable: false
maxShield:100000
shieldRegen:6
shieldRenderRadius:30
disableDeathOnZeroHp:true
[hiddenAction_convertOnDeath1]
autoTriggerOnEvent:tookDamage
requireConditional:if self.hp(lessThan=65) and self.hasParent(withTag="ysmk")
convertTo:超级闲置中
setBuilt:1
alsoTriggerAction: tellChangeToParent
[hiddenAction_convertOnDeath2]
autoTrigger:if not self.hasParent(withTag="ysmk")
deleteSelf:true
[graphics]
image_shield:ROOT:/素材/护盾.png
drawLayer: experimentals
total_frames: 1
image:        ROOT:炮塔/炮塔贴图/turret_base3A.png
image_wreak:  NONE
image_turret: NONE
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
icon_zoomed_out_neverShow: true
[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
maxAttackRange: 290
shootDelay: 85
[movement]
movementType: AIR
moveSpeed: 1.5
moveAccelerationSpeed: 0.1
moveDecelerationSpeed: 0.1
targetHeight: 0
targetHeightDrift: 0
reverseSpeedPercentage:1
maxTurnSpeed: 0.6
turnAcceleration: 0.2
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  45
slowDeathFall: true
[ai]
ai_upgradePriority: 0.2
[resource_slotid]
hidden: true
[action_selectSlot1]
@define slotId: 1
buildSpeed: 0s
text: [
textAddUnitName: unitRef self.attachment(slot="unitSlot${slotId}")
textPostFix: ]
descriptionAddFromUnit: unitRef self.attachment(slot="unitSlot${slotId}")
descriptionAddUnitStats: unitRef self.attachment(slot="unitSlot${slotId}")
addResources: unsetFlag=1-10, setFlag=${slotId}
isGuiBlinking: if self.hasFlag(id=${slotId})
displayType: action
unitShownInUI: unitRef self.attachment(slot="unitSlot${slotId}")
iconExtraIsVisible: if self.hasFlag(id=${slotId})
iconExtraImage: ROOT:蜘蛛/icon_selected.png
pos:1
canPlayerCancel: false
allowMultipleInQueue: false
alwaysSinglePress: true
extraLagHidingInUI: true
[action_selectSlot2]
@copyFromSection: action_selectSlot1
@define slotId: 2
[action_selectSlot3]
@copyFromSection: action_selectSlot1
@define slotId: 3
[attachment_unitSlot1]
@define slotId: 1
x:0
y:60
idleDir:0
idleDirReversing:0
onCreateSpawnUnitOf:超级闲置中(addResources=slotid:${slotId})
addTransportedUnits: true
setDrawLayerOnTop: true
lockLegMovement:false
canBeAttackedAndDamaged: true
isUnselectable: false
showAllActionsFrom:if self.hasFlag(id=${slotId})
lockRotation: true
createIncompleteIfParentIs: false
[attachment_unitSlot2]
@define slotId: 2
@copyFromSection: attachment_unitSlot1
x:60
y:0
idleDir:90
idleDirReversing:90
showAllActionsFrom:if self.hasFlag(id=2)
[attachment_unitSlot3]
@define slotId: 3
@copyFromSection: attachment_unitSlot1
x:-60
y:-0
idleDir:-90
idleDirReversing:90
showAllActionsFrom:if self.hasFlag(id=3)
[action_reclaim1]
buildSpeed:3s
text:回收延伸模块
description:-Free up slot for another turret type.\n-Returns ${core.price * 0.5} credits
convertTo:超级闲置中
addResources:${core.price * 0.5}
iconExtraImage:SHARED:icon_sell_top.png
iconExtraColor:#AAFFFFFF
isVisible: if self.completed and self.globalTeamTags(includes="cjzz") and self.numberOfAttachedUnits(withTag='modularSpider_nonEmptySlot',lessThan=1)
attachments_deleteNumUnits:4
[action_护盾升级]
@copyFromSection:action_效率升级
id:${core.price}+4
iconExtraImage:ROOT:素材/护盾K.png
isVisible:if self.globalTeamTags(includes="EW") and self.maxShield()>0
text:升级护盾[%{self.resource.HDDS}]
description:增加基础的2倍
setUnitStats:maxShield=self.maxShield()*(1+2/(2*self.resource.HDDS-1)),shield=self.shield()*(1+2/(2*self.resource.HDDS-1)),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS)
addResourcesWithLogic:HDDS=1
[decal_护盾升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.HDDS>0,1,-1)
isVisible:if self.resource.HDDS!=0
frame:min(select(self.resource.HDDS>0,self.resource.HDDS,int(-self.resource.HDDS/0.08))-1,4)
image:ROOT:素材/护盾升级.png
xOffsetAbsolute:0.1*${core.radius}
imageScale:${core.radius}/110
[resource_HDZ]
hidden:true
[hiddenAction_HD]
autoTrigger:if numberOfUnitsInAllTeams(withTag="ST")<1 and self.resource.stk==0 and self.resource.HDZ!=0 and self.shield<self.maxShield and self.resource.HDDS!=0
addResourcesWithLogic:shield=self.resource.HDZ*self.resource.HDDS*2