[core]
name: 闲置中T2
class: CustomUnitMetadata
price: 1000
tags: modularSpider_emptySlot,ys
showInEditor: false
copyFrom: baseSlot.ini
maxHp: 3000
selfRegenRate:3000
mass: 90000
techLevel: 1
buildSpeed:0.000100000
radius: 20
fogOfWarSightRange:5
transportSlotsNeeded: 1
softCollisionOnAll: 3
canNotBeDirectlyAttacked: true
isUnrepairableUnit: true
showOnMinimap: false
ignoreInUnitCapCalculation: true
isUnselectable: true
disableDeathOnZeroHp: true
[action_change]
autoTrigger:if self.queueSize(empty=true) and self.hasParent(withTag="模块化蜘蛛T3")
isVisible:false
convertTo:闲置中T3
buildSpeed:0s 
alsoTriggerAction: tellChangeToParent
[template_buildTurret]
text: Add
textAddUnitName: ${section.convertTo}
descriptionAddFromUnit: ${section.convertTo}
descriptionAddUnitStats: ${section.convertTo}
isActive: if self.queueSize(empty=true)
setBuilt:0
buildSpeed: 0s
alsoTriggerAction: tellChangeToParent
[action_buildSmallLaser]
@copyFromSection: template_buildTurret
convertTo: 模块离子枪T02
price: 2100
[action_buildGun]
@copyFromSection: template_buildTurret
convertTo: 模块机枪T02
price: 6000
[action_buildLightning]
@copyFromSection: template_buildTurret
convertTo: 模块电击塔T2
price: 18000
[action_buildArtillery]
@copyFromSection: template_buildTurret
convertTo: 模块火炮T2
price: 15000
[comment_action_buildNano]
@copyFromSection: template_buildTurret
convertTo: modularSpider_nano
price: 3000
[action_buildAntiair]
@copyFromSection:template_buildTurret
convertTo:模块防空T2
price:6000
[action_buildFabricator]
@copyFromSection: template_buildTurret
convertTo: 模块资源制造仪T2
price: 9000
[action_buildLaserdefense]
@copyFromSection: template_buildTurret
convertTo: 模块激光拦截T2
price: 9000
[action_buildShieldGen]
@copyFromSection: template_buildTurret
convertTo: 模块护盾恢复T2
price: 18000
[action_buildSpeed]
@copyFromSection: template_buildTurret
convertTo: 速度模块T2K
price: 18000
[action_buildAntinuke]
@copyFromSection: template_buildTurret
convertTo: 模块反核装置T2
price: 21000
[action_buildBlink]
@copyFromSection: template_buildTurret
convertTo: 瞬移模块T2
price: 45000
isLocked:if game.nukesEnabled()
isLockedMessage:核弹模式禁用
[graphics]
drawLayer: experimentals
total_frames: 1
image:        SHARED:blank.png
image_wreak:  NONE
image_turret: NONE
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
icon_zoomed_out_neverShow: true
[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
maxAttackRange: 290
shootDelay: 85
[movement]
movementType: OVER_CLIFF_WATER
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0
targetHeight: 0
targetHeightDrift: 0
reverseSpeedPercentage:1
maxTurnSpeed: 0.6
turnAcceleration: 0.2
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  45
slowDeathFall: true
[ai]
ai_upgradePriority: 0.2