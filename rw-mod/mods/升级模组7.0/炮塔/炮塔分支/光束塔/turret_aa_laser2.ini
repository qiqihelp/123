[core]
name: 脉冲炮T3
class: CustomUnitMetadata
price: 64400
maxHp:18000
mass: 9000
footprint: 0,0,1,1
constructionFootprint:0,0,1,1
buildingToFootprintOffsetX:20
buildingToFootprintOffsetY:20
fogOfWarSightRange:24
techLevel: 1
buildSpeed:0.000088889
radius: 16
buildingSelectionOffset: -8
energyMax: 36
energyRegen: 0.03
energyRegenWhenRecharging: 0.15
energyNeedsToRechargeToFull: true
isBuilding: true
isBio: false
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T4") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 波束炮T1
price:  56000
text: 升级T4
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.001
pos: 0.05
ai_isHighPriority:true
[action_R1]
buildSpeed:1
text:${action_upgradeT2.text}范围开关
setResourcesWithLogic:ammo=1-self.ammo
allowMultipleInQueue:false
alwaysSinglePress:true
highPriorityQueue:true
[decal_R1]
alwaysStartDirAtZero: true
layer: beforeUI
image: ROOT:炮塔/炮塔贴图/ring.png
imageScale: ${attack.maxAttackRange}*1.2/500
onlyWhenSelectedByOwnPlayer:true
isVisible:if self.ammo==1
alpha: 0.4
[graphics]
total_frames: 1
image:        ROOT:/炮塔/炮塔贴图/turret_base3B.png
image_wreak:  ROOT:/炮塔/炮塔贴图/turret_base_dead.png
image_turret: ROOT:/炮塔/炮塔贴图/aa_laser_top2.png
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turretSize: 27
turretTurnSpeed: 6
maxAttackRange: 448
shootDelay: 5
[turret_1]
x: 0
y: 6
canShoot: false
shouldResetTurret: false
idleSpin: 0.5
[turret_2]
x: 5
y: 0
barrelY:16
attachedTo: 1
slave: true
invisible: true
warmup: 0
shoot_light:#42f2f5
energyUsage: 1
[turret_3]
x: 0
y: 0
copyFrom:2
linkDelayWithTurret:2
[turret_4]
x: -5
y: 0
copyFrom:2
linkDelayWithTurret:2
[projectile_beam]
life: 15
instant:true
instantReuseLast: true
instantReuseLast_alsoChangeTurretAim: true
moveWithParent: true
beamImage:      SHARED:beam3.png
beamImageEnd:   SHARED:beam1_end.png
beamImageStart: SHARED:beam1_start.png
beamImageOffsetRate: 2
explodeEffect: NONE
explodeEffectOnShield: NONE
sweepOffsetFromTargetRadius:0.4
sweepSpeed:10
directDamage:72
areaDamage: 72
areaRadius:49
color: #42f2f5
shieldDamageMultiplier: 0.75
[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
[ai]
buildPriority: 0.2
noneInBaseExtraPriority: 0.15
maxEachBase: 5
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.脉冲炮T1>2) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T4") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[hiddenAction_sfk]
deleteSelf:true
autoTrigger:if numberOfUnitsInTeam(withTag='sfk', greaterThan=0)
[hiddenAction_NNHF]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull and not self.isEnergyRecharging
addResourcesWithLogic:energy=${core.energyRegen}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[hiddenAction_NNHF1]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull and self.isEnergyRecharging
addResourcesWithLogic:energy=${core.energyRegenWhenRecharging}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[global_resource_脉冲炮T1]
hidden:true
[ai]
upgradedFrom:脉冲炮T1
[action_能量升级]
@copyFromSection:action_效率升级
id:${core.price}+7
iconExtraImage:ROOT:素材/能量K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级能量[%{self.resource.NNDS}]
description:增加基础的1倍
setUnitStats:maxEnergy=self.maxEnergy*(1+1/self.resource.NNDS),energy=self.energy()*(1+1/self.resource.NNDS)
addResourcesWithLogic:NNDS=1
[decal_能量升级]
alwaysStartDirAtZero:true
imageScaleY:select(self.resource.NNDS>0,1,-1)
total_frames:5
layer:beforeUI
onlyWhileAlive:true
isVisible:if self.resource.NNDS!=0
frame:min(select(self.resource.NNDS>0,self.resource.NNDS,int(-self.resource.NNDS/0.16))-1,4)
image:ROOT:素材/能量.png
xOffsetAbsolute:-0.1*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90