[core]
name: 高射炮T2
class: CustomUnitMetadata
price: 13800
maxHp:4400
mass: 9000
maxShield:1600
shieldRegen:0.5
footprint: 0,0,1,1
constructionFootprint:0,0,1,1
buildingToFootprintOffsetX:20
buildingToFootprintOffsetY:20
fogOfWarSightRange:18
techLevel: 2
buildSpeed:0.0002
radius: 16
buildingSelectionOffset: -8
isBuilding: true
isBio: false
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T3") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 高射炮T3
price:  92000
text: 升级T3
description: 大幅度增强
displayType: Upgrade
buildSpeed: 0.001
pos: 0.05
ai_isHighPriority:true
[action_R1]
buildSpeed:1
text:${action_upgradeT2.text}范围开关
setResourcesWithLogic:ammo=1-self.ammo
allowMultipleInQueue:false
alwaysSinglePress:true
highPriorityQueue:true
[decal_R1]
alwaysStartDirAtZero: true
layer: beforeUI
image: ROOT:炮塔/炮塔贴图/ring.png
imageScale: ${attack.maxAttackRange}*4/1500
onlyWhenSelectedByOwnPlayer:true
isVisible:if self.ammo==1
alpha: 0.4
[graphics]
total_frames: 1
image:        ROOT:/炮塔/炮塔贴图/turret_base2B.png
image_wreak:  ROOT:/炮塔/炮塔贴图/turret_base_dead.png
image_turret: ROOT:/炮塔/炮塔贴图/anti_air_top_flakgun1.png
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turretSize: 27
turretTurnSpeed: 6
maxAttackRange: 240
shootDelay: 240
[turret_1]
x: 0
y: 6
canShoot: false
shouldResetTurret: false
idleSpin: 0.5
recoilOffset: -3
recoilOutTime: 6
recoilReturnTime: 12
[turret_2]
x: 7
y: 14
size: 0
attachedTo: 1
slave: true
invisible: true
warmup: 0
shoot_sound:large_gun_fire2
shoot_sound_vol:0.3
shoot_flame:small
shoot_light:#FFEECCCC
[turret_3]
x: -7
y: 14
copyFrom: 2
linkDelayWithTurret:2
warmup: 55
[turret_4]
x: 0
y: 14
copyFrom: 2
linkDelayWithTurret:2
warmup: 110
[projectile_1]
spawnProjectilesOnCreate:1(recursionLimit=1)
life: 240
speed: 24
trailEffect: true
largeHitEffect: true
frame: 0
areaDamage: 80
areaRadius: 84
autoTargetingOnDeadTarget: true
lightColor: #ffff00
lightSize: 0.4
deflectionPower:1
[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
[ai]
buildPriority: 0.2
noneInBaseExtraPriority: 0.15
maxEachBase: 5
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.高射炮T1>1) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T3") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[hiddenAction_sfk]
deleteSelf:true
autoTrigger:if numberOfUnitsInTeam(withTag='sfk', greaterThan=0)
[global_resource_高射炮T1]
hidden:true
[ai]
upgradedFrom:高射炮T1
[action_护盾升级]
@copyFromSection:action_效率升级
id:${core.price}+4
iconExtraImage:ROOT:素材/护盾K.png
isVisible:if self.globalTeamTags(includes="EW") and self.maxShield()>0
text:升级护盾[%{self.resource.HDDS}]
description:增加基础的2倍
setUnitStats:maxShield=self.maxShield()*(1+2/(2*self.resource.HDDS-1)),shield=self.shield()*(1+2/(2*self.resource.HDDS-1)),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS)
addResourcesWithLogic:HDDS=1
[decal_护盾升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.HDDS>0,1,-1)
isVisible:if self.resource.HDDS!=0
frame:min(select(self.resource.HDDS>0,self.resource.HDDS,int(-self.resource.HDDS/0.08))-1,4)
image:ROOT:素材/护盾升级.png
xOffsetAbsolute:0.1*${core.radius}
imageScale:${core.radius}/110