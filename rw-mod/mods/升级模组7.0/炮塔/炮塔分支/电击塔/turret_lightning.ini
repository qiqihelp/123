[core]
name: 闪电炮塔T1
copyFrom: ROOT:/炮塔/基础炮塔/turret_common_land.ini
displayLocaleKey: 闪电炮塔T1
price: 2700
maxHp: 1500
techLevel: 2
buildSpeed: 0.0008
overrideAndReplace:c_turret_t1_lightning
energyMax:1
startEnergyAtZero:true
energyRegen:0
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 闪电炮塔T2
price:  5400
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
ai_isHighPriority:true
[action_upgrade_gunT1.5]
convertTo: 闪电炮塔T1.5
price:  8000
text: 升级T1.5
description:\n-大幅度增强\n-额外的攻击伤害和范围\n高等级下性价比低\n不建议升级
displayType: Upgrade
buildSpeed: 30.0s
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
[action_R1]
buildSpeed:1
text:${action_upgradeT2.text}范围开关
setResourcesWithLogic:ammo=1-self.ammo
allowMultipleInQueue:false
alwaysSinglePress:true
highPriorityQueue:true
[action_R2]
buildSpeed:1
text:升级T1.5范围开关
setResourcesWithLogic:energy=1-self.energy
allowMultipleInQueue:false
alwaysSinglePress:true
highPriorityQueue:true
[decal_R1]
alwaysStartDirAtZero: true
layer: beforeUI
image: ROOT:炮塔/炮塔贴图/ring.png
imageScale: ${attack.maxAttackRange}*1.2/500
onlyWhenSelectedByOwnPlayer:true
isVisible:if self.ammo==1
alpha: 0.4
[decal_R2]
alwaysStartDirAtZero: true
layer: beforeUI
image: ROOT:炮塔/炮塔贴图/ring.png
imageScale: 0.5
onlyWhenSelectedByOwnPlayer:true
isVisible:if self.energy==1
alpha: 0.4
[comment_action_turnOn]
isVisible: if self.hasFlag(id=0)
text: i2:gui.actions.turnOn
displayType: action
buildSpeed: 0
addResources: unsetFlag=0
isGuiBlinking: true
[comment_action_turnOff]
isVisible: if not self.hasFlag(id=0)
text: i2:gui.actions.turnOff
displayType: action
buildSpeed: 0
addResources: setFlag=0
[graphics]
showEnergyBar:false
total_frames: 1
image:        ROOT:/炮塔/炮塔贴图/turret_base2.png
image_wreak:  ROOT:/炮塔/炮塔贴图/turret_base_dead.png
image_turret: ROOT:/炮塔/炮塔贴图/turret_top_lightning.png
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 20
turretTurnSpeed: 3
maxAttackRange: 210
shootDelay: 2.00s
[turret_1]
canAttackCondition: if not self.hasFlag(id=0)
x: 0
y: 6
image_drawOffsetY:9
idleSpin: 0.8
shoot_sound:lighting_burst
shoot_sound_vol:0.3
shoot_flame:CUSTOM:sparks2*3
shoot_light:#FFcceeee
canShoot: true
warmup:30
chargeEffectImage: SHARED:lighting_charge.png
recoilOffset: -1.5
recoilOutTime: 3
recoilReturnTime: 17
[projectile_1]
directDamage: 150
life: 25
instant: true
lightingEffect: true
largeHitEffect: true
shieldDamageMultiplier: 1
shieldDefectionMultiplier: 0.1
buildingDamageMultiplier: 0.5
explodeEffect:CUSTOM:lightningShock, CUSTOM:sparks*8
explodeEffectOnShield:CUSTOM:lightningShock*1, CUSTOM:hitLightFlash
[effect_hitLightFlash]
priority:high
image: SHARED:light_50.png
life: 17
fadeOut: true
attachedToUnit: false
color: #63e6e8
scaleFrom: 1.8
scaleTo: 1.8
alpha: 0.6
drawUnderUnits:false
[effect_lightningShock]
life: 60
hOffset: 0
dirOffset: 0
fadeInTime: 0
fadeOut: false
attachedToUnit: true
image: SHARED:lightning_shock.png
total_frames: 14
animateFrameStart: 0
animateFrameEnd: 13
animateFramePingPong: false
animateFrameSpeed: 0.5
[effect_sparks]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 1.6
ySpeedRelativeRandom: 1.6
hSpeed: 2
image: SHARED:spark.png
priority: verylow
[effect_sparks2]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: SHARED:spark.png
priority: verylow
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.闪电炮塔T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[global_resource_闪电炮塔T1]
hidden:true
[ai]
upgradedFrom:闪电炮塔T1