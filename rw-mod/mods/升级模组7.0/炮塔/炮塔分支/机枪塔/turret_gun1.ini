[core]
name: 机枪T2
copyFrom: ROOT:/炮塔/基础炮塔/turret_common_land.ini
displayLocaleKey: 机枪T2
price: 4500
maxHp:2200
techLevel: 2
buildSpeed:0.0004
fogOfWarSightRange:18
energyMax:1
startEnergyAtZero:true
energyRegen:0
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T3") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 机枪T3
price:  30000
text: 升级T3
description: 大幅度增强
displayType: Upgrade
buildSpeed: 0.001
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
ai_isHighPriority:true
[action_upgradeT2.5]
convertTo: 机枪T2.5
price:  33000
text: 升级T2.5
description:-额外的攻击伤害和范围\n-大量HP\n-自我修复\n高等级下性价比低\n不建议升级
displayType: Upgrade
buildSpeed: 0.0003
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
[action_R1]
buildSpeed:1
text:${action_upgradeT2.text}范围开关
setResourcesWithLogic:ammo=1-self.ammo
allowMultipleInQueue:false
alwaysSinglePress:true
highPriorityQueue:true
[action_R2]
buildSpeed:1
text:升级T2.5范围开关
setResourcesWithLogic:energy=1-self.energy
allowMultipleInQueue:false
alwaysSinglePress:true
highPriorityQueue:true
[decal_R1]
alwaysStartDirAtZero: true
layer: beforeUI
image: ROOT:炮塔/炮塔贴图/ring.png
imageScale: ${attack.maxAttackRange}*4/1500
onlyWhenSelectedByOwnPlayer:true
isVisible:if self.ammo==1
alpha: 0.4
[decal_R2]
alwaysStartDirAtZero: true
layer: beforeUI
image: ROOT:炮塔/炮塔贴图/ring.png
imageScale: 384/500
onlyWhenSelectedByOwnPlayer:true
isVisible:if self.energy==1
alpha: 0.4
[graphics]
showEnergyBar:false
total_frames: 1
image:        ROOT:炮塔/炮塔贴图/turret_base2.png
image_wreak:  ROOT:炮塔/炮塔贴图/turret_base_dead.png
image_turret: ROOT:炮塔/炮塔贴图/turret_top_l2_1.png
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 22
turretTurnSpeed: 6
maxAttackRange: 222
shootDelay: 20
[turret_1]
x: 0
y: 6
barrelX: -3
barrelOffsetX_onOddShots: 6
shoot_sound:firing3
shoot_sound_vol:0.3
shoot_flame:small
shoot_light:#FFEECCCC
recoilOffset: -0.5
recoilOutTime: 6
recoilReturnTime: 12
idleSweepAngle:20
idleSweepDelay:120
idleSweepSpeed:0.2
[turret_2]
invisible:true
x:0
y:0
barrelX:-3
barrelOffsetX_onOddShots:6
attachedTo:1
copyFrom:1
warmup:10
linkDelayWithTurret:1
[projectile_1]
directDamage: 44
life: 60
speed: 7.2
frame: 5
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.机枪T1>1) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T3") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[global_resource_机枪T1]
hidden:true
[ai]
upgradedFrom:机枪T1