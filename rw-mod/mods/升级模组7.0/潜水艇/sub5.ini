[core]
name: 巨型潜水艇
class: CustomUnitMetadata
price: 386400
maxHp:16900
mass: 8000
maxTransportingUnits:0
techLevel: 1
buildSpeed:0.000015385
availableInDemo: false
fogOfWarSightRange:46
radius: 52
softCollisionOnAll: 26
transportSlotsNeeded: 16
autoTriggerCooldownTime:10
[action_Surface]
pos:0.01
isActive:if self.ammo==0
price:  ammo=-1
text: Surface
buildSpeed: 1
alwaysSinglePress:true
highPriorityQueue:true
setUnitStats:targetHeight=1
[action_dive]
pos:0.01
isActive:if self.ammo==1
price:  ammo=1
text: Dive
buildSpeed: 1
alwaysSinglePress:true
highPriorityQueue:true
setUnitStats:targetHeight=-8
[graphics]
total_frames: 1
image:        attack_submarine5.png
image_wreak:  attack_submarine_dead.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
[attack]
canAttack: true
canAttackFlyingUnits: if self.height>=0
canAttackLandUnits:   true
canAttackUnderwaterUnits: if self.height<0
canAttackNotTouchingWaterUnits:if self.height>=0
turretSize: 20
turretTurnSpeed: 1.5
maxAttackRange: 553
shootDelay: 36
[turret_1]
canAttackCondition:if self.height<0
invisible: true
x: 0
y: 0
idleDir:0
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
canAttackNotTouchingWaterUnits: false
projectile: torpedo
turnSpeed: 0
canAttackMaxAngle: 181
[turret_2]
canAttackCondition:if self.height>=0
x: 0
y: 0
copyFrom:1
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
canAttackNotTouchingWaterUnits:true
shoot_sound:missile_fire
projectile: torpedo1
[projectile_torpedo]
largeHitEffect:true
areaDamage: 546
areaRadius:55
areaRadiusFromEdge:true
life: 300
speed: 3.072
drawSize: 1.5
color: #000084
trailEffect: true
deflectionPower: -1
lightColor:#000084
lightSize:0
autoTargetingOnDeadTarget:true
autoTargetingOnDeadTargetRange:368
[projectile_torpedo1]
largeHitEffect:true
areaDamage: 546
areaRadius:55
areaRadiusFromEdge:true
life: 300
speed: 3.7
targetSpeed: 6.14
targetSpeedAcceleration: 0.05
drawSize: 3
color: #fff7ff1d
trailEffect: true
deflectionPower: 13
lightSize:0.4
ballistic: true
ballistic_delaymove_height:30
ballistic_height: 45
autoTargetingOnDeadTarget:true
autoTargetingOnDeadTargetRange:368
[movement]
startingHeightOffset:1
movementType: WATER
moveSpeed: 1.125
moveAccelerationSpeed: 0.015
moveDecelerationSpeed: 0.05
targetHeight: -8
maxTurnSpeed: 1.5
turnAcceleration: 0.05
heightChangeRate:0.1
fallingAcceleration:0
[ai]
upgradedFrom:潜水艇T1
[hiddenAction_lj]
autoTrigger:false
[hiddenAction_splj]
autoTrigger:false
alsoTriggerAction:lj1k,lj2k,lj3
[hiddenAction_lj1k]
addWaypoint_prepend:true
autoTrigger:if (self.x>3100 and numberOfUnitsInTeam(withTag='标记K',lessThan=1) or (self.x>2100 and self.teamId%2==0 and not self.hasActiveWaypoint(type='attackmove'))) and self.globalTeamTags(includes="yd")
addWaypoint_position_offsetFromSelf:-4000,0
addWaypoint_type:attackmove
autoTriggerOnEvent:newWaypointGivenByPlayer,created
requireConditional:if self.globalTeamTags(includes="yd") and (self.teamId%2==0 or self.x>3100) and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
[hiddenAction_lj2k]
@copyFromSection:hiddenAction_lj1k
autoTrigger:if (self.x<=1100 and numberOfUnitsInTeam(withTag='标记K',lessThan=1) or (self.x<=2100 and self.teamId%2!=0 and not self.hasActiveWaypoint(type='attackmove'))) and self.globalTeamTags(includes="yd")
addWaypoint_position_offsetFromSelf:4000,0
requireConditional:if self.globalTeamTags(includes="yd") and (self.teamId%2!=0 or self.x<=1100) and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_speed]
autoTrigger:if self.height>0 and self.maxMoveSpeed()!=2*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=2*(1+0.2*self.resource.SDDS),maxAttackRange=768*(1+0.1*self.resource.SCDS)
spawnEffects:splash*3,wave
[hiddenAction_speed1]
autoTrigger:if self.height<0 and self.maxMoveSpeed()!=1.125*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=1.125*(1+0.2*self.resource.SDDS),maxAttackRange=553*(1+0.1*self.resource.SCDS)
spawnEffects:splash*3,wave
[effect_wave]
priority:high
delayedStartTimer:15
stripIndex:shockwave
life: 80
scaleFrom: 0.4
scaleTo: 4
alpha: 0.4
xOffsetAbsoluteRandom: 3
yOffsetAbsoluteRandom: 3
attachedToUnit: false
[effect_splash]
life: 80
stripIndex: effects
frameIndex: 13
scaleFrom: 1.8
scaleTo: 2.6
alpha: 1
atmospheric:true
fadeInTime: 3
fadeOut:true
dirOffsetRandom:180
xSpeedAbsoluteRandom: 0.2
ySpeedAbsoluteRandom: 0.2
xOffsetAbsoluteRandom: 30
yOffsetAbsoluteRandom: 30
attachedToUnit: false
drawUnderUnits:false
[hiddenAction_splash]
autoTrigger:if self.speed>0 and self.height>0
spawnEffects:CUSTOM:trailL,CUSTOM:trailR
[effect_trailL]
createWhenZoomedOut: true
priority:critical
life: 60
image: ROOT:/素材/浪.png
scaleFrom: 1.4
scaleTo: 1.4
alpha: 1
xSpeedAbsoluteRandom: 0.01
ySpeedAbsoluteRandom: 0.01
ySpeedRelative:-1
xSpeedRelative:-1
xOffsetRelative:-10
yOffsetRelative:60
attachedToUnit: false
fadeInTime: 0
drawUnderUnits:true
[effect_trailR]
createWhenZoomedOut: true
priority:critical
life: 60
image: ROOT:/素材/浪1.png
scaleFrom: 1.4
scaleTo: 1.4
alpha: 1
