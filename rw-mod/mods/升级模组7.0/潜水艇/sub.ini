[core]
name: 潜水艇T1
class: CustomUnitMetadata
price: 800
maxHp: 260
mass: 2000
maxTransportingUnits:0
techLevel: 1
buildSpeed: 0.001
availableInDemo: false
displayDescription:骚扰性质单位\n不建议主战，不建议出\n临时对空不如导弹舰\nby:猫6203
overrideAndReplace: attackSubmarine
radius: 13
builtFrom_1_name: seaFacTory
builtFrom_1_pos:  6
autoTriggerCooldownTime:10
[action_upgradeT2]
id:1
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 潜水艇T2
price:  1600
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.05
ai_isHighPriority:true
convertTo_keepCurrentFields:targetHeight
[action_Surface]
pos:0.01
isActive:if self.ammo==0
price:  ammo=-1
text: Surface
buildSpeed: 1
alwaysSinglePress:true
highPriorityQueue:true
setUnitStats:targetHeight=1
[action_dive]
pos:0.01
isActive:if self.ammo==1
price:  ammo=1
text: Dive
buildSpeed: 1
alwaysSinglePress:true
highPriorityQueue:true
setUnitStats:targetHeight=-8
[graphics]
total_frames: 1
image:        attack_submarine.png
image_wreak:  attack_submarine_dead.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:0
shadowOffsetY:0
[attack]
canAttack: true
canAttackFlyingUnits: if self.height>=0
canAttackLandUnits:   true
canAttackUnderwaterUnits: if self.height<0
canAttackNotTouchingWaterUnits:if self.height>=0
turretSize: 0
turretTurnSpeed: 1.5
maxAttackRange: 180
shootDelay: 180
[turret_1]
canAttackCondition:if self.height<0
invisible: true
x: 0
y: 0
idleDir:0
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
canAttackNotTouchingWaterUnits: false
projectile: torpedo
turnSpeed: 0
canAttackMaxAngle: 181
[turret_2]
canAttackCondition:if self.height>=0
x: 0
y: 0
copyFrom:1
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
canAttackNotTouchingWaterUnits:true
shoot_sound:missile_fire
projectile: torpedo1
[projectile_torpedo]
directDamage: 42
life: 300
speed: 1
drawSize: 1
color: #000084
trailEffect: true
largeHitEffect: false
deflectionPower: -1
lightColor:#000084
lightSize:0
hitSound:true
[projectile_torpedo1]
directDamage: 42
life: 300
speed: 1.2
targetSpeed: 2.0
targetSpeedAcceleration: 0.05
drawSize: 2
color: #fff7ff1d
trailEffect: true
largeHitEffect: false
deflectionPower: 1
lightSize:0.2
ballistic: true
ballistic_delaymove_height:30
ballistic_height: 45
hitSound:true
[movement]
startingHeightOffset:1
movementType: WATER
moveSpeed: 0.45
moveAccelerationSpeed: 0.015
moveDecelerationSpeed: 0.05
targetHeight: -8
maxTurnSpeed: 1.5
turnAcceleration: 0.05
heightChangeRate:0.1
fallingAcceleration:0
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.潜水艇T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:潜水艇T1
[global_resource_潜水艇T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_speed]
autoTrigger:if self.height>0 and self.maxMoveSpeed()!=0.8*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=0.8*(1+0.2*self.resource.SDDS),maxAttackRange=250*(1+0.1*self.resource.SCDS)
spawnEffects:splash*3,wave
[hiddenAction_speed1]
autoTrigger:if self.height<0 and self.maxMoveSpeed()!=0.45*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=0.45*(1+0.2*self.resource.SDDS),maxAttackRange=180*(1+0.1*self.resource.SCDS)
spawnEffects:splash*3,wave
[effect_wave]
priority:high
delayedStartTimer:15
stripIndex:shockwave
life: 80
scaleFrom: 0.1
scaleTo: 1
alpha: 0.4
xOffsetAbsoluteRandom: 3
yOffsetAbsoluteRandom: 3
attachedToUnit: false
[effect_splash]
life: 80
stripIndex: effects
frameIndex: 13
scaleFrom: 0.9
scaleTo: 1.3
alpha: 1
atmospheric:true
fadeInTime: 3
fadeOut:true
dirOffsetRandom:180
xSpeedAbsoluteRandom: 0.1
ySpeedAbsoluteRandom: 0.1
attachedToUnit: false
drawUnderUnits:false
[hiddenAction_splash]
autoTrigger:if self.speed>0 and self.height>0
spawnEffects:splashk
[effect_splashk]
life: 70
stripIndex: effects
frameIndex: 13
scaleFrom: 0.9
scaleTo: 1.3
alpha: 0.8
atmospheric:true
fadeInTime: 3
fadeOut:true
dirOffsetRandom:180
xSpeedAbsoluteRandom: 0.1
ySpeedAbsoluteRandom: 0.1
ySpeedRelative:-0.2
yOffsetRelative:-12
attachedToUnit: false
drawUnderUnits:true