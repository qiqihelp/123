[core]
name: 帝空_15
class: CustomUnitMetadata
price: 300
maxHp: 170
mass: 3000
showOnMinimap:false
ignoreInUnitCapCalculation:true
techLevel: 1
buildSpeed: 0.005
availableInDemo: true
showInEditor:false
radius: 1
autoTriggerCooldownTime:6
nanoFactorySpeed:100
[hiddenAction_核爆]
autoTriggerOnEvent:destroyed
fireTurretXAtGround:核爆
fireTurretXAtGround_withOffset:0,0
[turret_核爆]
canAttackCondition:if game.nukesEnabled()
x:0
y:0
size:0
shoot_flame:NONE
invisible:true
canShoot:false
projectile:0
altProjectile:0k
altProjectileCondition:if game.nukesEnabled()
[projectile_0]
invisible: true
directDamage: 0
life: 0
speed: 0
deflectionPower:-1
[projectile_0k]
invisible: true
directDamage: 0
life: 0
areaDamage: 65000
areaRadius:200
areaHitUnderwaterAlways:true
areaHitAirAndLandAtSameTime:true
friendlyFire:true
speed: 0
deflectionPower:-1
explodeEffect:震动1,冲击波1,lightB,shockwaveB,shockwaveB1,middlelight,B,B1,projectileTrail1
explodeOnEndOfLife:true
[resource_Dir]
displayName:Dir
hidden:true
[resource_Dir1]
displayName:Dir1
hidden:true
[resource_Dir2]
displayName:Dir2
hidden:true
[action_3]
setResourcesWithLogic:Dir2=self.dir()
[action_2]
autoTrigger:true
text:set
setResourcesWithLogic:Dir1=self.dir()
alsoQueueAction:3
[action_1]
autoTrigger:if self.resource.Dir1-self.resource.Dir2<100 and self.resource.Dir1-self.resource.Dir2>-100
setResourcesWithLogic:Dir=self.resource.Dir1-self.resource.Dir2
[action_4]
autoTrigger:if self.resource.Dir1-self.resource.Dir2>=100 or self.resource.Dir1-self.resource.Dir2<-100
setResourcesWithLogic:Dir=(self.resource.Dir2-self.resource.Dir1)*0.002
[global_resource_pfS]
hidden:true
[decal_尾焰2]
layer:beforeBody
isVisible:true
image: 尾焰.png
imageScale:1
imageScaleY:max(0,select(self.parent.speed==0, -self.resource.Dir*2.5, 1.2*self.parent.speed-self.resource.Dir))
alpha:rnd(0.8,0.9)
xOffsetRelative:-225
yOffsetRelative:180
onlyWhileAlive:true
[decal_1]
isVisible:if self.resource.pfS==0
layer:beforeBody
teamColors:true
image:ROOT:/_帝空/base2.png
