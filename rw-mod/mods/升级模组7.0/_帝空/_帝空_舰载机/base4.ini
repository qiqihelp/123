[core]
name: 尼龙
displayDescription:尼龙。\n帝空的舰载机，升级模组速度最高单位\n对地激光，对空拦截机子弹。\n当然，作为附属单位并没有什么特点（笑\nby威严な大小姐
maxTransportingUnits:0
class: CustomUnitMetadata
price: 1
maxHp: 30000
mass: 12000
selfRegenRate:0.6
generation_resources:ammo=1
tags:尼龙
canNotBeDirectlyAttacked:true
techLevel: 3
disableDeathOnZeroHp:true
canNotBeGivenOrdersByPlayer:true
buildSpeed: 0.00016667
energyMax:180
energyRegen:1
radius: 26
softCollisionOnAll: 26
fogOfWarSightRange: 46
autoTriggerCooldownTime:12
[hiddenAction_dj2]
autoTrigger:false
[action_add]
autoTriggerOnEvent:created
addResources:ammo=99
isVisible:false
[hiddenAction_1]
autoTrigger:if self.ammo(lessThan=101) and not self.hasActiveWaypoint()
addWaypoint_target_fromReference: self.customTarget1
addWaypoint_type:move
addWaypoint_triggerActionIfFailed:5
[hiddenAction_2]
autoTrigger:if self.ammo(greaterThan=100) and not self.hasActiveWaypoint()
addWaypoint_type:move
addWaypoint_target_randomUnit_tagged:标记K
addWaypoint_triggerActionIfFailed:1
[hiddenAction_3]
setResourcesWithLogic:energy=0
autoTrigger:if self.isEnergyFull()
clearAllWaypoints:true
[hiddenAction_5]
autoTrigger:if numberOfUnitsInTeam(withTag='尼龙')>numberOfUnitsInTeam(withTag='帝空')*6+numberOfUnitsInTeam(withTag='机库')*3
deleteSelf:true
[graphics]
icon_zoomed_out_neverShow:true
drawLayer:top
image:        base2.png
image_wreak:  base_dead2.png
image_turret: NONE
lock_body_rotation_with_main_turret: true
teamColorsOnTurret: true
showEnergyBar:false
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
movementEffect: CUSTOM:projectileTrail,CUSTOM:trail1,CUSTOM:trail2
movementEffectRate: 4
[attack]
attackMovement: bomber
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
maxAttackRange: 530
shootDelay: 4
turretRotateWithBody: true
turretMultiTargeting:true
[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
size: 10
turnSpeed: 3.7
turnSpeedAcceleration: 0.5
canShoot: false
[action_preblink]
autoTrigger:if self.ammo(greaterThan=150)
alsoQueueAction:blink
setResourcesWithLogic:ammo=0
[action_blink]
fireTurretXAtGround: blink
fireTurretXAtGround_withProjectile: blink
fireTurretXAtGround_withTarget: self.customTarget1
fireTurretXAtGround_onlyOverPassableTileOf:AIR
whenBuilding_playAnimation: blink
allowMultipleInQueue:false
clearAllWaypoints:true
[turret_blink]
x: 0
y: 0
[projectile_blink]
teleportSource: true
instant: true
directDamage: 0
life: 99999
speed: 10
targetGround: true
deflectionPower:-1
shouldRevealFog:true
explodeEffect: CUSTOM:blinkFlash,CUSTOM:blinkGlow
effectOnCreate: CUSTOM:blinkFlash,CUSTOM:blinkGlow
[effect_blinkFlash]
priority:high
image: SHARED:light_50.png
life: 78
fadeOut: true
attachedToUnit: false
color: #07eef2
scaleFrom: 3.8
scaleTo: 1.0
alpha: 0.8
drawUnderUnits:false
[effect_blinkGlow]
priority:high
image: SHARED:light_50.png
life: 148
fadeOut: true
attachedToUnit: false
color: #07eef2
scaleFrom: 2.8
scaleTo: 5.0
alpha: 0.5
drawUnderUnits:false
[effect_blinkSpark]
priority:high
image: SHARED:light_50.png
life: 18
lifeRandom:5
fadeOut: true
attachedToUnit: false
color: #07eef2
scaleFrom: 0.2
scaleTo: 0.5
alpha: 0.8
drawUnderUnits:false
xOffsetRelativeRandom:30
yOffsetRelativeRandom:30
xSpeedAbsoluteRandom:1.4
ySpeedAbsoluteRandom:1.4
delayedStartTimer:30
delayedStartTimerRandom:30
physics:true
physicsGravity:-0.4
[animation_blink]
effect_0.0s: {x:0, y:0, name:CUSTOM|blinkSpark*3}
effect_0.5s: {x:0, y:0, name:CUSTOM|blinkSpark*5}
effect_1.0s: {x:0, y:0, name:CUSTOM|blinkSpark*10}
effect_1.5s: {x:0, y:0, name:CUSTOM|blinkSpark*16}
[effect_projectileTrail]
createWhenZoomedOut: false
priority:high
image: SHARED:light_50.png
life: 35
fadeOut: true
attachedToUnit: false
color: #63e6e8
fadeInTime:2
scaleFrom:1
scaleTo: 2
alpha: 0.4
yOffsetRelative:-10
drawUnderUnits:false
ySpeedRelative:-0.4
atmospheric: true
[movement]
movementType: AIR
moveSpeed: 6
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0
joinsGroupFormations: false
maxTurnSpeed: 1
turnAcceleration: 0.04
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  -1
slowDeathFall: true
[effect_trail1]
createWhenZoomedOut: false
priority:high
life: 45
image: effect7.png
scaleFrom: 0.7
scaleTo: 1.4
alpha: 0.7
atmospheric:true
xSpeedAbsoluteRandom: 0.1
ySpeedAbsoluteRandom: 0.1
ySpeedRelative:-0.2
xOffsetRelative:45
yOffsetRelative:-10
attachedToUnit: false
fadeInTime: 6
[effect_trail2]
createWhenZoomedOut: false
priority:high
life: 45
image: effect7.png
scaleFrom: 0.7
scaleTo: 1.4
alpha: 0.7
atmospheric:true
xSpeedAbsoluteRandom: 0.1
ySpeedAbsoluteRandom: 0.1
ySpeedRelative:-0.2
xOffsetRelative:-45
yOffsetRelative:-10
attachedToUnit: false
fadeInTime: 6
[attachment_unitSlot1]
isVisible:false
x:0
y:0
idleDir:0
idleDirReversing:0
onCreateSpawnUnitOf:尼龙空
addTransportedUnits: true
setDrawLayerOnTop: true
lockLegMovement:false
canBeAttackedAndDamaged: false
isUnselectable: true
showAllActionsFrom:if self.hasFlag(id=1)
lockRotation: true
createIncompleteIfParentIs: false
redirectDamageToParent: true
redirectDamageToParent_shieldOnly: true
canAttack:true
deattachIfWantingToMove:false
keepAliveWhenParentDies:false
alwaysAllowedToAttackParentsMainTarget:true
[attachment_unitSlot2]
isVisible:false
x:0
y:0
idleDir:0
idleDirReversing:0
onCreateSpawnUnitOf:尼龙地
addTransportedUnits: true
setDrawLayerOnTop: true
lockLegMovement:false
canBeAttackedAndDamaged: false
isUnselectable: true
showAllActionsFrom:if self.hasFlag(id=1)
lockRotation: true
createIncompleteIfParentIs: false
redirectDamageToParent: true
redirectDamageToParent_shieldOnly: true
canAttack:true
deattachIfWantingToMove:false
keepAliveWhenParentDies:false
alwaysAllowedToAttackParentsMainTarget:true
[action_速度升级]
isActive:false
autoTrigger:if self.resource.SDDS<self.customTarget1.resource.SDDS and self.globalTeamTags(includes="EW")
[action_能量升级]
isActive:false
autoTrigger:if self.resource.NNDS<self.customTarget1.resource.NNDS and self.globalTeamTags(includes="EW")
[action_射速升级]
isActive:false
autoTrigger:if self.resource.SSDS<self.customTarget1.resource.SSDS and self.globalTeamTags(includes="EW")
[action_射程升级]
isActive:false
autoTrigger:if self.resource.SCDS<self.customTarget1.resource.SCDS and self.globalTeamTags(includes="EW")
[action_伤害升级]
isActive:false
autoTrigger:if self.resource.SHDS<self.customTarget1.resource.SHDS and self.globalTeamTags(includes="EW")
[hiddenAction_洗点数K]
autoTrigger:if self.globalTeamTags(includes="EW") and (self.resource.DSK==2 or (self.resource.SDDS+self.resource.XLDS+self.resource.SHDS+self.resource.HDDS+self.resource.SCDS+self.resource.SSDS+self.resource.NNDS+self.resource.GCDS>self.customTarget1.resource.SDDS+self.customTarget1.resource.XLDS+self.customTarget1.resource.SHDS+self.customTarget1.resource.HDDS+self.customTarget1.resource.SCDS+self.customTarget1.resource.SSDS+self.customTarget1.resource.NNDS+self.customTarget1.resource.GCDS))
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_dj]
autoTrigger:false