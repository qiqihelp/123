[core]
name: 浅戈地
class: CustomUnitMetadata
price: 0
maxHp: 60000
mass: 1536000
showInEditor: false
techLevel: 3
buildSpeed: 0.00016667
ignoreInUnitCapCalculation:true
radius: 47
fogOfWarSightRange: 46
[graphics]
drawLayer:top
image:        base1.png
image_wreak:  NONE
image_turret: NONE
lock_body_rotation_with_main_turret: true
teamColorsOnTurret: true
movementEffect: CUSTOM:projectileTrail,CUSTOM:trail1,CUSTOM:trail2
movementEffectRate: 4
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
maxAttackRange: 650
shootDelay: 4
turretRotateWithBody: true
turretMultiTargeting:true
[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
size: 10
turnSpeed: 3.7
turnSpeedAcceleration: 0.5
canShoot:false
canAttackFlyingUnits: false
canAttackLandUnits:   true
[turret_2]
x: 0
y: 80
projectile: 1
size: 1
attachedTo: 1
slave: true
turnSpeed: 0
turnSpeedAcceleration: 1
recoilOffset: -1
recoilOutTime: 3
recoilReturnTime: 10
shoot_sound:missile_fire
shoot_sound_vol:0.1
shoot_flame: NONE
delay:16
warmup: 200
warmupCallDownRate: 1
warmupNoReset: true
warmupShootDelayTransfer: 8
canAttackFlyingUnits: false
canAttackLandUnits:   true
[turret_3]
x: 0
y: 80
copyFrom:2
linkDelayWithTurret:2
[effect_projectileTrail]
createWhenZoomedOut: false
priority:high
image: SHARED:light_50.png
life: 80
fadeOut: true
attachedToUnit: false
color: #63e6e8
fadeInTime:2
scaleFrom:2.8
scaleTo: 4.8
alpha: 0.4
drawUnderUnits:true
ySpeedRelative:-0.4
atmospheric: true
[projectile_1]
flameWeapon: true
areaDamage: 1400
areaRadius: 80
drawSize: 0.8
targetGround: true
targetGroundSpread: 20
life: 240
speed: 7.9872
trailEffect: true
largeHitEffect: true
lightColor: #ff0000
lightSize: 0.4
frame: 7
wobbleAmplitude: 0.9
wobbleFrequency: 0.4s
deflectionPower: 16
autoTargetingOnDeadTarget: true
[movement]
movementType: AIR
moveSpeed: 5
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0
joinsGroupFormations: false
maxTurnSpeed: 1
turnAcceleration: 0.04
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  -1
slowDeathFall: true
[effect_trail1]
createWhenZoomedOut: false
priority:high
life: 45
image: effect7.png
scaleFrom: 0.7
scaleTo: 1.4
alpha: 0.7
atmospheric:true
xSpeedAbsoluteRandom: 0.1
ySpeedAbsoluteRandom: 0.1
ySpeedRelative:-0.2
xOffsetRelative:50
yOffsetRelative:-15
attachedToUnit: false
fadeInTime: 6
[effect_trail2]
createWhenZoomedOut: false
priority:high
life: 45
image: effect7.png
scaleFrom: 0.7
scaleTo: 1.4
alpha: 0.7
atmospheric:true
xSpeedAbsoluteRandom: 0.1
ySpeedAbsoluteRandom: 0.1
ySpeedRelative:-0.2
xOffsetRelative:-50
yOffsetRelative:-15
attachedToUnit: false
fadeInTime: 6
[action_速度升级]
autoTrigger:if self.resource.SDDS<self.customTarget1.resource.SDDS and self.globalTeamTags(includes="EW")
[action_能量升级]
autoTrigger:if self.resource.NNDS<self.customTarget1.resource.NNDS and self.globalTeamTags(includes="EW")
[action_射速升级]
autoTrigger:if self.resource.SSDS<self.customTarget1.resource.SSDS and self.globalTeamTags(includes="EW")
[action_射程升级]
autoTrigger:if self.resource.SCDS<self.customTarget1.resource.SCDS and self.globalTeamTags(includes="EW")
[action_伤害升级]
autoTrigger:if self.resource.SHDS<self.customTarget1.resource.SHDS and self.globalTeamTags(includes="EW")
[hiddenAction_洗点数K]
autoTrigger:if self.globalTeamTags(includes="EW") and (self.resource.DSK==2 or (self.resource.SDDS+self.resource.XLDS+self.resource.SHDS+self.resource.HDDS+self.resource.SCDS+self.resource.SSDS+self.resource.NNDS+self.resource.GCDS>self.customTarget1.resource.SDDS+self.customTarget1.resource.XLDS+self.customTarget1.resource.SHDS+self.customTarget1.resource.HDDS+self.customTarget1.resource.SCDS+self.customTarget1.resource.SSDS+self.customTarget1.resource.NNDS+self.customTarget1.resource.GCDS))
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90