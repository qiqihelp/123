[core]
name: 机库
class: CustomUnitMetadata
price: 300
maxHp: 170
mass: 3000
selfBuildRate:0.001
techLevel: 1
buildSpeed: 0.005
availableInDemo: true
disableAllUnitCollisions:true
fogOfWarSightRange: 46
isUnselectableAsTarget:true
canNotBeDirectlyAttacked:true
canNotBeDamaged:true
isUnrepairableUnit:true
isUnselectable:false
showInEditor:false
autoTriggerCooldownTime:120
tags:机库,ys
radius: 50
[hiddenAction_1]
autoTrigger:if self.completed() and self.ammo==0
setResourcesWithLogic:ammo=1
sendMessageTo:parent
sendMessageWithTags:ZJ
[graphics]
image:        base1.png
image_wreak:  NONE
image_turret: NONE
icon_zoomed_out_neverShow:true
[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
turretSize: 0
turretTurnSpeed: 1.8
maxAttackRange: 10
aimOffsetSpread:0
turretMultiTargeting: true
[movement]
movementType: AIR
moveSpeed: 1.5
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.05
reverseSpeedPercentage:0
maxTurnSpeed: 4.1
turnAcceleration: 0.25
[action_reclaim]
buildSpeed:3s
text:Reclaim Slot
description:-Free up slot for another turret type.\n-Returns ${core.price * 0.5} credits
convertTo:终极闲置中
setResourcesWithLogic:ammo=0
addResources:30000000
iconExtraImage:SHARED:icon_sell_top.png
iconExtraColor:#AAFFFFFF
isVisible: if self.completed and self.globalTeamTags(includes="cjdk")
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90