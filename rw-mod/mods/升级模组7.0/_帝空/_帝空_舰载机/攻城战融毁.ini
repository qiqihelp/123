[core]
name: 融毁K
displayDescription:攻城战融毁\n对空对地激光
maxTransportingUnits:0
class: CustomUnitMetadata
price: 8200000
maxHp: 310000
mass: 192000
selfRegenRate:8.6
tags:融毁,ys
techLevel: 3
buildSpeed: 0.00016667
radius: 100
softCollisionOnAll: 50
fogOfWarSightRange: 46
[graphics]
drawLayer:top
image:        base3.png
image_wreak:  base_dead3.png
image_turret: NONE
lock_body_rotation_with_main_turret: true
teamColorsOnTurret: true
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
showEnergyBar:false
movementEffect: CUSTOM:projectileTrail,CUSTOM:trail1,CUSTOM:trail2
movementEffectRate: 4
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
maxAttackRange:614
shootDelay: 4
turretRotateWithBody: true
aimOffsetSpread:0
[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
size: 10
turnSpeed: 2
turnSpeedAcceleration: 1
canShoot: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
[projectile_1]
life: 15
instant:true
instantReuseLast: true
instantReuseLast_alsoChangeTurretAim: true
moveWithParent: true
beamImage:      beam3b.png
beamImageEnd:   beam1b_end.png
beamImageStart: beam1b_start.png
beamImageOffsetRate: 2
explodeEffect: NONE
explodeEffectOnShield: NONE
sweepOffsetFromTargetRadius:0.4
sweepSpeed:10
areaDamage:1100
areaRadius:80
areaRadiusFromEdge:true
color: #FF0000
[effect_projectileTrail]
createWhenZoomedOut: false
priority:high
yOffsetRelative:-90
image: SHARED:light_50.png
life: 50
fadeOut: true
attachedToUnit: false
color:#FF0000
fadeInTime:2
scaleFrom:2
scaleTo: 4
alpha: 0.4
drawUnderUnits:false
ySpeedRelative:-0.4
atmospheric: true
[movement]
movementType: AIR
moveSpeed: 4
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.05
joinsGroupFormations: false
maxTurnSpeed: 3
turnAcceleration: 0.1
moveSlidingMode :false
moveIgnoringBody:false
slowDeathFall: true
[effect_trail1]
createWhenZoomedOut: false
priority:high
life: 60
image: effect7.png
color:#FF0000
scaleFrom: 1.4
scaleTo: 2.8
alpha: 0.7
atmospheric:true
xSpeedAbsoluteRandom: 0.1
ySpeedAbsoluteRandom: 0.1
ySpeedRelative:-0.2
xOffsetRelative:70
yOffsetRelative:-60
attachedToUnit: false
fadeInTime: 6
[effect_trail2]
createWhenZoomedOut: false
priority:high
life: 60
image: effect7.png
color:#FF0000
scaleFrom: 1.4
scaleTo: 2.8
alpha: 0.7
atmospheric:true
xSpeedAbsoluteRandom: 0.1
ySpeedAbsoluteRandom: 0.1
ySpeedRelative:-0.2
xOffsetRelative:-70
yOffsetRelative:-60
attachedToUnit: false
fadeInTime: 6
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_lj]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="ydk") and numberOfUnitsInEnemyTeam(withTag="ct",greaterThan=0)
[hiddenAction_splj]
autoTrigger:if self.hasActiveWaypoint(type='attackmove') and activeWaypointTarget.numberOfUnitsInAllTeams(withinRange=30,withTag='ct')<1 and activeWaypointTarget.isInMap and self.globalTeamTags(includes='yd')
alsoTriggerAction:lj1k,lj2k,lj3
[hiddenAction_lj1]
clearAllWaypoints:true
autoTrigger:if self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1) and activeWaypointTarget.numberOfUnitsInAllTeams(withinRange=30,withTag='ct')<1 and ((self.x>4100-${attack.maxAttackRange} and self.teamId%2!=0) or (self.x<=100+${attack.maxAttackRange} and self.teamId%2==0))
alsoTriggerAction:lj
[hiddenAction_lj1k]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:-4000,0
addWaypoint_type:attackmove
requireConditional:if self.globalTeamTags(includes="yd") and self.teamId%2==0 and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
[hiddenAction_lj2k]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:4000,0
addWaypoint_type:attackmove
requireConditional:if self.globalTeamTags(includes="yd") and self.teamId%2!=0 and numberOfUnitsInTeam(withTag='标记K',lessThan=1)