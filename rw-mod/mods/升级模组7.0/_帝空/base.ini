[core]
name: 帝空
displayText:帝空
displayDescription:帝空。\n-巨大的空天战舰，升级模组的终极单位\n-也是最昂贵的单位（废话\n-最大的特点就是它的一门轨道炮，能够毁灭一切\n-能够瞬间将一切除它之外的单位彻底毁灭，并且毁灭一切被认为坚固的防线\n-装甲和护盾全都是顶尖技术，几乎没有任何升级模组单位和它匹敌\n-但这种巨型战舰的出现极为困难，需要通过信标发信才能抵达战场\n-召唤出时将会全图通告，强调了作为终极单位の威严\n-若是它一旦出现，战局基本已经定下了吧（笑\n-当然，有时会出现多只对轰的情况\n嘛，那样的事怎样都好了~\n-by威严な大小姐\n-部分语句抄自巨屑合金
