explodeEffect:NONE
[projectile_R]
invisible:true
areaDamage: -3500
areaRadius:750
areaRadiusFromEdge:true
areaDamageNoFalloff:true
areaHitUnderwaterAlways:true
life: 1
explodeOnEndOfLife:true
speed: 0
frame: 10
friendlyFire: only-ignoreEnemy
mutatorX_ifUnitWithTags:CJJZ,fs
mutatorX_areaDamageMultiplier:0
drawSize:0.1
deflectionPower:-1
areaHitAirAndLandAtSameTime:true
explodeEffect:Custom:W
[effect_W]
priority:critical
image:离子炮弹爆炸.png
life: 130
alpha: 0.6
scaleFrom: 15
scaleTo: 15
drawUnderUnits:true
dirSpeed:1.5
color: #63e6e8
fadeOut:false
[effect_D]
priority:critical
image: SHARED:light_50.png
life: 40
fadeOut: true
attachedToUnit: true
color: #63e6e8
scaleFrom: 2
scaleTo: 7.5
alpha: 1
drawUnderUnits:false
[effect_lightSlowFade]
priority:veryhigh
image: SHARED:light_50.png
life: 40
fadeOut: true
attachedToUnit: true
color: #63e6e8
scaleFrom: 3
scaleTo: 50
alpha: 1
drawUnderUnits:true
[movement]
movementType: AIR
moveSpeed: 1.5
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.05
reverseSpeedPercentage:0
maxTurnSpeed: 4.1
turnAcceleration: 0.25
[action_reclaim]
buildSpeed:3s
text:Reclaim Slot
description:-Free up slot for another turret type.\n-Returns ${core.price * 0.5} credits
convertTo:终极闲置中
addResources:15000000
iconExtraImage:SHARED:icon_sell_top.png
iconExtraColor:#AAFFFFFF
isVisible: if self.completed and self.globalTeamTags(includes="cjdk")
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90