canAttackLandUnits:   true
canAttackUnderwaterUnits: true
projectile: D
size: 0
delay: 120
turnSpeed: 3.9
turnSpeedAcceleration: 0.2
[turret_2]
invisible: true
x: 0
y: 0
idleDir:0
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
projectile: R
size: 0
delay: 120
turnSpeed: 3.9
turnSpeedAcceleration: 0.2
[projectile_D]
invisible:true
areaDamage: 5000
areaRadius:750
areaRadiusFromEdge:true
areaDamageNoFalloff:true
areaHitUnderwaterAlways:true
life: 1
explodeOnEndOfLife:true
speed: 0
frame: 10
drawSize:1
