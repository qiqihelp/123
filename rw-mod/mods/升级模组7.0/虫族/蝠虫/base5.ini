[core]
name: 剧毒蝠虫
class: CustomUnitMetadata
price: 1690500
maxHp: 130000
mass: 80000
techLevel: 2
buildSpeed:2600s
radius: 64
energyMax: 3
energyRegen: 0.002
energyNeedsToRechargeToFull: true
softCollisionOnAll:48
isBio: true
isBug: true
displayDescription:-重型飞虫单位-\n-只能对陆-\n-喷射硫酸后需要时间装填-\n-----------------------------------------------------\n不俗的血量与速度可以突破防线\n虽然伤害较高但是畏惧人族的激光防御塔
selfRegenRate:6.5
[graphics]
total_frames: 2
image:        蝠虫5.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 4
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 4
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 10
turretTurnSpeed: 9
maxAttackRange: 92
shootDelay: 30
attackMovement: bomber
[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
shoot_sound:ROOT:/虫族/喷射.ogg
shoot_sound_vol:0.2
canAttackMaxAngle:361
projectile: 1
size: 1.1
turnSpeed: 20
energyUsage: 1
[projectile_1]
spawnUnit:毒液T6(offsetHeight=4)
lightColor: #00ff00
lightSize: 0.3
life: 250
speed: 0.92
targetSpeed: 5.2
drawSize: 1
color: #000000
trailEffect: false
directDamage: 0
deflectionPower: 130
[movement]
movementType: AIR
moveSpeed: 4.25
moveAccelerationSpeed: 0.1
moveDecelerationSpeed: 0.1
maxTurnSpeed: 2.8
turnAcceleration: 0.08
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
reverseSpeedPercentage:0
[ai]
upgradedFrom:蝠虫T1
[hiddenAction_NNHF]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull
addResourcesWithLogic:energy=${core.energyRegen}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[action_能量升级]
@copyFromSection:action_效率升级
id:${core.price}+7
iconExtraImage:ROOT:素材/能量K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级能量[%{self.resource.NNDS}]
description:增加基础的1倍
setUnitStats:maxEnergy=self.maxEnergy*(1+1/self.resource.NNDS),energy=self.energy()*(1+1/self.resource.NNDS)
addResourcesWithLogic:NNDS=1
[decal_能量升级]
alwaysStartDirAtZero:true
imageScaleY:select(self.resource.NNDS>0,1,-1)
total_frames:5
layer:beforeUI
onlyWhileAlive:true
isVisible:if self.resource.NNDS!=0
frame:min(select(self.resource.NNDS>0,self.resource.NNDS,int(-self.resource.NNDS/0.16))-1,4)
image:ROOT:素材/能量.png
xOffsetAbsolute:-0.1*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_lj]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="ydk") and numberOfUnitsInEnemyTeam(withTag="ct",greaterThan=0)
[hiddenAction_splj]
autoTrigger:if self.hasActiveWaypoint(type='attackmove') and activeWaypointTarget.numberOfUnitsInAllTeams(withinRange=30,withTag='ct')<1 and activeWaypointTarget.isInMap and self.globalTeamTags(includes='yd')
alsoTriggerAction:lj1k,lj2k,lj3
[hiddenAction_lj1]
clearAllWaypoints:true
autoTrigger:if self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1) and activeWaypointTarget.numberOfUnitsInAllTeams(withinRange=30,withTag='ct')<1 and ((self.x>4100-${attack.maxAttackRange} and self.teamId%2!=0) or (self.x<=100+${attack.maxAttackRange} and self.teamId%2==0))
alsoTriggerAction:lj
[hiddenAction_lj1k]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:-4000,0
addWaypoint_type:attackmove
requireConditional:if self.globalTeamTags(includes="yd") and self.teamId%2==0 and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
[hiddenAction_lj2k]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:4000,0
addWaypoint_type:attackmove
requireConditional:if self.globalTeamTags(includes="yd") and self.teamId%2!=0 and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
[hiddenAction_分裂]
autoTriggerOnEvent:destroyed
requireConditional:if self.globalTeamTags(includes="yd")
spawnUnits:毒浆T2