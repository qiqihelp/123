[core]
name: 猎甲虫T2
class: CustomUnitMetadata
price: 15000
maxHp: 6000
mass: 20000
techLevel: 1
buildSpeed:60.000000000 s
radius: 22
energyMax:900
energyRegen:-1
startEnergyAtZero:true
softCollisionOnAll:24
isBio: true
isBug: true
