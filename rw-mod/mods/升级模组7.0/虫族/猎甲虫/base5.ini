[core]
name: 圣甲虫
class: CustomUnitMetadata
price: 2415000
maxHp: 195000
mass: 80000
techLevel: 1
buildSpeed:1950s
radius: 88
energyMax:900
energyRegen:-1
startEnergyAtZero:true
softCollisionOnAll:96
isBio: true
isBug: true
displayDescription:-虫族六阶重型单位-\n-允许对空中单位发动进攻-\n-可以使用加速让它移动的更快-\n-----------------------------------------------------\n过于昂贵的圣甲虫可能不是前期对抗空军的首选
selfRegenRate:26
fogOfWarSightRange: 46
[action_cc]
buildSpeed:1
isVisible:if self.energy==0
text:冲刺
autoTrigger:if self.energy>0 and self.maxMoveSpeed()<7.5*(1+0.1*self.resource.SDDS)
description:冲刺15s
addActionCooldownTime: 35s
setUnitStats:movespeed=7.5*(1+0.1*self.resource.SDDS)
setResourcesWithLogic:energy=900
highPriorityQueue:true
alwaysSinglePress: true
ai_isHighPriority:true
[action_cc1]
buildSpeed:1
autoTrigger:if self.energy==0 and self.maxMoveSpeed()>3.5*(1+0.1*self.resource.SDDS)
isVisible:false
setUnitStats:movespeed=3.5*(1+0.1*self.resource.SDDS)
highPriorityQueue:true
alwaysSinglePress: true
[graphics]
showShotDelayBar:false
total_frames: 1
image:        base5.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:4
shadowOffsetY:4
lock_body_rotation_with_main_turret: true
lock_leg_rotation_with_main_turret:true
[attack]
isMelee: true
meleeEngangementDistance:768
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turretSize: 40
turretTurnSpeed: 9
maxAttackRange: 60
shootDelay: 30
[turret_1]
x: 0
y: 0
shoot_sound:large_gun_fire2
shoot_sound_vol:0.2
shoot_light:#afafaf
recoilOffset: 2
recoilOutTime: 13
recoilReturnTime: 13
onShoot_playAnimation:attack
canAttackMaxAngle:30
[projectile_1]
life: 50
instant: true
directDamage:5200
areaDamage: 3250
areaRadius: 110
[arm_1]
x:-18
y:52
image_end:tooth_l5.png
image_end_shadow:SHADOW:tooth_l5.png
[arm_2]
x:18
y:52
image_end:tooth_r5.png
image_end_shadow:SHADOW:tooth_r5.png
[arm_3]
x:18
y:0
drawDirOffset:15
image_end:wing_r2.png
drawOverBody:true
image_end_shadow:SHADOW:wing_r2.png
[arm_4]
x:-18
y:0
drawDirOffset:-15
image_end:wing_l2.png
drawOverBody:true
image_end_shadow:SHADOW:wing_l2.png
[animation_attack]
