[core]
name: 虫族抽取器T1
class: CustomUnitMetadata
price: 1200
maxHp: 800
mass: 9000
overrideAndReplace:bugExtractor
generation_credits: 28
generation_delay: 40
tags:kuj,ys
techLevel: 1
buildSpeed: 0.002
radius: 16
isBio: true
isBug: true
isBuilding: true
placeOnlyOnResPool: true
selfRegenRate:0.1
selfBuildRate:0.002
softCollisionOnAll: 3
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T0") and self.resource.等级<2
isLockedMessage:暂未开放等级
convertTo: 虫族抽取器T2
price:  2400
text: 升级T2
description: 经济加成升级为69
displayType: Upgrade
buildSpeed: 0.002
pos: 0.05
ai_isHighPriority:true
[action_explosion]
text:自爆
description:将自身资源抽取器自爆
addResources: hp=-${core.maxHp}
isVisible: if self.teamDefeatedTech()
displayType: action
buildSpeed: 1s
[graphics]
total_frames: 1
image:        bug_extractor.png
image_wreak:  NONE
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 100
animation_idle_scale_start:1
animation_idle_scale_end:1.05
animation_idle_pingPong: true
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turretSize: 20
turretTurnSpeed: 3
maxAttackRange: 210
shootDelay: 80
[projectile_1]
directDamage: 80
life: 70
speed: 5
[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
[ai]
buildPriority: 0.6
noneGlobalExtraPriority: 0.3
maxEachBase: 4
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.isControlledByAI() or self.resource.虫族抽取器>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T0") or self.resource.等级>1)
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:虫族抽取器T1
[global_resource_虫族抽取器]
hidden:true
[global_resource_等级]
hidden:true