[core]
name: 蚁虫T1
class: CustomUnitMetadata
price: 200
maxHp: 48
mass: 200
displayDescription:-虫族一阶轻型单位-\n-可对地对空-\n-用于直接作战的效果往往不合人意-\n-----------------------------------------------------\n廉价的价格造就了它脆弱的身躯\n一般用于 -骚扰- 或者 -信息差突袭- 效果更好
techLevel: 1
buildSpeed: 0.004
radius: 6
displayRadius: 7
isBio: true
isBug: true
selfRegenRate:0.1
softCollisionOnAll: 12
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 蚁虫T2
price:  400
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.05
ai_isHighPriority:true
[graphics]
total_frames: 2
imageScale:0.7
image:        bug_ant.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 2
lock_body_rotation_with_main_turret: true
[attack]
isMelee: true
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 10
turretTurnSpeed: 9
maxAttackRange: 9
shootDelay: 30
[turret_1]
x: 0
y: 0
recoilOffset: 5
recoilOutTime: 13
recoilReturnTime: 13
shoot_sound:bug_attack
shoot_sound_vol:0.2
shoot_flame: smoke
[projectile_1]
directDamage: 12
life: 50
instant: true
[movement]
movementType: AIR
moveSpeed: 1.8
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.07
targetHeight:8
maxTurnSpeed: 5.5
turnAcceleration: 0.5
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
reverseSpeedPercentage:0
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.蚁虫>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:蚁虫T1
[global_resource_蚁虫]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90