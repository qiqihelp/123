[core]
name: 巨型运输虫
class: CustomUnitMetadata
price: 289800
maxHp:29250
mass: 4800
techLevel: 1
buildSpeed:0.000030769
fogOfWarSightRange: 46
radius: 36
displayRadius: 44
isBio: true
isBug: true
