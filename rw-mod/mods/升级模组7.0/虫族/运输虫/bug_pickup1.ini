[core]
name: 运输虫T2
class: CustomUnitMetadata
price: 1800
maxHp:900
mass: 1200
techLevel: 1
buildSpeed:0.001000000
fogOfWarSightRange: 18
radius: 9
displayRadius: 11
isBio: true
isBug: true
selfRegenRate:0.2
tags:SJ
softCollisionOnAll: 12
transportUnitsEachUnitAlwaysUsesSingleSlot:false
transportUnitsRequireTag:ys
transportUnitsRequireMovementType:LAND,HOVER,OVER_CLIFF_WATER,OVER_CLIFF
transportUnitsAddUnloadOption:true
maxTransportingUnits: 4
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T3") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 运输虫T3
price:  12000
text: 升级T3
description: 大幅度增强
displayType: Upgrade
buildSpeed: 0.001
pos: 0.05
ai_isHighPriority:true
[hiddenAction_运输]
autoTrigger:false
temporarilyAddTags:ys
[attachment_sp]
addTransportedUnits: false
[graphics]
showTransportBar:true
total_frames: 2
image:        bug_pickup1.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2
animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 45
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true
[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 18
turretTurnSpeed: 9
maxAttackRange: 170
shootDelay: 70
[turret_1]
x: 0
y: 0
[projectile_1]
directDamage: 25
life: 80
speed: 5
[movement]
movementType: AIR
moveSpeed: 2.16
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12
maxTurnSpeed: 5.5
turnAcceleration: 0.5
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
landOnGround: true
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.运输虫>1) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T3") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:运输虫T1
[global_resource_运输虫]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_运输1]
autoTrigger:false
[hiddenAction_transnum]
autoTriggerOnEvent:transportingNewUnit
addResourcesWithLogic:num=eventSource.resource.tnum
[hiddenAction_transnum1]
autoTriggerOnEvent:transportUnloadedOrRemovedUnit
addResourcesWithLogic:num=-eventSource.resource.tnum
[resource_num]
hidden:true