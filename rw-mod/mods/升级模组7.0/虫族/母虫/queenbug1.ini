life: 250
speed: 0.48
targetSpeed: 1.56
drawSize: 1
color: #00ff00
trailEffect: true
lightColor: #00ff00
lightSize: 0.3
deflectionPower:1.68
[movement]
movementType: HOVER
moveSpeed: 0.6
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12
maxTurnSpeed: 1
