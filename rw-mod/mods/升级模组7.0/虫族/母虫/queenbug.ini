[core]
name: 母虫T1
class: CustomUnitMetadata
price: 5000
maxHp: 900
mass: 1200
techLevel: 1
buildSpeed: 0.0007
nanoFactorySpeed:2
radius: 11
displayRadius: 13
isBio: true
isBug: true
isBuilder: true
selfRegenRate:0.1
nanoRange: 65
canReclaimResources:true
canRepairUnits : true
nanoBuildSpeed: 2
canRepairBuildings: false
nanoRepairSpeed: 0.3
transportUnitsEachUnitAlwaysUsesSingleSlot:false
transportUnitsRequireTag:ys
transportUnitsRequireMovementType:LAND,HOVER,OVER_CLIFF_WATER,OVER_CLIFF
transportUnitsAddUnloadOption:true
tags:SJ
maxTransportingUnits: 1
displayDescription:-虫族一阶辅助型单位-\n-对地对空与反潜艇-\n-拥有多次建造与回收单位能力-\n-----------------------------------------------------\n多数情况用于快速建造虫塔
softCollisionOnAll: 12
generation_credits: 1
generation_delay: 40
[hiddenAction_运输]
autoTrigger:false
temporarilyAddTags:ys
[canBuild_1]
name: reclaim
pos:  -1
[canBuild_2]
name:虫孢T1,bugExtractor,虫族抽取器T2,bugTurret,虫巢T1.5,虫族翼巢T1.5,虫族海巢T1.5,血脏巢T1,bugGenerator,大型虫巢T1,毒浆喷射巢T1,毒粒拦截桶T1
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 母虫T2
price:  10000
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: ${ 0.002 / core.nanoFactorySpeed }
pos: 0.05
ai_isHighPriority:true
[graphics]
showTransportBar:true
teamColoringMode:hueShift
total_frames: 1
splastEffect: true
image:        queenbug.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
lock_body_rotation_with_main_turret: true
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
isFixedFiring: true
turretSize: 15
turretTurnSpeed: 9
maxAttackRange: 170
shootDelay: 60
[turret_1]
x: 0
y: 0
recoilOffset: -3
recoilOutTime: 6
recoilReturnTime: 18
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
shoot_sound:plasma_fire2
shoot_sound_vol:0.4
shoot_flame:NONE
shoot_light:#00FF00
[turret_2]
invisible: true
x: 0
y: 0
idleDir:0
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: true
canAttackCondition: if self.overwater
shoot_sound:plasma_fire2
shoot_sound_vol:0.4
shoot_flame:NONE
shoot_light:#00FF00
projectile: 2
size: 1
turnSpeed: 15
delay: 150
[projectile_1]
directDamage: 25
life: 80
speed: 7
lightColor: #00ff00
lightSize: 0.3
[projectile_2]
directDamage: 40
life: 250
speed: 0.4
targetSpeed: 1.3
drawSize: 1
color: #00ff00
trailEffect: true
lightColor: #00ff00
lightSize: 0.3
[movement]
movementType: HOVER
moveSpeed: 0.5
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12
maxTurnSpeed: 1
turnAcceleration: 0.1
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.母虫>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:母虫T1
[attachment_sp]
addTransportedUnits: false
[global_resource_母虫]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_运输1]
autoTrigger:false
