[core]
name: 大型鲨虫T1
class: CustomUnitMetadata
price: 43000
maxHp: 15000
mass: 12000
techLevel: 1
buildSpeed:0.000112000
radius: 40
displayRadius: 42
isBio: true
isBug: true
tags:cw,ys
transportSlotsNeeded: 4
selfRegenRate:1.25
softCollisionOnAll: 24
fogOfWarSightRange: 29
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T5") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 大型鲨虫T2
price:  40000
text: 升级T5
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.0005
pos: 0.05
ai_isHighPriority:true
[graphics]
splastEffect: true
total_frames: 3
image:        bug_shark3.png
image_wreak:  NONE
image_turret: NONE
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
animation_attack_start: 0
animation_attack_end: 2
animation_attack_speed: 4
animation_attack_scale_start:1
animation_attack_scale_end:1.02
animation_attack_pingPong:true
animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 4
animation_moving_scale_start:1
animation_moving_scale_end:1.02
animation_moving_pingPong:true
animation_idle_start: 0
animation_idle_end: 2
animation_idle_speed: 18
animation_idle_scale_start:1
animation_idle_scale_end:1.02
animation_idle_pingPong:true
lock_body_rotation_with_main_turret: true
[attack]
isMelee: true
meleeEngangementDistance:480
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 40
turretTurnSpeed: 3
maxAttackRange: 30
shootDelay: 30
[turret_1]
x: 0
y: 0
canAttackMaxAngle:30
shoot_sound:large_gun_fire2
shoot_sound_vol:0.2
recoilOffset: 3
recoilOutTime: 6
recoilReturnTime: 18
[projectile_1]
areaDamage: 625
areaRadius:35
areaRadiusFromEdge:true
life: 50
instant: true
targetGround:true
targetGroundSpread:0
[movement]
movementType: WATER
moveSpeed: 2.16
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.07
maxTurnSpeed: 3
turnAcceleration: 0.5
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
reverseSpeedPercentage:0
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.鲨虫>3) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T5") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:鲨虫T1
[global_resource_鲨虫]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90