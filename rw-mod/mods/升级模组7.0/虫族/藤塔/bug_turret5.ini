[core]
name: 巨型藤塔
class: CustomUnitMetadata
price: 2898000
maxHp:130000
mass: 9000
techLevel: 1
buildSpeed:0.000030769
fogOfWarSightRange: 46
radius: 32
isBio: true
isBug: true
isBuilding: true
selfRegenRate:6.5
selfBuildRate:0.001
softCollisionOnAll: 12
energyMax: 12
energyRegen: 0.01
energyRegenWhenRecharging: 0.05
energyNeedsToRechargeToFull: true
footprint: -1,-1,1,1
constructionFootprint:-1,-1,1,1
[action_休眠]
buildSpeed:1
alwaysSinglePress:true
highPriorityQueue:true
isVisible:if self.ammo==0
text:休眠
setResourcesWithLogic:ammo=1
[action_唤醒]
buildSpeed:1
alwaysSinglePress:true
highPriorityQueue:true
isVisible:if self.ammo==1
text:唤醒
setResourcesWithLogic:ammo=0
[graphics]
imageScale:0.8
total_frames: 1
image:        bug_turret5.png
image_wreak:  NONE
image_shadow: SHADOW:ROOT:虫族/影.png
shadowOffsetX:20
shadowOffsetY:1
animation_idle_blendIn: 1s
animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 75
animation_idle_scale_start:1
animation_idle_scale_end:1.05
animation_idle_pingPong: true
animation_attack_scale_start:1
animation_attack_scale_end:1.05
animation_attack_pingPong: true
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 2
turretTurnSpeed: 3
maxAttackRange: 860
shootDelay: 6
aimOffsetSpread:0
[turret_1]
x: 0
y: 20
canAttackCondition:if self.ammo==0
canAttackMaxAngle:361
shoot_light:#FF00CCCC
energyUsage: 0.25
projectile:1
[projectile_1]
drawSize:1.25
beamImage: t1.png
beamImageEnd: j1.png
beamImageStart: j1.png
directDamage: 325
teamColorRatio:0.6
life: 70
instant:true
instantReuseLast:true
pushVelocity:-5
[animation_build]
onActions: underConstructionWithLinkedBuiltTime
blendOut: 2s
body_0: {scale:0}
body_1: {scale:1.2}
[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
[ai]
buildPriority: 0.2
noneInBaseExtraPriority: 0.15
maxEachBase: 5
[ai]
upgradedFrom:藤塔T1
[hiddenAction_NNHF]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull and not self.isEnergyRecharging
addResourcesWithLogic:energy=${core.energyRegen}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[hiddenAction_NNHF1]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull and self.isEnergyRecharging
addResourcesWithLogic:energy=${core.energyRegenWhenRecharging}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[action_能量升级]
@copyFromSection:action_效率升级
id:${core.price}+7
iconExtraImage:ROOT:素材/能量K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级能量[%{self.resource.NNDS}]
description:增加基础的1倍
setUnitStats:maxEnergy=self.maxEnergy*(1+1/self.resource.NNDS),energy=self.energy()*(1+1/self.resource.NNDS)
addResourcesWithLogic:NNDS=1
[decal_能量升级]
alwaysStartDirAtZero:true
imageScaleY:select(self.resource.NNDS>0,1,-1)
total_frames:5
layer:beforeUI
onlyWhileAlive:true
isVisible:if self.resource.NNDS!=0
frame:min(select(self.resource.NNDS>0,self.resource.NNDS,int(-self.resource.NNDS/0.16))-1,4)
image:ROOT:素材/能量.png
xOffsetAbsolute:-0.1*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90