[core]
name: 瓢虫T3
class: CustomUnitMetadata
price: 9200
maxHp:1170
mass: 500
techLevel: 1
buildSpeed:0.000277778
fogOfWarSightRange: 24
radius: 6
displayRadius: 8
isBio: true
isBug: true
transportSlotsNeeded:3
numBitsOnDeath: 5
softCollisionOnAll: 12
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T4") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 颚虫T1
price:  8000
text: 升级T4
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.001
pos: 0.05
ai_isHighPriority:true
[graphics]
total_frames: 3
image:        ladybug2.png
image_wreak:  NONE
image_turret: NONE
image_offsetX:0
image_shadow: NONE
shadowOffsetX:0
shadowOffsetY:0
animation_moving_start: 1
animation_moving_end: 1
animation_moving_speed: 3
animation_attack_start: 2
animation_attack_end: 2
animation_attack_speed: 40
lock_body_rotation_with_main_turret: true
[attack]
meleeEngangementDistance:400
isMelee: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 20
turretTurnSpeed: 3
aimOffsetSpread:0
maxAttackRange: 30
shootDelay: 10.88
[turret_1]
x: 0
y: 0
shoot_sound:bug_attack
shoot_sound_vol:0.2
recoilOffset: 0
recoilOutTime: 6
recoilReturnTime: 18
[projectile_1]
directDamage: 86
life: 50
instant: true
explodeEffect:NONE
[movement]
movementType: LAND
moveSpeed:2.55
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12
maxTurnSpeed: 8.5
turnAcceleration: 0.5
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
reverseSpeedPercentage:0
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.瓢虫>2) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T4") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:瓢虫T1
[global_resource_瓢虫]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90