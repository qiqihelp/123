[core]
name: 螈虫T3
class: CustomUnitMetadata
price: 16100
maxHp: 4050
mass: 12000
displayDescription:可运载单位从水下通过
techLevel: 2
buildSpeed:45s
radius: 14
displayRadius: 14
isBio: true
isBug: true
fogOfWarSightRange: 24
selfRegenRate:0.9
softCollisionOnAll: 7
transportUnitsEachUnitAlwaysUsesSingleSlot:false
transportUnitsRequireTag:ys
transportUnitsRequireMovementType:LAND,HOVER,OVER_CLIFF_WATER,OVER_CLIFF
transportUnitsAddUnloadOption:true
maxTransportingUnits: 9
tags:SJ
[hiddenAction_运输]
autoTrigger:false
temporarilyAddTags:ys
[hiddenAction_trigger_onWater]
autoTrigger: if self.overWater() and self.maxMoveSpeed!=2.1*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=2.1*(1+0.2*self.resource.SDDS),targetHeight=-4
[hiddenAction_trigger_onLand]
autoTrigger: if not self.overWater() and self.maxMoveSpeed!=1.2*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=1.2*(1+0.2*self.resource.SDDS),targetHeight=0
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T4") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 大型螈虫T1
price:  14000
text: 升级T4
description:中幅度增强
displayType: Upgrade
buildSpeed: 0.001
pos: 0.2
ai_isHighPriority:true
[graphics]
image:        base2.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
splastEffect: true
lock_body_rotation_with_main_turret: true
animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 80
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true
animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 40
animation_moving_scale_start:1
animation_moving_scale_end:1.03
animation_moving_pingPong: true
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
[leg_1]
x: -12
y: 2
attach_x: 0
attach_y: 0
moveSpeed: 4.5
resetAngle:0
heightSpeed: 0.8
image_leg:leg.png
image_foot: NONE
drawLegWhenZoomedOut: true
dust_effect: false
holdDisMin: 4
holdDisMax: 16
[leg_2]
x: 12
y: 2
attach_x: 0
attach_y: 0
copyFrom: 1
[leg_3]
x: -12
y: -12
attach_x: 0
attach_y: -8
copyFrom: 1
[leg_4]
x: 12
y: -12
attach_x: 0
attach_y: -8
copyFrom: 1
[movement]
movementType: HOVER
moveSpeed: 1.2
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.12
targetHeight:0
maxTurnSpeed: 2.5
turnAcceleration: 0.5
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.螈虫>2) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T4") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:螈虫T1
[attachment_sp]
addTransportedUnits: false
[global_resource_螈虫]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[decal_tk]
isVisible:if self.resource.num>0
alwaysStartDirAtZero:true
layer:beforeUI
image: ROOT:运输机/t1.png
imageScaleX:0.6
imageScaleY:0.6
xOffsetAbsolute:-30
yOffsetAbsolute:23
onlyWhileAlive:true
[decal_tk1]
isVisible:if self.resource.num>1
@copyFromSection:decal_tk
xOffsetAbsolute:-23
[decal_tk2]
isVisible:if self.resource.num>2
@copyFromSection:decal_tk
xOffsetAbsolute:-17
[decal_tk3]
isVisible:if self.resource.num>3
@copyFromSection:decal_tk
xOffsetAbsolute:-10
[decal_tk4]
isVisible:if self.resource.num>4
@copyFromSection:decal_tk
xOffsetAbsolute:-4
[decal_tk5]
isVisible:if self.resource.num>5
@copyFromSection:decal_tk
xOffsetAbsolute:3
[decal_tk6]
isVisible:if self.resource.num>6
@copyFromSection:decal_tk
xOffsetAbsolute:10
[decal_tk7]
isVisible:if self.resource.num>7
@copyFromSection:decal_tk
xOffsetAbsolute:16
[decal_tk8]
isVisible:if self.resource.num>8
@copyFromSection:decal_tk
xOffsetAbsolute:23
[decal_t]
xOffsetAbsolute:-17.5
alwaysStartDirAtZero:true
layer:beforeUI
image: ROOT:运输机/t.png
imageScaleX:0.6
imageScaleY:0.6
alpha:0.8
yOffsetAbsolute:23
onlyWhileAlive:true
[decal_t1]
@copyFromSection:decal_t
xOffsetAbsolute:2
[decal_t2]
@copyFromSection:decal_t
xOffsetAbsolute:15.5
[hiddenAction_transnum]
autoTriggerOnEvent:transportingNewUnit
addResourcesWithLogic:num=eventSource.resource.tnum
[hiddenAction_transnum1]
autoTriggerOnEvent:transportUnloadedOrRemovedUnit
addResourcesWithLogic:num=-eventSource.resource.tnum
[resource_num]
hidden:true
[hiddenAction_运输1]
autoTrigger:false
