[core]
name: 巨型螈虫
class: CustomUnitMetadata
price: 338100
maxHp: 29250
mass: 48000
displayDescription:可运载单位从水下通过
techLevel: 2
buildSpeed:325s
radius: 56
displayRadius: 56
isBio: true
isBug: true
fogOfWarSightRange: 46
selfRegenRate:6.5
softCollisionOnAll: 28
transportUnitsEachUnitAlwaysUsesSingleSlot:false
transportUnitsRequireTag:ys
transportUnitsRequireMovementType:LAND,HOVER,OVER_CLIFF_WATER,OVER_CLIFF
transportUnitsAddUnloadOption:true
maxTransportingUnits: 48
tags:SJ
[hiddenAction_运输]
autoTrigger:false
temporarilyAddTags:ys
[hiddenAction_trigger_onWater]
autoTrigger: if self.overWater() and self.maxMoveSpeed!=3.5*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=3.5*(1+0.2*self.resource.SDDS),targetHeight=-4
[hiddenAction_trigger_onLand]
autoTrigger: if not self.overWater() and self.maxMoveSpeed!=2*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=2*(1+0.2*self.resource.SDDS),targetHeight=0
[graphics]
image:        base5.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:4
shadowOffsetY:4
splastEffect: true
lock_body_rotation_with_main_turret: true
animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 80
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true
animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 40
animation_moving_scale_start:1
animation_moving_scale_end:1.03
animation_moving_pingPong: true
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
[leg_1]
x: -48
y: 8
attach_x: 0
attach_y: 0
moveSpeed: 7.5
resetAngle:0
heightSpeed: 0.8
image_leg:leg2.png
image_foot: NONE
drawLegWhenZoomedOut: true
dust_effect: false
holdDisMin: 4
holdDisMax: 64
[leg_2]
x: 48
y: 8
attach_x: 0
attach_y: 0
copyFrom: 1
[leg_3]
x: -48
y: -48
attach_x: 0
attach_y: -32
copyFrom: 1
[leg_4]
x: 48
y: -48
attach_x: 0
attach_y: -32
copyFrom: 1
[movement]
movementType: OVER_CLIFF_WATER
moveSpeed: 2
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.12
targetHeight:0
maxTurnSpeed: 2.5
turnAcceleration: 0.5
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
[ai]
upgradedFrom:螈虫T1
[attachment_sp]
addTransportedUnits: false
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[decal_tk]
alwaysStartDirAtZero:true
layer:beforeUI
image: ROOT:运输机/t1.png
imageScaleX:min(self.resource.num/4,1)
imageScaleY:1
xOffsetAbsolute:-65
yOffsetAbsolute:66
onlyWhileAlive:true
[decal_tk1]
@copyFromSection:decal_tk
imageScaleX:max(0,min((self.resource.num-4)/4,1))
xOffsetAbsolute:-54
[decal_tk2]
@copyFromSection:decal_tk
imageScaleX:max(0,min((self.resource.num-8)/4,1))
xOffsetAbsolute:-43
