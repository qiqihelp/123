[core]
name: 巨型虫蜂
class: CustomUnitMetadata
price: 386400
maxHp:16250
mass: 4800
techLevel: 1
buildSpeed:0.000021538
radius: 36
displayRadius: 44
isBio: true
isBug: true
fogOfWarSightRange: 46
selfRegenRate:6.5
softCollisionOnAll: 48
[graphics]
teamColoringMode:hueShift
total_frames: 2
image:        bug_wasp5.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:4
shadowOffsetY:4
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 2
lock_body_rotation_with_main_turret: true
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 40
turretTurnSpeed: 9
maxAttackRange: 521
shootDelay: 14
[turret_1]
x: 0
y: 0
recoilOffset: -5
recoilOutTime: 13
recoilReturnTime: 13
shoot_sound:ROOT:/虫族/喷射.ogg
shoot_sound_vol:0.1
shoot_flame: smoke
[projectile_1]
directDamage: 349
life: 80
speed: 21
deflectionPower:13
color: #00ff00
drawSize: 2.5
lightColor: #00ff00
lightSize: 0.3
[movement]
movementType: AIR
moveSpeed:4.75
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.07
maxTurnSpeed: 5.5
turnAcceleration: 0.5
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
reverseSpeedPercentage:0
[ai]
upgradedFrom:虫蜂T1
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_lj]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="ydk") and numberOfUnitsInEnemyTeam(withTag="ct",greaterThan=0)
[hiddenAction_splj]
autoTrigger:if self.hasActiveWaypoint(type='attackmove') and activeWaypointTarget.numberOfUnitsInAllTeams(withinRange=30,withTag='ct')<1 and activeWaypointTarget.isInMap and self.globalTeamTags(includes='yd')
alsoTriggerAction:lj1k,lj2k,lj3
[hiddenAction_lj1]
clearAllWaypoints:true
autoTrigger:if self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1) and activeWaypointTarget.numberOfUnitsInAllTeams(withinRange=30,withTag='ct')<1 and ((self.x>4100-${attack.maxAttackRange} and self.teamId%2!=0) or (self.x<=100+${attack.maxAttackRange} and self.teamId%2==0))
alsoTriggerAction:lj
[hiddenAction_lj1k]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:-4000,0
addWaypoint_type:attackmove
requireConditional:if self.globalTeamTags(includes="yd") and self.teamId%2==0 and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
[hiddenAction_lj2k]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:4000,0
addWaypoint_type:attackmove
requireConditional:if self.globalTeamTags(includes="yd") and self.teamId%2!=0 and numberOfUnitsInTeam(withTag='标记K',lessThan=1)