[core]
name: 巨爆虫T2
class: CustomUnitMetadata
price: 58100
maxHp:3600
mass: 1000
techLevel: 1
buildSpeed:0.000055556
radius: 16
displayRadius: 20
isBio: true
isBug: true
fogOfWarSightRange: 35
selfRegenRate:1.8
softCollisionOnAll: 24
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T6") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 核爆虫
price:  280000
text: 升级T6
description: 大幅度增强
displayType: Upgrade
buildSpeed: 0.00025
pos: 0.05
ai_isHighPriority:true
[action_explode]
displayType: action
fireTurretXAtGround: 1
fireTurretXAtGround_withOffset: 0,0
fireTurretXAtGround_withProjectile: explodeArea2
price:  0
text: Explode
buildSpeed: 1s
addResources: hp:-6000
[graphics]
teamColoringMode:hueShift
total_frames: 2
image:        bug_bee4.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 2
[attack]
meleeEngangementDistance:576
isMelee: true
dieOnAttack: true
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 20
turretTurnSpeed: 3
maxAttackRange: 21
shootDelay: 30
[turret_1]
canAttackCondition:if self.resource.BF==0
x:0
y:0
canAttackFlyingUnits: true
canAttackLandUnits:   false
projectile:explodeArea2
[turret_2]
canAttackCondition:if self.resource.BF==0
x:0
y:0
canAttackFlyingUnits: false
canAttackLandUnits:   true
projectile:explodeArea1
[projectile_explodeArea2]
areaDamage: 3600
areaRadius: 230
life: 50
instant: true
explodeEffect:1
explodeEffectOnShield:1
[projectile_explodeArea1]
areaDamage: 3600
areaRadius: 230
life: 50
instant: true
targetGround:true
explodeEffect:1
explodeEffectOnShield:1
[effect_1]
life:90
scaleFrom:7
scaleTo:7
image:ROOT:/特效集/explosion.png
total_frames:14
animateFrameStart:0
animateFrameEnd:13
animateFrameSpeed:0.3
xOffsetRelativeRandom:0
yOffsetRelativeRandom:0
showInFog:true
priority:critical
alsoPlaySound:nuke_explode
[movement]
movementType: AIR
moveSpeed:2.7300000000000004
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12
targetHeight: 13
targetHeightDrift: 3
maxTurnSpeed: 6.5
turnAcceleration: 0.4
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.自爆虫>4) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T6") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:自爆虫T1
[global_resource_自爆虫]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_lj]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="ydk") and numberOfUnitsInEnemyTeam(withTag="ct",greaterThan=0)
[hiddenAction_splj]
autoTrigger:if self.hasActiveWaypoint(type='attackmove') and activeWaypointTarget.numberOfUnitsInAllTeams(withinRange=30,withTag='ct')<1 and activeWaypointTarget.isInMap and self.globalTeamTags(includes='yd')
alsoTriggerAction:lj1k,lj2k,lj3
[hiddenAction_lj1]
clearAllWaypoints:true
autoTrigger:if self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1) and activeWaypointTarget.numberOfUnitsInAllTeams(withinRange=30,withTag='ct')<1 and ((self.x>4100-${attack.maxAttackRange} and self.teamId%2!=0) or (self.x<=100+${attack.maxAttackRange} and self.teamId%2==0))
alsoTriggerAction:lj
[hiddenAction_lj1k]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:-4000,0
addWaypoint_type:attackmove
requireConditional:if self.globalTeamTags(includes="yd") and self.teamId%2==0 and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
[hiddenAction_lj2k]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="yd") and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:4000,0
addWaypoint_type:attackmove
requireConditional:if self.globalTeamTags(includes="yd") and self.teamId%2!=0 and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
