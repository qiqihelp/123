class: CustomUnitMetadata
price: 1932000
maxHp: 130000
mass: 48000
displayDescription:-虫族六阶重型单位-\n-只能攻击地面单位-\n-对静止不动的单位造成大量额外伤害-\n-----------------------------------------------------\n用于正面作战不太划算
techLevel: 2
buildSpeed:1514.5s
transportSlotsNeeded:16
radius: 68
