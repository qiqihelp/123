[core]
name: 大型黾虫T1
class: CustomUnitMetadata
price:12900
maxHp:2000
mass: 1000
displayDescription:水陆通用版虫孢\n进化出了能在水面快速奔跑的纤细肢体解决了水面不能行走的问题\n并且这玩意还能上岸\n但是造价是虫孢的三倍\n自我修复\n最强单位虫族海上版
techLevel: 1
buildSpeed:0.000200000
radius: 16
displayRadius: 20
isBio: true
isBug: true
selfRegenRate:1.25
tags:chb,ys
transportSlotsNeeded:4
softCollisionOnAll: 24
fogOfWarSightRange: 29
dieOnConstruct: true
nanoRange: 23
canBuild_1_name: 虫族抽取器T4
canBuild_1_pos:  1
canBuild_2_name: 虫巢T4
canBuild_2_pos:  2
canBuild_3_name: 虫族制造仪T4
canBuild_3_pos:  3
canBuild_4_name: 大型虫塔T1
canBuild_4_pos:  1.5
canBuild_6_name: 虫族翼巢T4
canBuild_6_pos:  2.1
canBuild_7_name: 虫族海巢T4
canBuild_7_pos:  2.2
canBuild_8_name: 大型血脏巢T1
canBuild_8_pos:  2.3
canBuild_10_name: 虫族抽取器T3
canBuild_10_pos:  10
canBuild_12_name: 虫巢T3
canBuild_12_pos:  20
canBuild_13_name:虫族制造仪T3
canBuild_13_pos:  3
canBuild_14_name: 虫塔T3
canBuild_14_pos:  10.5
canBuild_16_name: 虫族翼巢T3
canBuild_16_pos:  20.1
canBuild_17_name: 虫族海巢T3
canBuild_17_pos:  20.2
canBuild_18_name: 血脏巢T3
canBuild_18_pos:  20.3
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T5") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 大型黾虫T2
price:  12000
text: 升级T5
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.0005
pos: 0.05
[graphics]
total_frames: 3
image:        base3.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 2
animation_moving_scale_start:1
animation_moving_scale_end:1.02
animation_moving_pingPong:true
animation_idle_start: 0
animation_idle_end: 0
animation_idle_scale_start:1
animation_idle_scale_end:1.02
[attack]
isMelee: true
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 20
turretTurnSpeed: 3
maxAttackRange: 9
shootDelay: 30
[projectile_1]
directDamage: 23
life: 50
instant: true
[movement]
movementType: HOVER
moveSpeed:2.52
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12
maxTurnSpeed: 6.5
turnAcceleration: 0.4
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
reverseSpeedPercentage:0
[ai]
useAsBuilder: true
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.黾虫>3) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T5") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:黾虫T1
[hiddenAction_sp]
autoTrigger:if numberOfUnitsInTeam(withTag='cb', lessThan=1)
spawnUnits:虫族面板
[global_resource_黾虫]
hidden:true
[hiddenAction_检测]
autoTriggerOnEvent: newWaypointGivenByPlayer
requireConditional: if self.hasActiveWaypoint(type='build')
takeResources_includeUnitsWithinRange: 1000
takeResources_excludeUnitsWithoutTags: chb
takeResources_includeUnitsWithinRange_team: own
takeResources_triggerActionForEach: 优化
takeResources_searchOnly: true
[hiddenAction_优化]
requireConditional: if thisActionTarget!=self and distanceBetween(thisActionTarget.activeWaypointTarget, self.activeWaypointTarget)<1 and thisActionTarget.self.hasActiveWaypoint(type='build')
clearActiveWaypoint: true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90