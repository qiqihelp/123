[core]
name: 豚虫T1
class: CustomUnitMetadata
price: 2000
maxHp: 1000
mass: 6000
displayDescription:一种远程的水上喷射虫，使用射弹攻击\n造价较高，并且仅对地\n继承了虫族的较大射程，但是没战列舰舰远\n伤害与导弹舰差不多，但是子弹效果比其好\n虽然不能反潜，但拥有较快的移速，能快速远离潜艇\n自我修复
techLevel: 1
buildSpeed: 0.001
radius: 20
displayRadius: 21
isBio: true
isBug: true
selfRegenRate:0.1
softCollisionOnAll: 12
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 豚虫T2
price:  4000
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.05
ai_isHighPriority:true
[graphics]
splastEffect: true
total_frames: 2
image:        base.png
image_wreak:  NONE
image_turret: NONE
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
animation_attack_start: 0
animation_attack_end: 1
animation_attack_speed: 6
animation_attack_scale_start:1
animation_attack_scale_end:1.02
animation_attack_pingPong:true
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 6
animation_moving_scale_start:1
animation_moving_scale_end:1.02
animation_moving_pingPong:true
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 27
animation_idle_scale_start:1
animation_idle_scale_end:1.02
animation_idle_pingPong:true
lock_body_rotation_with_main_turret: true
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 40
turretTurnSpeed: 3
maxAttackRange: 220
shootDelay: 60
[turret_1]
x: 0
y: 0
shoot_sound:ROOT:/虫族/喷射.ogg
shoot_sound_vol:0.1
recoilOffset: -3
recoilOutTime: 6
recoilReturnTime: 18
shoot_light:#FF00CCCC
[projectile_1]
directDamage: 60
life: 160
speed: 6
frame: 6
[movement]
movementType: WATER
moveSpeed: 1
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.07
maxTurnSpeed: 3
turnAcceleration: 0.5
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
reverseSpeedPercentage:0
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.豚虫>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:豚虫T1
[global_resource_豚虫]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90