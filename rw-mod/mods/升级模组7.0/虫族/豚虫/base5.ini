[core]
name: 巨型豚虫
class: CustomUnitMetadata
price: 966000
maxHp: 65000
mass: 24000
techLevel: 1
buildSpeed:0.000015385
radius: 80
displayRadius: 84
isBio: true
isBug: true
transportSlotsNeeded:16
selfRegenRate:6.5
softCollisionOnAll: 48
fogOfWarSightRange: 46
[graphics]
splastEffect: true
total_frames: 2
image:        base5.png
image_wreak:  NONE
image_turret: NONE
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
animation_attack_start: 0
