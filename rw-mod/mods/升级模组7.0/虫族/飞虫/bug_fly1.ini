[core]
name: 飞虫T2
class: CustomUnitMetadata
price: 1200
maxHp:320
mass: 500
techLevel: 1
buildSpeed:0.001250000
radius: 8
displayRadius: 10
isBio: true
isBug: true
selfRegenRate:0.2
tags:chb,ys
softCollisionOnAll: 12
fogOfWarSightRange: 18
dieOnConstruct: true
nanoRange: 14
canBuild_1_name: 虫族抽取器T2
canBuild_1_pos:  1
canBuild_2_name: 虫巢T2
canBuild_2_pos:  2
canBuild_3_name: 虫族制造仪T2
canBuild_3_pos:  3
canBuild_4_name: 虫塔T2
canBuild_4_pos:  1.5
canBuild_6_name: 虫族翼巢T2
canBuild_6_pos:  2.1
canBuild_7_name: 虫族海巢T2
canBuild_7_pos:  2.2
canBuild_8_name: 血脏巢T2
canBuild_8_pos:  2.3
canBuild_10_name: bugExtractor
canBuild_10_pos:  6
canBuild_12_name: bugNest
canBuild_12_pos:  7
canBuild_13_name: bugGenerator
canBuild_13_pos:  9
canBuild_14_name: bugTurret
canBuild_14_pos:  6.5
canBuild_16_name: 虫族翼巢T1
canBuild_16_pos:  7.1
canBuild_17_name: 虫族海巢T1
canBuild_17_pos:  7.2
canBuild_18_name: 血脏巢T1
canBuild_18_pos:  7.3
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T3") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 飞虫T3
price:  8000
text: 升级T3
description: 大幅度增强
displayType: Upgrade
buildSpeed: 0.001
pos: 0.05
ai_isHighPriority:true
[graphics]
total_frames: 2
image:        bug_fly1.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2
animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 10
[attack]
isMelee: true
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 20
turretTurnSpeed: 3
maxAttackRange: 9
shootDelay: 30
[projectile_1]
directDamage: 8
life: 50
instant: true
[movement]
movementType: AIR
moveSpeed: 1.68
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12
landOnGround: true
targetHeight: 15
targetHeightDrift: 3
maxTurnSpeed: 6.5
turnAcceleration: 0.4
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
[ai]
useAsBuilder: true
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.飞虫>1) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T3") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:飞虫T1
[hiddenAction_sp]
autoTrigger:if numberOfUnitsInTeam(withTag='cb', lessThan=1)
spawnUnits:虫族面板
[global_resource_飞虫]
hidden:true
[hiddenAction_检测]
autoTriggerOnEvent: newWaypointGivenByPlayer
requireConditional: if self.hasActiveWaypoint(type='build')
takeResources_includeUnitsWithinRange: 1000
takeResources_excludeUnitsWithoutTags: chb
takeResources_includeUnitsWithinRange_team: own
takeResources_triggerActionForEach: 优化
takeResources_searchOnly: true
[hiddenAction_优化]
requireConditional: if thisActionTarget!=self and distanceBetween(thisActionTarget.activeWaypointTarget, self.activeWaypointTarget)<1 and thisActionTarget.self.hasActiveWaypoint(type='build')
clearActiveWaypoint: true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90