[core]
name: 虫塔T1
class: CustomUnitMetadata
price: 1000
maxHp: 800
mass: 9000
overrideAndReplace:bugTurret
techLevel: 1
buildSpeed: 0.002
radius: 16
isBio: true
isBug: true
isBuilding: true
selfRegenRate:0.1
selfBuildRate:0.001
softCollisionOnAll: 3
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 虫塔T2
price:  2000
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.05
ai_isHighPriority:true
[action_upgradeAa]
convertTo: 蜂巢T1
price:  1200
text: 蜂巢T1
description: 对空大射程，蜂群攻击
displayType: Upgrade
buildSpeed: 0.001
pos: 0.2
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
descriptionAddUnitStats: ${section.convertTo}
[action_upgrade_flame]
convertTo: 毒气塔T1
price:  800
text: 毒气塔T1
description: 对地短射程，全向AOE伤害\n血量高，高速修复
descriptionAddUnitStats: ${section.convertTo}
displayType: Upgrade
buildSpeed: 8.3s
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
[action_upgrade_tm]
convertTo: 藤塔T1
price:  5000
text: 藤塔T1
description:远距离抓取地面单位\n高血量
descriptionAddUnitStats: ${section.convertTo}
displayType: Upgrade
buildSpeed: 33.3s
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
[graphics]
total_frames: 2
image:        bug_turret.png
image_wreak:  NONE
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
animation_idle_blendIn: 1s
animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 75
animation_idle_scale_start:1
animation_idle_scale_end:1.05
animation_idle_pingPong: true
animation_attack_start: 0
animation_attack_end: 1
animation_attack_speed: 5
animation_attack_scale_start:1
animation_attack_scale_end:1.05
animation_attack_pingPong: true
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 2
turretTurnSpeed: 3
aimOffsetSpread:0
maxAttackRange: 210
shootDelay: 30
[turret_1]
x: 0
y: 8
shoot_light:#FF00CCCC
[projectile_1]
directDamage: 40
life: 70
speed: 7
frame: 6
[animation_build]
onActions: underConstructionWithLinkedBuiltTime
blendOut: 2s
body_0: {scale:0}
body_1: {scale:1.2}
[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
[ai]
buildPriority: 0.2
noneInBaseExtraPriority: 0.15
maxEachBase: 5
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.虫塔>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:虫塔T1
[global_resource_虫塔]
hidden:true