[core]
name: 大型猎虫T1
class: CustomUnitMetadata
price: 43000
maxHp: 7500
mass: 10000
techLevel: 1
buildSpeed:0.000096
radius: 26
displayRadius: 28
isBio: true
isBug: true
displayDescription:优秀的机动性\n对空打击\n长时间交火会因疲惫射速下滑
selfRegenRate:1.25
softCollisionOnAll: 24
fogOfWarSightRange: 29
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T5") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 大型猎虫T2
price:  40000
text: 升级T5
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.0005
pos: 0.05
ai_isHighPriority:true
[graphics]
showShotDelayBar:false
total_frames: 2
image:        bug_hunt3.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 2
lock_body_rotation_with_main_turret: true
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 10
turretTurnSpeed: 9
maxAttackRange: 326
shootDelay: 60
[turret_1]
x: 0
y: 0
recoilOffset: -5
recoilOutTime: 13
recoilReturnTime: 13
warmup: 200
warmupCallDownRate: 0.5
warmupNoReset: true
warmupShootDelayTransfer: -60
shoot_flame: smoke
shoot_sound:ROOT:/虫族/喷射.ogg
shoot_sound_vol:0.06
[turret_2]
x:5
y:-5
linkDelayWithTurret:1
copyFrom:1
[turret_3]
x:5
y:-5
copyFrom:1
linkDelayWithTurret:1
[turret_4]
x:10
y:-5
copyFrom:1
linkDelayWithTurret:1
[turret_5]
x:-10
y:-5
copyFrom:1
linkDelayWithTurret:1
[turret_6]
x:0
y:0
copyFrom:1
linkDelayWithTurret:1
[projectile_1]
areaDamage: 125
areaRadius: 20
areaRadiusFromEdge:true
life: 80
speed: 13.44
autoTargetingOnDeadTargetRange:60
autoTargetingOnDeadTarget:true
color: #00ff00
drawSize: 2
lightColor: #00ff00
lightSize: 0.3
deflectionPower:4.1667
[movement]
movementType: AIR
moveSpeed: 4.32
moveAccelerationSpeed: 0.16
moveDecelerationSpeed: 0.16
maxTurnSpeed: 5.5
turnAcceleration: 1
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
reverseSpeedPercentage:0
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.猎虫>3) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T5") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:猎虫T1
[global_resource_猎虫]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90