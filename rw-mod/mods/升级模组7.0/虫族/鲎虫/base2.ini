[core]
name: 鲎虫T3
class: CustomUnitMetadata
price: 69000
maxHp: 27000
mass: 6000
displayDescription:一种水面防空虫，相当于虫族版防空船\n虽然没有防空船的AOE，但是攻击频率更快，对单的伤害更高\n拥有较高的血量，但没有护盾\n移速相对来说较快\n自我修复\n哟，怎么脸红了(
techLevel: 1
buildSpeed:0.000055556
radius: 20
displayRadius: 21
isBio: true
isBug: true
transportSlotsNeeded: 9
selfRegenRate:0.9
softCollisionOnAll: 12
fogOfWarSightRange: 24
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T4") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 大型鲎虫T1
price:  60000
text: 升级T4
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.001
pos: 0.05
ai_isHighPriority:true
[graphics]
splastEffect: true
total_frames: 1
image:        base2.png
image_wreak:  NONE
image_turret: NONE
animation_idle_scale_start:1
animation_idle_scale_end:1.02
animation_idle_pingPong:true
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turretSize: 0
turretTurnSpeed: 3
maxAttackRange: 480
shootDelay: 40
[turret_1]
x: 10
y: 5
shoot_sound:ROOT:/虫族/喷射.ogg
shoot_sound_vol:0.07
canAttackMaxAngle:361
shoot_light:#FF00CCCC
[turret_2]
x: -10
y:5
copyFrom:1
linkDelayWithTurret:1
warmup:25
[turret_3]
x: -10
y:8
copyFrom:1
linkDelayWithTurret:1
warmup:5
[turret_4]
x: 10
y:8
copyFrom:1
linkDelayWithTurret:1
warmup:10
[turret_5]
x: -10
y:11
copyFrom:1
linkDelayWithTurret:1
warmup:15
[turret_6]
x: 10
y:11
copyFrom:1
linkDelayWithTurret:1
warmup:20
[projectile_1]
directDamage: 105
life: 160
speed: 14.4
frame: 6
deflectionPower:3
[arm_1]
x:0
y:0
image_end:tailk.png
image_end_shadow:SHADOW:tailk.png
drawOverBody:false
[animation_1]
blendIn:0.5s
onActions: move
arm1_0.25s: {dir:-25}
arm1_0.75s: {dir:25}
arm1_1s: {dir:0}
body_0s: {scale: 1}
body_0.5s: {scale: 1.02}
body_1s: {scale: 1}
[movement]
movementType: WATER
moveSpeed: 1.2
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.07
maxTurnSpeed: 3
turnAcceleration: 0.5
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
reverseSpeedPercentage:0
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.鲎虫>2) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T4") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:鲎虫T1
[global_resource_鲎虫]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90