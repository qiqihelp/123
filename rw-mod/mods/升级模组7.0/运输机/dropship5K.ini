[core]
name: 巨型运输机K
class: CustomUnitMetadata
price: 386400
maxHp:32500
mass: 36000
displayDescription:不像运输机，像是空中炮艇
techLevel: 2
transportUnitsRequireTag:ys
transportUnitsRequireMovementType:LAND,HOVER,OVER_CLIFF_WATER,OVER_CLIFF
transportUnitsAddUnloadOption:true
buildSpeed:0.000015385
fogOfWarSightRange:46
radius: 80
isBio: false
softCollisionOnAll: 40
maxTransportingUnits: 1
transportUnitsCanUnloadUnits: if not self.isOverLiquid() and not self.isTransportUnloading() or self.gound()
transportUnitsKillOnDeath:false
exit_x:0
exit_y:-100
exit_dirOffset:-180
exit_moveAwayAmount:0
autoTriggerCooldownTime:30
fireTurretXAtSelfOnDeath: explode
showInEditor:false
[turret_explode]
x:0
y:0
canShoot:false
projectile:explode
[projectile_explode]
life:99
instant: true
speed: 1
largeHitEffect: true
frame: 0
shadowFrame:1
drawType:1
targetGround: true
areaDamage: 85000
areaRadius: 90
areaRadiusFromEdge:true
areaExpandTime:35
deflectionPower:-1
lightColor: #FFEEEE00
lightSize: 1
friendlyFire: only-ignoreEnemy
[hiddenAction_运输]
autoTrigger:false
temporarilyAddTags:ys
[decal_尾焰]
layer:beforeBody
isVisible:true
image: ROOT:/素材/尾焰2.png
imageScale:1
imageScaleY:0.8*self.speed
alpha:rnd(0.8,0.9)
xOffsetRelative:50
yOffsetRelative:-40
onlyWhileAlive:true
[decal_尾焰1]
layer:beforeBody
isVisible:true
image: ROOT:/素材/尾焰2.png
imageScale:1
imageScaleY:0.8*self.speed
alpha:rnd(0.8,0.9)
xOffsetRelative:-50
yOffsetRelative:-40
onlyWhileAlive:true
[graphics]
showTransportBar:true
image:        dropship5.png
image_wreak:  dropship_dead3.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:4
shadowOffsetY:10
[attack]
canAttack: false
[movement]
movementType:AIR
moveSpeed:5.75
moveAccelerationSpeed:0.028
moveDecelerationSpeed:0.05
maxTurnSpeed:3
turnAcceleration:1.5
landOnGround:true
reverseSpeedPercentage:0.5
slowDeathFall:true
heightChangeRate:0.4
[ai]
upgradedFrom:运输机T1
[attachment_sp]
addTransportedUnits: false
[hiddenAction_splj]
autoTrigger:false
autoTriggerOnEvent:NONE
[hiddenAction_lj]
autoTrigger:false
autoTriggerOnEvent:NONE
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[resource_sx]
hidden:true
[hiddenAction_ty3]
clearAllWaypoints:true
autoTriggerOnEvent:newWaypointGivenByPlayer,created
alsoQueueAction:ty2
requireConditional:if self.globalTeamTags(includes="yd") and not self.globalTeamTags(includes="是人机")
[hiddenAction_ty]
addWaypoint_target_randomUnit_maxRange:200
autoTrigger:if self.transportingCount<1 and self.globalTeamTags(includes="yd") and not self.globalTeamTags(includes="是人机")
addWaypoint_type:loadUp
addWaypoint_target_randomUnit_tagged:ys
addWaypoint_target_randomUnit_team:own
alsoTriggerAction:ty
setResourcesWithLogic:sx=self.y
[hiddenAction_ty1]
autoTrigger:if self.transportingCount>0 and self.globalTeamTags(includes="yd") and not self.globalTeamTags(includes="是人机") and self.resource.sx>=1400 and not self.hasActiveWaypoint(type='attackmove')
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:0,-3000
addWaypoint_type:attackmove
requireConditional:if self.y>=1400
[hiddenAction_ty1k]
autoTrigger:if self.transportingCount>0 and self.globalTeamTags(includes="yd") and not self.globalTeamTags(includes="是人机") and self.resource.sx<1400 and not self.hasActiveWaypoint(type='attackmove')
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:0,3000
addWaypoint_type:attackmove
requireConditional:if self.y<1400
[hiddenAction_ty2]
autoTriggerOnEvent:transportUnloadedOrRemovedUnit,destroyed
buildSpeed:60s
autoTrigger:if self.transportingCount>0 and self.globalTeamTags(includes="yd") and not self.globalTeamTags(includes="是人机") and self.resource.sx>=1400 and self.y<1000
forceUnloadTransportNow:true
deleteSelf:true
requireConditional:if self.globalTeamTags(includes="yd")
[hiddenAction_ty2k]
buildSpeed:60s
autoTrigger:if self.transportingCount>0 and self.globalTeamTags(includes="yd") and not self.globalTeamTags(includes="是人机") and self.resource.sx<1400 and self.y>1800
forceUnloadTransportNow:true
deleteSelf:true
requireConditional:if self.globalTeamTags(includes="yd")
[hiddenAction_运输1]
autoTrigger:false
