setUnitStats:maxTurnSpeed=3
setResourcesWithLogic:ammo=1
[hiddenAction_4]
autoTrigger:if (distanceBetween(self, activeWaypointTarget) >240 or self.speed==0) and self.ammo==1 and activeWaypointTarget!=nullUnit
setUnitStats:maxTurnSpeed=1.2
setResourcesWithLogic:ammo=0
