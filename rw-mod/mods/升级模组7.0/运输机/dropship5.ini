[core]
name: 巨型运输机
class: CustomUnitMetadata
price: 386400
maxHp:32500
mass: 36000
displayDescription:不像运输机，像是空中炮艇
techLevel: 2
transportUnitsEachUnitAlwaysUsesSingleSlot:false
transportUnitsRequireTag:ys
transportUnitsRequireMovementType:LAND,HOVER,OVER_CLIFF_WATER,OVER_CLIFF
transportUnitsAddUnloadOption:true
buildSpeed:0.000015385
tags:ysj
fogOfWarSightRange:46
radius: 80
isBio: false
softCollisionOnAll: 40
maxTransportingUnits: 64
transportUnitsCanUnloadUnits: if not self.isOverLiquid() and not self.isTransportUnloading() or self.gound()
