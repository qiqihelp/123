isLockedMessage:暂未开放等级
convertTo: 指挥中心T2
price:  6000
text: 升级T2
description: 中幅度增强\n生产T2建造者与侦察者
displayType: Upgrade
buildSpeed: 0.002
pos: 0.2
ai_isHighPriority:true
addResources:ammo=-1
[resource_auto]
hidden:true
[action_1]
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
extraLagHidingInUI:true
[action_3]
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
extraLagHidingInUI:true
[hiddenAction_2]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.isControlledByAI()) and self.ammo(lessThan=1) and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T0") or self.resource.等级>1)
addResources:credits=-${action_upgradeT2.price},ammo=1
alsoQueueAction:upgradeT2
[global_resource_等级]
hidden:true
[action_mb]
description:选择面板中的单位可使该单位自动升级到这一等级
isVisible:if not self.hasFlag(id=1) and self.numberOfAttachedUnits()>0
buildSpeed:1
text:展开升级面板
addResources:setFlag=1,unsetFlag=2
alwaysSinglePress:true
highPriorityQueue:true
extraLagHidingInUI:true
[action_mb1]
