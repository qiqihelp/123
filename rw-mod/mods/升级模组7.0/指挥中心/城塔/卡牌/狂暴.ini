turnSpeed:0
x:0
y:0
shoot_sound:ROOT:_地狱/龙吼.ogg
shoot_sound_vol:1
projectile:1
altProjectile:2
altProjectileCondition:if numberOfUnitsInTeam(withTag='ylfk')>0
[projectile_1]
areaDamage: 0
areaRadius:250
mutatorX_ifUnitWithoutTags:zwd,fs
mutatorX_addResourcesAreaHit:KB=100
areaRadiusFromEdge:true
areaDamageNoFalloff:true
life: 99999
speed: 99999
targetGround: true
deflectionPower:-1
explodeEffect: NONE
areaHitUnderwaterAlways:true
areaHitAirAndLandAtSameTime:true
[projectile_2]
areaDamage: 0
areaRadius:250
mutatorX_ifUnitWithoutTags:zwd,fs
mutatorX_addResourcesAreaHit:KB=110
areaRadiusFromEdge:true
areaDamageNoFalloff:true
life: 99999
speed: 99999
targetGround: true
deflectionPower:-1
explodeEffect: NONE
areaHitUnderwaterAlways:true
areaHitAirAndLandAtSameTime:true
[arm_1]
image_end:狂暴.png
x:0
y:0
[graphics]
imageScale:4
image:        ROOT:素材/NONE.png
image_shadow: NONE
disableLowHpFire:true
disableLowHpSmoke:true
drawLayer: bottom
[animation_1]
onActions:created
arm1_0s: {alpha: 0}
arm1_0.5s: {alpha: 0.8,dir:180}
arm1_1.2s: {alpha: 0}
[movement]
movementType: AIR
moveSpeed: 0
moveAccelerationSpeed: 10
moveDecelerationSpeed: 0
targetHeight: 4
targetHeightDrift: 0
startingHeightOffset:4
reverseSpeedPercentage:1
maxTurnSpeed: 0
turnAcceleration: 0.2
moveSlidingMode :false
moveIgnoringBody:true
moveSlidingDir:  45
[action_reclaim]
alwaysSinglePress:true
isVisible: false
[hiddenAction_BF]
