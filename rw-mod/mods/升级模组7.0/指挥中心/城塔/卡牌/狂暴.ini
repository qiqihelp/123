[core]
name: 狂暴
copyFrom: ROOT:/炮塔/基础炮塔/common_weapon_slot.ini
displayDescription:部署1个狂暴领域\n使范围内单位增加增加30%伤害与40%移速\n持续10s\n价格：2,415,000\n部署范围：全图
isUnselectable:true
isUnselectableAsTarget:true
price: 0
canNotBeDirectlyAttacked: true
canNotBeDamaged:true
displayRadius:200
maxHp:60
radius: 250
selfRegenRate:-1
showInEditor:true
mass: 200000000
disableDeathOnZeroHp:false
autoTriggerCooldownTime:6
autoTriggerCooldownTime_allowDangerousHighCPU:true
disableAllUnitCollisions:true
effectOnDeath:NONE
explodeOnDeath:false
