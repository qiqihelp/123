[core]
name: [卡]后手
copyFrom: ROOT:/炮塔/基础炮塔/common_weapon_slotK.ini
displayDescription:对局开始后5分钟后此卡槽转化为空卡槽再次选卡\n限时一分钟\n选卡后等待一分钟揭晓
price: 0
canNotBeDirectlyAttacked: true
isUnselectable: false
tags:hfys,ys
[hiddenAction_hfys]
autoTrigger:if self.parent.timeAlive>390
showMessageToPlayer:后手选卡开始
convertTo:闲置中
setResourcesWithLogic:ammo=3,ch=0
[resource_ch]
hidden:true
[hiddenAction_hfys1]
autoTrigger:if self.parent.timeAlive>450 and self.ammo==3
showMessageToPlayer:后手选卡结束
setResourcesWithLogic:ammo=0
[action_reclaim]
addResourcesWithLogic:point=1,hsxz=1
[global_resource_hsxz]
hidden:true
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
maxAttackRange: 999999
shootDelay: 85
[graphics]
total_frames: 1
imageScale:2
image:        ROOT:功能单位/time.png
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
drawLayer: bottom
[action_blink]
isVisible:false
[action_blink2]
isVisible:false
[hiddenAction_BF]
autoTrigger:if numberOfUnitsInAllTeams(withTag="ST")>0
