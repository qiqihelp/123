[core]
name: [卡]激光坦克
copyFrom: ROOT:/炮塔/基础炮塔/common_weapon_slotK.ini
displayDescription:部署3个光棱坦克\n价格：2,700,000\n部署范围：全图
price: 0
canNotBeDirectlyAttacked: true
isUnselectable: false
energyMax:30
energyRegen:0.0166667
[decal_1]
xOffsetRelative:0
yOffsetRelative:0
image:ROOT:激光坦克/laser_tank_turret5.png
imageScale:0.4
[decal_R]
imageScale: 1
total_frames:${graphics.total_frames}
alwaysStartDirAtZero: true
layer: inactive
image: ${graphics.image}
alpha: 0.4
xOffsetRelative:-130
yOffsetRelative:75
[decal_R1]
@copyFromSection:decal_R
xOffsetRelative:130
yOffsetRelative:75
[decal_R2]
@copyFromSection:decal_R
xOffsetRelative:0
yOffsetRelative:-150
[action_blink]
fireTurretXAtGround: 1
fireTurretXAtGround_withProjectile: 1
fireTurretXAtGround_onlyOverPassableTileOf: AIR
fireTurretXAtGround_showGuideDecals:R,R1,R2,cdm0,cdm1,cdm2,cdm3,cdm4,cdm5,icon,iconbk
[turret_1]
x: 0
y: 0
canShoot:false
invisible: true
size: 1
turnSpeed: 40
limitingRange: 999999
[projectile_1]
image:SHADOW:ROOT:激光坦克/laser_tank5.png
directDamage: 0
life: 99999
speed: 10
targetSpeedAcceleration:0.05
targetSpeed:30
targetGround: true
deflectionPower:-1
spawnUnit:光棱坦克K(offsetHeight=200,offsetY=150,offsetX=0),光棱坦克K(offsetHeight=200,offsetY=-75,offsetX=130),光棱坦克K(offsetHeight=200,offsetY=-75,offsetX=-130)
explodeEffect: NONE
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
maxAttackRange: 999999
shootDelay: 85
[graphics]
total_frames:3
imageScale:0.4
image:        ROOT:激光坦克/laser_tank5.png
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
drawLayer: bottom
[hiddenAction_BF]
autoTrigger:if numberOfUnitsInAllTeams(withTag="ST")>0
[hiddenAction_索敌]
autoTrigger:if  self.isControlledByAI() and not self.hasActiveWaypoint(type='follow')
addWaypoint_target_nearestUnit_tagged:ct
addWaypoint_type: follow
addWaypoint_target_nearestUnit_team:enemy
[action_ai]
setResourcesWithLogic:energy=${core.energyMax}*0.5
buildSpeed:0
isActive:if self.parent.ammo==1 and self.isEnergyFull()
isVisible:if self.isControlledByAI()
price:${action_zj.price}
fireTurretXAtGround: 1
fireTurretXAtGround_withProjectile: 1k
fireTurretXAtGround_withTarget:activeWaypointTarget
ai_isHighPriority:true
[projectile_1k]
spawnProjectilesOnExplode:1
instant: true
directDamage: 0
life: 99999
speed: 99999
deflectionPower:-1
explodeEffect: NONE
[action_cd]
isActive:false
displayType:infoOnly
id:564864
text:冷却:%{self.maxEnergy-self.energy}s
addActionCooldownTime: 30s
[action_zj]
price:2700000
isActive:false
displayType:infoOnly
text:资金:%{min(100,100*self.resource.credits/${action_zj.price})}%
isVisible:true
