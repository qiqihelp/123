[core]
name: 滚石
copyFrom: ROOT:/炮塔/基础炮塔/common_weapon_slot.ini
displayDescription:部署1个横向滚动的巨大滚石\n撞开单位并造成伤害\n可以拖拽虫王\n对城塔0.3倍伤害\n价格：1,500,000\n部署范围：大
isUnselectable:true
price: 0
tags:cq,fs
canNotBeDirectlyAttacked: true
displayRadius:200
softCollisionOnAll:0
maxHp:280
selfRegenRate:-1
radius: 200
mass: 200000000
disableDeathOnZeroHp:false
autoTriggerCooldownTime:6
autoTriggerCooldownTime_allowDangerousHighCPU:true
showInEditor:true
effectOnDeath:NONE
explodeOnDeath:false
numBitsOnDeath:0
[hiddenAction_感染]
autoTrigger:false
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
shootDelay: 85
[hiddenAction_start]
setBodyRotation:0.1
autoTriggerOnEvent:created
fireTurretXAtGround:入场
fireTurretXAtGround_withOffset:0,0
[turret_入场]
canShoot:false
turnSpeed:0
x:0
y:0
shoot_sound:滚石.ogg
shoot_sound_vol:1
projectile:0
[projectile_0]
invisible: true
directDamage: 0
life: 0
speed: 0
deflectionPower:-1
[arm_1]
hidden:if self.resource.pf3==1
image_end:滚石.png
x:0
y:0
spinRate:1
drawOverBody:true
[global_resource_pf3]
hidden:true
[decal_1]
layer:afterBody
teamColors:true
onlyWhileAlive:true
isVisible:if self.resource.pf3==1
image:耄耋滚石.png
imageScale:3.5
basePositionFromLegEnd:arm_1
[graphics]
disableLowHpSmoke:true
disableLowHpFire:true
imageScale:3.5
image:        ROOT:素材/NONE.png
image_shadow: SHADOW:滚石.png
shadowOffsetX:16
shadowOffsetY:16
drawLayer: bottom
[turret_1]
x:0
y:0
[hiddenAction_1]
autoTrigger:true
fireTurretXAtGround: 1
fireTurretXAtGround_withProjectile: 1
fireTurretXAtGround_withOffset:0,0
setUnitStats:movespeed=7*self.hp/280+1
[projectile_1]
areaDamage: 1500
areaRadius:200
areaRadiusFromEdge:true
areaDamageNoFalloff:true
life: 99999
speed: 99999
targetGround: true
deflectionPower:-1
explodeEffect: NONE
mutatorX_ifUnitWithTags:ct
mutatorX_areaDamageMultiplier:0.3
mutatorY_ifUnitWithTags:cw
mutatorY_areaDamageMultiplier:0.2
pushVelocity:-3
[hiddenAction_lj]
autoTrigger:false
[hiddenAction_splj]
autoTrigger:false
[hiddenAction_lj1]
autoTrigger:if self.teamId%2==0 and not self.hasActiveWaypoint(type='move')
addWaypoint_position_offsetFromSelf:-9999,0
addWaypoint_type:move
autoTriggerOnEvent:NONE
[hiddenAction_lj2]
autoTrigger:if self.teamId%2!=0 and not self.hasActiveWaypoint(type='move')
addWaypoint_position_offsetFromSelf:9999,0
addWaypoint_type:move
autoTriggerOnEvent:NONE
[movement]
movementType: AIR
moveSpeed: 7
moveAccelerationSpeed: 10
moveDecelerationSpeed: 0
targetHeight: 0
targetHeightDrift: 0
reverseSpeedPercentage:1
maxTurnSpeed: 0
turnAcceleration: 0.2
moveSlidingMode :false
moveIgnoringBody:true
moveSlidingDir:  45
[action_reclaim]
alwaysSinglePress:true
isVisible: false
[hiddenAction_BF]
autoTrigger:if numberOfUnitsInAllTeams(withTag="ST")>0
[hiddenAction_运输]
autoTrigger:false
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_yl]
autoTriggerOnEvent:created
requireConditional:if numberOfUnitsInTeam(withTag='ylfk')>0
setUnitStats:maxHp=310,hp=310