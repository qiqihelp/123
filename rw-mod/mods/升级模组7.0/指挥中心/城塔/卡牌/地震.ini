[core]
name: [卡]地震
copyFrom: ROOT:/炮塔/基础炮塔/common_weapon_slotK.ini
displayDescription:使指定范围产生地震\n造成大范围低伤害\n对城塔0.3倍伤害\n价格：1,500,000\n部署范围：全图
price: 0
canNotBeDirectlyAttacked: true
isUnselectable: false
energyMax:18
energyRegen:0.0166667
[action_blink]
fireTurretXAtGround: 1
fireTurretXAtGround_onlyOverPassableTileOf: AIR
fireTurretXAtGround_showGuideDecals:targetGuide,R,cdm0,cdm1,cdm2,cdm3,cdm4,cdm5,icon,iconbk
addResourcesWithLogic:pointK=${action_zj.price},credits=-${action_zj.price}
[decal_R]
imageScale:select(numberOfUnitsInTeam(withTag='ylfk')>0,2,1.75)
alwaysStartDirAtZero: true
layer: inactive
image: ROOT:/_地狱/裂缝.png
alpha: 0.4
frame:4
[decal_targetGuide]
alwaysStartDirAtZero: true
layer: inactive
image: SHARED:area_guide.png
teamColors: false
@define area_guide_size: 100
@define area_guide_radius: 50
@define lowDamageBorder: 30
imageScale: select(numberOfUnitsInTeam(withTag='ylfk')>0,400,350)/${area_guide_radius}
alpha: 0.4
color: #960d06
[turret_1]
x: 0
y: 0
canShoot:false
invisible: true
size: 1
turnSpeed: 40
limitingRange: 999999
shoot_sound:ROOT:/_地狱/撞击.ogg
shoot_sound_vol:0.5
projectile:1
altProjectile:2
altProjectileCondition:if numberOfUnitsInTeam(withTag='ylfk')>0
[projectile_1]
instant: true
areaDamage: 8000
areaRadius: 350
areaRadiusFromEdge:true
areaDamageNoFalloff:true
life: 99999
speed: 99999
targetGround: true
deflectionPower:-1
explodeEffect: ZJ,F
mutatorX_ifUnitWithTags:ct
mutatorX_areaDamageMultiplier:0.3
areaHitUnderwaterAlways:true
[projectile_2]
instant: true
areaDamage: 8000
areaRadius: 400
areaRadiusFromEdge:true
areaDamageNoFalloff:true
life: 99999
speed: 99999
targetGround: true
deflectionPower:-1
explodeEffect: ZJ2,F
mutatorX_ifUnitWithTags:ct
mutatorX_areaDamageMultiplier:0.3
areaHitUnderwaterAlways:true
[effect_ZJ]
createWhenOffscreen:true
priority:critical
scaleFrom:1
scaleTo:1
life:360
image:ROOT:/_地狱/裂缝.png
dirOffsetRandom:45
drawUnderUnits:true
attachedToUnit:false
[effect_ZJ2]
createWhenOffscreen:true
priority:critical
scaleFrom:1.14
scaleTo:1.14
life:360
image:ROOT:/_地狱/裂缝.png
dirOffsetRandom:45
drawUnderUnits:true
attachedToUnit:false
[effect_F]
createWhenZoomedOut: true
priority:critical
createWhenOffscreen:true
image: SHARED:cone_inverted_normal_128.png
life: 5
fadeOut: true
attachedToUnit: true
color: #63e6e8
fadeInTime:15
scaleFrom:200
scaleTo: 200
alpha: 0.8
drawUnderUnits:true
xOffsetAbsoluteRandom:0.3
yOffsetAbsoluteRandom:0.3
atmospheric: true
xOffsetRelative:0
yOffsetRelative:0
dirSpeed:900
drawType:displacement
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
maxAttackRange: 999999
shootDelay: 85
[graphics]
imageScale:0.15
image:        ROOT:/_地狱/裂缝.png
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
drawLayer: bottom
[hiddenAction_BF]
autoTrigger:if numberOfUnitsInAllTeams(withTag="ST")>0
[hiddenAction_索敌]
autoTrigger:if  self.isControlledByAI() and not self.hasActiveWaypoint(type='follow')
addWaypoint_target_nearestUnit_tagged:luj
addWaypoint_type: follow
addWaypoint_maxTime:10s
addWaypoint_target_nearestUnit_team:enemy
[action_ai]
setResourcesWithLogic:energy=${core.energyMax}*0.7
buildSpeed:0
isActive:if self.parent.ammo==1 and self.isEnergyFull()
isVisible:if self.isControlledByAI()
price:${action_zj.price}
fireTurretXAtGround: 1
fireTurretXAtGround_withProjectile: 1
fireTurretXAtGround_withTarget:activeWaypointTarget
ai_isHighPriority:true
[action_cd]
isActive:false
displayType:infoOnly
id:564864
text:冷却:%{self.maxEnergy-self.energy}s
addActionCooldownTime: 18s
[action_zj]
price:1500000
isActive:false
displayType:infoOnly
text:资金:%{min(100,100*self.resource.credits/${action_zj.price})}%
isVisible:true
