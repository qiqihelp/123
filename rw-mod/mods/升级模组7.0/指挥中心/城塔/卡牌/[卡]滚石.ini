teamColors: false
xOffsetRelative:1410
imageScale: 4
alpha: 0.4
color: #960d06
[turret_1]
x: 0
y: 0
canShoot:false
invisible: true
size: 1
turnSpeed: 40
limitingRange: 1300
[projectile_1]
instant: true
directDamage: 0
life: 99999
speed: 99999
targetGround: true
deflectionPower:-1
spawnUnit:滚石
explodeEffect: NONE
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
shootDelay: 85
maxAttackRange:1300
[decal_1]
layer:afterBody
teamColors:true
onlyWhileAlive:true
isVisible:if self.resource.pf3==1
image:耄耋滚石.png
imageScale:0.45
[graphics]
imageScale:0.45
image:        滚石.png
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
drawLayer: bottom
[hiddenAction_BF]
autoTrigger:if numberOfUnitsInAllTeams(withTag="ST")>0
[hiddenAction_索敌]
autoTrigger:if  self.isControlledByAI() and not self.hasActiveWaypoint(type='follow')
addWaypoint_target_nearestUnit_tagged:luj
addWaypoint_type: follow
addWaypoint_maxTime:10s
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_maxRange:1300
[action_ai]
setResourcesWithLogic:energy=${core.energyMax}*0.5
buildSpeed:0
isActive:if self.parent.ammo==1 and self.isEnergyFull() and self.hasActiveWaypoint(type='follow')
isVisible:if self.isControlledByAI()
price:${action_zj.price}
fireTurretXAtGround: 1
fireTurretXAtGround_withProjectile: 1k
fireTurretXAtGround_withTarget:activeWaypointTarget
ai_isHighPriority:true
[projectile_1k]
spawnProjectilesOnExplode:1
instant: true
directDamage: 0
life: 99999
speed: 99999
deflectionPower:-1
explodeEffect: NONE
[action_cd]
isActive:false
displayType:infoOnly
id:564864
text:冷却:%{self.maxEnergy-self.energy}s
addActionCooldownTime: 20s
[action_zj]
price:1500000
isActive:false
displayType:infoOnly
text:资金:%{min(100,100*self.resource.credits/${action_zj.price})}%
isVisible:true
[action_pf_on]
isActive:if self.resource.pfcd==0
text:耄耋皮
description:滚石哈气了
isVisible:if self.resource.pf3==0
buildSpeed:0
alwaysSinglePress:true
highPriorityQueue:true
setResourcesWithLogic:pf3=1,pfcd=6
[action_pf_off]
isActive:if self.resource.pfcd==0
text:原皮
isVisible:if self.resource.pf3==1
buildSpeed:0
alwaysSinglePress:true
highPriorityQueue:true
setResourcesWithLogic:pf3=0,pfcd=6