[core]
name: [卡]滚石
copyFrom: ROOT:/炮塔/基础炮塔/common_weapon_slotK.ini
displayDescription:部署1个横向滚动的巨大滚石\n撞开单位并造成伤害\n可以拖拽虫族\n对城塔0.3倍伤害\n价格：1,500,000\n部署范围：大
price: 0
showInEditor:false
canNotBeDirectlyAttacked: true
isUnselectable: false
energyMax:20
energyRegen:0.0166667
[global_resource_pfcd]
hidden:true
[global_resource_pf3]
hidden:true
[action_blink]
fireTurretXAtGround: 1
fireTurretXAtGround_withProjectile: 1
