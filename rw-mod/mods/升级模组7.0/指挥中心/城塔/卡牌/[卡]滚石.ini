image: SHARED:area_guide.png
teamColors: false
imageScale: 4
alpha: 0.3
color: #960d06
[decal_targetGuide_L]
isVisible:if self.teamId%2==0
total_frames:2
frame:0
alwaysStartDirAtZero: true
layer: inactive
image: SHARED:area_guide.png
teamColors: false
xOffsetRelative:-1410
imageScale: 4
alpha: 0.4
color: #960d06
[decal_R1]
