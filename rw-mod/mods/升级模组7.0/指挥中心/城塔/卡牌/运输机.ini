directDamage: 0
life: 99999
speed: 99999
targetGround: true
deflectionPower:-1
spawnUnit:巨型运输机K(offsetHeight=20)
explodeEffect: NONE
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
shootDelay: 85
maxAttackRange: 999999
[graphics]
imageScale:0.3
image:        ROOT:运输机/dropship5.png
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
drawLayer: bottom
[hiddenAction_BF]
