[core]
name: [卡]无人机
copyFrom: ROOT:/炮塔/基础炮塔/common_weapon_slotK.ini
displayDescription:部署3个勘察无人机\n价格：1,086,750\n部署范围：全图\n不移动\n狂暴时血量翻倍
price: 0
canNotBeDirectlyAttacked: true
isUnselectable: false
energyMax:16.6
energyRegen:0.0166667
[decal_R]
dirOffset:90
imageScale: 1
total_frames:${graphics.total_frames}
alwaysStartDirAtZero: true
layer: inactive
image: ${graphics.image}
alpha: 0.4
yOffsetRelative:100
[decal_R1]
@copyFromSection:decal_R
yOffsetRelative:0
[decal_R2]
@copyFromSection:decal_R
yOffsetRelative:-100
[action_blink]
fireTurretXAtGround: 1
fireTurretXAtGround_withProjectile: 1
fireTurretXAtGround_onlyOverPassableTileOf: AIR
fireTurretXAtGround_showGuideDecals:R,R1,R2,cdm0,cdm1,cdm2,cdm3,cdm4,cdm5,icon,iconbk
[turret_1]
x: 0
y: 0
canShoot:false
invisible: true
size: 1
turnSpeed: 40
limitingRange: 999999
[projectile_1]
instant: true
directDamage: 0
life: 99999
speed: 99999
targetGround: true
deflectionPower:-1
spawnUnit:勘察无人机(offsetY=-100,offsetHeight=20),勘察无人机(offsetY=0,offsetHeight=20),勘察无人机(offsetY=100,offsetHeight=20)
explodeEffect: NONE
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
maxAttackRange: 999999
shootDelay: 85
[graphics]
imageScale:0.3
image:        ROOT:间谍无人机/base5.png
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
drawLayer: bottom
[hiddenAction_BF]
autoTrigger:if numberOfUnitsInAllTeams(withTag="ST")>0
[hiddenAction_索敌]
clearAllWaypoints:true
autoTrigger:if  self.isControlledByAI() and not activeWaypointTarget.tags(includes='tttk') and numberOfUnitsInEnemyTeam(withTag="tttk",greaterThan=0)
addWaypoint_target_nearestUnit_tagged:tttk
addWaypoint_type: follow
addWaypoint_target_nearestUnit_team:enemy
[hiddenAction_索敌2]
clearAllWaypoints:true
autoTrigger:if  self.isControlledByAI() and not self.hasActiveWaypoint(type='follow') and numberOfUnitsInEnemyTeam(withTag="tttk",lessThan=1)
addWaypoint_target_nearestUnit_tagged:ys
addWaypoint_maxTime:10s
addWaypoint_type: follow
addWaypoint_target_nearestUnit_team:enemy
[action_ai]
setResourcesWithLogic:energy=0
buildSpeed:0
isActive:if self.parent.ammo==1 and self.isEnergyFull()
isVisible:if self.isControlledByAI()
price:${action_zj.price}
fireTurretXAtGround: 1
fireTurretXAtGround_withProjectile: 1k
fireTurretXAtGround_withTarget:activeWaypointTarget
ai_isHighPriority:true
[projectile_1k]
spawnProjectilesOnExplode:1
instant: true
directDamage: 0
life: 99999
speed: 99999
targetGround: true
deflectionPower:-1
explodeEffect: NONE
[action_cd]
isActive:false
displayType:infoOnly
id:564864
text:冷却:%{self.maxEnergy-self.energy}s
addActionCooldownTime: 16.6s
[action_zj]
price:1086750
isActive:false
displayType:infoOnly
text:资金:%{min(100,100*self.resource.credits/${action_zj.price})}%
isVisible:true
