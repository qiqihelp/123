[core]
name: [卡]光炮
copyFrom: ROOT:/炮塔/基础炮塔/common_weapon_slotK.ini
displayDescription:发射1束高能激光\n造成对点巨额伤害\n对城塔0.25倍伤害\n价格：3,000,000\n部署范围：全图
price: 0
canNotBeDirectlyAttacked: true
isUnselectable: false
energyMax:30
energyRegen:0.0166667
[action_blink]
fireTurretXAtGround: 1
fireTurretXAtGround_withProjectile: 1
fireTurretXAtGround_onlyOverPassableTileOf: AIR
fireTurretXAtGround_showGuideDecals:R,R1,cdm0,cdm1,cdm2,cdm3,cdm4,cdm5,icon,iconbk,targetGuide
addResourcesWithLogic:pointK=${action_zj.price},credits=-${action_zj.price}
[decal_targetGuide]
alwaysStartDirAtZero: true
layer: inactive
image: SHARED:area_guide.png
teamColors: false
@define area_guide_size: 100
@define area_guide_radius: 50
@define lowDamageBorder: 30
imageScale: ${ projectile_1.areaRadius - lowDamageBorder }/${area_guide_radius}
alpha: 0.4
color: #960d06
[decal_R]
yOffsetAbsolute:-195
imageScale: 1
total_frames:${graphics.total_frames}
alwaysStartDirAtZero: true
layer: inactive
image: ROOT:激光坦克/激光.png
alpha: 0.4
[decal_R1]
imageScale: 0.5
total_frames:${graphics.total_frames}
alwaysStartDirAtZero: true
layer: inactive
image: ${graphics.image}
alpha: 0.4
[turret_1]
shoot_sound:plasma_fire
shoot_sound_vol:0.5
x: 0
y: 0
canShoot:false
invisible: true
size: 1
turnSpeed: 40
limitingRange: 999999
[projectile_1]
instant: true
areaDamage: 100000
areaRadius: 20
areaRadiusFromEdge:true
areaDamageNoFalloff:true
life: 99999
speed: 99999
targetGround: true
deflectionPower:-1
explodeEffect: 1,2
mutatorX_ifUnitWithTags:ct
mutatorX_areaDamageMultiplier:0.25
areaHitUnderwaterAlways:true
areaHitAirAndLandAtSameTime:true
[effect_1]
yOffsetAbsolute:-195
life:60
alwayStartDirAtZero:true
image:ROOT:激光坦克/激光.png
alsoPlaySound:plasma_fire
[effect_2]
life:60
alwayStartDirAtZero:true
image:ROOT:激光坦克/离子炮弹爆炸.png
scaleFrom:0.5
scaleTo:0.5
alsoPlaySound:plasma_fire
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
maxAttackRange: 999999
shootDelay: 85
[graphics]
imageScale:0.45
image:        ROOT:激光坦克/离子炮弹爆炸.png
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
drawLayer: bottom
[hiddenAction_BF]
autoTrigger:if numberOfUnitsInAllTeams(withTag="ST")>0
[hiddenAction_索敌]
clearAllWaypoints:true
autoTrigger:if  self.isControlledByAI() and not activeWaypointTarget.tags(includes='cqq') and numberOfUnitsInEnemyTeam(withTag="cqq",greaterThan=0)
addWaypoint_target_nearestUnit_tagged:cqq
addWaypoint_type: follow
addWaypoint_target_nearestUnit_team:enemy
[hiddenAction_索敌1]
clearAllWaypoints:true
autoTrigger:if  self.isControlledByAI() and not activeWaypointTarget.tags(includes='zp') and numberOfUnitsInEnemyTeam(withTag="zp",greaterThan=0) and numberOfUnitsInEnemyTeam(withTag="cqq",lessThan=1)
addWaypoint_target_nearestUnit_tagged:zp
addWaypoint_type: follow
addWaypoint_target_nearestUnit_team:enemy
[hiddenAction_索敌2]
clearAllWaypoints:true
autoTrigger:if  self.isControlledByAI() and not self.hasActiveWaypoint(type='follow') and numberOfUnitsInEnemyTeam(withTag="cqq",lessThan=1) and numberOfUnitsInEnemyTeam(withTag="zp",lessThan=1)
addWaypoint_target_nearestUnit_tagged:ys
addWaypoint_type: follow
addWaypoint_maxTime:10s
addWaypoint_target_nearestUnit_team:enemy
[action_ai]
setResourcesWithLogic:energy=${core.energyMax}*0.7
buildSpeed:0
isActive:if self.parent.ammo==1 and self.isEnergyFull()
isVisible:if self.isControlledByAI()
price:${action_zj.price}
fireTurretXAtGround: 1
fireTurretXAtGround_withProjectile: 1k
fireTurretXAtGround_withTarget:activeWaypointTarget
ai_isHighPriority:true
[projectile_1k]
spawnProjectilesOnExplode:1
instant: true
directDamage: 0
life: 99999
speed: 99999
targetGround: true
deflectionPower:-1
explodeEffect: NONE
[action_cd]
isActive:false
displayType:infoOnly
id:564864
text:冷却:%{self.maxEnergy-self.energy}s
addActionCooldownTime: 30s
[action_zj]
price:3000000
isActive:false
displayType:infoOnly
text:资金:%{min(100,100*self.resource.credits/${action_zj.price})}%
isVisible:true
[hiddenAction_yl]
autoTrigger:if numberOfUnitsInTeam(withTag='ylfk')>0 and self.parent.ammo==0
setUnitStats:shootDamageMultiplier=1.1