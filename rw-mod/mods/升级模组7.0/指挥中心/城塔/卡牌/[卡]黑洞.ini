[core]
name: [卡]黑洞
copyFrom: ROOT:/炮塔/基础炮塔/common_weapon_slotK.ini
displayDescription:部署1个极大的黑洞\n大范围吸引单位\n持续2s\n价格：1,500,000\n部署范围：全图
price: 0
canNotBeDirectlyAttacked: true
isUnselectable: false
energyMax:20
energyRegen:0.0166667
[action_blink]
fireTurretXAtGround: 1
fireTurretXAtGround_withProjectile: 1
fireTurretXAtGround_onlyOverPassableTileOf: AIR
fireTurretXAtGround_showGuideDecals:R1,cdm0,cdm1,cdm2,cdm3,cdm4,cdm5,icon,iconbk
addResourcesWithLogic:pointK=${action_zj.price},credits=-${action_zj.price}
[decal_R1]
imageScale: 5
total_frames:${graphics.total_frames}
alwaysStartDirAtZero: true
layer: inactive
image: ${graphics.image}
alpha: 0.4
[turret_1]
x: 0
y: 0
canShoot:false
invisible: true
size: 1
turnSpeed: 40
limitingRange: 999999
[projectile_1]
instant: true
directDamage: 0
life: 99999
speed: 99999
targetGround: true
deflectionPower:-1
spawnUnit:黑洞(offsetHeight=4)
explodeEffect: NONE
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 2
maxAttackRange: 999999
shootDelay: 85
[graphics]
imageScale:0.20
image:        黑洞.png
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
drawLayer: bottom
[hiddenAction_BF]
autoTrigger:if numberOfUnitsInAllTeams(withTag="ST")>0
[hiddenAction_索敌]
autoTrigger:if  self.isControlledByAI() and not self.hasActiveWaypoint(type='follow')
addWaypoint_target_nearestUnit_tagged:ys
addWaypoint_type: follow
addWaypoint_maxTime:10s
addWaypoint_target_nearestUnit_team:enemy
[action_ai]
setResourcesWithLogic:energy=0
buildSpeed:0
isActive:if self.parent.ammo==1 and self.isEnergyFull() and self.hasActiveWaypoint(type='follow')
isVisible:if self.isControlledByAI()
price:${action_zj.price}
fireTurretXAtGround: 1
fireTurretXAtGround_withProjectile: 1k
fireTurretXAtGround_withTarget:activeWaypointTarget
ai_isHighPriority:true
[projectile_1k]
spawnProjectilesOnExplode:1
instant: true
directDamage: 0
life: 99999
targetGround: true
targetGroundSpread:300
speed: 99999
deflectionPower:-1
explodeEffect: NONE

[action_cd]
isActive:false
displayType:infoOnly
id:564864
text:冷却:%{self.maxEnergy-self.energy}s
addActionCooldownTime: 20s
[action_zj]
price:1500000
isActive:false
displayType:infoOnly
text:资金:%{min(100,100*self.resource.credits/${action_zj.price})}%
isVisible:true
