[core]
copyFrom:限制处理.md
name:限制模式
showInEditor:false
showOnMinimap:false
fogOfWarSightRange:0
disableAllUnitCollisions:true
availableInDemo:false
canNotBeDirectlyAttacked:true
maxHp:1
mass:1
radius:100
ignoreInUnitCapCalculation:true
isUnselectableAsTarget:true
isUnselectable:true
price:1
shieldRegen:0
tags:xz,ys
[graphics]
image:NONE.png
image_shield:NONE.png
[attack]
canAttack:false
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
[movement]
movementType: AIR
targetHeightDrift:0
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0
maxTurnSpeed:0
[hiddenAction_js1]
showMessageToPlayer:T2开放
addGlobalTeamTags:T2,清空
[hiddenAction_js2]
showMessageToPlayer:T3开放
addGlobalTeamTags:T3,清空
[hiddenAction_js3]
showMessageToPlayer:T4开放
addGlobalTeamTags:T4,清空
[hiddenAction_js4]
showMessageToPlayer:T5开放
addGlobalTeamTags:T5,清空
[hiddenAction_js5]
showMessageToPlayer:T6开放
addGlobalTeamTags:T6,清空
[action_xs1]
autoTrigger:if not self.globalTeamTags(includes="T2")
setUnitStats:maxShield=80,Shield=self.customTimer
[action_xs2]
autoTrigger:if self.globalTeamTags(includes="T2") and not self.globalTeamTags(includes="T3")
setUnitStats:maxShield=200,Shield=self.customTimer
[action_xs3]
autoTrigger:if self.globalTeamTags(includes="T3") and not self.globalTeamTags(includes="T4")
setUnitStats:maxShield=180,Shield=self.customTimer
[action_xs4]
autoTrigger:if self.globalTeamTags(includes="T4") and not self.globalTeamTags(includes="T5")
setUnitStats:maxShield=160,Shield=self.customTimer
[action_xs5]
autoTrigger:if not self.globalTeamTags(includes="T6") and self.globalTeamTags(includes="T5")
setUnitStats:maxShield=320,Shield=self.customTimer
[action_xs6]
autoTrigger:if self.globalTeamTags(includes="T6")
setUnitStats:maxShield=0
[hiddenAction_csh]
resetCustomTimer:true
autoTriggerOnEvent:created
[hiddenAction_dead]
autoTrigger:if self.noUnitInTeam()
deleteSelf:true