[core]
name: 间谍无人机T1
class: CustomUnitMetadata
price: 1500
maxHp: 1500
mass: 5000
displayDescription:-间谍无人机T1\n-拥有探开迷雾程度的能力\n-拥有自愈程度的能力\n-移速: 高\n-不能攻击
techLevel: 2
buildSpeed: 8s
availableInDemo: true
overrideAndReplace:spyDrone
radius: 16
displayRadius: 14
softCollisionOnAll:12
selfRegenRate:0.1
builtFrom_1_name: airFacTory
builtFrom_1_pos:  3.1
fogOfWarSightRange: 20
fogOfWarSightRangeWhileNotBuilt: 15
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 间谍无人机T2
price:  3000
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.05
ai_isHighPriority:true
[graphics]
image:        base.png
image_wreak:  base_dead.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
[movement]
movementType: AIR
moveSpeed: 2.4
moveAccelerationSpeed: 0.008
moveDecelerationSpeed: 0.015
targetHeight:30
joinsGroupFormations: false
maxTurnSpeed: 2.3
turnAcceleration: 0.08
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  35
slowDeathFall: true
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.间谍无人机T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:间谍无人机T1
[global_resource_间谍无人机T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_射程升级]
isVisible:if self.globalTeamTags(includes="EW")
text:升级视野[%{self.resource.SCDS}]
description:增加基础的0.1倍
setUnitStats:fogOfWarSightRange=${core.fogOfWarSightRange}*(1+0.1*self.resource.SCDS),maxAttackRange=${attack.maxAttackRange}*(1+0.1*self.resource.SCDS)
[decal_射程升级]
isVisible:if self.resource.SCDS!=0
[hiddenAction_KB2]
setUnitStats:movespeed=${movement.moveSpeed}*(1+0.2*self.resource.SDDS),shootDamageMultiplier=1+1.4*self.resource.SHDS,hp=self.hp*${core.maxHp}*(1+1.4*self.resource.XLDS)/self.maxHp,maxHp=${core.maxHp}*(1+1.4*self.resource.XLDS),selfRegenRate=${core.selfRegenRate}*(1+1.4*self.resource.XLDS),shield=select(self.maxShield==0,0,self.shield*${core.maxShield}*(1+2*self.resource.HDDS)/self.maxShield),maxShield=${core.maxShield}*(1+2*self.resource.HDDS),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS),maxAttackRange=${attack.maxAttackRange}*(1+0.1*self.resource.SCDS),fogOfWarSightRange=${core.fogOfWarSightRange}*(1+0.1*self.resource.SCDS),shootDelayMultiplier=1/(self.resource.SSDS+1),energy=select(self.maxEnergy==0,0,self.energy()*${core.energyMax}*(1+self.resource.NNDS)/self.maxEnergy),maxEnergy=${core.energyMax}*(1+self.resource.NNDS),nanoFactorySpeed=${core.nanoFactorySpeed }*(1+self.resource.GCDS),maxTurnSpeed=${movement.maxTurnSpeed},nanoRange=${core.nanoRange}*(1+0.1*self.resource.SCDS)