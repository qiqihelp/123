xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_射程升级]
isVisible:if self.globalTeamTags(includes="EW")
text:升级视野[%{self.resource.SCDS}]
description:增加基础的0.1倍
setUnitStats:fogOfWarSightRange=${core.fogOfWarSightRange}*(1+0.1*self.resource.SCDS),maxAttackRange=${attack.maxAttackRange}*(1+0.1*self.resource.SCDS)
[decal_射程升级]
isVisible:if self.resource.SCDS!=0
[hiddenAction_KB2]
setUnitStats:movespeed=${movement.moveSpeed}*(1+0.2*self.resource.SDDS),shootDamageMultiplier=1+1.4*self.resource.SHDS,hp=self.hp*${core.maxHp}*(1+1.4*self.resource.XLDS)/self.maxHp,maxHp=${core.maxHp}*(1+1.4*self.resource.XLDS),selfRegenRate=${core.selfRegenRate}*(1+1.4*self.resource.XLDS),shield=select(self.maxShield==0,0,self.shield*${core.maxShield}*(1+2*self.resource.HDDS)/self.maxShield),maxShield=${core.maxShield}*(1+2*self.resource.HDDS),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS),maxAttackRange=${attack.maxAttackRange}*(1+0.1*self.resource.SCDS),fogOfWarSightRange=${core.fogOfWarSightRange}*(1+0.1*self.resource.SCDS),shootDelayMultiplier=1/(self.resource.SSDS+1),energy=select(self.maxEnergy==0,0,self.energy()*${core.energyMax}*(1+self.resource.NNDS)/self.maxEnergy),maxEnergy=${core.energyMax}*(1+self.resource.NNDS),nanoFactorySpeed=${core.nanoFactorySpeed }*(1+self.resource.GCDS),maxTurnSpeed=${movement.maxTurnSpeed},nanoRange=${core.nanoRange}*(1+0.1*self.resource.SCDS)