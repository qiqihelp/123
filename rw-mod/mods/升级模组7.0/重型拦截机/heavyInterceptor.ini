moveSpeed: 2.5
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.1
maxTurnSpeed: 5.0
turnAcceleration: 0.3
reverseSpeedPercentage: 0.75
targetHeight: 20
targetHeightDrift: 1
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
slowDeathFall: true
[ai]
upgradedFrom:重型拦截机T1
[action_射速升级]
description:提高射速
setUnitStats:shootDelayMultiplier=1/(self.resource.SSDS*0.147+1)
[hiddenAction_KB2]
setUnitStats:movespeed=${movement.moveSpeed}*(1+0.2*self.resource.SDDS),shootDamageMultiplier=1+1.4*self.resource.SHDS,hp=self.hp*${core.maxHp}*(1+1.4*self.resource.XLDS)/self.maxHp,maxHp=${core.maxHp}*(1+1.4*self.resource.XLDS),selfRegenRate=${core.selfRegenRate}*(1+1.4*self.resource.XLDS),shield=select(self.maxShield==0,0,self.shield*${core.maxShield}*(1+2*self.resource.HDDS)/self.maxShield),maxShield=${core.maxShield}*(1+2*self.resource.HDDS),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS),maxAttackRange=${attack.maxAttackRange}*(1+0.1*self.resource.SCDS),shootDelayMultiplier=1/(self.resource.SSDS*0.147+1),energy=select(self.maxEnergy==0,0,self.energy()*${core.energyMax}*(1+self.resource.NNDS)/self.maxEnergy),maxEnergy=${core.energyMax}*(1+self.resource.NNDS),nanoFactorySpeed=${core.nanoFactorySpeed }*(1+self.resource.GCDS),maxTurnSpeed=${movement.maxTurnSpeed},nanoRange=${core.nanoRange}
[global_resource_重型拦截机]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_护盾升级]
@copyFromSection:action_效率升级
id:${core.price}+4
iconExtraImage:ROOT:素材/护盾K.png
isVisible:if self.globalTeamTags(includes="EW") and self.maxShield()>0
text:升级护盾[%{self.resource.HDDS}]
description:增加基础的2倍
setUnitStats:maxShield=self.maxShield()*(1+2/(2*self.resource.HDDS-1)),shield=self.shield()*(1+2/(2*self.resource.HDDS-1)),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS)
addResourcesWithLogic:HDDS=1
[decal_护盾升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.HDDS>0,1,-1)
isVisible:if self.resource.HDDS!=0
frame:min(select(self.resource.HDDS>0,self.resource.HDDS,int(-self.resource.HDDS/0.08))-1,4)
image:ROOT:素材/护盾升级.png
xOffsetAbsolute:0.1*${core.radius}
imageScale:${core.radius}/110