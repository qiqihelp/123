[core]
name: 重型拦截机T1
displayDescription:同样运用了等离子技术\n他拥有极其优秀的对空能力和其极高的机动性\n 放风筝神器
class: CustomUnitMetadata
price: 1200
maxHp: 150
maxShield: 450
shieldRegen: 0.15
mass: 6000
techLevel: 1
buildSpeed: 0.001
radius: 14
builtFrom_1_name: airFacTory
builtFrom_1_pos:  2
overrideAndReplace:heavyInterceptor
[hiddenAction_毒圈]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield>=self.maxShield()/100
addResourcesWithLogic:shield=-0.083333*self.maxShield()
[hiddenAction_毒圈1]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield<self.maxShield()/100
addResourcesWithLogic:hp=-0.083333*self.maxShield()
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 重型拦截机T2
price:  2400
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.05
ai_isHighPriority:true
addResources:ammo=-1
[action_add1]
autoTriggerOnEvent:created
addResources:auto=1
isVisible:false
[resource_auto]
displayName:auto
hidden:true
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_2]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.重型拦截机>0) and self.ammo(lessThan=1) and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},ammo=1
alsoQueueAction:upgradeT2
[graphics]
image:        base2.png
image_wreak:  base_dead.png
image_turret: turret.png
lock_body_rotation_with_main_turret: true
teamColorsOnTurret: true
image_shadow: SHADOW:base_shadow.png
shadowOffsetX:1
shadowOffsetY:1
movementEffect: CUSTOM:projectileTrail
movementEffectRate: 8
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 170
shootDelay: 20
turretRotateWithBody: true
[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
projectile: 1
size: 10
turnSpeed: 3.7
turnSpeedAcceleration: 0.5
canShoot: false
[turret_2]
x: 6
y: 13
projectile: 1
size: 1
attachedTo: 1
slave: true
turnSpeed: 0
turnSpeedAcceleration: 1
shoot_sound:plasma_fire
shoot_sound_vol:0.06
shoot_flame: NONE
shoot_light: #eefbff
recoilOffset: -1
recoilOutTime: 3
recoilReturnTime: 10
warmup: 200
warmupCallDownRate: 1
warmupNoReset: true
warmupShootDelayTransfer: 10
[turret_3]
x: -7
y: 13
