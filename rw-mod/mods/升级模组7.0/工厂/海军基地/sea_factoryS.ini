[core]
name: 海军基地T1.5
copyFrom: sea_factory.ini
overrideAndReplace:NONE
price: 3000
showInEditor: false
maxHp: 1000
techLevel: 2
buildSpeed: 0.0007
[canBuild_1]
isVisible:if self.ammo<1 and not self.globalTeamTags(includes="SJ")
name:海上建造者T1,机枪艇T1,水下探测器T1,导弹舰T1,登陆艇T1,战列舰T1,潜水艇T1,重型防空舰T1,重型战舰T1,海上工程师T1,重型导弹舰T1,重型潜艇T1,鹦鹉螺号T1,航空母舰T1
[action_upgrade]
@copyFrom_skipThisSection:true
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 海军基地T2.5
price:  3000
text: 升级T2.5
description: 生产T2海军单位
displayType: upgrade
buildSpeed: 0.002
pos: 0.2
iconImage:SHARED:icon_upgrade.png
ai_isHighPriority:true
[action_SJ]
isVisible:if self.globalTeamTags(includes="SJ")
text:随机
price:4675
buildSpeed:${0.00042579 /core.nanoFactorySpeed}
produceUnits:海上建造者T1(spawnChance=${1/13},maxSpawnLimit=1),机枪艇T1(spawnChance=${1/12},maxSpawnLimit=1),水下探测器T1(spawnChance=${1/11},maxSpawnLimit=1),导弹舰T1(spawnChance=${1/10},maxSpawnLimit=1),登陆艇T1(spawnChance=${1/9},maxSpawnLimit=1),战列舰T1(spawnChance=${1/8},maxSpawnLimit=1),潜水艇T1(spawnChance=${1/7},maxSpawnLimit=1),重型防空舰T1(spawnChance=${1/6},maxSpawnLimit=1),重型战舰T1(spawnChance=${1/5},maxSpawnLimit=1),重型导弹舰T1(spawnChance=${1/4},maxSpawnLimit=1),重型潜艇T1(spawnChance=${1/3},maxSpawnLimit=1),鹦鹉螺号T1(spawnChance=${1/2},maxSpawnLimit=1),航空母舰T1(spawnChance=1,maxSpawnLimit=1)
[graphics]
total_frames: 1
image:        sea_factory_t2.png
image_wreak:  sea_factory_dead.png
[ai]
upgradedFrom: 海军基地T1
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.海军基地T5>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[action_SJ]
ai_isHighPriority:true
id:2
[global_resource_海军基地T5]
hidden:true