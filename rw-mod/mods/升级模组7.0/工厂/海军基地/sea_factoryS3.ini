price:  60000
text: 升级T5.5
description: 生产T5海军单位
displayType: upgrade
buildSpeed: ${ 0.0005 / core.nanoFactorySpeed }
pos: 0.2
iconImage:SHARED:icon_upgrade.png
ai_isHighPriority:true
[action_SJ]
isVisible:if self.globalTeamTags(includes="SJ")
text:随机
price:201025
buildSpeed:${0.00042579 /core.nanoFactorySpeed}
produceUnits:海上建造者T4(spawnChance=${1/13},maxSpawnLimit=1),重机枪艇T1(spawnChance=${1/12},maxSpawnLimit=1),水下巡逻器T1(spawnChance=${1/11},maxSpawnLimit=1),武装导弹舰T1(spawnChance=${1/10},maxSpawnLimit=1),重型登陆艇T1(spawnChance=${1/9},maxSpawnLimit=1),重型战列舰T1(spawnChance=${1/8},maxSpawnLimit=1),重型潜水艇T1(spawnChance=${1/7},maxSpawnLimit=1),重型防空战舰T1(spawnChance=${1/6},maxSpawnLimit=1),巨型战舰T1(spawnChance=${1/5},maxSpawnLimit=1),巨型导弹舰T1(spawnChance=${1/4},maxSpawnLimit=1),巨型潜艇T1(spawnChance=${1/3},maxSpawnLimit=1),唐冠螺号T1(spawnChance=${1/2},maxSpawnLimit=1),航空巨舰T1(spawnChance=1,maxSpawnLimit=1)
[action_1]
id:6
alwaysSinglePress:true
highPriorityQueue:true
buildSpeed:0
isVisible:if self.ammo<1 and not self.globalTeamTags(includes="SJ")
text:上级
setResourcesWithLogic:ammo=1
[action_2]
id:7
alwaysSinglePress:true
highPriorityQueue:true
buildSpeed:0
isVisible:if self.ammo==1 and not self.globalTeamTags(includes="SJ")
text:下级
setResourcesWithLogic:ammo=0
[graphics]
total_frames: 1
image:        sea_factory_t3.png
image_wreak:  sea_factory_dead.png
[ai]
upgradedFrom: 海军基地T1
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.海军基地T5>3) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T5") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[action_SJ]
ai_isHighPriority:true
[global_resource_海军基地T5]
hidden:true
[decal_效率升级]
yOffsetAbsolute:1.3*${core.radius}
imageScale:1.3*${core.radius}/110
[decal_血量升级]
imageScale:1.3*${core.radius}/40