[core]
name: 陆军工厂T4
class: CustomUnitMetadata
price: 14875
maxHp:15000
mass: 3000
showInEditor: false
fogOfWarSightRange:29
nanoFactorySpeed:12.5
footprint: -2,-2,1,1
buildingSelectionOffset: -10
constructionFootprint: -2,-2,1,3
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0
techLevel: 1
buildSpeed:0.00008
radius: 40
isBio: false
isBuilding: true
exit_x:0
exit_y:-1
exit_moveAwayAmount:90
canBuild_1_name: seTRally
canBuild_1_pos:  0.1
explodeTypeOnDeath: building
[canBuild_1]
isVisible:if self.ammo<1 and not self.globalTeamTags(includes="SJ")
name: 高级建造者T1,高级侦察者T1,机枪坦克T1,两栖坦克T1,自行巨炮T1
[canBuild_2]
isVisible:if self.ammo==1 and not self.globalTeamTags(includes="SJ")
name: 建造者T3,侦察者T3,坦克T3,悬浮坦克T3,自行火炮T3
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T5") and self.globalTeamTags(includes="T1")
convertTo: 陆军工厂T5
price:  13500
text: 升级T5
description: 生产T5陆军单位
displayType: upgrade
buildSpeed: ${ 0.0005 / core.nanoFactorySpeed }
pos: 0.2
iconImage:SHARED:icon_upgrade.png
ai_isHighPriority:true
[action_upgrade]
convertTo: 陆军工厂T4.5
price:  44525
text: 升级T4.5
description: 生产全T4陆军单位
displayType: upgrade
buildSpeed: ${ 0.0004 / core.nanoFactorySpeed }
pos: 0.2
iconImage:SHARED:icon_upgrade.png
ai_isHighPriority:true
[action_SJ]
isVisible:if self.globalTeamTags(includes="SJ")
text:随机
price:17458
buildSpeed:${0.0024853365 /core.nanoFactorySpeed}
produceUnits:高级建造者T1(spawnChance=${1/5},maxSpawnLimit=1),高级侦察者T1(spawnChance=${1/4},maxSpawnLimit=1),机枪坦克T1(spawnChance=${1/3},maxSpawnLimit=1),两栖坦克T1(spawnChance=${1/2},maxSpawnLimit=1),自行巨炮T1(spawnChance=1,maxSpawnLimit=1)
[action_1]
id:6
alwaysSinglePress:true
highPriorityQueue:true
buildSpeed:0
isVisible:if self.ammo<1 and not self.globalTeamTags(includes="SJ")
text:上级
setResourcesWithLogic:ammo=1
[action_2]
id:7
alwaysSinglePress:true
highPriorityQueue:true
buildSpeed:0
isVisible:if self.ammo==1 and not self.globalTeamTags(includes="SJ")
text:下级
setResourcesWithLogic:ammo=0
[graphics]
imageScale:1.2
total_frames: 1
image_back_always_use_full_image:true
image:      land_factory_front3.png
image_back:   land_factory_back1.png
image_wreak:  land_factory_dead.png
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0
[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
[ai]
buildPriority: 0.75
noneInBaseExtraPriority: 0.25
noneGlobalExtraPriority: 0.75
ai_upgradePriority:0.09
maxEachBase:1
upgradedFrom: 陆军工厂T1
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.陆军工厂T1>3) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T5") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[action_SJ]
ai_isHighPriority:true
id:2
[global_resource_陆军工厂T1]
hidden:true
[decal_效率升级]
yOffsetAbsolute:1.3*${core.radius}
imageScale:1.3*${core.radius}/110
[decal_血量升级]
imageScale:1.3*${core.radius}/40