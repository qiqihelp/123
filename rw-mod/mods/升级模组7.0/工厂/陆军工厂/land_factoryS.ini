[core]
name: 陆军工厂T1.5
copyFrom: land_factory.ini
overrideAndReplace:NONE
price: 2700
showInEditor: false
techLevel: 2
buildSpeed: 0.001
[canBuild_1]
isVisible:if self.ammo<1 and not self.globalTeamTags(includes="SJ")
[canBuild_2]
tech:2
isVisible:if self.ammo<1 and not self.globalTeamTags(includes="SJ")
name:hovercraft,missileTank, plasmaTank,重型坦克T1,对地导弹坦克T1,combatEngineer,heavyArtillery, heavyHoverTank,laserTank,mammothTank
[action_upgrade]
@copyFrom_skipThisSection:true
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 陆军工厂T2.5
price:  2700
text: 升级T2.5
description: 生产T2陆军单位
displayType: upgrade
buildSpeed: 0.002
pos: 0.2
iconImage:SHARED:icon_upgrade.png
ai_isHighPriority:true
[action_SJ]
isVisible:if self.globalTeamTags(includes="SJ")
text:随机
price:1092
buildSpeed:${0.00128793 /core.nanoFactorySpeed}
produceUnits:建造者T1(spawnChance=${1/15},maxSpawnLimit=1),侦察者T1(spawnChance=${1/14},maxSpawnLimit=1),坦克T1(spawnChance=${1/13},maxSpawnLimit=1),悬浮坦克T1(spawnChance=${1/12},maxSpawnLimit=1),自行火炮T1(spawnChance=${1/11},maxSpawnLimit=1),登陆艇T1(spawnChance=${1/10},maxSpawnLimit=1),防空导弹坦克T1(spawnChance=${1/9},maxSpawnLimit=1),等离子坦克T1(spawnChance=${1/8},maxSpawnLimit=1),重型坦克T1(spawnChance=${1/7},maxSpawnLimit=1),对地导弹坦克T1(spawnChance=${1/6},maxSpawnLimit=1),战斗工程师T1(spawnChance=${1/5},maxSpawnLimit=1),重型火炮T1(spawnChance=${1/4},maxSpawnLimit=1),重型气垫坦克T1(spawnChance=${1/3},maxSpawnLimit=1),激光坦克T1(spawnChance=${1/2},maxSpawnLimit=1),猛犸坦克T1(spawnChance=1,maxSpawnLimit=1)
[graphics]
total_frames: 1
image:        land_factory_front_t2.png
image_back:   land_factory_back.png
image_wreak:  land_factory_dead.png
[ai]
upgradedFrom: 陆军工厂T1
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.陆军工厂T5>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[action_SJ]
ai_isHighPriority:true
id:2
[global_resource_陆军工厂T5]
hidden:true