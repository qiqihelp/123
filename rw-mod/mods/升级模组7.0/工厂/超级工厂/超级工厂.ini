isVisible:false
autoTriggerOnEvent:created
addResourcesWithLogic:shield=select(self.globalTeamTags(includes="EW"),1000000,0),energy=select(self.globalTeamTags(includes="EW"),1,0),st=1
setHeight:self.teamId
setBodyRotation:0
requireConditional:if not self.customTarget1.hasTags(includes='CJJZ')
[action_额外]
iconImage: SHARED:icon_off.png
buildSpeed:1
alwaysSinglePress:true
isVisible:if not self.globalTeamTags(includes="EW")
addGlobalTeamTags:EW
text:启动额外升级
allowMultipleInQueue:false
setResourcesWithLogic:shield=1000000+self.resource.NNDS*100000+self.resource.HDDS*100000+self.resource.XLDS*1000+self.resource.SHDS*100+self.resource.SSDS*10+self.resource.SCDS,energy=self.resource.st
[action_额外1]
iconImage: SHARED:icon_on.png
buildSpeed:1
isVisible:if self.globalTeamTags(includes="EW")
removeGlobalTeamTags:EW
text:禁用额外升级
allowMultipleInQueue:false
setResourcesWithLogic:shield=0,st=self.energy,energy=0
[resource_st]
hidden:true
[action_删除自身]
allowMultipleInQueue:false
text:删除自身
isVisible:if not self.hasTags(includes="ST")
buildSpeed: ${ 0.005 / core.nanoFactorySpeed }
deleteSelf:true
