[core]
name: 两栖喷气战机T2
displayDescription:T5
class: CustomUnitMetadata
displayLocaleKey:两栖喷气战机T2
showInEditor: true
transportSlotsNeeded: 5
fogOfWarSightRange:35
price: 166000
maxHp:9540
mass: 20000
techLevel: 1
buildSpeed:0.000055556
availableInDemo: false
radius: 24
displayRadius:28
isBio: false
softCollisionOnAll: 0
autoTriggerCooldownTime:10
[action_upgradeT2]
id:7
isLocked:if not self.globalTeamTags(includes="T6") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 两栖战机
price:  800000
text: 升级T6
description: 超大幅度增强
displayType: Upgrade
buildSpeed: 0.00025
pos: 0.2
ai_isHighPriority:true
[action_fly]
pos:0.1
id:3
isActive:if self.ammo==1 and (not lastDamagedBy.hasTags(includes='YOUC') or self.hasTakenDamage(laterThanSeconds=1))
convertTo: 两栖喷气战机T2
unitShownInUI:激光模块_蜘蛛
price:  ammo=1
text: Fly
buildSpeed: 1
stopLastAnimation:true
playAnimation:fly
alwaysSinglePress:true
highPriorityQueue:true
[action_dive]
pos:0.1
id:4
convertTo: 两栖喷气战机T2（水下）
unitShownInUI:激光模块_蜘蛛
price:  ammo=-1
text: Dive
buildSpeed: 1
stopLastAnimation:true
playAnimation:dive
alwaysSinglePress:true
isActive: if self.isOverWater() and self.ammo==0 and self.transportingCount()==0
highPriorityQueue:true
[animation_dive]
blendIn: 0s
arm1_0s: {x:10, y:11}
arm2_0s: {x:-10, y:11}
arm1_.2s: {x:10, y:0}
arm2_.2s: {x:-10, y:0}
arm1_.4s: {x:10, y:0}
arm2_.4s: {x:-10, y:0}
arm1_1s: {x:0, y:0}
arm2_1s: {x:0, y:0}
arm1_1.2s: {x:0, y:0}
arm2_1.2s: {x:0, y:0}
[animation_fly]
blendIn: 0s
arm1_0s: {x:-10, y:-11}
arm2_0s: {x:10, y:-11}
arm1_1s: {x:-10, y:-11}
arm2_1s: {x:10, y:-11}
arm1_1.5s: {x:0, y:-11}
arm2_1.5s: {x:0, y:-11}
arm1_1.7s: {x:0, y:-11}
arm2_1.7s: {x:0, y:-11}
arm1_1.9s: {x:0, y:0}
arm2_1.9s: {x:0, y:0}
[graphics]
total_frames: 1
image:        amphibious_jet4.png
image_wreak:  amphibious_jet2_dead.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
lock_body_rotation_with_main_turret: true
lock_leg_rotation_with_main_turret: true
[attack]
turretRotateWithBody: false
canAttack: true
canAttackFlyingUnits: if self.height>=0
canAttackLandUnits:   if self.height>=0
canAttackUnderwaterUnits: false
turretSize: 10
turretTurnSpeed: 4
maxAttackRange: 391
shootDelay: 110
turretMultiTargeting: true
[turret_base]
x: 0
y: 0
idleDir:0
turnSpeed: 3.9
turnSpeedAcceleration: 0.5
canShoot: false
[turret_wing1]
x: 26
y: 26
attachedTo: base
slave: true
invisible: true
projectile: lightning
turnSpeed: 5.0
turnSpeedAcceleration: 1.5
shoot_sound:lighting_burst
shoot_sound_vol:0.3
shoot_light:#FFFFFF
shoot_flame:CUSTOM:lightSlowFade
canShoot: true
size: 0
warmup:25
chargeEffectImage: SHARED:lighting_charge.png
warmupCallDownRate: 0.3
barrelX: -4
barrelOffsetX_onOddShots: 8
[turret_wing2]
x: -26
y: 26
copyFrom:wing1
warmup:35
[projectile_lightning]
spawnProjectilesOnCreate:lightning(recursionLimit=8)
directDamage: 90
life: 25
instant: true
lightingEffect: true
largeHitEffect: true
shieldDamageMultiplier: 1
shieldDefectionMultiplier: 0.1
buildingDamageMultiplier: 0.5
explodeEffect:CUSTOM:lightningShock*1, CUSTOM:sparks*3
explodeEffectOnShield:CUSTOM:lightningShock*1, CUSTOM:hitLightFlash
autoTargetingOnDeadTarget:true
autoTargetingOnDeadTargetRange:${attack.maxAttackRange}
[effect_hitLightFlash]
priority:high
image: SHARED:light_50.png
life: 17
fadeOut: true
attachedToUnit: false
color: #63e6e8
scaleFrom: 1.8
scaleTo: 1.8
alpha: 0.6
drawUnderUnits:false
[effect_lightningShock]
life: 60
xOffsetRelative: 0
yOffsetRelative: 0
hOffset: 0
dirOffset: 0
dirOffsetRandom:180
fadeInTime: 0
fadeOut: false
attachedToUnit: false
image: SHARED:lightning_shock.png
total_frames: 14
animateFrameStart: 0
animateFrameStartRandomAdd: 2
animateFrameEnd: 13
animateFramePingPong: false
animateFrameSpeed: 0.5
animateFrameSpeedRandom: 0.2
alpha:0.6
[effect_sparks]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 1.1
ySpeedRelativeRandom: 1.1
hSpeed: 1.5
image: SHARED:spark.png
priority: verylow
[effect_sparks2]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
ySpeedRelative:2
image: SHARED:spark.png
priority: verylow
[effect_lightSlowFade]
image: SHARED:light_50.png
life: 40
fadeOut: true
attachedToUnit: true
color: #63e6e8
scaleFrom: 0.3
scaleTo: 0.2
alpha: 1.7
[arm_1]
x:22
y:12
image_end:amphibious_jet_p9.png
image_end_shadow: SHADOW:amphibious_jet_p9.png
drawOverBody:true
image_end_teamColors:true
[arm_2]
x:-22
y:12
image_end:amphibious_jet_p10.png
image_end_shadow: SHADOW:amphibious_jet_p10.png
drawOverBody:true
image_end_teamColors:true
[movement]
movementType: AIR
moveSpeed: 2.94
moveAccelerationSpeed: 0.054
moveDecelerationSpeed: 0.126
targetHeight:20
landOnGround: false
reverseSpeedPercentage:0.7
maxTurnSpeed: 3.7
turnAcceleration: 0.3
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
slowDeathFall: false
heightChangeRate:0.2
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.两栖喷气机T1>4) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T6") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:两栖喷气机T1
[global_resource_两栖喷气机T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_speed]
autoTrigger:if self.height>0 and self.maxMoveSpeed()!=2.94*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=2.94*(1+0.2*self.resource.SDDS)
spawnEffects:splash*3,wave
[hiddenAction_speed1]
autoTrigger:if self.height<0 and self.maxMoveSpeed()!=0.84*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=0.84*(1+0.2*self.resource.SDDS)
[effect_wave]
priority:high
delayedStartTimer:15
stripIndex:shockwave
life: 80
scaleFrom: 0.2
scaleTo: 2
alpha: 0.4
xOffsetAbsoluteRandom: 3
yOffsetAbsoluteRandom: 3
attachedToUnit: false
[effect_splash]
life: 80
stripIndex: effects
frameIndex: 13
scaleFrom: 1.8
scaleTo: 2.6
alpha: 1
atmospheric:true
fadeInTime: 3
fadeOut:true
dirOffsetRandom:180
xSpeedAbsoluteRandom: 0.1
ySpeedAbsoluteRandom: 0.1
attachedToUnit: false
drawUnderUnits:false