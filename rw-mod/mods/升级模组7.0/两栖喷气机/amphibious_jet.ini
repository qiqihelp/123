[core]
name: 两栖喷气机T1
displayDescription:原版神器 但是它这个样子 怎么看都不像是飞机呀T﹏T
class: CustomUnitMetadata
displayLocaleKey:两栖喷气机T1
overrideAndReplace: c_amphibiousJet,amphibiousJet
price: 2000
maxHp: 530
mass: 10000
techLevel: 1
buildSpeed: 0.001
availableInDemo: false
radius: 12
displayRadius:14
isBio: false
softCollisionOnAll: 0
autoTriggerCooldownTime:10
[action_upgradeT2]
id:1
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 两栖喷气机T2
price:  4000
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.2
ai_isHighPriority:true
[action_fly]
pos:0.1
id:3
isActive:if self.ammo==1 and (not lastDamagedBy.hasTags(includes='YOUC') or self.hasTakenDamage(laterThanSeconds=1))
convertTo: 两栖喷气机T1
unitShownInUI:激光模块_蜘蛛
price:  ammo=1
text: Fly
buildSpeed: 1
stopLastAnimation:true
playAnimation:fly
alwaysSinglePress:true
highPriorityQueue:true
[action_dive]
pos:0.1
id:4
convertTo: 两栖喷气机T1（水下）
unitShownInUI:激光模块_蜘蛛
price:  ammo=-1
text: Dive
buildSpeed: 1
stopLastAnimation:true
playAnimation:dive
alwaysSinglePress:true
isActive: if self.isOverWater() and self.ammo==0 and self.transportingCount()==0
highPriorityQueue:true
[animation_dive]
blendIn: 0s
arm1_0s: {x:5, y:5.5}
arm2_0s: {x:-5, y:5.5}
arm1_.2s: {x:5, y:0}
arm2_.2s: {x:-5, y:0}
arm1_.4s: {x:5, y:0}
arm2_.4s: {x:-5, y:0}
arm1_1s: {x:0, y:0}
arm2_1s: {x:0, y:0}
arm1_1.2s: {x:0, y:0}
arm2_1.2s: {x:0, y:0}
[animation_fly]
blendIn: 0s
arm1_0s: {x:-5, y:-5.5}
arm2_0s: {x:5, y:-5.5}
arm1_1s: {x:-5, y:-5.5}
arm2_1s: {x:5, y:-5.5}
arm1_1.5s: {x:0, y:-5.5}
arm2_1.5s: {x:0, y:-5.5}
arm1_1.7s: {x:0, y:-5.5}
arm2_1.7s: {x:0, y:-5.5}
arm1_1.9s: {x:0, y:0}
arm2_1.9s: {x:0, y:0}
[graphics]
total_frames: 1
image:        amphibious_jet.png
image_wreak:  amphibious_jet_dead.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
lock_body_rotation_with_main_turret: true
lock_leg_rotation_with_main_turret: true
[attack]
turretRotateWithBody: false
canAttack: true
canAttackFlyingUnits: if self.height>=0
canAttackLandUnits:   if self.height>=0
canAttackUnderwaterUnits: false
turretSize: 10
turretTurnSpeed: 4
maxAttackRange: 170
shootDelay: 110
[turret_base]
x: 0
y: 0
idleDir:0
turnSpeed: 3.9
turnSpeedAcceleration: 0.5
canShoot: false
[turret_wing1]
x: 13
y: 13
attachedTo: base
slave: true
invisible: true
projectile: lightning
turnSpeed: 5.0
turnSpeedAcceleration: 1.5
shoot_sound:lighting_burst
shoot_light:#FFFFFF
shoot_sound_vol:0.3
shoot_flame:CUSTOM:lightSlowFade
canShoot: true
size: 0
warmup:25
chargeEffectImage: SHARED:lighting_charge.png
warmupCallDownRate: 0.3
[turret_wing2]
x: -13
y: 13
copyFrom:wing1
warmup:35
[projectile_lightning]
directDamage: 45
life: 25
instant: true
lightingEffect: true
largeHitEffect: true
shieldDamageMultiplier: 1
shieldDefectionMultiplier: 0.1
buildingDamageMultiplier: 0.5
explodeEffect:CUSTOM:lightningShock*1, CUSTOM:sparks*3
explodeEffectOnShield:CUSTOM:lightningShock*1, CUSTOM:hitLightFlash
[effect_hitLightFlash]
priority:high
image: SHARED:light_50.png
life: 17
fadeOut: true
attachedToUnit: false
color: #63e6e8
scaleFrom: 1.8
scaleTo: 1.8
alpha: 0.6
drawUnderUnits:false
[effect_lightningShock]
life: 60
xOffsetRelative: 0
yOffsetRelative: 0
hOffset: 0
dirOffset: 0
dirOffsetRandom:180
fadeInTime: 0
fadeOut: false
attachedToUnit: false
image: SHARED:lightning_shock.png
total_frames: 14
animateFrameStart: 0
animateFrameStartRandomAdd: 2
animateFrameEnd: 13
animateFramePingPong: false
animateFrameSpeed: 0.5
animateFrameSpeedRandom: 0.2
alpha:0.6
[effect_sparks]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 1.1
ySpeedRelativeRandom: 1.1
hSpeed: 1.5
image: SHARED:spark.png
priority: verylow
[effect_sparks2]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
ySpeedRelative:2
image: SHARED:spark.png
priority: verylow
[effect_lightSlowFade]
image: SHARED:light_50.png
life: 40
fadeOut: true
attachedToUnit: true
color: #63e6e8
scaleFrom: 0.3
scaleTo: 0.2
alpha: 1.7
[arm_1]
x:12
y:7.5
image_end:amphibious_jet_p1.png
image_end_shadow: SHADOW:amphibious_jet_p1.png
drawOverBody:true
image_end_teamColors:true
[arm_2]
x:-12
y:7.5
image_end:amphibious_jet_p2.png
image_end_shadow: SHADOW:amphibious_jet_p2.png
drawOverBody:true
image_end_teamColors:true
[movement]
movementType: AIR
moveSpeed: 1.4
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.07
targetHeight:20
landOnGround: false
reverseSpeedPercentage:0.7
maxTurnSpeed: 3.7
turnAcceleration: 0.3
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
slowDeathFall: false
heightChangeRate:0.2
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.两栖喷气机T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:两栖喷气机T1
[global_resource_两栖喷气机T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_speed]
autoTrigger:if self.height>0 and self.maxMoveSpeed()!=1.4*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=1.4*(1+0.2*self.resource.SDDS)
spawnEffects:splash*3,wave
[hiddenAction_speed1]
autoTrigger:if self.height<0 and self.maxMoveSpeed()!=0.4*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=0.4*(1+0.2*self.resource.SDDS)
[effect_wave]
priority:high
delayedStartTimer:15
stripIndex:shockwave
life: 80
scaleFrom: 0.1
scaleTo: 1
alpha: 0.4
xOffsetAbsoluteRandom: 3
yOffsetAbsoluteRandom: 3
attachedToUnit: false
[effect_splash]
life: 80
stripIndex: effects
frameIndex: 13
scaleFrom: 0.9
scaleTo: 1.3
alpha: 1
atmospheric:true
fadeInTime: 3
fadeOut:true
dirOffsetRandom:180
xSpeedAbsoluteRandom: 0.1
ySpeedAbsoluteRandom: 0.1
attachedToUnit: false
drawUnderUnits:false