[core]
name: 两栖喷气战机T1（水下）
class: CustomUnitMetadata
showInEditor: false
transportSlotsNeeded: 4
copyFrom: amphibious_jet3.ini
maxTransportingUnits:0
[graphics]
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T5") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 两栖喷气战机T2（水下）
price:  80000
text: 升级T5
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.0005
pos: 0.2
ai_isHighPriority:true
[attack]
canAttackFlyingUnits: false
canAttackLandUnits:   if self.height<=0
canAttackUnderwaterUnits: if self.height<=0
canAttackNotTouchingWaterUnits: false
maxAttackRange: 192
[turret_base]
turnSpeed: 1.9
turnSpeedAcceleration: 0.3
[turret_wing1]
x: 12
y: 18
[turret_wing2]
x: -12
y: 18
[arm_1]
x:12
y:4
[arm_2]
x:-12
y:4
[movement]
movementType: WATER
targetHeight:-8
fallingAcceleration:0.002
[ai]
upgradedFrom: 两栖喷气机T1
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_speed]
autoTrigger:if self.height<0 and self.maxMoveSpeed()!=0.72*(1+0.2*self.resource.SDDS)
setUnitStats:movespeed=0.72*(1+0.2*self.resource.SDDS)
[hiddenAction_speed1]
autoTrigger:false