[core]
copyFrom: engineer_ship5.ini
maxTransportingUnits:0
name: 概念型海上工程师（水下）
displayText: 概念型海上工程师
showInEditor:false
canRepairBuildings: false
canRepairUnits : false
canBuild_1_name: NONE
canBuild_1_pos:  -1
[hiddenAction_0]
addResources:ammok=1
autoTriggerOnEvent:created
[canBuild_1]
isVisible: false
[canBuild_2]
isVisible: false
[canBuild_T4]
isVisible:false
[canBuild_T3]
isVisible:false
[canBuild_T2]
isVisible:false
[canBuild_T1]
isVisible:false
[graphics]
splastEffect: false
movementEffect: NONE
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
canAttackNotTouchingWaterUnits:false
[turret_2]
x: 0
y: 0
invisible: true
canAttackNotTouchingWaterUnits: false
shoot_sound:plasma_fire
shoot_sound_vol:0.05
shoot_flame:small
shoot_light:#FFccCCEE
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
[turret_3]
invisible: true
x: 0
y: 0
idleDir:0
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
canAttackNotTouchingWaterUnits: false
[movement]
movementType: WATER
moveSpeed: 2
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.08
maxTurnSpeed: 1.8
turnAcceleration: 0.25
targetHeight: -8
targetHeightDrift: 0.3
moveSlidingMode :true
moveIgnoringBody:false
moveSlidingDir:  -1
[arm_1]
spinRate:3
[arm_2]
spinRate:3
[ai]
useAsBuilder: false
upgradedFrom: 概念型海上工程师
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90