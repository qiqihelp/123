[action_pf_off]
isActive:if self.resource.pfcd==0
text:原皮
isVisible:if self.resource.pf==1
buildSpeed:0
alwaysSinglePress:true
highPriorityQueue:true
setResourcesWithLogic:pf=0,pfcd=6
[global_resource_pfcd]
