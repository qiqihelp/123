[core]
dont_load: false
name: 主战坦克
displayText: 主战坦克
displayDescription:主战坦克。\n一辆坦克，属性十分均衡\n造价便宜，可以快速批量生产\n机枪适合清理一些小单位，主炮适用于大型单位和攻城，\n但主炮发射后需要重新装填\n不过，由于炮塔的存在\n相对实力仍旧偏弱(悲\n原稿by巨屑合金\n完善by威严な大小姐
class: CustomUnitMetadata
price: 169050
maxHp:13650
mass: 60000
techLevel: 1
buildSpeed:0.000030769
fogOfWarSightRange:46
radius: 44
displayRadius: 44
softCollisionOnAll: 22
transportSlotsNeeded:16
[decal_1]
onlyWhileAlive:true
isVisible:if self.resource.pf==1
image:1.png
imageScale:0.8
[decal_3]
onlyWhileAlive:true
isVisible:if self.resource.pf==1
image:3.png
imageScale:0.855
basePositionFromTurret:1
[decal_2]
