[core]
dont_load: false
name: 机枪坦克T1
displayText: 标准坦克T1
displayDescription: 三年的老兵
class: CustomUnitMetadata
price: 15050
maxHp:2625
mass: 6000
techLevel: 1
buildSpeed:0.000160000
fogOfWarSightRange:29
radius: 22
displayRadius: 22
softCollisionOnAll: 11
transportSlotsNeeded:4
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T5") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 机枪坦克T2
price:  14000
text: 升级T5
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.0005
pos: 0.05
ai_isHighPriority:true
addResources:ammo=-1
[action_add1]
autoTriggerOnEvent:created
addResources:auto=1
isVisible:false
[resource_auto]
displayName:auto
hidden:true
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_2]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.坦克>3) and self.ammo(lessThan=1) and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T5") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},ammo=1
alsoQueueAction:upgradeT2
[graphics]
total_frames: 3
image:        tank3.png
image_wreak:  tank_dead3.png
image_turret: tank_turret3_l.png
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
imageScale:0.8
scaleTurretImagesTo:16
teamColorsOnTurret:true
animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 1
dustEffect: true
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 30
turretTurnSpeed: 3
turretMultiTargeting:false
maxAttackRange: 250
shootDelay: 72
[turret_1]
x: 0
y: 0
projectile: 1
turnSpeedAcceleration: 1.0
shoot_sound:tank_firing
shoot_sound_vol:1
shoot_flame:small
shoot_light:#FFEECCCC
canAttackFlyingUnits:false
canShoot: true
recoilOffset:-6
recoilOutTime: 6
recoilReturnTime: 30
attachedTo:3
slave:true
[turret_3]
image:tank3_turret.png
x: 0
y: 0
canShoot: false
canAttackFlyingUnits:false
turnSpeedAcceleration: 1.0
recoilOffset:-2
recoilOutTime: 6
recoilReturnTime: 30
[projectile_1]
areaDamage:300
life: 60
speed: 9.6
frame: 1
drawSize: 1.25
deflectionPower:12
areaRadius:20
areaRadiusFromEdge:true
targetGround:true
targetGroundSpread:0
[movement]
movementType: LAND
moveSpeed:1.98
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.17
maxTurnSpeed: 4.1
turnAcceleration: 0.4
moveSlidingMode :false
moveIgnoringBody:false
[ai]
upgradedFrom:坦克T1
[hiddenAction_无尽]
buildSpeed:1
requireConditional:if self.resource.credits>=${action_upgradeT2.price}
alsoQueueAction:无尽
autoTrigger:if self.isControlledByAI() and self.resource.credits>${action_upgradeT2.price}-1 and self.globalTeamTags(includes="WJ")
addResources:credits=-${action_upgradeT2.price}
alsoTriggerAction:upgradeT2
[global_resource_坦克]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90