linkDelayWithTurret:9
projectile: 4K
[turret_14]
copyFrom: 9
x: -50
y: -42
idleDir:0
warmup:20
linkDelayWithTurret:9
projectile: 4K
[leg_1]
x: -6
y: 0
attach_x: -6
attach_y: 6
moveSpeed: 0.375
resetAngle:20
holdDisMin: 10
holdDisMax: 20
image_leg:  leg.png
image_foot: foot.png
image_foot_shadow: SHADOW:foot.png
lockMovement: true
[leg_2]
x: 6
y: 0
attach_x: 6
attach_y: 6
copyFrom: 1
[leg_3]
