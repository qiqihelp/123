[core]
copyFrom: nautilus5.ini
name: 菊石号（空中）
displayText: 菊石号
class: CustomUnitMetadata
builtFrom_1_name: NONE
transportUnitsCanUnloadUnits: if self.isOverLiquid()
transportUnitsKeepBuiltUnits: false
[decal_尾焰]
layer:beforeBody
isVisible:true
image: ROOT:/素材/尾焰2.png
imageScale:1.2
imageScaleY:1.1*self.speed
alpha:rnd(0.8,0.9)
xOffsetRelative:0
yOffsetRelative:-190
onlyWhileAlive:true
[action_launchScoutBot]
isVisible: true
[action_surface]
isVisible: false
autoTrigger: false
[hiddenAction_trigger_onLand]
autoTrigger: false
[action_dive]
isVisible: if self.isOverwater
convertTo: 菊石号（水面）
isActive: if self.isOverwater
displayType: action
price:  0
text: Drop
description: -Drop unit
buildSpeed: 780s
whenBuilding_cannotMove: true
whenBuilding_playAnimation: drop
pos:-1
highPriorityQueue: true
[action_dive1]
isVisible: if self.isOverPassableTile(type="LAND")
convertTo: 菊石号（陆地）
isActive: if not self.overWater()
displayType: action
price:  0
text: Drop
description: -Drop unit
buildSpeed: 780s
whenBuilding_cannotMove: true
whenBuilding_playAnimation: drop
pos:-1
highPriorityQueue: true
[graphics]
splastEffect: true
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
canAttackNotTouchingWaterUnits:true
[turret_9]
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
canAttackNotTouchingWaterUnits: true
projectile: 4K
[turret_10]
copyFrom: 9
x: -50
y: 42
idleDir:0
warmup:4
linkDelayWithTurret:9
projectile: 4K
[turret_11]
