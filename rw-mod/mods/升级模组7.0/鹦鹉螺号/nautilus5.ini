[core]
name: 菊石号
class: CustomUnitMetadata
displayLocaleKey: 菊石号
displayDescription:菊石号。\n我一度以为懒鸽他们为了这些名字想了很久（\n长相非常憨憨，胖嘟嘟的样子（\n因为非常滴（珍）贵，无论是原版还是升级模组除了后期钱太多一般不会出。\n血量高并且能够超快的回血，拥有多门超重型导弹发射器，能够在最短的时间内造成最大的伤害，不过因为超长的装填时间和特殊的两栖能力可以对岸边的机枪反复拉扯（\n另外值得一提的是，这货可以以海军工厂数倍的速度制造部分海军，可以用来整活也可以用来躲猫猫
price: 8694000
maxHp:260000
mass: 120000
selfRegenRate:6.5
transportUnitsEachUnitAlwaysUsesSingleSlot:false
techLevel: 2
experimental: true
buildSpeed:0.000004615
availableInDemo: false
radius: 144
softCollisionOnAll: 72
fogOfWarSightRange:75
nanoFactorySpeed:130
generation_resources:ammok=1
