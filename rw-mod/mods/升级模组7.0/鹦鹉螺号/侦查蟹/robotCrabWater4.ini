[core]
showInEditor:false
copyFrom: robotCrab4.ini
name: 勘察蟹T2(水面)
[hiddenAction_overWater]
autoTrigger: false
[hiddenAction_notOverWater]
convertTo: 勘察蟹T2
autoTrigger: if not self.overWater()
convertTo_keepCurrentTags:true
[graphics]
image:        base1.png
image_wreak:  base_dead.png
image_turret: turret4.png
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
splastEffect:true
[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 14
turretTurnSpeed: 4
maxAttackRange: 253
shootDelay: 18
isFixedFiring: false
[turret_1]
x: 0
y: 0
invisible:true
warmup:30
turnSpeed: 4
size: 8
canShoot: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
isMainNanoTurret: true
[turret_2]
x: 0
y: -1
idleDir:0
projectile: 1
size: 14
turnSpeed: 4
shoot_sound:plasma_fire
shoot_sound_vol:0.05
shoot_flame:small
shoot_light:#FFccCCEE
recoilOffset: -4
[projectile_1]
directDamage: 110
life: 70
speed: 13.82
frame: 6
lightSize:0.8
drawSize:1.25
lightColor:#05e705
deflectionPower:6.4799999999999995
[leg_1]
x: -8
y: -4
attach_x: -4
attach_y: 0
moveSpeed: 0.64
heightSpeed: 0.4
dust_effect: false
rotateSpeed: 7
hardLimit: 36
image_leg:  leg1.png
lockMovement: true
[leg_2]
x: 8
y: -4
attach_x: 4
attach_y: 0
copyFrom: 1
[leg_3]
x: -8
y: 10
attach_x: -10
attach_y: 8
copyFrom: 1
[leg_4]
x: 8
y: 10
attach_x: 10
attach_y: 8
copyFrom: 1
[leg_5]
x: -8
y: -20
attach_x: -10
attach_y: -12
copyFrom: 1
[leg_6]
x: 8
y: -20
attach_x: 10
attach_y: -12
copyFrom: 1
[movement]
movementType: OVER_CLIFF_WATER
moveSpeed: 1.26
moveAccelerationSpeed: 1
moveDecelerationSpeed: 1
targetHeight: 0.1
maxTurnSpeed: 4
turnAcceleration: 0.2
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  45
reverseSpeedPercentage:0
[ai]
useAsBuilder: true
[ai]
upgradedFrom:侦察蟹T1
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90