[core]
name: 实验型陆空机甲T1
class: CustomUnitMetadata
displayDescription:致敬传奇实验飞行机甲
copyFrom: mech_med_common.ini
showInEditor: true
price: 8000
maxHp: 1500
mass: 6000
techLevel: 2
buildSpeed: 0.0025
radius: 25
isBio: false
softCollisionOnAll: 0
energyMax: 4
energyRegen: 0.010
energyNeedsToRechargeToFull: true
action_1_convertTo: 实验型陆空机甲T1(飞行)
action_1_displayType: action
action_1_price:  0
action_1_text: Fly
action_1_buildSpeed: 0.009
action_1_whenBuilding_cannotMove: true
[graphics]
total_frames: 1
image:        topFlying.png
image_wreak:  NONE
image_turret: NONE
image_shadow: SHADOW:topFlying.png
shadowOffsetX:2
shadowOffsetY:2
lock_body_rotation_with_main_turret: true
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 20
turretTurnSpeed: 3
maxAttackRange: 310
shootDelay: 20
turretRotateWithBody: false
[turret_1]
x: 0
y: 0
idleDir:0
turnSpeed: 2.9
turnSpeedAcceleration: 0.3
canShoot: false
[turret_2]
x: 13
y: 49
attachedTo: 1
slave: true
invisible: true
projectile: 1
turnSpeed: 4.0
turnSpeedAcceleration: 1.0
shoot_sound:plasma_fire
shoot_sound_vol:0.05
shoot_light:#FFccCCEE
canShoot: true
size: 0
[projectile_1]
directDamage: 110
life: 70
speed: 11
frame: 11
[leg_1]
holdDisMin: 5
holdDisMax: 36
moveWarmUp:0.1s
[movement]
movementType: LAND
moveSpeed: 0.6
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.17
maxTurnSpeed: 5.0
turnAcceleration: 0.5
moveSlidingMode :false
moveIgnoringBody:false
reverseSpeedPercentage:1
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90