[core]
name: 机枪机甲T1
class: CustomUnitMetadata
displayDescription:机枪机甲配备了强大的气盾与一管越射越快的机枪\n他无疑是强大破局手段与中期陆军主力\n在面对大部分陆军单位时，他都能显得游刃有余\n不过要小心被猛犸咬到\n（啊我草我机枪机甲怎么被树卡住了）\nby:猫6203
copyFrom: mech_med_common.ini
price: 5000
maxHp: 600
mass: 6000
techLevel: 2
buildSpeed: 0.0006
overrideAndReplace:mechMinigun
fogOfWarSightRange: 20
radius: 23
isBio: false
softCollisionOnAll: 0
builtFrom_1_name: mechFacToryT2
builtFrom_1_pos: 8
maxShield: 800
shieldRegen: 0.08
[hiddenAction_毒圈]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield>=self.maxShield()/100
addResourcesWithLogic:shield=-0.083333*self.maxShield()
[hiddenAction_毒圈1]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield<self.maxShield()/100
addResourcesWithLogic:hp=-0.083333*self.maxShield()
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 机枪机甲T2
price:  10000
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.05
ai_isHighPriority:true
[graphics]
total_frames: 2
image:        topMinigun.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
lock_body_rotation_with_main_turret: true
animation_attack_start: 0
animation_attack_end: 1
animation_attack_speed: 2
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 20
turretTurnSpeed: 3
maxAttackRange: 210
shootDelay: 34
turretRotateWithBody: false
[turret_1]
x: 0
y: 0
idleDir:0
turnSpeed: 2.9
turnSpeedAcceleration: 0.3
canShoot: false
[turret_2]
x: 6
y: 26
attachedTo: 1
slave: true
invisible: true
projectile: 1
turnSpeed: 4.0
turnSpeedAcceleration: 1.0
shoot_sound:gun_fire
shoot_sound_vol:0.15
shoot_flame:small
shoot_light:#FFccCCEE
canShoot: true
size: 0
warmup: 200
warmupCallDownRate: 1
warmupNoReset: true
warmupShootDelayTransfer: 19
[projectile_1]
life: 160
speed: 11
directDamage: 55
drawType: 2
frame: 4
color: #BB99DD
[leg_1]
[leg_2]
[movement]
moveSpeed: 0.6
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.17
maxTurnSpeed: 5.0
turnAcceleration: 0.5
moveSlidingMode :false
moveIgnoringBody:false
reverseSpeedPercentage:1
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.机枪机甲T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:机枪机甲T1
[action_射速升级]
description:提高射速
setUnitStats:shootDelayMultiplier=1/(self.resource.SSDS*0.1178+1)
[hiddenAction_KB2]
setUnitStats:movespeed=${movement.moveSpeed}*(1+0.2*self.resource.SDDS),shootDamageMultiplier=1+1.4*self.resource.SHDS,hp=self.hp*${core.maxHp}*(1+1.4*self.resource.XLDS)/self.maxHp,maxHp=${core.maxHp}*(1+1.4*self.resource.XLDS),selfRegenRate=${core.selfRegenRate}*(1+1.4*self.resource.XLDS),shield=select(self.maxShield==0,0,self.shield*${core.maxShield}*(1+2*self.resource.HDDS)/self.maxShield),maxShield=${core.maxShield}*(1+2*self.resource.HDDS),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS),maxAttackRange=${attack.maxAttackRange}*(1+0.1*self.resource.SCDS),shootDelayMultiplier=1/(self.resource.SSDS*0.1178+1),energy=select(self.maxEnergy==0,0,self.energy()*${core.energyMax}*(1+self.resource.NNDS)/self.maxEnergy),maxEnergy=${core.energyMax}*(1+self.resource.NNDS),nanoFactorySpeed=${core.nanoFactorySpeed }*(1+self.resource.GCDS),maxTurnSpeed=${movement.maxTurnSpeed},nanoRange=${core.nanoRange}
[global_resource_机枪机甲T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_护盾升级]
@copyFromSection:action_效率升级
id:${core.price}+4
iconExtraImage:ROOT:素材/护盾K.png
isVisible:if self.globalTeamTags(includes="EW") and self.maxShield()>0
text:升级护盾[%{self.resource.HDDS}]
description:增加基础的2倍
setUnitStats:maxShield=self.maxShield()*(1+2/(2*self.resource.HDDS-1)),shield=self.shield()*(1+2/(2*self.resource.HDDS-1)),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS)
addResourcesWithLogic:HDDS=1
[decal_护盾升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.HDDS>0,1,-1)
isVisible:if self.resource.HDDS!=0
frame:min(select(self.resource.HDDS>0,self.resource.HDDS,int(-self.resource.HDDS/0.08))-1,4)
image:ROOT:素材/护盾升级.png
xOffsetAbsolute:0.1*${core.radius}
imageScale:${core.radius}/110