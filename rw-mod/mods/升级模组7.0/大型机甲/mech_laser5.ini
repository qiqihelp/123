[core]
name: 聚能离子机甲
class: CustomUnitMetadata
copyFrom: mech_large_common2.ini
displayDescription:聚能离子机甲。\n它性价比不高\n它射程远，能用来火力支援\nPVP几乎没人出
price: 3381000
maxHp:78000
mass: 24000
techLevel: 2
buildSpeed:0.000009231
fogOfWarSightRange: 61
radius: 100
isBio: false
softCollisionOnAll: 50
energyMax: 15
energyRegen: 0.055
energyNeedsToRechargeToFull: true
transportSlotsNeeded: 32
[resource_DWQH]
hidden:true
[hiddenAction_onWater]
autoTrigger: if self.overWater() and self.resource.DWQH==0
setUnitStats:movespeed=${movement.moveSpeed}*(1+0.2*self.resource.SDDS)/2
setResourcesWithLogic:DWQH=1
[hiddenAction_onGround]
autoTrigger: if not self.overWater() and self.resource.DWQH==1
setUnitStats:movespeed=${movement.moveSpeed}*(1+0.2*self.resource.SDDS)
setResourcesWithLogic:DWQH=0
[graphics]
total_frames: 1
image:        topLaser5.png
image_wreak:  topLaser_dead5.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:8
shadowOffsetY:8
lock_body_rotation_with_main_turret: true
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits:false
turretSize: 20
turretTurnSpeed: 3
turretMultiTargeting:true
maxAttackRange: 952
shootDelay: 1
turretRotateWithBody: false
[turret_1]
x: 0
y: 0
idleDir:0
turnSpeed: 2.9
turnSpeedAcceleration: 0.07
canShoot: false
recoilOffset: -4
recoilOutTime: 2
recoilReturnTime: 3
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
[turret_2]
x: 56
y: 196
attachedTo: 1
slave: true
invisible: true
projectile: 1
turnSpeed: 4.0
turnSpeedAcceleration: 1.0
shoot_sound:plasma_fire
shoot_sound_vol:0.07
shoot_light:#FFccCCEE
canShoot: true
size: 0
energyUsage: 1
warmup:3
chargeEffectImage: SHARED:lighting_charge.png
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
altProjectile:3
altProjectileCondition:if self.attacking.height>6
[projectile_1]
directDamage:0
life: 80
speed: 0
targetSpeed: 32
targetSpeedAcceleration: 1
deflectionPower:13
drawType:2
frame:4
drawSize: 1
trailEffect: CUSTOM:projectileTrail
trailEffectRate:2
autoTargetingOnDeadTarget: true
effectOnCreate: CUSTOM:projectileLight
spawnProjectilesOnExplode:2
[projectile_2]
areaDamage:1170
areaRadius: 35
areaRadiusFromEdge:true
life: 80
speed: 999
deflectionPower:-1
drawType:2
frame:4
drawSize: 1
explodeEffect: CUSTOM:projectilePassThough, smallExplosion, CUSTOM:hitLightFlash
targetGroundSpread:0
targetGround:true
[projectile_3]
areaDamage:1170
areaRadius: 35
areaRadiusFromEdge:true
life: 80
speed: 0
targetSpeed: 32
targetSpeedAcceleration: 1
deflectionPower:13
drawType:2
frame:4
drawSize: 1
trailEffect: CUSTOM:projectileTrail
trailEffectRate:2
autoTargetingOnDeadTarget: true
explodeEffect: CUSTOM:projectilePassThough, smallExplosion, CUSTOM:hitLightFlash
effectOnCreate: CUSTOM:projectileLight
[effect_warmup]
priority:high
image: SHARED:light_50.png
life: 25
fadeOut: true
attachedToUnit: true
color: #63e6e8
scaleFrom: 0.1
scaleTo: 0.1
alpha: 0.8
drawUnderUnits:false
ySpeedRelative:3.9
[effect_lightSlowFade]
image: SHARED:light_50.png
life: 40
fadeOut: true
attachedToUnit: true
color: #63e6e8
scaleFrom: 0.7
scaleTo: 0.7
alpha: 0.5
drawUnderUnits:true
[effect_projectileTrail]
image: SHARED:light_50.png
life: 20
fadeOut: true
attachedToUnit: false
color: #63e6e8
fadeInTime:2
scaleFrom: 0.4
scaleTo: 0.4
alpha: 0.6
drawUnderUnits:true
[effect_projectileLight]
priority:veryhigh
image: SHARED:light_50.png
life: 100
fadeOut: true
attachedToUnit: true
color: #63e6e8
fadeInTime:2
scaleFrom: 0.8
scaleTo: 0.8
alpha: 0.6
drawUnderUnits:false
liveAfterAttachedDies: false
[effect_hitLightFlash]
priority:high
image: SHARED:light_50.png
life: 14
fadeOut: true
attachedToUnit: false
color: #63e6e8
scaleFrom: 1.8
scaleTo: 1.8
alpha: 0.6
drawUnderUnits:false
[effect_projectilePassThough]
priority:high
frameIndex: 4
stripIndex: projectiles2
life: 20
fadeOut: true
attachedToUnit: false
color: #FFFFFF
scaleFrom: 1
scaleTo: 0.5
alpha: 1
drawUnderUnits:false
ySpeedRelative:2
atmospheric: true
[movement]
moveSpeed:1.5
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.17
maxTurnSpeed: 5.0
turnAcceleration: 0.5
moveSlidingMode :false
moveIgnoringBody:false
reverseSpeedPercentage:1
[hiddenAction_NNHF]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull
addResourcesWithLogic:energy=${core.energyRegen}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[ai]
upgradedFrom:等离子机甲T1
[action_射速升级]
isVisible:false
[hiddenAction_洗点数K]
setResourcesWithLogic:SDDS=0,XLDS=0,SHDS=0,HDDS=0,SCDS=0,SSDS=0,NNDS=0,GCDS=0,DS=5,DSK=0,DWQH=0
[action_能量升级]
@copyFromSection:action_效率升级
id:${core.price}+7
iconExtraImage:ROOT:素材/能量K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级能量[%{self.resource.NNDS}]
description:增加基础的1倍
setUnitStats:maxEnergy=self.maxEnergy*(1+1/self.resource.NNDS),energy=self.energy()*(1+1/self.resource.NNDS)
addResourcesWithLogic:NNDS=1
[decal_能量升级]
alwaysStartDirAtZero:true
imageScaleY:select(self.resource.NNDS>0,1,-1)
total_frames:5
layer:beforeUI
onlyWhileAlive:true
isVisible:if self.resource.NNDS!=0
frame:min(select(self.resource.NNDS>0,self.resource.NNDS,int(-self.resource.NNDS/0.16))-1,4)
image:ROOT:素材/能量.png
xOffsetAbsolute:-0.1*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_back]
allowMultipleInQueue:false
buildSpeed:1
text:后退\n价格250000
price:250000
addActionCooldownTime:10s
isVisible:if self.globalTeamTags(includes="yd") and self.teamId%2!=0
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:-600,0
addWaypoint_type: move
[action_back1]
allowMultipleInQueue:false
buildSpeed:1
text:后退\n价格250000
price:250000
addActionCooldownTime:10s
isVisible:if self.globalTeamTags(includes="yd") and self.teamId%2==0
clearAllWaypoints:true
addWaypoint_position_offsetFromSelf:600,0
addWaypoint_type: move