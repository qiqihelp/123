[core]
name: 移动炮塔T1(部署)
class: CustomUnitMetadata
copyFrom: mech_bunker.ini
overrideAndReplace:移动炮塔T1(部署)
showInEditor: false
builtFrom_1_name: NONE
builtFrom_2_name: NONE
radius: 23
footprint: -1,-1,1,1
constructionFootprint:-1,-1,1,1
maxShield: 500
shieldRegen: 0.15
startShieldAtZero: true
isBuilding: true
ignoreInUnitCapCalculation: false
[action_upgradeT2]
id:1
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 移动炮塔T2(部署)
price:  9000
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.05
ai_isHighPriority:true
[action_deploy]
isVisible: false
[action_undeploy]
id:7
isVisible: true
text: Undeploy
convertTo: 移动炮塔T1
displayType: action
price:  0
buildSpeed: 0.010
highPriorityQueue:true
canPlayerCancel: false
allowMultipleInQueue: false
alwaysSinglePress: true
[graphics]
[attack]
maxAttackRange: 240
shootDelay: 50
[turret_2]
shouldResetTurret: false
[leg_1]
x: -3
y: 3
attach_x: -5
attach_y: 10
moveSpeed: 1.0
rotateSpeed: 7
heightSpeed: 0.4
resetAngle:25
image_leg:  leg.png
image_foot: foot_small.png
holdDisMin: 5
holdDisMax: 15
[leg_2]
x: 3
y: 3
attach_x: 5
attach_y: 10
copyFrom: 1
[leg_3]
x: -3
y: -3
attach_x: -5
attach_y: -10
copyFrom: 1
[leg_4]
x: 3
y: -3
attach_x: 5
attach_y: -10
copyFrom: 1
[movement]
movementType: NONE
targetHeight:0
moveSpeed: 0
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.17
maxTurnSpeed: 1.0
turnAcceleration: 0.5
moveSlidingMode :false
moveIgnoringBody:false
reverseSpeedPercentage:1
[ai]
upgradedFrom: 移动炮塔T1
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90