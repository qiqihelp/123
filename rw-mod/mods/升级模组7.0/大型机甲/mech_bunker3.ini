[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.移动炮塔T1>3) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T5") or not self.globalTeamTags(includes="T1"))
