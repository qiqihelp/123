[core]
name: 火力平台
displayDescription:火力平台。\n一个巨型的可移动炮塔，射程较远\n快速向敌人发射范围伤害的炮弹，小型集群单位是不可能攻破这座坚硬的堡垒的\n并且，它可以移动到水面，依靠射程对陆地目标进行攻击\n部署之后，不可移动，但是，攻速将会得到较大的强化，同时还可以获得一定量的护盾(笑\n原稿by巨屑合金\n完善by威严な大小姐
class: CustomUnitMetadata
copyFrom: mech_large_common.ini
price: 2173500
maxHp:52000
mass: 24000
techLevel: 1
buildSpeed:0.000009231
fogOfWarSightRange: 61
softCollisionOnAll: 58
radius: 116
transportSlotsNeeded:16
[resource_DWQH]
hidden:true
[hiddenAction_毒圈]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield>=self.maxShield()/100
addResourcesWithLogic:shield=-0.083333*self.maxShield()
[hiddenAction_毒圈1]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield<self.maxShield()/100
addResourcesWithLogic:hp=-0.083333*self.maxShield()
[hiddenAction_onWater]
autoTrigger: if self.overWater() and self.resource.DWQH==0
setUnitStats:movespeed=${movement.moveSpeed}*(1+0.2*self.resource.SDDS)/2
setResourcesWithLogic:DWQH=1
[hiddenAction_onGround]
autoTrigger: if not self.overWater() and self.resource.DWQH==1
setUnitStats:movespeed=${movement.moveSpeed}*(1+0.2*self.resource.SDDS)
setResourcesWithLogic:DWQH=0
