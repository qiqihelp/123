[core]
name: 激光坦克T2
displayDescription: 激光家族很少有弱势单位，\n相信我，你绝对不会想被它打中的。\nby小空
class: CustomUnitMetadata
price: 4800
maxHp:800
mass: 3000
techLevel: 2
buildSpeed:0.000650000
fogOfWarSightRange:18
transportSlotsNeeded: 2
radius: 15
displayRadius: 16
isBio: false
softCollisionOnAll: 0
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T3") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 激光坦克T3
price:  32000
text: 升级T3
description: 大幅度增强
displayType: Upgrade
buildSpeed: 0.001
pos: 0.2
ai_isHighPriority:true
[graphics]
total_frames: 3
image:        laser_tank.png
image_wreak:  laser_tank_dead.png
image_turret: laser_tank_turret1.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 2.75
dustEffect: true
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 19
turretTurnSpeed: 4
maxAttackRange: 228
shootDelay: 5s
[turret_barrel]
x: 4
y: 0
attachedTo: base
slave: true
projectile: laser
image: laser_tank_barrel.png
turnSpeed: 0
turnSpeedAcceleration: 1.0
shoot_sound:plasma_fire
shoot_sound_vol:0.5
shoot_flame:small
canShoot: true
recoilOffset: -2.5
recoilOutTime: 2
recoilReturnTime: 18
warmup:60
chargeEffectImage: laser_tank_charge.png
[turret_barrel1]
x: -4
y: 0
copyFrom:barrel
[turret_base]
x: 0
y: -1
turnSpeed: 3
turnSpeedAcceleration: 1.0
canShoot: false
recoilOffset: -0.5
recoilOutTime: 2
recoilReturnTime: 18
[projectile_laser]
directDamage: 350
life: 10
largeHitEffect: true
instant:true
laserEffect:true
instantReuseLast:true
color:#6fff0000
[effect_lightSlowFade]
image: SHARED:light_50.png
life: 40
fadeOut: true
attachedToUnit: true
color: #FF0000
scaleFrom: 0.7
scaleTo: 0.7
alpha: 0.5
drawUnderUnits:true
[movement]
movementType: LAND
moveSpeed: 0.72
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.17
maxTurnSpeed: 1.8
turnAcceleration: 0.5
moveSlidingMode :false
moveIgnoringBody:false
reverseSpeedPercentage:0.75
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.激光坦克T1>1) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T3") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:激光坦克T1
[global_resource_激光坦克T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90