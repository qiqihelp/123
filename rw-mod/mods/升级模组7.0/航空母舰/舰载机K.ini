[effect_1]
createWhenZoomedOut: false
priority:critical
image: SHARED:light_50.png
life: 80
fadeOut: true
attachedToUnit: false
yOffsetRelative:0
color: #63e6e8
fadeInTime:2
scaleFrom:0.3
scaleTo: 0.15
alpha: 0.6
