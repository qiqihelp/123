priority:low
life: 45
image: effect7.png
scaleFrom: 0.15
scaleTo: 0.3
alpha: 0.7
atmospheric:true
xSpeedAbsoluteRandom: 0.1
ySpeedAbsoluteRandom: 0.1
ySpeedRelative:-0.2
xOffsetRelative:-23
yOffsetRelative:-10
