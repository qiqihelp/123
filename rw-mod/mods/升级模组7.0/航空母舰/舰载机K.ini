targetHeight: 35
targetHeightDrift: 1
moveSpeed: 2
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0
joinsGroupFormations: false
maxTurnSpeed: 5
turnAcceleration: 0.05
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  -1
slowDeathFall: true
slowDeathFallSmoke: false
[ai]
upgradedFrom:航空母舰T1
[action_速度升级]
autoTrigger:if self.resource.SDDS<self.customTarget1.resource.SDDS and self.globalTeamTags(includes="EW")
[action_能量升级]
autoTrigger:if self.resource.NNDS<self.customTarget1.resource.NNDS and self.globalTeamTags(includes="EW")
[action_射速升级]
autoTrigger:if self.resource.SSDS<self.customTarget1.resource.SSDS and self.globalTeamTags(includes="EW")
[action_射程升级]
autoTrigger:if self.resource.SCDS<self.customTarget1.resource.SCDS and self.globalTeamTags(includes="EW")
[action_伤害升级]
autoTrigger:if self.resource.SHDS<self.customTarget1.resource.SHDS and self.globalTeamTags(includes="EW")
[hiddenAction_洗点数K]
autoTrigger:if self.globalTeamTags(includes="EW") and (self.resource.DSK==2 or (self.resource.SDDS+self.resource.XLDS+self.resource.SHDS+self.resource.HDDS+self.resource.SCDS+self.resource.SSDS+self.resource.NNDS+self.resource.GCDS>self.customTarget1.resource.SDDS+self.customTarget1.resource.XLDS+self.customTarget1.resource.SHDS+self.customTarget1.resource.HDDS+self.customTarget1.resource.SCDS+self.customTarget1.resource.SSDS+self.customTarget1.resource.NNDS+self.customTarget1.resource.GCDS))
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_SJEW]
autoTrigger:false
autoTriggerOnEvent:NONE
[hiddenAction_JY]
autoTriggerOnEvent:killedAnyUnit
autoTrigger:if self.resource.CHZ>0
takeResources_includeReference:self.customTarget1
takeResources_directTransferStoppingAtZero:true
takeResources:CHZ=-999999999
[hiddenAction_dj2]
autoTrigger:false
[hiddenAction_dj3]
autoTriggerOnEvent:NONE