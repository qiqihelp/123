[core]
name: 舰载机K
showInEditor: false
displayText:舰载机
class: CustomUnitMetadata
price: 0
maxHp: 1600
mass: 6000
displayDescription:
tags:Z,ys
ignoreInUnitCapCalculation:true
fogOfWarSightRange: 13
techLevel: 2
energyMax: 600
buildSpeed: 10s
availableInDemo: true
autoTriggerCooldownTime:10
radius: 26
isUnselectable:true
isUnselectableAsTarget:true
canNotBeDamaged:true
canNotBeDirectlyAttacked:true
isUnrepairableUnit:true
disableAllUnitCollisions:true
[hiddenAction_dj]
autoTrigger:false
[action_2]
autoTrigger:if self.hasParent(withTag ="水面")
convertTo:舰载机_固定
[action_4]
autoTrigger:if not self.hasParent()
convertTo:舰载机M
addEnergy:600
[graphics]
total_frames:1
movementEffect: CUSTOM:projectileTrail,CUSTOM:trail1,CUSTOM:trail2
