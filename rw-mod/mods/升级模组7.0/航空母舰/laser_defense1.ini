[graphics]
image: NONE.png
image_shadow: NONE
shadowOffsetX:3
shadowOffsetY:3
drawLayer: bottom
[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
[ai]
upgradedFrom:航空母舰T1
[hiddenAction_NNHF]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull
addResourcesWithLogic:energy=${core.energyRegen}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[action_能量升级]
autoTrigger:if self.resource.NNDS<self.parent.resource.NNDS
@copyFromSection:action_效率升级
id:${core.price}+7
iconExtraImage:ROOT:素材/能量K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级能量[%{self.resource.NNDS}]
description:增加基础的1倍
setUnitStats:maxEnergy=self.maxEnergy*(1+1/self.resource.NNDS),energy=self.energy()*(1+1/self.resource.NNDS)
addResourcesWithLogic:NNDS=1
[hiddenAction_洗点数K]
autoTrigger:if self.globalTeamTags(includes="EW") and (self.resource.DSK==2 or (self.resource.SDDS+self.resource.XLDS+self.resource.SHDS+self.resource.HDDS+self.resource.SCDS+self.resource.SSDS+self.resource.NNDS+self.resource.GCDS>self.customTarget1.resource.SDDS+self.customTarget1.resource.XLDS+self.customTarget1.resource.SHDS+self.customTarget1.resource.HDDS+self.customTarget1.resource.SCDS+self.customTarget1.resource.SSDS+self.customTarget1.resource.NNDS+self.customTarget1.resource.GCDS))
[decal_能量升级]
alwaysStartDirAtZero:true
imageScaleY:select(self.resource.NNDS>0,1,-1)
total_frames:5
layer:beforeUI
onlyWhileAlive:true
isVisible:if self.resource.NNDS!=0
frame:min(select(self.resource.NNDS>0,self.resource.NNDS,int(-self.resource.NNDS/0.16))-1,4)
image:ROOT:素材/能量.png
xOffsetAbsolute:-0.1*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_SJEW]
autoTrigger:false
autoTriggerOnEvent:NONE