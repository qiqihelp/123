[core]
name: 舰载机M
showInEditor: false
displayText:舰载机
class: CustomUnitMetadata
price: 0
maxHp:1400
mass: 6000
ignoreInUnitCapCalculation:true
fogOfWarSightRange:0
displayDescription:
tags:Z,ys
techLevel: 2
energyMax: 600
buildSpeed: 10s
availableInDemo: true
energyRegen: -2
radius: 26
isUnselectable:true
isUnselectableAsTarget:true
canNotBeDamaged:true
canNotBeDirectlyAttacked:true
isUnrepairableUnit:true
disableAllUnitCollisions:true
autoTriggerCooldownTime:10
[action_0]
autoTrigger:if not self.hasActiveWaypoint()
addWaypoint_type:move
addWaypoint_position_offsetFromSelf:0,0
[action_1]
autoTrigger:if not self.hasParent()
addWaypoint_target_fromReference: self.customTarget1
addWaypoint_type:loadInto
addWaypoint_triggerActionIfFailed:5
[action_4]
autoTrigger:if self.hasParent(withTag ="水面")
convertTo:舰载机_固定
addEnergy:600
[action_2]
autoTrigger:if self.hasParent(withTag ="空中")
convertTo:舰载机K
addEnergy:600
[action_5]
deleteSelf:true
[action_3]
clearActiveWaypoint:true
autoTrigger:if self.energy(lessThan=1)
[decal_尾焰]
layer:beforeBody
isVisible:true
image: ROOT:/素材/尾焰.png
imageScale:0.6
imageScaleY:0.5*self.speed
alpha:rnd(0.8,0.9)
xOffsetRelative:0
yOffsetRelative:-26
onlyWhileAlive:true
[graphics]
total_frames:1
image:        舰载机.png
image_wreak:  NONE
image_turret: NONE
lock_body_rotation_with_main_turret: true
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
attackMovement: bomber
turretSize: -6
aimOffsetSpread:0
maxAttackRange: 340
shootDelay: 60
isFixedFiring: false
[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
projectile: 1
barrelX: -18
barrelOffsetX_onOddShots: 36
turnSpeed: 6.4
turnSpeedAcceleration: 0.4
shoot_sound:missile_fire
shoot_sound_vol:0.3
shoot_flame:small
shoot_light:#ffc600
recoilOffset: 0
recoilOutTime: 10
recoilReturnTime: 14
[projectile_1]
life: 150
speed: 10
frame: 6
trailEffect: true
trailEffectRate: 2
largeHitEffect: true
targetGround: true
areaDamage: 1300
deflectionPower:13
areaRadius: 90
areaRadiusFromEdge:true
drawSize: 1.5
lightColor: #ffc600
lightSize: 1
image:projectile1.png
[effect_1]
createWhenZoomedOut: false
priority:critical
image: SHARED:light_50.png
life: 80
fadeOut: true
attachedToUnit: false
yOffsetRelative:0
color: #63e6e8
fadeInTime:2
scaleFrom:0.3
scaleTo: 0.15
alpha: 0.6
drawUnderUnits:true
ySpeedRelative:-0.4
atmospheric: true
[effect_lightningShock]
life: 120
dirOffset: 0
dirOffsetRandom:180
fadeInTime: 0
fadeOut: false
attachedToUnit: false
image: SHARED:lightning_shock.png
total_frames: 14
animateFrameStart: 2
animateFrameStartRandomAdd: 2
animateFrameEnd: 13
animateFramePingPong: false
animateFrameSpeed: 0.5
animateFrameSpeedRandom: 0.1
alpha:0.6
drawUnderUnits:true
scaleFrom: 0.4
scaleTo: 0.4
[effect_fireSmall]
life: 50
xOffsetRelativeRandom: 3
yOffsetRelativeRandom: 3
hOffset: 0.2
alwayStartDirAtZero: true
dirOffset: 0
fadeInTime: 10
fadeOut: true
attachedToUnit: false
atmospheric: true
stripIndex: 7
frameIndex: 0
frameIndexRandom: 2
alpha:1
drawUnderUnits:true
scaleFrom: 0.5
scaleTo: 0.5
delayedStartTimerRandom: 15
[effect_verySmallFlame]
life: 20
attachedToUnit: true
atmospheric: true
stripIndex: 3
animateFrameStart: 0
animateFrameEnd: 3
animateFrameSpeed: 0.5
alpha:1
scaleFrom: 0.5
scaleTo: 0.5
[movement]
movementType: AIR
targetHeight: 35
targetHeightDrift: 1
moveSpeed: 4
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0
joinsGroupFormations: false
maxTurnSpeed: 5
turnAcceleration: 0.05
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  -1
slowDeathFall: true
slowDeathFallSmoke: false
[ai]
upgradedFrom:航空母舰T1
[action_速度升级]
autoTrigger:if self.resource.SDDS<self.customTarget1.resource.SDDS and self.globalTeamTags(includes="EW")
[action_能量升级]
autoTrigger:if self.resource.NNDS<self.customTarget1.resource.NNDS and self.globalTeamTags(includes="EW")
[action_射速升级]
autoTrigger:if self.resource.SSDS<self.customTarget1.resource.SSDS and self.globalTeamTags(includes="EW")
[action_射程升级]
autoTrigger:if self.resource.SCDS<self.customTarget1.resource.SCDS and self.globalTeamTags(includes="EW")
[action_伤害升级]
autoTrigger:if self.resource.SHDS<self.customTarget1.resource.SHDS and self.globalTeamTags(includes="EW")
[hiddenAction_洗点数K]
autoTrigger:if self.globalTeamTags(includes="EW") and (self.resource.DSK==2 or (self.resource.SDDS+self.resource.XLDS+self.resource.SHDS+self.resource.HDDS+self.resource.SCDS+self.resource.SSDS+self.resource.NNDS+self.resource.GCDS>self.customTarget1.resource.SDDS+self.customTarget1.resource.XLDS+self.customTarget1.resource.SHDS+self.customTarget1.resource.HDDS+self.customTarget1.resource.SCDS+self.customTarget1.resource.SSDS+self.customTarget1.resource.NNDS+self.customTarget1.resource.GCDS))
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_SJEW]
autoTrigger:false
autoTriggerOnEvent:NONE
[hiddenAction_JY]
autoTriggerOnEvent:killedAnyUnit
autoTrigger:if self.resource.CHZ>0
takeResources_includeReference:self.customTarget1
takeResources_directTransferStoppingAtZero:true
takeResources:CHZ=-999999999
[hiddenAction_dj]
autoTrigger:false
[hiddenAction_dj2]
autoTrigger:false
[hiddenAction_dj3]
autoTriggerOnEvent:NONE