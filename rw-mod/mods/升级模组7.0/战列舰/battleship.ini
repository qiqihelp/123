[core]
name: 战列舰T1
displayDescription:战列舰是海上的霸主\n他拥有极高的性价比与较高的射程\n是争夺海权的主力军\n只能对地，无法反潜和防空\n便宜的造价与两管炮塔注定了战列舰是海军中的佼佼者\nby;猫6203
class: CustomUnitMetadata
price: 1500
maxHp: 1200
mass: 6000
techLevel: 1
buildSpeed: 0.001
availableInDemo: true
overrideAndReplace:battleship
radius: 20
builtFrom_1_name: seaFacTory
builtFrom_1_pos:  5
numBitsOnDeath:0
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 战列舰T2
price:  3000
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.2
ai_isHighPriority:true
[graphics]
image:        battle_ship_t2.png
image_wreak:  battle_ship_t2_dead.png
image_turret: battle_ship_t2_turret.png
image_shadow: AUTO
shadowOffsetX:4
shadowOffsetY:4
splastEffect: true
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 17
turretTurnSpeed: 1.8
maxAttackRange: 240
shootDelay: 120
turretMultiTargeting: true
[turret_1]
x: 0
y: 22
shoot_sound:cannon_firing
shoot_sound_vol:0.3
shoot_flame:small
shoot_light:#FFEECCCC
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
projectile: 1
recoilOffset: -3
idleDir:0
idleDirReversing: -145
[turret_2]
copyFrom: 1
x: 0
y: 4
projectile: 1
idleDir:0
idleDirReversing: 125
warmup:30
delay:92
[projectile_1]
life: 150
speed: 4
drawType:0
drawSize:2
directDamage: 65
color: #ffe92b
lightColor: #ffe92b
lightSize: 0.6
[movement]
movementType: WATER
moveSpeed: 0.8
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.05
reverseSpeedPercentage:1
maxTurnSpeed: 1.5
turnAcceleration: 0.3
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.战列舰T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:战列舰T1
[global_resource_战列舰T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90