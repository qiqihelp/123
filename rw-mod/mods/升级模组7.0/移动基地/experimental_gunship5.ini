[core]
name: 泰坦型移动基地
displayText: 泰坦型移动基地
displayDescription:泰坦型移动基地。\n虽说是陆军单位，但风格却与海军格外相似\n部署时射程非常远\n有着超强的闪现能力，适合闪过敌方防线直接打击。\n（此处修改了屑大小姐的一处错误(ಡωಡ) ）\n这个基地，十分的珍贵(\n当然，其实应该叫支援悬浮坦克的，\n但鸽子太懒(，所以还是叫移动基地(\nby威严な大小姐
