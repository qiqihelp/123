[core]
name: 重型对地导弹坦克T1
displayDescription:更大更酷的造型，让他们的炮塔吃点苦头吧。\nby小空
class: CustomUnitMetadata
price: 107500
maxHp:11000
mass: 18000
techLevel: 2
fogOfWarSightRange: 34
buildSpeed:0.000040000
availableInDemo: false
transportSlotsNeeded: 4
radius: 34
softCollisionOnAll: 17
builtFrom_1_name: landFacTory
builtFrom_1_pos:  5
maxShield:7000
shieldRegen:1.5
[hiddenAction_毒圈]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield>=self.maxShield()/100
addResourcesWithLogic:shield=-0.083333*self.maxShield()
[hiddenAction_毒圈1]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield<self.maxShield()/100
addResourcesWithLogic:hp=-0.083333*self.maxShield()
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T5") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 重型对地导弹坦克T2
price:  100000
text: 升级T5
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.0005
pos: 0.05
ai_isHighPriority:true
[graphics]
image_shield:ROOT:/素材/护盾1.png
imageScale:0.9
total_frames: 3
image:        missile_tank1.png
image_wreak:  experimental_tank_dead.png
image_turret: missile_tank_turret8.png
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 3
dustEffect: true
scaleTurretImagesTo:24
[attack]
canAttack: true
canAttackFlyingUnits:false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
canAttackNotTouchingWaterUnits:true
turretSize: 30
turretTurnSpeed: 2.5
maxAttackRange: 480
shootDelay: 230
[turret_1]
x: 0
y: -6
canShoot: false
shouldResetTurret: true
recoilOffset: -6
recoilOutTime: 5
recoilReturnTime: 7
[turret_2]
x: -7
y: 0
attachedTo: 1
slave: true
warmup: 2
shoot_sound:missile_fire
shoot_sound_vol:0.2
shoot_flame:small
shoot_light:#FFEECCCC
invisible: true
projectile:1
canAttackFlyingUnits: false
canAttackLandUnits:   true
[turret_3]
x: 7
y: 0
copyFrom: 2
linkDelayWithTurret:2
warmup: 30
[projectile_1]
directDamage:500
life: 240
speed: 0.58
targetSpeed: 9.6
trailEffect: true
largeHitEffect: true
areaDamage: 250
areaRadius: 56
autoTargetingOnDeadTarget: true
autoTargetingOnDeadTargetRange:230
wobbleAmplitude: 1.0
wobbleFrequency: 0.7s
deflectionPower:12.5
frame: 0
shadowFrame:1
drawType:1
areaRadiusFromEdge:true
[movement]
movementType: LAND
moveSpeed:1.08
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.17
reverseSpeedPercentage:1
maxTurnSpeed: 2.1
turnAcceleration: 0.5
moveSlidingMode :false
moveIgnoringBody:false
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.对地导弹坦克T1>3) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T5") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:对地导弹坦克T1
[global_resource_对地导弹坦克T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_护盾升级]
@copyFromSection:action_效率升级
id:${core.price}+4
iconExtraImage:ROOT:素材/护盾K.png
isVisible:if self.globalTeamTags(includes="EW") and self.maxShield()>0
text:升级护盾[%{self.resource.HDDS}]
description:增加基础的2倍
setUnitStats:maxShield=self.maxShield()*(1+2/(2*self.resource.HDDS-1)),shield=self.shield()*(1+2/(2*self.resource.HDDS-1)),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS)
addResourcesWithLogic:HDDS=1
[decal_护盾升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.HDDS>0,1,-1)
isVisible:if self.resource.HDDS!=0
frame:min(select(self.resource.HDDS>0,self.resource.HDDS,int(-self.resource.HDDS/0.08))-1,4)
image:ROOT:素材/护盾升级.png
xOffsetAbsolute:0.1*${core.radius}
imageScale:${core.radius}/110