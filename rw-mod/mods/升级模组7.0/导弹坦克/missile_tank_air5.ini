[hiddenAction_lj]
autoTrigger:if not self.hasActiveWaypoint(type='attackmove') and self.globalTeamTags(includes="ydk") and numberOfUnitsInEnemyTeam(withTag="ct",greaterThan=0)
[hiddenAction_splj]
autoTrigger:false
alsoTriggerAction:lj1k,lj2k,lj3
[hiddenAction_lj1k]
addWaypoint_prepend:true
autoTrigger:if (self.x>2600 and numberOfUnitsInTeam(withTag='标记K',lessThan=1) or (self.x>2100 and self.teamId%2==0 and not self.hasActiveWaypoint(type='attackmove'))) and self.globalTeamTags(includes="yd")
addWaypoint_position_offsetFromSelf:-4000,0
addWaypoint_type:attackmove
autoTriggerOnEvent:newWaypointGivenByPlayer,created
requireConditional:if self.globalTeamTags(includes="yd") and (self.teamId%2==0 or self.x>2600) and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
[hiddenAction_lj2k]
@copyFromSection:hiddenAction_lj1k
autoTrigger:if (self.x<=1600 and numberOfUnitsInTeam(withTag='标记K',lessThan=1) or (self.x<=2100 and self.teamId%2!=0 and not self.hasActiveWaypoint(type='attackmove'))) and self.globalTeamTags(includes="yd")
addWaypoint_position_offsetFromSelf:4000,0
requireConditional:if self.globalTeamTags(includes="yd") and (self.teamId%2!=0 or self.x<=1600) and numberOfUnitsInTeam(withTag='标记K',lessThan=1)
[action_速度升级]
@copyFromSection:action_效率升级
