[core]
name:巨型防空导弹坦克
displayDescription:“给我装备最先进的防护罩和动力系统，\n配上最新的[T6]级复合装甲，再来一对超大口径的导弹发射器。”\n“这得花不少钱，先生。”\n“我知道，另外给我来一批这…么大的防空导弹”\n我们在一个T6.5陆军工厂的日志中找到了这段对话。\nby小空
