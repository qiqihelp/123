[core]
name: 防空导弹坦克T1
class: CustomUnitMetadata
price: 2500
maxHp: 1100
mass: 9000
displayDescription:说真的，我永远不知道从哪边飞来的导弹\n这或许才是导弹车最鲜明的特点\n拥有较远的射程与气盾\n较高的血量也使得防空导弹坦克极其棘手\n很难绕过敌人的陆军单位直接对其打击\nby:猫6203
techLevel: 2
fogOfWarSightRange: 20
buildSpeed: 0.0005
availableInDemo: false
overrideAndReplace: missileTank
radius: 17
isBio: false
builtFrom_1_name: landFacTory
builtFrom_1_pos:  5
maxShield: 700
shieldRegen: 0.15
[hiddenAction_毒圈]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield>=self.maxShield()/100
addResourcesWithLogic:shield=-0.083333*self.maxShield()
[hiddenAction_毒圈1]
autoTrigger:if lastDamagedBy.height==114 and self.hasTakenDamage(withinSeconds=1) and self.shield<self.maxShield()/100
addResourcesWithLogic:hp=-0.083333*self.maxShield()
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 防空导弹坦克T2
price:  5000
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.05
ai_isHighPriority:true
[graphics]
total_frames: 2
image:        missile_tank.png
image_wreak:  missile_tank_dead.png
image_turret: missile_tank_turret.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2
dustEffect: true
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turretSize: 1
turretTurnSpeed: 2.5
maxAttackRange: 340
shootDelay: 230
[turret_1]
x: 0
y: -2
canShoot: false
shouldResetTurret: false
idleSpin: 1.5
recoilOffset: -3
recoilOutTime: 5
recoilReturnTime: 7
[turret_2]
x: 7
y: 6
attachedTo: 1
slave: true
invisible: true
warmup: 2
shoot_sound:missile_fire
shoot_sound_vol:0.2
shoot_flame:small
shoot_light:#FFEECCCC
[turret_3]
x: -7
y: 6
invisible: true
copyFrom: 2
linkDelayWithTurret:2
warmup: 15
[projectile_1]
directDamage: 80
life: 240
speed: 0.3
targetSpeed: 5
trailEffect: true
largeHitEffect: true
frame: 4
areaDamage: 40
areaRadius: 35
autoTargetingOnDeadTarget: true
wobbleAmplitude: 1.0
wobbleFrequency: 0.7s
[movement]
movementType: LAND
moveSpeed: 0.6
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.17
reverseSpeedPercentage:1
maxTurnSpeed: 2.1
turnAcceleration: 0.5
moveSlidingMode :false
moveIgnoringBody:false
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.防空导弹坦克T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:防空导弹坦克T1
[global_resource_防空导弹坦克T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_护盾升级]
@copyFromSection:action_效率升级
id:${core.price}+4
iconExtraImage:ROOT:素材/护盾K.png
isVisible:if self.globalTeamTags(includes="EW") and self.maxShield()>0
text:升级护盾[%{self.resource.HDDS}]
description:增加基础的2倍
setUnitStats:maxShield=self.maxShield()*(1+2/(2*self.resource.HDDS-1)),shield=self.shield()*(1+2/(2*self.resource.HDDS-1)),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS)
addResourcesWithLogic:HDDS=1
[decal_护盾升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.HDDS>0,1,-1)
isVisible:if self.resource.HDDS!=0
frame:min(select(self.resource.HDDS>0,self.resource.HDDS,int(-self.resource.HDDS/0.08))-1,4)
image:ROOT:素材/护盾升级.png
xOffsetAbsolute:0.1*${core.radius}
imageScale:${core.radius}/110