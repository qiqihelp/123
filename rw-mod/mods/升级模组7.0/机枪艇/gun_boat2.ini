[core]
name: 机枪艇T3
class: CustomUnitMetadata
price: 6900
maxHp:1530
mass: 3000
techLevel: 1
buildSpeed:0.000555556
availableInDemo: true
displayDescription:经过数次改良，以及参考了某种生物\n我们将它速度再次提高了一个档次\n(by:海军重工)
fogOfWarSightRange:24
radius: 11
transportSlotsNeeded: 3
isBio: false
builtFrom_1_name: seaFacTory
builtFrom_1_pos:  1
numBitsOnDeath:0
[action_upgradeT2]
