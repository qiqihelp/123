[core]
name: 飞行堡垒T2
class: CustomUnitMetadata
price: 90000
maxHp:16000
mass: 90000
isPickableStartingUnit: true
startFallingWhenStartingUnit: true
transportUnitsEachUnitAlwaysUsesSingleSlot:false
transportUnitsRequireTag:ys
transportUnitsRequireMovementType:LAND,HOVER,OVER_CLIFF_WATER,OVER_CLIFF
transportUnitsAddUnloadOption:true
techLevel: 1
experimental: true
buildSpeed:0.000100000
radius: 25
isBio: false
softCollisionOnAll: 3
maxTransportingUnits: 24
nanoFactorySpeed:6
fogOfWarSightRange:18
generation_credits: 12
generation_delay: 40
selfRegenRate:0.8
exit_x:0
exit_y:10
tags:SJ
exit_dirOffset:0
exit_moveAwayAmount:140
[decal_tk]
alwaysStartDirAtZero:true
layer:beforeUI
image: ROOT:运输机/t1.png
imageScaleX:min(self.resource.num/3,1)
imageScaleY:1
xOffsetAbsolute:-43
yOffsetAbsolute:35
onlyWhileAlive:true
[decal_tk1]
@copyFromSection:decal_tk
imageScaleX:max(0,min((self.resource.num-3)/3,1))
xOffsetAbsolute:-32
[decal_tk2]
@copyFromSection:decal_tk
imageScaleX:max(0,min((self.resource.num-6)/3,1))
xOffsetAbsolute:-21
[decal_tk3]
@copyFromSection:decal_tk
imageScaleX:max(0,min((self.resource.num-9)/3,1))
xOffsetAbsolute:-10
[decal_tk4]
@copyFromSection:decal_tk
imageScaleX:max(0,min((self.resource.num-12)/3,1))
xOffsetAbsolute:1
[decal_tk5]
@copyFromSection:decal_tk
imageScaleX:max(0,min((self.resource.num-15)/3,1))
xOffsetAbsolute:12
[decal_tk6]
@copyFromSection:decal_tk
imageScaleX:max(0,min((self.resource.num-18)/3,1))
xOffsetAbsolute:23
[decal_tk7]
@copyFromSection:decal_tk
imageScaleX:max(0,min((self.resource.num-21)/3,1))
xOffsetAbsolute:34
[decal_t]
xOffsetAbsolute:-22
alwaysStartDirAtZero:true
layer:beforeUI
image: ROOT:运输机/t.png
imageScaleX:1
imageScaleY:1
alpha:0.8
yOffsetAbsolute:35
onlyWhileAlive:true
[decal_t1]
@copyFromSection:decal_t
xOffsetAbsolute:22
[hiddenAction_transnum]
autoTriggerOnEvent:transportingNewUnit
addResourcesWithLogic:num=eventSource.resource.tnum
[hiddenAction_transnum1]
autoTriggerOnEvent:transportUnloadedOrRemovedUnit
addResourcesWithLogic:num=-eventSource.resource.tnum
[resource_num]
hidden:true
[hiddenAction_运输]
autoTrigger:false
temporarilyAddTags:ys
[canBuild_1]
isVisible:if self.ammo<1
name: 建造者T2,侦察者T2,战斗工程师T2,坦克T2, 悬浮坦克T2,重型坦克T2, 等离子坦克T2, 猛犸坦克T2, 防空导弹坦克T2,激光坦克T2
[canBuild_2]
isVisible:if self.ammo==1
name: 建造者T1,侦察者T1,战斗工程师T1,坦克T1, 悬浮坦克T1,重型坦克T1, 等离子坦克T1, 猛犸坦克T1, 防空导弹坦克T1,激光坦克T1
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T3") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 飞行堡垒T3
price:  600000
text: 升级T3
description: 大幅度增强\n生产T3陆军单位\n增加运载空间
displayType: Upgrade
buildSpeed: ${ 0.001 / core.nanoFactorySpeed }
pos: 0.2
ai_isHighPriority:true
[action_1]
alwaysSinglePress:true
highPriorityQueue:true
buildSpeed:0
isVisible:if self.ammo<1
text:上级
setResourcesWithLogic:ammo=1
[action_2]
alwaysSinglePress:true
highPriorityQueue:true
buildSpeed:0
isVisible:if self.ammo==1
text:下级
setResourcesWithLogic:ammo=0
[graphics]
total_frames: 1
image:        experimental_dropship1.png
image_wreak:  experimental_dropship_dead.png
image_turret: ROOT:蜘蛛/small_laser_turretT2.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   if not self.flying
canAttackUnderwaterUnits: false
turretSize: 18
turretTurnSpeed: 4
maxAttackRange: 252
shootDelay: 21
turretMultiTargeting: true
[turret_1]
x: -20
y: -17
shoot_sound:plasma_fire
shoot_sound_vol:0.05
shoot_flame:small
shoot_light:#FFccCCEE
recoilOffset: -1
recoilOutTime: 4
recoilReturnTime: 6
[turret_2]
copyFrom: 1
x: 20
y: -17
warmup:5.88
linkDelayWithTurret:1
[projectile_1]
directDamage: 59
life: 70
speed: 8.4
frame: 11
lightColor: #FFccCCEE
lightSize: 0.4
deflectionPower:1.68
[movement]
movementType: AIR
moveSpeed: 1.32
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.018
landOnGround: true
maxTurnSpeed: 1.3
turnAcceleration: 0.05
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  45
slowDeathFall: true
[hiddenAction_3]
autoTrigger:if distanceBetween(self, activeWaypointTarget) <20 and activeWaypointTarget!=nullUnit and self.hasActiveWaypoint(type='move') and not self.isOverLiquid and self.height>30
clearActiveWaypoint:true
[effect_engineTrail]
createWhenZoomedOut: false
priority:low
life: 20
fadeOut: true
attachedToUnit: false
color: #FFEE22
fadeInTime:3
scaleFrom: 0.3
scaleTo: 0.8
alpha: 1.1
ySpeedRelative:-0.7
xSpeedRelativeRandom:0.2
yOffsetRelative: -40
atmospheric: true
stripIndex:effects
frameIndex: 0
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.飞行堡垒T1>1) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T3") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:飞行堡垒T1
[attachment_sp]
addTransportedUnits: false
[action_效率升级]
isVisible:if self.globalTeamTags(includes="EW")
[global_resource_飞行堡垒T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_运输1]
autoTrigger:false
