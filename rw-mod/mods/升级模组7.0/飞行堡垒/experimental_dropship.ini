[core]
name: 飞行堡垒T1
class: CustomUnitMetadata
price: 30000
maxHp: 8000
mass: 90000
transportUnitsEachUnitAlwaysUsesSingleSlot:false
transportUnitsRequireTag:ys
transportUnitsRequireMovementType:LAND,HOVER,OVER_CLIFF_WATER,OVER_CLIFF
transportUnitsAddUnloadOption:true
displayDescription:每秒4+，升级后的完全体是后期极强单位\n当这个东西爬到你家里的时候你就要质问你的空军队友了\nby:猫6203
isPickableStartingUnit: true
startFallingWhenStartingUnit: true
techLevel: 1
experimental: true
buildSpeed: 0.0002
radius: 25
overrideAndReplace: experimentalDropship
isBio: false
softCollisionOnAll: 3
maxTransportingUnits: 12
nanoFactorySpeed:3
generation_credits: 4
generation_delay: 40
selfRegenRate:0.4
builtFrom_1_name: experimenTalLandFacTory
builtFrom_1_pos:  5
canBuild_1_name: builder, scout
canBuild_1_pos:  1
canBuild_2_name: combatEngineer
canBuild_2_pos:  1
canBuild_3_name: Tank, hoverTank
canBuild_3_pos:  2
canBuild_4_name: heavyTank, plasmaTank, mammoThTank, missileTank
canBuild_4_pos:  3
canBuild_5_name: laserTank
canBuild_5_pos:  4
exit_x:0
exit_y:10
tags:SJ
exit_dirOffset:0
exit_moveAwayAmount:140
[hiddenAction_运输]
autoTrigger:false
temporarilyAddTags:ys
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 飞行堡垒T2
price:  60000
text: 升级T2
description: 中幅度增强\n生产T2陆军单位\n增加运载空间
displayType: Upgrade
buildSpeed: 0.0006667
pos: 0.2
ai_isHighPriority:true
[graphics]
showTransportBar:true
total_frames: 1
image:        experimental_dropship.png
image_wreak:  experimental_dropship_dead.png
image_turret: SHARED:small_laser_turret.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   if not self.flying
canAttackUnderwaterUnits: false
turretSize: 18
turretTurnSpeed: 4
maxAttackRange: 210
shootDelay: 25
turretMultiTargeting: true
[turret_1]
x: -20
y: -17
shoot_sound:plasma_fire
shoot_sound_vol:0.05
shoot_flame:small
shoot_light:#FFccCCEE
recoilOffset: -1
recoilOutTime: 4
recoilReturnTime: 6
[turret_2]
copyFrom: 1
x: 20
y: -17
warmup:7
linkDelayWithTurret:1
[projectile_1]
directDamage: 35
life: 70
speed: 7
frame: 11
lightColor: #FFccCCEE
lightSize: 0.4
[movement]
movementType: AIR
moveSpeed: 1.1
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
landOnGround: true
maxTurnSpeed: 1.3
turnAcceleration: 0.05
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  45
slowDeathFall: true
[effect_engineTrail]
createWhenZoomedOut: false
priority:low
life: 20
fadeOut: true
attachedToUnit: false
color: #FFEE22
fadeInTime:3
scaleFrom: 0.3
scaleTo: 0.8
alpha: 1.1
ySpeedRelative:-0.7
xSpeedRelativeRandom:0.2
yOffsetRelative: -40
atmospheric: true
stripIndex:effects
frameIndex: 0
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.飞行堡垒T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:飞行堡垒T1
[attachment_sp]
addTransportedUnits: false
[action_效率升级]
isVisible:if self.globalTeamTags(includes="EW")
[global_resource_飞行堡垒T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_运输1]
autoTrigger:false
[hiddenAction_transnum]
autoTriggerOnEvent:transportingNewUnit
addResourcesWithLogic:num=eventSource.resource.tnum
[hiddenAction_transnum1]
autoTriggerOnEvent:transportUnloadedOrRemovedUnit
addResourcesWithLogic:num=-eventSource.resource.tnum
[resource_num]
hidden:true