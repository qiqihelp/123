[core]
isUnselectable:true
@memory a:number
showInEditor: false
@memory H:number
@memory sjm:number
@memory jsq:number
name: AI规则1
displayText:AI
displayDescription:用于控制AI的核心单位,AI的调教单位
price: 1
maxHp: 1
mass: 1
techLevel: 1
buildSpeed: 0
availableInDemo: false
canNotBeDamaged:true
canNotBeDirectlyAttacked:true
ignoreInUnitCapCalculation:true
showOnMinimap:false
radius: 22
[hiddenAction_jsq]
autoTrigger:true
setUnitMemory:jsq=memory.jsq+1
[hiddenAction_csh]
autoTriggerOnEvent:created
setUnitMemory:sjm=self.x() +self.y()
[hiddenAction_sjm]
autoTrigger:if memory.sjm==self.x() +self.y() and numberOfUnitsInTeam(withTag='侦察者T1',greaterThan=0)
setUnitMemory:sjm= rnd(0,1100) + memory.jsq + self.x() +self.y()
[hiddenAction_a]
autoTrigger:if memory.a==0
setUnitMemory:a=1
addResources: AI1=1,AI2=1,AI4=1,AI5=1,AI10=1,  AI6=1,AI7=1,AI8=1,AI9=1,AI11=1,AI12=1,AI13=1
[hiddenAction_侦察者]
autoTrigger:if numberOfUnitsInTeam(withTag='侦察者T1',greaterThan=3) and self.resource.AI3==0
addResources: AI3=1
[hiddenAction_侦察者2]
autoTrigger:if numberOfUnitsInTeam(withTag='侦察者T1',lessThan=4) and self.resource.AI3==1
addResources: AI3=-1
[hiddenAction_重型机枪机甲]
autoTrigger:if numberOfUnitsInTeam(withTag='重型机枪机甲',greaterThan=2) and self.resource.AI14==1
addResources: AI14=-1
[hiddenAction_重型机枪机甲2]
autoTrigger:if numberOfUnitsInTeam(withTag='重型机枪机甲',lessThan=3) and self.resource.AI14==0
addResources: AI14=1
[hiddenAction_巨象坦克]
autoTrigger:if (numberOfUnitsInTeam(withTag='巨象坦克',greaterThan=2) or self.resource.credits <= 2000000) and self.resource.AI15==1
addResources: AI15=-1
[hiddenAction_巨象坦克2]
autoTrigger:if numberOfUnitsInTeam(withTag='巨象坦克',lessThan=3) and self.resource.AI15==0 and self.resource.credits >= 2000000
addResources: AI15=1
[hiddenAction_un1]
autoTrigger:if (not numberOfUnitsInTeam(withTag='资源抽取器T6',lessThan=1) or self.resource.credits >= 1000000) and self.resource.AI2==1 
addResources: AI2=-1
[hiddenAction_un工厂]
autoTrigger:if (not numberOfUnitsInTeam(withTag='资源抽取器T7',lessThan=1) or self.resource.credits >= 1500000) and self.resource.AI6==1
addResources: AI6=-1,AI7=-1,AI8=-1,AI9=-1,AI12=-1,AI13=-1
[hiddenAction_un工厂2]
autoTrigger:if not numberOfUnitsInTeam(withTag='资源抽取器T9(超频)',lessThan=1) and self.resource.AI4==1
addResources: AI4=-1
[hiddenAction_实验工厂]
autoTrigger:if numberOfUnitsInTeam(withTag='概念型实验工厂',greaterThan=0) and self.resource.AI16==1 and self.resource.credits >=10000000
addResources: AI16=-1
[hiddenAction_实验工厂2]
autoTrigger:if numberOfUnitsInTeam(withTag='概念型实验工厂',lessThan=1) and self.resource.AI16==0 and self.resource.credits >=10000000
addResources: AI16=1
[hiddenAction_实验工厂3]
autoTrigger:if self.resource.AI16==0 and self.resource.credits >=100000000
addResources: AI16=2
[hiddenAction_实验工厂4]
autoTrigger:if self.resource.AI16==2 and self.resource.credits <=100000000
addResources: AI16=-2
[hiddenAction_泰坦型悬浮坦克]
autoTrigger:if self.resource.AI17==1 and self.resource.credits <=15000000
addResources: AI17=-1
[hiddenAction_泰坦型悬浮坦克2]
autoTrigger:if self.resource.AI17==0 and self.resource.credits >=15000000
addResources: AI17=1
[hiddenAction_巨型战列舰]
autoTrigger:if self.resource.AI18==1 and self.resource.credits <=2049000 and (rnd(0,1000)+memory.sjm)%100>=0   and  (rnd(0,1000)+memory.sjm)%100 <=6
addResources: AI18=-1
[hiddenAction_巨型战列舰2]
autoTrigger:if self.resource.AI18==0 and self.resource.credits >=2049000 and (rnd(0,1000)+memory.sjm)%100>=0   and  (rnd(0,1000)+memory.sjm)%100 <=6
addResources: AI18=1
[hiddenAction_蛋生蛋]
autoTrigger:if self.resource.AI20==0 and numberOfUnitsInTeam(withTag='资源抽取器T9(超频)',greaterThan=0) and (rnd(0,1000)+memory.sjm)%100>=0   and  (rnd(0,1000)+memory.sjm)%100 <=int(self.resource.AIH)*2           
addResources: AI20=1
[hiddenAction_蛋生蛋2]
autoTrigger:if self.resource.AI20==1 and       (rnd(0,100000)+memory.sjm)%100>=0       and (rnd(0,100000)+memory.sjm)%100<=2
addResources: AI20=-1
