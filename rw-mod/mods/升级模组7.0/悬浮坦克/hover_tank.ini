[core]
name: 悬浮坦克T1
displayDescription:陆军垃圾海之一的小悬浮\n娇小的体格与极脆的身板\n虽然对空对地，但是伤害较低\n可以跨海使其在海图能有所发挥，惧怕aoe\n我补药被拉去打飞机啊！\nby:猫6203
class: CustomUnitMetadata
price: 450
maxHp: 150
mass: 1000
techLevel: 1
buildSpeed: 0.002
availableInDemo: true
overrideAndReplace:hovertank
radius: 8
displayRadius: 9
fogOfWarSightRange: 15
builtFrom_2_name: landFacTory
builtFrom_2_pos:  2
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 悬浮坦克T2
price:  900
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.2
ai_isHighPriority:true
[graphics]
image:        hover_tank.png
image_wreak:  hover_tank_dead.png
image_turret: NONE
lock_body_rotation_with_main_turret: true
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
splastEffect: true
[attack]
turretRotateWithBody: false
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 7
turretTurnSpeed: 4
maxAttackRange: 140
shootDelay: 90
isFixedFiring: false
[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
projectile: 1
size: 7
turnSpeed: 2.4
shoot_sound:plasma_fire2
shoot_sound_vol:0.7
shoot_flame:NONE
shoot_light:#00FF00
recoilOffset: -1
recoilOutTime: 5
recoilReturnTime: 15
[projectile_1]
directDamage: 23
life: 70
speed: 6
frame: 5
drawType:5
color:#00FF00
[movement]
movementType: HOVER
moveSpeed: 1.0
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.06
targetHeight: 4
targetHeightDrift: 2
maxTurnSpeed: 2.4
turnAcceleration: 0.2
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.悬浮坦克T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:悬浮坦克T1
[hiddenAction_无尽]
buildSpeed:1
requireConditional:if self.resource.credits>=${action_upgradeT2.price}
alsoQueueAction:无尽
autoTrigger:if self.isControlledByAI() and self.resource.credits>${action_upgradeT2.price}-1 and self.globalTeamTags(includes="WJ")
addResources:credits=-${action_upgradeT2.price}
alsoTriggerAction:upgradeT2
[global_resource_悬浮坦克T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90