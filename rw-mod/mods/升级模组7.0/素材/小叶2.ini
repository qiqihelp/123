[core]
copyFrom:小叶1.ini
name: 小叶2
showInEditor:false
isPickableStartingUnit:false
[resource_a]
hidden:true
[resource_b]
hidden:true
[resource_y]
hidden:true
[resource_x]
hidden:true
[hiddenAction_y]
autoTrigger:true
setResourcesWithLogic:x=self.x-self.resource.b
[hiddenAction_x]
autoTrigger:true
setResourcesWithLogic:y=self.y-self.resource.a
[hiddenAction_y1]
autoTrigger:true
setResourcesWithLogic:a=self.y
[hiddenAction_x1]
autoTrigger:true
setResourcesWithLogic:b=self.x
[hiddenAction_上]
autoTrigger:if self.resource.y>0 and self.speed()>0.9
convertTo:小叶1
[hiddenAction_左]
autoTrigger:if self.resource.x<0 and self.speed()>0.9 and (self.resource.y*self.resource.y)<=0.09
convertTo:小叶4
[hiddenAction_右]
autoTrigger:if self.resource.x>0 and self.speed()>0.9 and (self.resource.y*self.resource.y)<=0.09
convertTo:小叶3
[hiddenAction_set]
setBodyRotation:-90
autoTriggerOnEvent:created
[graphics]
total_frames: 3
image:        ROOT:素材/小叶2.png
image_wreak:  ROOT:素材/小叶_睡着.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 1
animation_moving_end: 2
animation_moving_speed: 10