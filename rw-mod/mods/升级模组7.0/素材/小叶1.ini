[core]
name: 小叶1
displayText: 小叶
displayDescription: 兼职工程师的小叶
class: CustomUnitMetadata
price: 3500
maxHp: 1000
mass: 4000
techLevel: 2
buildSpeed: 0.0005
availableInDemo: false
selfRegenRate:0.1
radius: 17
displayRadius: 18
isBuilder: true
canRepairBuildings: true
canRepairUnits : true
canReclaimResources: true
transportSlotsNeeded: 2
nanoRepairSpeed: 0.2
generation_credits: 1
generation_delay: 40
nanoRange: 95
nanoBuildSpeed: 2
autoTriggerCooldownTime:0.6
autoTriggerCooldownTime_allowDangerousHighCPU:true
startFallingWhenStartingUnit:true
isPickableStartingUnit:true
[canBuild_3]
name: reclaim
[canBuild_1]
name: 重型坦克T1,两栖喷气机T1,建造者T1,资源抽取器T1,资源抽取器T2,机枪T1,炮塔T1,闪电炮塔T1,防空炮塔T0,陆军工厂T1.5,空军基地T1.5,机械工厂T1.5,海军基地T1.5,资源制造仪T1,修复湾T1,激光防御塔T1, 战争塔楼T1,实验工厂T1,反核防御T1,核弹发射井T1
forceNano: true
[resource_a]
hidden:true
[resource_b]
hidden:true
[resource_y]
hidden:true
[resource_x]
hidden:true
[hiddenAction_y]
autoTrigger:true
setResourcesWithLogic:x=self.x-self.resource.b
[hiddenAction_x]
autoTrigger:true
setResourcesWithLogic:y=self.y-self.resource.a
[hiddenAction_y1]
autoTrigger:true
setResourcesWithLogic:a=self.y
[hiddenAction_x1]
autoTrigger:true
setResourcesWithLogic:b=self.x
[hiddenAction_上]
autoTrigger:if self.resource.y<0 and self.speed()>0.9
convertTo:小叶2
[hiddenAction_左]
autoTrigger:if self.resource.x<0 and self.speed()>0.9 and (self.resource.y*self.resource.y)<=0.09
convertTo:小叶4
[hiddenAction_右]
autoTrigger:if self.resource.x>0 and self.speed()>0.9 and (self.resource.y*self.resource.y)<=0.09
convertTo:小叶3
[hiddenAction_set]
setBodyRotation:-90
autoTriggerOnEvent:created
[graphics]
total_frames: 3
image:        ROOT:素材/小叶1.png
image_wreak:  ROOT:素材/小叶_睡着.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 1
animation_moving_end: 2
animation_moving_speed: 10
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
turretSize: 3
turretTurnSpeed: 3
maxAttackRange: 170
shootDelay: 50
turretRotateWithBody: false
[turret_1]
x: 0
y: 0
invisible: true
warmup:30
canShoot: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turnSpeedAcceleration: 0.08
[turret_2]
x: 0
y: 30
invisible: true
shoot_sound:plasma_fire
shoot_sound_vol:0.05
shoot_light:#FFccCCEE
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
[turret_3]
invisible: true
x: 0
y: 30
idleDir:0
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: true
canAttackCondition: if self.overwater
projectile: 2
size: 1
turnSpeed: 15
delay: 150
[projectile_1]
directDamage: 30
life: 70
speed: 7
frame: 11
lightColor: #FFccCCEE
lightSize: 0.4
[projectile_2]
directDamage: 45
life: 250
speed: 0.4
targetSpeed: 1.3
drawSize: 1
color: #1E1E96
trailEffect: true
largeHitEffect: true
[movement]
movementType: HOVER
moveSpeed: 1.0
moveAccelerationSpeed: 1
moveDecelerationSpeed: 1
targetHeight: 0.5
targetHeightDrift:0.5
maxTurnSpeed: 0
turnAcceleration: 0
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
[ai]
useAsBuilder: true
upgradedFrom:小叶1
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90