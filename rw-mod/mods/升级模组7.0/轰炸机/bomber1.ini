[core]
name: 轰炸机T2
class: CustomUnitMetadata
price: 12000
maxHp:6000
mass: 20000
techLevel: 2
buildSpeed:0.000125000
availableInDemo: true
displayDescription:我们存在的意义是什么？\n我们在战场中的意义又是什么？\n也许只有那些被炸药抹除的人知道吧\n（by:轰炸机t2驾驶员）
radius: 16
displayRadius: 19
isBio: false
softCollisionOnAll:24
fogOfWarSightRange:18
selfRegenRate:0.2
builtFrom_1_name: airFacTory
builtFrom_1_pos:  6
energyMax: 3.5715
energyRegen: 0.002381
energyNeedsToRechargeToFull: true
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T3") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 轰炸机T3
price:  80000
text: 升级T3
description: 大幅度增强
displayType: Upgrade
buildSpeed: 0.001
pos: 0.2
ai_isHighPriority:true
[graphics]
total_frames: 1
image:        base1.png
image_wreak:  base_dead.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
turretSize: 20
turretTurnSpeed: 1.5
maxAttackRange: 54
shootDelay: 25.2
attackMovement: bomber
[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
projectile: 1
size: 1.1
turnSpeed: 20
energyUsage: 1
[projectile_1]
life: 294
speed: 0.36
targetSpeed: 2.04
drawSize: 1
color: #000000
