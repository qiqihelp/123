[core]
name: 轰炸战斗机
class: CustomUnitMetadata
price: 1932000
maxHp:195000
mass: 80000
displayDescription:轰炸战斗机。\n血很厚，高爆发力，很浓重的威压感。\n飞到敌人阵地上空投出核弹。\n若集群飞来的话，\n想必是件很恐怖的事吧（笑\n但被激光防御克制\n嘛，那样的事情怎么样都好了~\nby威严な大小姐
techLevel: 2
buildSpeed:0.000003846
availableInDemo: true
fogOfWarSightRange:46
radius: 64
displayRadius: 76
isBio: false
softCollisionOnAll:48
selfRegenRate:6.5
builtFrom_1_name: airFacTory
builtFrom_1_pos:  6
energyMax: 15
energyRegen: 0.01
energyNeedsToRechargeToFull: true
[decal_尾焰]
layer:beforeBody
isVisible:true
image: ROOT:/素材/尾焰1.png
imageScale:1
imageScaleY:0.6*self.speed
alpha:rnd(0.8,0.9)
xOffsetRelative:5
yOffsetRelative:-80
onlyWhileAlive:true
[decal_尾焰1]
layer:beforeBody
isVisible:true
image: ROOT:/素材/尾焰1.png
imageScale:1
imageScaleY:0.6*self.speed
alpha:rnd(0.8,0.9)
xOffsetRelative:-5
yOffsetRelative:-80
onlyWhileAlive:true
[graphics]
total_frames: 1
image:        base5.png
image_wreak:  base_dead5.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:4
shadowOffsetY:10
[attack]
canAttack: true
canAttackFlyingUnits:false
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
turretSize: 20
turretTurnSpeed: 1.5
maxAttackRange: 138
shootDelay: 6
attackMovement: bomber
turretMultiTargeting: true
[turret_0]
x:0
y:0
invisible: true
canShoot:true
projectile: 3
[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
canAttackFlyingUnits:false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
projectile: 1
size: 1.1
turnSpeed: 20
energyUsage: 1
[projectile_1]
life: 624
speed: 0.93
targetSpeed: 6.55
drawSize: 1
trailEffect: false
largeHitEffect: true
drawUnderUnits:true
areaRadiusFromEdge:true
targetGround: true
areaDamage: 4810
areaRadius: 130
deflectionPower:39
nukeWeapon:true
image:Aerial_bomb.png
[turret_2]
invisible: true
x: 0
y: 0
idleDir:0
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: true
projectile: 2
size: 1.1
turnSpeed: 20
energyUsage: 1
[projectile_2]
directDamage: 910
life: 624
speed: 0.93
targetSpeed: 5.2
drawSize: 1
trailEffect: false
largeHitEffect: false
image:Aerial_bomb.png
targetGround: false
drawUnderUnits:true
deflectionPower:39
nukeWeapon:true
[projectile_3]
directDamage: 0
life: 0
speed: 0.3
[movement]
movementType: AIR
moveSpeed:2.125
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
landOnGround: onlyIdle
joinsGroupFormations: false
maxTurnSpeed: 1.2
turnAcceleration: 0.04
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  25
slowDeathFall: true
[ai]
upgradedFrom:轰炸机T1
[hiddenAction_lj]
clearAllWaypoints:true
buildSpeed:1
autoTriggerOnEvent:newWaypointGivenByPlayer
autoTrigger:if not self.hasActiveWaypoint() and (self.globalTeamTags(includes="yd") or self.globalTeamTags(includes="ydk"))
addWaypoint_target_nearestUnit_tagged:ct
addWaypoint_type: attack
addWaypoint_target_nearestUnit_team:enemy
unitShownInUIWithProgressBar:false
requireConditional:if self.globalTeamTags(includes="yd") or self.globalTeamTags(includes="ydk")
[hiddenAction_NNHF]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull
addResourcesWithLogic:energy=${core.energyRegen}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[action_能量升级]
@copyFromSection:action_效率升级
id:${core.price}+7
iconExtraImage:ROOT:素材/能量K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级能量[%{self.resource.NNDS}]
description:增加基础的1倍
setUnitStats:maxEnergy=self.maxEnergy*(1+1/self.resource.NNDS),energy=self.energy()*(1+1/self.resource.NNDS)
addResourcesWithLogic:NNDS=1
[decal_能量升级]
alwaysStartDirAtZero:true
imageScaleY:select(self.resource.NNDS>0,1,-1)
total_frames:5
layer:beforeUI
onlyWhileAlive:true
isVisible:if self.resource.NNDS!=0
frame:min(select(self.resource.NNDS>0,self.resource.NNDS,int(-self.resource.NNDS/0.16))-1,4)
image:ROOT:素材/能量.png
xOffsetAbsolute:-0.1*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_KB]
setResourcesWithLogic:kbk=1,NNDS=0.3,SDDS=2
[hiddenAction_KB1]
setResourcesWithLogic:kbk=0,KB=0,NNDS=0,SDDS=2