[core]
name: 巡航反核防御系统
displayDescription:巡航反核防御系统。\n咱第二成功的贴图(第一是紫火导弹(或油咖喱导弹)\n银色の饭盒\n可以保护其范围内免受任何核打击\n(前提是你要保证它有弹药)\n就像某绀珠传五面的月亮一样\n会拦截弹幕(核弹)，不过这个可不会拦截自己的(笑\n价格也是相对十分公道\n就像这个泰坦型坦克一样(笑\nby威严な大小姐
