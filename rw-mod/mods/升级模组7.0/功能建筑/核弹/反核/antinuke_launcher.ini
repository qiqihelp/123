convertTo: 反核防御T2
price:  30000,energy=1
text: 升级T2
description: 可拦截T2、T3核弹
displayType: Upgrade
buildSpeed: 0.002
pos: 0.2
ai_isHighPriority:true
addResources:energy=1,zd=-1
[action_buildAntiNuke]
price:  4000
text: i:gui.actions.buildAntiNuke
description:i:gui.actions.buildAntiNuke.description
displayType: NONE
buildSpeed: 0.0007
pos: 0.2
isActive:if self.ammoIncludingQueued(lessThan=12)
addResources: ammo=1
ai_isDisabled: if self.ammo(greaterThan=3)
iconImage: SHARED:icon_build.png
isLocked:if self.isEnergyEmpty
[action_showAntiNukeCount]
addResources: ammo=1
price:  ammo=1
