class: CustomUnitMetadata
displayLocaleKey: 反核防御T1
overrideAndReplace: AntiNukeLaucher,antiNukeLauncherC
isLockedIfGameModeNoNuke:true
energyMax:1
energyRegen:0
energyStartingPercentage:1
energyNeedsToRechargeToFull:true
price: 15000
maxHp: 2800
mass: 9000
footprint: -1,-1,1,1
