[core]
name:修复核心
class: CustomUnitMetadata
price: 0
mass: 9000
maxHp: 500
showInEditor:false
disableDeathOnZeroHp:true
isUnselectable:true
isUnrepairableUnit:true
canNotBeDirectlyAttacked:true
canNotBeDamaged:true
canNotBeGivenOrdersByPlayer:true
disableAllUnitCollisions:true
ignoreInUnitCapCalculation:true
fogOfWarSightRange:0
techLevel: 1
showOnMinimap:false
buildSpeed:0.001
radius: 0
buildingSelectionOffset: 0
maxTransportingUnits:0
isBuilding: false
autoTriggerCooldownTime:5
stayNeutral:true
createOnAggressiveTeam:true
tags:XFHX
[graphics]
icon_zoomed_out_neverShow:true
image:ROOT:素材/NONE.png
image_wreak:  NONE
image_shadow: NONE
[attack]
canAttack: true
canAttackFlyingUnits: if self.parent.hasActiveWaypoint and self.resource.SHDS>0
canAttackLandUnits:   if self.parent.hasActiveWaypoint and self.resource.SHDS>0
canAttackUnderwaterUnits: if self.parent.hasActiveWaypoint and self.resource.SHDS>0
turretTurnSpeed: 6
maxAttackRange:999999999
shootDelay: 5
disablePassiveTargeting:true
[movement]
movementType: AIR
moveSpeed: 0
maxTurnSpeed: 0
[turret_repairTurret]
canAttackCondition:if not (self.parent.hasActiveWaypoint(type='reclaim') and self.parent.activeWaypointTarget.hp<=14*self.parent.resource.SHDS*self.parent.resource.XL)
x: 0
y: 0
size:0
canShoot: true
invisible: true
projectile:XF
altProjectile:XF1
altProjectileCondition:if self.parent.hasActiveWaypoint(type='reclaim')
[action_伤害升级]
autoTrigger:if self.resource.SHDS!=self.parent.resource.SHDS
setUnitStats:shootDamageMultiplier=1.4*self.parent.resource.SHDS*self.parent.resource.XL
setResourcesWithLogic:SHDS=self.parent.resource.SHDS
addResourcesWithLogic:hp=0
[hiddenAction_XLHF]
addWaypoint_target_fromReference:self.parent.activeWaypointTarget
addWaypoint_type:attack
autoTrigger:if self.parent.hasActiveWaypoint(type='repair') and self.resource.SHDS>0 and self.parent.activeWaypointTarget.completed() and distanceBetweenSquared(self,self.parent.activeWaypointTarget)<=self.parent.resource.XLSC*(1+0.2*self.parent.resource.SCDS+0.01*self.parent.resource.SCDS*self.parent.resource.SCDS) and not self.hasActiveWaypoint(type='attack')
[hiddenAction_XLHF1]
addWaypoint_target_fromReference:self.parent.activeWaypointTarget
addWaypoint_type:attack
autoTrigger:if self.parent.hasActiveWaypoint(type='reclaim') and self.resource.SHDS>0 and self.parent.activeWaypointTarget.completed() and distanceBetweenSquared(self,self.parent.activeWaypointTarget)<=self.parent.resource.XLSC*(1+0.2*self.parent.resource.SCDS+0.01*self.parent.resource.SCDS*self.parent.resource.SCDS) and self.parent.activeWaypointTarget.hp>14*self.parent.resource.SHDS*self.parent.resource.XL and not self.parent.activeWaypointTarget.hasTags(includes='zjxz') and not self.hasActiveWaypoint(type='attack')
[hiddenAction_XLHFK]
autoTrigger:if (self.activeWaypointTarget!=self.parent.activeWaypointTarget and self.hasActiveWaypoint) or (self.parent.hasActiveWaypoint(type='reclaim') and self.parent.activeWaypointTarget.hp<=14*self.parent.resource.SHDS*self.parent.resource.XL)
clearAllWaypoints:true
[projectile_XF]
life: 24
instant:true
directDamage: -1
explodeEffect: NONE
explodeEffectOnShield: NONE
shieldDefectionMultiplier:0
shieldDamageMultiplier:0
friendlyFire:true
[projectile_XF1]
life: 24
instant:true
directDamage: 5
explodeEffect: NONE
explodeEffectOnShield: NONE
shieldDefectionMultiplier:0
shieldDamageMultiplier:0
friendlyFire:true
[hiddenAction_KB2]
setUnitStats:shootDamageMultiplier=1.4*self.resource.SHDS*self.parent.resource.XL
[resource_XL]
hidden:true
[resource_XLSC]
hidden:true
[hiddenAction_ZLLJK]
autoTrigger:false
[hiddenAction_SJEW]
autoTrigger:false
autoTriggerOnEvent:NONE