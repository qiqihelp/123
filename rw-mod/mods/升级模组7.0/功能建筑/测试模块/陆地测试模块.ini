[core]
@memory all:number
@memory s:number
@memory pdps:float
@memory maxdps:number
@memory maxpdps:float
name: 陆地测试模块
class: CustomUnitMetadata
price: 0
maxHp: 10000000
mass: 9000
disableDeathOnZeroHp: true
displayLocaleKey: 3
footprint: 0,0,1,1
constructionFootprint:0,0,1,1
buildingToFootprintOffsetX:20
buildingToFootprintOffsetY:20
techLevel: 1
buildSpeed: 0.0008
radius: 16
buildingSelectionOffset: -8
isBuilding: true
[graphics]
image:        turret_base.png
image_wreak:  turret_base_dead.png
scaleImagesTo:30
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
[attack]
canAttack: false
[movement]
targetHeight:6
movementType: OVER_CLIFF_WATER
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
[ai]
buildPriority: 0.22
noneInBaseExtraPriority: 0.17
maxEachBase: 3
[hiddenAction_csh]
autoTriggerOnEvent: created
setUnitMemory:s=0,all=0,maxdps=0,maxpdps=0
[hiddenAction_gx]
autoTrigger:true
setUnitMemory:s=memory.s+1,all=memory.all+self.resource.dps,maxdps=select(memory.maxdps>self.resource.dps,memory.maxdps,self.resource.dps),pdps=memory.all/memory.s,maxpdps=select(memory.maxpdps>memory.pdps,memory.maxpdps,memory.pdps)
[resource_dps]
displayName: dps
displayColor: #000000
hidden: true
[action_dps]
isVisible: true
text: 秒伤(dps)
description: 秒伤(dps):%{self.resource.dps}
autoTrigger: true
setResourcesWithLogic: dps=self.maxHp-self.hp
setUnitStats: hp=self.maxHp
isActive: false
buildSpeed: 0s
[action_pdps]
isVisible: true
text: 平均秒伤
description: 平均秒伤:%{memory.pdps}
isActive: false
buildSpeed: 0s
[action_maxdps]
isVisible: true
text: 最大秒伤
description: 最大秒伤:%{memory.maxdps}
isActive: false
buildSpeed: 0s
[action_maxpdps]
isVisible: true
text: 最大平均秒伤
description: 最大平均秒伤:%{memory.maxpdps}
isActive: false
buildSpeed: 0s
[action_qk]
isVisible: true
text: 清空
description: 清空
buildSpeed: 0s
setUnitMemory:s=0,all=0,maxdps=0,maxpdps=0,pdps=0