[core]
@memory all:number
@memory s:number
@memory pdps:float
@memory maxdps:number
@memory maxpdps:float
name: 深水测试模块
class: CustomUnitMetadata
price: 0
maxHp: 10000000
mass: 999999999
disableDeathOnZeroHp: true
displayLocaleKey: 1
footprint: 0,0,1,1
constructionFootprint:0,0,1,1
buildingToFootprintOffsetX:20
buildingToFootprintOffsetY:20
techLevel: 3
buildSpeed: 0.0008
radius: 16
buildingSelectionOffset: -8
[graphics]
image:        turret_base.png
image_wreak:  turret_base_dead.png
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turretSize: 12
turretTurnSpeed: 6
maxAttackRange: 250
shootDelay: 80
[turret_1]
x: 0
y: 6
shoot_sound:missile_fire
shoot_sound_vol:0.3
shoot_flame:small
shoot_light:#FFEECCCC
shouldResetTurret: false
idleSpin: 0.8
recoilOffset: -3
recoilOutTime: 6
recoilReturnTime: 12
[projectile_1]
directDamage: 60
life: 240
speed: 0.3
targetSpeed: 6
trailEffect: true
frame: 4
autoTargetingOnDeadTarget: true
initialUnguidedSpeedY:8
[movement]
movementType: WATER
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
targetHeight: -8
[ai]
buildPriority: 0.22
noneInBaseExtraPriority: 0.17
maxEachBase: 3
[hiddenAction_csh]
autoTriggerOnEvent: created
setUnitMemory:s=0,all=0,maxdps=0,maxpdps=0
[hiddenAction_gx]
autoTrigger:true
setUnitMemory:s=memory.s+1,all=memory.all+self.resource.dps,maxdps=select(memory.maxdps>self.resource.dps,memory.maxdps,self.resource.dps),pdps=memory.all/memory.s,maxpdps=select(memory.maxpdps>memory.pdps,memory.maxpdps,memory.pdps)
[resource_dps]
displayName: dps
displayColor: #000000
hidden: true
[action_dps]
isVisible: true
text: 秒伤(dps)
description: 秒伤(dps):%{self.resource.dps}
autoTrigger: true
setResourcesWithLogic: dps=self.maxHp-self.hp
setUnitStats: hp=self.maxHp
isActive: false
buildSpeed: 0s
[action_pdps]
isVisible: true
text: 平均秒伤
description: 平均秒伤:%{memory.pdps}
isActive: false
buildSpeed: 0s
[action_maxdps]
isVisible: true
text: 最大秒伤
description: 最大秒伤:%{memory.maxdps}
isActive: false
buildSpeed: 0s
[action_maxpdps]
isVisible: true
text: 最大平均秒伤
description: 最大平均秒伤:%{memory.maxpdps}
isActive: false
buildSpeed: 0s
[action_qk]
isVisible: true
text: 清空
description: 清空
buildSpeed: 0s
setUnitMemory:s=0,all=0,maxdps=0,maxpdps=0,pdps=0