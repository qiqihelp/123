[core]
name: 资源制造仪T1
class: CustomUnitMetadata
price: 2200
maxHp: 500
mass: 9000
displayLocaleKey: 资源制造仪T1
overrideAndReplace: fabricator,fabricatorT1
tags:dan
generation_resources: credits=2
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
techLevel: 1
buildSpeed: 0.0005
radius: 20
isBuilding: true
fireTurretXAtSelfOnDeath: explode
[hiddenAction_d]
autoTrigger:if not self.hasTags(includes='d1') and self.globalTeamTags(includes="GX")
temporarilyAddTags:d1
[action_explosion]
text:自爆
description:将自身资源制造仪自爆
addResources: hp=-2100000000
isVisible: if self.teamDefeatedTech()
[action_upgradeT2]
convertTo: 资源制造仪T2
price:  4400
text: i:gui.actions.upgradeT2
description: 经济加成升级为6，稍高的血量，更高的自爆伤害
displayType: upgrade
buildSpeed: 0.002
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
ai_isHighPriority:true
[animation_idle]
onActions : idle
body_0s: {frame:2}
body_0.4s: {frame:2}
body_0.6s: {frame:0}
body_0.8s: {frame:0}
body_1.3s: {frame:2}
[graphics]
total_frames: 3
image:        fabricatorT1.png
image_wreak:  fabricator_dead.png
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0
[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
[turret_explode]
x:0
y:0
canShoot:false
projectile:explode
[projectile_explode]
life:99
instant: true
speed: 1
largeHitEffect: true
frame: 0
shadowFrame:1
drawType:1
targetGround: true
areaDamage: 350
areaRadius: 90
areaExpandTime:35
deflectionPower:-1
lightColor: #FFEEEE00
lightSize: 1
friendlyFire: true
[ai]
buildPriority: 0.1
noneInBaseExtraPriority: 0.04
noneGlobalExtraPriority: 0.1
maxEachBase: 1
maxGlobal: 5
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.资源制造仪T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[global_resource_资源制造仪T1]
hidden:true