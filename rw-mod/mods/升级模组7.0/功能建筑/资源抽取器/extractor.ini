[core]
name: 资源抽取器T1
displayLocaleKey: 资源抽取器T1
copyFrom: extractor_common.ini
price: 700
maxHp: 800
techLevel: 1
buildSpeed: 0.0010
overrideAndReplace: extractor,extractorT1
generation_resources: credits=22
[hiddenAction_k]
autoTrigger:if not self.hasTags(includes='k1') and self.globalTeamTags(includes="GX")
temporarilyAddTags:k1
[action_add1]
autoTriggerOnEvent:created
addResources:auto=1
isVisible:false
[resource_auto]
displayName:auto
hidden:true
[action_upgradeT2]
convertTo: 资源抽取器T2
price:  1400
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T0") and self.resource.等级<2
isLockedMessage:暂未开放等级
text: 经济加成升级为55
displayType: upgrade
buildSpeed: 0.002
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
ai_isHighPriority:true
addResources:ammo=-1
pos:1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
pos:2
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
pos:3
[hiddenAction_2]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.isControlledByAI() or self.resource.资源抽取器>0) and self.ammo(lessThan=1) and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T0") or self.resource.等级>1)
addResources:credits=-${action_upgradeT2.price},ammo=1
alsoQueueAction:upgradeT2
[global_resource_等级]
hidden:true
[animation_idle]
onActions : idle
body_0s: {frame:0}
body_0.8s: {frame:3}
body_1.0s: {frame:3}
pingPong:true
[graphics]
image:        extractor.png
[global_resource_资源抽取器]
hidden:true