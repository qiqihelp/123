[core]
name: 资源抽取器T2
altNames:资源抽取器t2
displayLocaleKey: 资源抽取器T2
displayText: 资源抽取器T2
copyFrom: extractor_common.ini
price: 2100
maxHp:1600
techLevel: 1
buildSpeed:0.000500000
fogOfWarSightRange:18
generation_resources: credits=55
[hiddenAction_k]
autoTrigger:if not self.hasTags(includes='k2') and self.globalTeamTags(includes="GX")
temporarilyAddTags:k2
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T3") and self.globalTeamTags(includes="T0") and self.resource.等级<3
isLockedMessage:暂未开放等级
convertTo: 资源抽取器T3
price:  14000
text: 经济加成升级为147
displayType: upgrade
buildSpeed: 0.001
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
ai_isHighPriority:true
addResources:ammo=-1
pos:1
[action_add1]
autoTriggerOnEvent:created
addResources:auto=1
isVisible:false
[resource_auto]
displayName:auto
hidden:true
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,ammo=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_2]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.isControlledByAI() or self.resource.资源抽取器>1) and self.ammo(lessThan=1) and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T3") or not self.globalTeamTags(includes="T0") or self.resource.等级>2)
addResources:credits=-${action_upgradeT2.price},ammo=1
alsoQueueAction:upgradeT2
pos:3
[global_resource_等级]
hidden:true
[hiddenAction_卡bug警告]
autoTrigger:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T0") and self.resource.等级<2
showMessageToPlayer:检测到您正在进行卡bug行为,为表鼓励,强制付费(-1400)给您升级到T1资源抽取器
convertTo: 资源抽取器T1
addResources:credits=1400
[animation_idle]
onActions : idle
body_0s: {frame:0}
body_0.8s: {frame:3}
body_1.0s: {frame:3}
pingPong:true
[graphics]
image:        extractor1.png
[global_resource_资源抽取器]
hidden:true