[core]
name: 战争塔楼T1
class: CustomUnitMetadata
displayDescription:完美的反向裂缝发生器
tags: watchtower
price: 1500
maxHp: 1500
mass: 9000
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
overrideAndReplace:outpostT1
techLevel: 1
buildSpeed: 0.0005
radius: 20
isBuilding: true
fogOfWarSightRange: 34
fogOfWarSightRangeWhileNotBuilt: 15
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 战争塔楼T2
text: 升级T2
description: 小幅度增强探测范围
price:  3000
displayType: upgrade
buildSpeed: 0.002
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
[action_R1]
buildSpeed:1
text:${action_upgradeT2.text}范围开关
setResourcesWithLogic:ammo=1-self.ammo
allowMultipleInQueue:false
alwaysSinglePress:true
highPriorityQueue:true
[decal_R1]
alwaysStartDirAtZero: true
layer: beforeUI
image: ROOT:炮塔/炮塔贴图/ring.png
imageScale: ${core.fogOfWarSightRange * 20 - 40}*1.2/500
onlyWhenSelectedByOwnPlayer:true
isVisible:if self.ammo==1
alpha: 0.4
[graphics]
image:        outpost.png
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 640
showRangeUIGuide:true
[movement]
movementType: NONE
moveSpeed: 0
maxTurnSpeed: 0
[ai]
maxGlobal: 0
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.战争塔楼T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[global_resource_战争塔楼T1]
hidden:true
[action_射程升级]
isVisible:if self.globalTeamTags(includes="EW")
text:升级视野[%{self.resource.SCDS}]
description:增加基础的0.1倍
setUnitStats:fogOfWarSightRange=${core.fogOfWarSightRange}*(1+0.1*self.resource.SCDS),maxAttackRange=${attack.maxAttackRange}*(1+0.1*self.resource.SCDS)
[decal_射程升级]
isVisible:if self.resource.SCDS!=0
[hiddenAction_KB2]
setUnitStats:movespeed=${movement.moveSpeed}*(1+0.2*self.resource.SDDS),shootDamageMultiplier=1+1.4*self.resource.SHDS,hp=self.hp*${core.maxHp}*(1+1.4*self.resource.XLDS)/self.maxHp,maxHp=${core.maxHp}*(1+1.4*self.resource.XLDS),selfRegenRate=${core.selfRegenRate}*(1+1.4*self.resource.XLDS),shield=select(self.maxShield==0,0,self.shield*${core.maxShield}*(1+2*self.resource.HDDS)/self.maxShield),maxShield=${core.maxShield}*(1+2*self.resource.HDDS),shieldRegen=${core.shieldRegen}*(1+2*self.resource.HDDS),maxAttackRange=${attack.maxAttackRange}*(1+0.1*self.resource.SCDS),fogOfWarSightRange=${core.fogOfWarSightRange}*(1+0.1*self.resource.SCDS),shootDelayMultiplier=1/(self.resource.SSDS+1),energy=select(self.maxEnergy==0,0,self.energy()*${core.energyMax}*(1+self.resource.NNDS)/self.maxEnergy),maxEnergy=${core.energyMax}*(1+self.resource.NNDS),nanoFactorySpeed=${core.nanoFactorySpeed }*(1+self.resource.GCDS),maxTurnSpeed=${movement.maxTurnSpeed},nanoRange=${core.nanoRange}*(1+0.1*self.resource.SCDS)