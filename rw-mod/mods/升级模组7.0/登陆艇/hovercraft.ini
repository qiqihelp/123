[core]
name: 登陆艇T1
class: CustomUnitMetadata
price: 600
maxHp: 450
mass: 12000
displayDescription:登陆战一般必备单位\n虽然很多时候会被运输机抢活 笑)\n是个海军单位,但是ai经常在陆军厂出它\nby:新人写手天使酱
transportUnitsEachUnitAlwaysUsesSingleSlot:false
transportUnitsRequireTag:ys
transportUnitsRequireMovementType:LAND,HOVER,OVER_CLIFF_WATER,OVER_CLIFF
transportUnitsAddUnloadOption:true
displayLocaleKey: 登陆艇T1
overrideAndReplace: hovercraft
techLevel: 1
buildSpeed: 0.003
availableInDemo: true
radius: 15
displayRadius: 15
maxTransportingUnits: 4
softCollisionOnAll: 0
tags:SJ
[hiddenAction_运输]
autoTrigger:false
temporarilyAddTags:ys
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 登陆艇T2
price:  1200
text: 升级T2
description: 中幅度增强\n增加运载能力
displayType: Upgrade
buildSpeed: 0.002
pos: 0.2
[hiddenAction_trigger_onWater]
autoTrigger: if self.overWater() and self.maxMoveSpeed==0.9
setUnitStats:movespeed=1.2
[hiddenAction_trigger_onLand]
autoTrigger: if not self.overWater() and self.maxMoveSpeed==1.2
setUnitStats:movespeed=0.9
[graphics]
showTransportBar:true
image:        hovercraft.png
image_wreak:  hovercraft_dead.png
image_turret: NONE
splastEffect: true
image_shadow: AUTO
shadowOffsetX:0
shadowOffsetY:1
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0
shootDelay: 0
[movement]
movementType: HOVER
moveSpeed: 0.9
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.03
targetHeight: 1.5
targetHeightDrift: 1.4
maxTurnSpeed: 1.5
turnAcceleration: 0.1
heightChangeRate:1.8
moveSlidingMode :false
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.登陆艇T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:登陆艇T1
[attachment_sp]
addTransportedUnits: false
[hiddenAction_spljk]
autoTrigger:false
[hiddenAction_splj]
autoTrigger:false
autoTriggerOnEvent:NONE
[hiddenAction_ljk]
autoTriggerOnEvent:NONE
[hiddenAction_lj3]
autoTriggerOnEvent:NONE
autoTrigger:false
[hiddenAction_lj]
autoTrigger:false
[global_resource_登陆艇T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_运输1]
autoTrigger:false
[hiddenAction_transnum]
autoTriggerOnEvent:transportingNewUnit
addResourcesWithLogic:num=eventSource.resource.tnum
[hiddenAction_transnum1]
autoTriggerOnEvent:transportUnloadedOrRemovedUnit
addResourcesWithLogic:num=-eventSource.resource.tnum
[resource_num]
hidden:true