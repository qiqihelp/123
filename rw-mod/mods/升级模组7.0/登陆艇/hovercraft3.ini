[core]
name: 重型登陆艇T1
displayDescription:把你所有笨重的东西都塞进去吧，\n但是要小心别在路上被攻击了，它无法保护里面运输的单位。\nby小空
class: CustomUnitMetadata
price: 25800
maxHp:5625
mass: 24000
displayLocaleKey: 重型登陆艇T1
transportUnitsEachUnitAlwaysUsesSingleSlot:false
transportUnitsRequireTag:ys
transportUnitsRequireMovementType:LAND,HOVER,OVER_CLIFF_WATER,OVER_CLIFF
transportUnitsAddUnloadOption:true
techLevel: 1
buildSpeed:0.000240000
availableInDemo: true
fogOfWarSightRange: 29
radius: 30
displayRadius: 30
maxTransportingUnits: 16
softCollisionOnAll: 15
tags:SJ
[hiddenAction_运输]
autoTrigger:false
temporarilyAddTags:ys
[action_1]
highPriorityQueue:true
alwaysSinglePress:true
isActive:if not self.isOverLiquid
buildSpeed:1
text:快速卸载
forceUnloadTransportNow:true
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T5") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 重型登陆艇T2
price:  24000
text: 升级T5
description: 中幅度增强\n增加运载能力
displayType: Upgrade
buildSpeed: 0.0005
pos: 0.2
[hiddenAction_trigger_onWater]
autoTrigger: if self.overWater() and self.maxMoveSpeed==1.62
setUnitStats:movespeed=2.16
[hiddenAction_trigger_onLand]
autoTrigger: if not self.overWater() and self.maxMoveSpeed==2.16
setUnitStats:movespeed=1.62
[graphics]
showTransportBar:true
image:        hovercraft3.png
image_wreak:  hovercraft_dead2.png
image_turret: NONE
splastEffect: true
image_shadow: AUTO
shadowOffsetX:0
shadowOffsetY:2
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0
shootDelay: 0
[movement]
movementType: HOVER
moveSpeed:1.62
moveAccelerationSpeed: 0.048
moveDecelerationSpeed: 0.048
targetHeight: 1.5
targetHeightDrift: 1.4
maxTurnSpeed: 1.5
turnAcceleration: 0.1
reverseSpeedPercentage:1
moveSlidingMode :false
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.登陆艇T1>3) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T5") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:登陆艇T1
[attachment_sp]
addTransportedUnits: false
[hiddenAction_spljk]
autoTrigger:false
[hiddenAction_splj]
autoTrigger:false
autoTriggerOnEvent:NONE
[hiddenAction_ljk]
autoTriggerOnEvent:NONE
[hiddenAction_lj3]
autoTriggerOnEvent:NONE
autoTrigger:false
[hiddenAction_lj]
autoTrigger:false
[global_resource_登陆艇T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_运输1]
autoTrigger:false
[hiddenAction_transnum]
autoTriggerOnEvent:transportingNewUnit
addResourcesWithLogic:num=eventSource.resource.tnum
[hiddenAction_transnum1]
autoTriggerOnEvent:transportUnloadedOrRemovedUnit
addResourcesWithLogic:num=-eventSource.resource.tnum
[resource_num]
hidden:true