[core]
name: 巨型登陆艇
class: CustomUnitMetadata
price: 269800
maxHp:29250
mass: 48000
displayDescription:它能压步兵吗？\n不能
displayLocaleKey: 巨型登陆艇
transportUnitsEachUnitAlwaysUsesSingleSlot:false
transportUnitsRequireTag:ys
transportUnitsRequireMovementType:LAND,HOVER,OVER_CLIFF_WATER,OVER_CLIFF
transportUnitsAddUnloadOption:true
techLevel: 1
buildSpeed:0.000046154
availableInDemo: true
fogOfWarSightRange: 46
radius: 60
displayRadius: 60
maxTransportingUnits: 64
softCollisionOnAll: 30
tags:SJ
[hiddenAction_运输]
autoTrigger:false
temporarilyAddTags:ys
[action_1]
highPriorityQueue:true
alwaysSinglePress:true
isActive:if not self.isOverLiquid
buildSpeed:1
text:快速卸载
forceUnloadTransportNow:true
[hiddenAction_trigger_onWater]
autoTrigger: if self.overWater() and self.maxMoveSpeed==2.25
setUnitStats:movespeed=3
[hiddenAction_trigger_onLand]
autoTrigger: if not self.overWater() and self.maxMoveSpeed==3
setUnitStats:movespeed=2.25
[graphics]
image:        hovercraft5.png
image_wreak:  hovercraft_dead1.png
image_turret: NONE
splastEffect: true
image_shadow: AUTO
shadowOffsetX:0
shadowOffsetY:4
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0
shootDelay: 0
[movement]
movementType: OVER_CLIFF_WATER
moveSpeed:2.25
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
targetHeight: 1.5
targetHeightDrift: 1.4
reverseSpeedPercentage:1
maxTurnSpeed: 1.5
turnAcceleration: 0.1
moveSlidingMode :false
[ai]
upgradedFrom:登陆艇T1
[attachment_sp]
addTransportedUnits: false
[hiddenAction_spljk]
autoTrigger:false
[hiddenAction_splj]
autoTrigger:false
autoTriggerOnEvent:NONE
[hiddenAction_ljk]
autoTriggerOnEvent:NONE
[hiddenAction_lj3]
autoTriggerOnEvent:NONE
autoTrigger:false
[hiddenAction_lj]
autoTrigger:false
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
