[core]
name: AA棱镜射束战机T2
class: CustomUnitMetadata
price: 498000
maxHp:45000
mass: 40000
techLevel: 2
buildSpeed:630s
availableInDemo: false
fogOfWarSightRange:35
radius: 44
softCollisionOnAll:48
builtFrom_1_name: airFacTory
builtFrom_1_pos:  6
energyMax: 6
energyRegen: 0.01
energyRegenWhenRecharging: 0.05
energyNeedsToRechargeToFull: true
[action_upgradeT2]
id:5
isLocked:if not self.globalTeamTags(includes="T6") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: AA光能射束战机
price:  2400000
text: 升级最高T6
description: 超大幅度增强
displayType: Upgrade
buildSpeed: 0.00025
pos: 0.2
ai_isHighPriority:true
[action_afterBurn]
id:6
text: Afterburn
description: Temporarily redirect weapon power to boost engine speed.\n-Greatly increases movement speed.\n-Can not attack while active.\n-Cooldown of 25 seconds
buildSpeed:0
convertTo: AA棱镜射束战机T2(加速)
convertTo_keepCurrentFields:maxEnergy
setResourcesWithLogic:energy=6*(self.resource.NNDS+1)
addActionCooldownTime: 25s
ai_isDisabled: true
canPlayerCancel: false
allowMultipleInQueue: false
alwaysSinglePress: true
highPriorityQueue:true
[graphics]
image:        base3_4.png
image_wreak:  base4_dead.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:false
canAttackUnderwaterUnits: false
turretSize: 40
turretTurnSpeed: 1.8
maxAttackRange: 645
shootDelay: 20
[turret_0]
image: beam_turret4.png
x: 0
y: 0
idleDir:0
canShoot:false
size: 10
turnSpeed: 4.2
aimOffsetSpread: 0
idleSweepAngle:20
idleSweepDelay:100
idleSweepSpeed:0.4
image_drawOffsetY:10
image_applyTeamColors: true
[turret_1]
attachedTo: 0
slave: true
x: 0
y: 4
idleDir:0
projectile: beam
size: 32
canAttackFlyingUnits: true
canAttackLandUnits:   false
delay: 5
energyUsage: 0.5
shouldResetTurret: true
turnSpeed: 4.2
turnSpeedAcceleration: 0.3
aimOffsetSpread: 0
[projectile_beam]
life: 15
instant:true
instantReuseLast: true
instantReuseLast_alsoChangeTurretAim: true
moveWithParent: true
beamImage:      beam3a.png
beamImageEnd:   beam1a_end.png
beamImageStart: beam1a_start.png
beamImageOffsetRate: 2
explodeEffect: CUSTOM:sparks*8
explodeEffectOnShield: CUSTOM:sparks*2
shieldDamageMultiplier: 0.75
sweepOffsetFromTargetRadius:0.4
sweepSpeed:10
areaDamage: 396
areaRadius: 45
areaRadiusFromEdge:true
color: #42f2f5
teamColorRatio_sourceRatio:0.8
teamColorRatio:0.5
[movement]
movementType: AIR
moveSpeed:2.1
moveAccelerationSpeed: 0.015
moveDecelerationSpeed: 0.015
targetHeightDrift: 1
maxTurnSpeed: 1.2
turnAcceleration: 0.04
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  50
slowDeathFall: true
[effect_sparks]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 1.6
ySpeedRelativeRandom: 1.6
hSpeed: 2
image: spark.png
priority: low
color:#42f2f5
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.AA激光射束战机T1>4) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T6") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:AA激光射束战机T1
[hiddenAction_NNHF]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull and not self.isEnergyRecharging
addResourcesWithLogic:energy=${core.energyRegen}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[hiddenAction_NNHF1]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull and self.isEnergyRecharging
addResourcesWithLogic:energy=${core.energyRegenWhenRecharging}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[global_resource_AA激光射束战机T1]
hidden:true
[action_能量升级]
@copyFromSection:action_效率升级
id:${core.price}+7
iconExtraImage:ROOT:素材/能量K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级能量[%{self.resource.NNDS}]
description:增加基础的1倍
setUnitStats:maxEnergy=self.maxEnergy*(1+1/self.resource.NNDS),energy=self.energy()*(1+1/self.resource.NNDS)
addResourcesWithLogic:NNDS=1
[decal_能量升级]
alwaysStartDirAtZero:true
imageScaleY:select(self.resource.NNDS>0,1,-1)
total_frames:5
layer:beforeUI
onlyWhileAlive:true
isVisible:if self.resource.NNDS!=0
frame:min(select(self.resource.NNDS>0,self.resource.NNDS,int(-self.resource.NNDS/0.16))-1,4)
image:ROOT:素材/能量.png
xOffsetAbsolute:-0.1*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90