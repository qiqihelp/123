[core]
name: AA光能射束战机
displayDescription:AA光能射束战机。\n虽说是专业对空，\n却打不过等价的重拦战斗机。\n一种看起来很弱，不实用的感觉（笑\nPS:早期有一段时间它可以对地\n嘛，那种事怎么样都好了~\nby威严な大小姐
class: CustomUnitMetadata
price: 2898000
maxHp:162500
mass: 80000
techLevel: 2
buildSpeed:2275s
availableInDemo: false
fogOfWarSightRange:46
radius: 88
softCollisionOnAll:96
energyMax: 6
energyRegen: 0.01
energyRegenWhenRecharging: 0.05
energyNeedsToRechargeToFull: true
[action_afterBurn]
id:6
text: Afterburn
description: Temporarily redirect weapon power to boost engine speed.\n-Greatly increases movement speed.\n-Can not attack while active.\n-Cooldown of 25 seconds
buildSpeed:0
convertTo: AA光能射束战机(加速)
convertTo_keepCurrentFields:maxEnergy
setResourcesWithLogic:energy=6*(self.resource.NNDS+1)
addActionCooldownTime: 25s
ai_isDisabled: true
canPlayerCancel: false
allowMultipleInQueue: false
alwaysSinglePress: true
[decal_尾焰]
layer:beforeBody
isVisible:true
image: ROOT:/素材/尾焰.png
imageScale:1
imageScaleY:0.4*self.speed
alpha:rnd(0.8,0.9)
xOffsetRelative:40
yOffsetRelative:-100
onlyWhileAlive:true
[decal_尾焰1]
layer:beforeBody
isVisible:true
image: ROOT:/素材/尾焰.png
imageScale:1
imageScaleY:0.4*self.speed
alpha:rnd(0.8,0.9)
xOffsetRelative:-40
yOffsetRelative:-100
onlyWhileAlive:true
[graphics]
image:        base5.png
image_wreak:  base5_dead.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:4
shadowOffsetY:4
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:false
canAttackUnderwaterUnits: false
turretSize: 50
turretTurnSpeed: 1.8
maxAttackRange: 860
turretMultiTargeting:true
shootDelay: 20
[turret_0]
image: beam_turret5.png
x: 0
y: 8
idleDir:0
canShoot:false
size: 20
turnSpeed: 4.2
aimOffsetSpread: 0
idleSweepAngle:20
idleSweepDelay:100
idleSweepSpeed:0.4
image_drawOffsetY:5
image_applyTeamColors: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
[turret_1]
attachedTo: 0
slave: true
x: 0
y: 8
idleDir:0
projectile: beam
size: 60
delay: 5
canAttackFlyingUnits: true
canAttackLandUnits:   false
energyUsage: 0.5
shouldResetTurret: true
turnSpeed: 4.2
turnSpeedAcceleration: 0.3
aimOffsetSpread: 0
[projectile_beam]
life: 15
instant:true
instantReuseLast: true
instantReuseLast_alsoChangeTurretAim: true
moveWithParent: true
beamImage:      beam3b.png
beamImageEnd:   beam1b_end.png
beamImageStart: beam1b_start.png
beamImageOffsetRate: 2
explodeEffect: CUSTOM:sparks*1
explodeEffectOnShield: NONE
shieldDamageMultiplier: 0.75
sweepOffsetFromTargetRadius:0.4
sweepSpeed:10
areaDamage: 1430
areaRadius: 55
areaRadiusFromEdge:true
color: #42f2f5
teamColorRatio_sourceRatio:0.8
teamColorRatio:0.5
[movement]
movementType: AIR
moveSpeed:2.5
moveAccelerationSpeed: 0.015
moveDecelerationSpeed: 0.015
targetHeightDrift: 1
maxTurnSpeed: 1.2
turnAcceleration: 0.04
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  50
slowDeathFall: true
[effect_sparks]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 1.8
ySpeedRelativeRandom: 1.8
hSpeed: 2
image: spark2.png
priority: high
scaleFrom:0.2
scaleTo:0.05
alpha:0.5
color:#42f2f5
[ai]
upgradedFrom:AA激光射束战机T1
[hiddenAction_NNHF]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull and not self.isEnergyRecharging
addResourcesWithLogic:energy=${core.energyRegen}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[hiddenAction_NNHF1]
autoTrigger:if (self.resource.NNDS!=0 or self.resource.stk==1) and not self.isEnergyFull and self.isEnergyRecharging
addResourcesWithLogic:energy=${core.energyRegenWhenRecharging}*${core.autoTriggerCooldownTime}*select(self.resource.stk==1,-1,self.resource.NNDS)
[action_能量升级]
@copyFromSection:action_效率升级
id:${core.price}+7
iconExtraImage:ROOT:素材/能量K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级能量[%{self.resource.NNDS}]
description:增加基础的1倍
setUnitStats:maxEnergy=self.maxEnergy*(1+1/self.resource.NNDS),energy=self.energy()*(1+1/self.resource.NNDS)
addResourcesWithLogic:NNDS=1
[decal_能量升级]
alwaysStartDirAtZero:true
imageScaleY:select(self.resource.NNDS>0,1,-1)
total_frames:5
layer:beforeUI
onlyWhileAlive:true
isVisible:if self.resource.NNDS!=0
frame:min(select(self.resource.NNDS>0,self.resource.NNDS,int(-self.resource.NNDS/0.16))-1,4)
image:ROOT:素材/能量.png
xOffsetAbsolute:-0.1*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90