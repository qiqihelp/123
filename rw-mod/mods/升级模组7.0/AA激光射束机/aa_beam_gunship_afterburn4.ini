[core]
name: AA棱镜射束战机T2(加速)
copyFrom: aa_beam_gunship4.ini
showInEditor: false
energyRegen: -0.02
builtFrom_1_name: IGNORE
builtFrom_1_pos:  IGNORE
[action_upgradeT2]
id:5
isLocked:if not self.globalTeamTags(includes="T6") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: AA光能射束战机(加速)
price:  2400000
text: 升级最高T6
description: 超大幅度增强
displayType: Upgrade
buildSpeed: 0.00025
pos: 0.2
ai_isHighPriority:true
[hiddenAction_autoSwitchBack]
autoTrigger: if self.energy(empty=true)
convertTo: AA棱镜射束战机T2
convertTo_keepCurrentFields:maxEnergy
setResourcesWithLogic:energy=6*(self.resource.NNDS+1)
[action_cancelBurn]
id:7
text: Cancel
description: Cancel afterburn early
buildSpeed:0
convertTo: AA棱镜射束战机T2
convertTo_keepCurrentFields:maxEnergy
setResourcesWithLogic:energy=6*(self.resource.NNDS+1)
canPlayerCancel: false
allowMultipleInQueue: false
alwaysSinglePress: true
[turret_1]
idleSweepAngle:0
energyUsage: 999999999
[graphics]
movementEffect: CUSTOM:trailL, CUSTOM:trailR
movementEffectRate: 4
[comment_effect_projectileTrail]
createWhenZoomedOut: false
priority:low
image: SHARED:light_50.png
life: 30
fadeOut: true
attachedToUnit: false
color: #fcbe03
fadeInTime:2
scaleFrom: 0.7
scaleTo: 1.2
alpha: 0.4
drawUnderUnits:true
ySpeedRelative:-0.4
atmospheric: true
[effect_trailL]
createWhenZoomedOut: false
priority:low
life: 30
image: SHARED:glow_sharp.png
scaleFrom: 1.4
scaleTo: 2.8
alpha: 0.7
atmospheric:true
xSpeedAbsoluteRandom: 0.1
ySpeedAbsoluteRandom: 0.1
ySpeedRelative:-0.2
xOffsetRelative:20
yOffsetRelative:-44
attachedToUnit: false
color: #ffe32b
fadeInTime: 6
[effect_trailR]
@copyFromSection: effect_trailL
xOffsetRelative:-20
[movement]
movementType: AIR
moveSpeed:4.83
moveAccelerationSpeed: 0.13
moveDecelerationSpeed: 0.13
maxTurnSpeed: 1.5
turnAcceleration: 0.1
[ai]
upgradedFrom:AA激光射束战机T1
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90
[hiddenAction_NNHF]
autoTrigger:false
[hiddenAction_NNHF1]
autoTrigger:false