[core]
name: 标准机甲T2
copyFrom: mechs_small_common1.ini
price: 49800
maxHp:9000
mass: 6000
techLevel: 1
buildSpeed:0.000066667
radius: 26
displayRadius: 22
softCollisionOnAll: 13
fogOfWarSightRange:20
transportSlotsNeeded:5
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T6") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 原型机甲
price:  240000
text: 升级最高T6
description: 超大幅度增强
displayType: Upgrade
buildSpeed: 0.00025
pos: 0.05
ai_isHighPriority:true
[graphics]
image: topGun4.png
image_wreak:  NONE
image_shadow: AUTO
shadowOffsetX:4
shadowOffsetY:4
[attack]
canAttack: true
canAttackFlyingUnits:false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 40
turretTurnSpeed: 3
maxAttackRange: 300
shootDelay: 10.8
turretRotateWithBody: false
[turret_0]
x: 0
y: 0
canShoot: false
recoilOffset: -2
recoilOutTime: 2
recoilReturnTime: 14
idleSweepAngle:20
idleSweepSpeed:0.30
idleSweepDelay:100
idleSweepAddRandomDelay:50
idleSweepCondition: if not self.isMoving()
[turret_mainBody]
x: 0
y: 0
idleDir:0
barrelX: 9
barrelY: 32
attachedTo: 0
slave: true
turnSpeed: 2.9
turnSpeedAcceleration: 0.3
projectile: 1
shoot_sound:plasma_fire
shoot_sound_vol:0.03
shoot_flame:CUSTOM:lightSlowFade
canShoot: true
warmup:2.52
chargeEffectImage: lighting_charge1.png
canAttackFlyingUnits: false
canAttackLandUnits:   true
[turret_2]
x:0
y:0
copyFrom:mainBody
barrelX: -9
barrelY: 32
[effect_lightSlowFade]
image: SHARED:light_50.png
life: 20
fadeOut: true
attachedToUnit: true
color: #FFEECCCC
scaleFrom: 0.4
scaleTo: 1
alpha: 0.5
drawUnderUnits:true
[projectile_1]
areaDamage: 75
life: 70
frame: 11
drawSize: 0.88
speed: 0
targetSpeed: 18.43
targetSpeedAcceleration: 1.5
effectOnCreate: CUSTOM:projectileLight
deflectionPower:3.2399999999999998
areaRadius:25
areaRadiusFromEdge:true
targetGround:true
targetGroundSpread:0
[effect_projectileLight]
priority:high
image: SHARED:light_50.png
life: 100
fadeOut: true
attachedToUnit: true
color: #FFEECCCC
fadeInTime:2
scaleFrom: 0.6
scaleTo: 0.6
alpha: 0.6
drawUnderUnits:false
liveAfterAttachedDies: false
[movement]
moveSpeed:1.6800000000000002
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.07
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.基础机甲T1>4) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T6") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:基础机甲T1
[global_resource_基础机甲T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90