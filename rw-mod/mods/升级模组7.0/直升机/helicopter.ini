[core]
name: 直升机T1
displayDescription:T1空军基地唯一可以生产的\n一个既可以对空又可以对地的单位\n建议多出(认真)
class: CustomUnitMetadata
price: 700
maxHp: 150
mass: 3000
displayLocaleKey: 直升机T1
techLevel: 1
buildSpeed: 0.0012
availableInDemo: true
overrideAndReplace: helicopter, c_helicopter
radius: 15
displayRadius: 9
softCollisionOnAll: 24
builtFrom_1_name: airFacTory
builtFrom_1_pos:  3
tags:zsj,ys
[action_upgradeT2]
isLocked:if not self.globalTeamTags(includes="T2") and self.globalTeamTags(includes="T1")
isLockedMessage:暂未开放等级
convertTo: 直升机T2
price:  1400
text: 升级T2
description: 中幅度增强
displayType: Upgrade
buildSpeed: 0.002
pos: 0.05
ai_isHighPriority:true
[graphics]
image:        helicopter.png
image_wreak:  helicopter_dead.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
[attack]
turretRotateWithBody: false
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 4
aimOffsetSpread:0.4
maxAttackRange: 130
shootDelay: 60
isFixedFiring: false
[turret_1]
invisible: true
x: 0
y: 16
idleDir:0
projectile: 1
turnSpeed: 15
turnSpeedAcceleration: 15
shoot_sound:gun_fire
shoot_sound_vol:0.2
shoot_flame:small
shoot_light:#FFEEEE00
[arm_1]
x:0
y:0
image_end:helicopter_blades.png
drawOverBody: true
spinRate:30
[projectile_1]
directDamage: 17
life: 70
speed: 10
frame: 5
drawSize: 0.7
[movement]
movementType: AIR
targetHeight: 20
targetHeightDrift: 2
reverseSpeedPercentage: 0.1
moveSpeed: 1.8
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.06
maxTurnSpeed: 6
turnAcceleration: 0.4
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
[resource_zd]
hidden:true
[resource_auto]
hidden:true
[action_upgradeT2]
addResources:zd=-1
[hiddenAction_auto]
autoTriggerOnEvent:created
addResources:auto=1
[action_zd1]
id:514
buildSpeed: 0
iconImage: SHARED:icon_off.png
iconExtraColor: #FFFFFFFF
text:开启自动升级
description:开启自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=0
isVisible:if self.resource(type="auto",greaterThan=0)
highPriorityQueue:true
[action_zd2]
id:191
buildSpeed: 0
iconImage: SHARED:icon_on.png
iconExtraColor: #FFFFFFFF
text:关闭自动升级
description:关闭自动升级
setResourcesWithLogic:auto=-self.resource.auto,zd=1
isVisible:if self.resource(type="auto",lessThan=0)
highPriorityQueue:true
[hiddenAction_zd]
autoTrigger:if (self.resource(type="auto",lessThan=0) or self.resource.直升机T1>0) and self.resource.zd<1 and self.resource.credits>${action_upgradeT2.price}-1 and (self.globalTeamTags(includes="T2") or not self.globalTeamTags(includes="T1"))
addResources:credits=-${action_upgradeT2.price},zd=1
alsoQueueAction:upgradeT2
[ai]
upgradedFrom:直升机T1
[hiddenAction_无尽]
buildSpeed:1
requireConditional:if self.resource.credits>=${action_upgradeT2.price}
alsoQueueAction:无尽
autoTrigger:if self.isControlledByAI() and self.resource.credits>${action_upgradeT2.price}-1 and self.globalTeamTags(includes="WJ")
addResources:credits=-${action_upgradeT2.price}
alsoTriggerAction:upgradeT2
[global_resource_直升机T1]
hidden:true
[action_速度升级]
@copyFromSection:action_效率升级
id:${core.price}+1
iconExtraImage:ROOT:素材/速度K.png
isVisible:if self.globalTeamTags(includes="EW")
text:升级速度[%{self.resource.SDDS}]
description:增加基础的0.2倍
setUnitStats:movespeed=self.maxMoveSpeed()*(1+0.2/(0.8+0.2*self.resource.SDDS))
addResourcesWithLogic:SDDS=1
[decal_速度升级]
@copyFromSection:decal_效率升级
imageScaleY:select(self.resource.SDDS>0,1,-1)
isVisible:if self.resource.SDDS!=0
frame:min(select(self.resource.SDDS>0,self.resource.SDDS,int(-self.resource.SDDS/0.5))-1,4)
image:ROOT:素材/速度.png
xOffsetAbsolute:-0.3*${core.radius}
yOffsetAbsolute:1.1*${core.radius}
imageScale:${core.radius}/90