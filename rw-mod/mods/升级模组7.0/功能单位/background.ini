[core]
name:背景
class:CustomUnitMetadata
price:600
maxHp:0
mass:9000
fogOfWarSightRange:0
radius:1
isBio:false
showInEditor:false
disableDeathOnZeroHp:true
isUnrepairableUnit:true
isUnselectable:true
canNotBeDirectlyAttacked:true
canNotBeDamaged:true
canNotBeGivenOrdersByPlayer:true
disableAllUnitCollisions:true
ignoreInUnitCapCalculation:true
onNewMapSpawn:mapCenter_asNeutral
autoTriggerCooldownTime:60
showOnMinimap:false
stayNeutral:true
tags:background
[hiddenAction_boom]
autoTrigger:if self.timeAlive()>=2 and self.timeAlive()<3
fireTurretXAtGround:explode
fireTurretXAtGround_withProjectile:explode
fireTurretXAtGround_withOffset:0,0
[hiddenAction_DE]
autoTrigger:if not (game.mapHeight()==3200 and game.mapWidth()==3200) and not (game.mapHeight()==3400 and game.mapWidth()==3400) and not (game.mapHeight()==2400 and game.mapWidth()==2400) or (self.timeAlive()<2 and (numberOfUnitsInAllTeams(withTag="kjgc")!=6 or numberOfUnitsInAllTeams(withTag="ljj")!=9) and game.mapHeight()==2400 and game.mapWidth()==2400) or (self.timeAlive()<2 and (numberOfUnitsInAllTeams(withTag="gntk")!=1 or numberOfUnitsInAllTeams(withTag="zsj")!=10) and game.mapHeight()==3400 and game.mapWidth()==3400) or (self.timeAlive()<2 and (numberOfUnitsInAllTeams(withTag="gntk")!=2 or numberOfUnitsInAllTeams(withTag="zsj")!=9) and game.mapHeight()==3200 and game.mapWidth()==3200)
deleteSelf:true
[turret_explode]
x:0
y:0
canShoot:false
projectile:explode
[projectile_explode]
spawnProjectilesOnCreate:explode(recursionLimit=1)
life:99
instant: true
areaHitAirAndLandAtSameTime:true
speed: 1
largeHitEffect: true
friendlyFire: true
frame: 0
shadowFrame:1
drawType:1
targetGround: true
areaDamage: 2147483647
armourIgnoreAmount:2147483647
areaRadius: 999999
deflectionPower:-1
lightColor: #FFEEEE00
lightSize: 1
[hiddenAction_DEk]
deleteSelf:false
[decal_1]
isVisible:if self.timeAlive()>0.01
layer:beforeUI
image:background.png
imageScale:2.5
alwaysStartDirAtZero:true
[decal_1K]
isVisible:if self.timeAlive()>0.01
layer:beforeUI
image:background.png
imageScale:2
onlyWithZoomLevelOrMore:1.0001
alwaysStartDirAtZero:true
[graphics]
drawLayer:top
icon_zoomed_out_neverShow:true
total_frames:1
image:SHARED:blank.png
image_wreak:NONE
image_turret:NONE
imageScale:1
image_shadow:NONE
shadowOffsetX:1
shadowOffsetY:1
